<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VR Beta">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>VR Beta</title>
<style>
  :root { --bg: #f4f5f7; --fg: #1f2328; --mut: #5f6368; --line: #e3e5e8; --acc: #1a73e8; --card: #fff; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #e8eaed; --mut: #9aa0a6; --line: #34363a; --acc: #8ab4f8; --card: #1e1f22; color-scheme: dark; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  #splash img { width: 84px; height: 84px; border-radius: 20px; }
  #splash .t { font-size: 20px; font-weight: 800; }
  #splash .s { color: var(--mut); max-width: 300px; }
  #keyBox { display: none; width: 100%; max-width: 320px; }
  #keyBox input { width: 100%; box-sizing: border-box; padding: 11px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); margin: 6px 0 10px; }
  #keyBox button, #retry { width: 100%; min-height: 46px; border: 0; border-radius: 12px; background: var(--acc); color: #fff; font: 700 16px -apple-system, sans-serif; }
  #retry { display: none; max-width: 320px; }
  @media (prefers-color-scheme: dark) { #keyBox button, #retry { color: #15161a; } }
  #badge { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 2px); font: 700 10px -apple-system, sans-serif; letter-spacing: .8px;
    color: #15161a; background: #f59e0b; border-radius: 999px; padding: 2px 8px; opacity: .85; pointer-events: none; display: none; }
</style>
</head>
<body>
<div id="splash">
  <img src="icon.png" alt="">
  <div class="t">VR Beta</div>
  <div class="s" id="msg">Loading from the test copy of your sheet…</div>
  <div id="keyBox">
    <div class="s">Access key (the same VR_KEY as the test copy). Kept on this phone only.</div>
    <input id="keyIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="keyGo" type="button">Open</button>
  </div>
  <button id="retry" type="button">Try again</button>
  <a href="test.html" style="color:var(--acc);font-size:13px;margin-top:8px">Connection test and test-server updates</a>
</div>
<iframe id="app" title="VR Beta"></iframe>
<div id="badge">BETA · TEST SHEET</div>
<script>
  // VR Beta (native plan, step 2): the app itself, running straight in this page instead of inside Google's frames, against the TEST copy of the sheet.
  // The app page comes from the test server's front door (appPage) and is kept in this phone's database, so the next open shows it at once; its calls to
  // the server go through the same front door. Nothing here touches the real sheet.
  var TEST_URL = "https://script.google.com/macros/s/AKfycbwVa9nlRY4PWJDLNB6tE0ZaeGPTJthu8bQ5cerEySfFXYqH3zjDdGsbfSoov0gLN-5o/exec";
  var frame = document.getElementById("app"), msg = document.getElementById("msg");
  function key() { try { return localStorage.getItem("vr_beta_key") || localStorage.getItem("vr_key") || ""; } catch (e) { return ""; } }

  // ── the front door: POST {op:'api', key, name, args} as plain text; resolves with the result, rejects with the server's message ──
  var calls = 0;
  function vrbCall(name, args) {
    calls++;
    return fetch(TEST_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow",
      body: JSON.stringify({ op: "api", key: key(), name: name, args: Array.isArray(args) ? args : [] }) })
      .then(function(r) { return r.text(); })
      .then(function(t) {
        var j = null; try { j = JSON.parse(t); } catch (e) {}
        if (!j) throw new Error("The test server sent something unexpected.");
        if (!j.ok) throw new Error(j.error || "The test server refused.");
        return j.result;
      });
  }
  window.vrbCall = vrbCall;

  // ── this page's own small database: the last app page (with the day it was fetched) ──
  var DB = (function() {
    var db = null;
    function open() {
      if (db) return Promise.resolve(db);
      return new Promise(function(res, rej) {
        try {
          var r = indexedDB.open("vrbeta", 1);
          r.onupgradeneeded = function() { if (!r.result.objectStoreNames.contains("meta")) r.result.createObjectStore("meta"); };
          r.onsuccess = function() { db = r.result; res(db); };
          r.onerror = function() { rej(r.error); };
        } catch (e) { rej(e); }
      });
    }
    function tx(mode, fn) { return open().then(function(d) { return new Promise(function(res, rej) { var t = d.transaction("meta", mode), q = fn(t.objectStore("meta")); t.oncomplete = function() { res(q && q.result); }; t.onerror = t.onabort = function() { rej(t.error); }; }); }); }
    return {
      get: function(k) { return tx("readonly", function(s) { return s.get(k); }).catch(function() { return undefined; }); },
      set: function(k, v) { return tx("readwrite", function(s) { s.put(v, k); }).catch(function() {}); }
    };
  })();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  // ── the app page, with what it needs to run here ──
  // google.script.run is replaced by a small stand-in that sends every call through the front door (the app only ever calls through it).
  var SHIM = '<script>(function(){var P=window.parent;function run(s,f){var o={withSuccessHandler:function(h){return run(h,f);},withFailureHandler:function(h){return run(s,h);},withUserObject:function(){return o;},' +
    'api:function(k,name,args){P.vrbCall(name,args).then(function(r){if(s)s(r);},function(e){if(f)f(e);});}};return o;}window.google={script:{run:run(null,null)}};window.__vrBeta=1;})();<\/script>';
  function prepare(html) {
    var head = /<head[^>]*>/i;
    var add = SHIM + (/name=["']viewport/i.test(html) ? "" : '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">');
    return head.test(html) ? html.replace(head, function(m) { return m + add; }) : add + html;
  }
  function buildOf(html) { var m = /const CLIENT_BUILD = '(sync-\d+)'/.exec(html || ""); return m ? m[1] : ""; }
  var shown = null, touched = false;
  function show(page) {
    shown = page; touched = false;
    frame.onload = function() {
      try { ["pointerdown", "keydown"].forEach(function(ev) { frame.contentWindow.addEventListener(ev, function() { touched = true; }, { capture: true, once: true }); }); } catch (e) {}
    };
    frame.srcdoc = prepare(page.html);
    frame.style.display = "block";
    document.getElementById("splash").style.display = "none";
    document.getElementById("badge").style.display = "block";
  }
  function today() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }

  function start() {
    if (!key()) { askKey(); return; }
    var t0 = Date.now();
    // 1) the saved copy at once (instant open), 2) the fresh one from the test server; it replaces the saved copy if you have not started tapping yet
    var saved = DB.get("app").then(function(p) { if (p && p.html && !shown) { show(p); } return p; });
    vrbCall("appPage", []).then(function(r) {
      var page = { html: r.html, at: Date.now(), day: today(), srv: r.srv, ver: r.ver, ms: Date.now() - t0 };
      DB.set("app", page);
      saved.then(function(p) {
        if (!shown) { show(page); return; }
        // the saved copy is up: swap to the fresh one unless you are already using it (a newer build always swaps on the next open)
        if (!touched) show(page);
      });
    }).catch(function(e) {
      saved.then(function(p) {
        if (shown) return;   // the saved copy is up: it keeps working, and its own checks retry the server
        msg.textContent = "Couldn't reach the test server: " + (e && e.message || e);
        document.getElementById("retry").style.display = "block";
      });
    });
  }
  function askKey() {
    msg.textContent = "One time: enter the access key.";
    document.getElementById("keyBox").style.display = "block";
    document.getElementById("keyGo").onclick = function() {
      var v = document.getElementById("keyIn").value.trim(); if (!v) return;
      try { localStorage.setItem("vr_beta_key", v); } catch (e) {}
      document.getElementById("keyBox").style.display = "none"; msg.textContent = "Loading from the test copy of your sheet…"; start();
    };
  }
  document.getElementById("retry").onclick = function() { this.style.display = "none"; msg.textContent = "Loading from the test copy of your sheet…"; start(); };
  // the app's messages to its home-screen page (screen awake, saved lists, ...) are not handled here yet; they are simply ignored
  window.addEventListener("message", function() {});
  start();
</script>
</body>
</html>
