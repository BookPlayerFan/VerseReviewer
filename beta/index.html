<!DOCTYPE html>
<html lang="en" style="color-scheme: light dark;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>VR Beta</title>

  <!-- Preconnect & Prefetch Hints -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/beta/icon.png?v=1">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/beta/icon.png?v=1">
  <link rel="icon" type="image/png" sizes="192x192" href="https://bookplayerfan.github.io/VerseReviewer/beta/icon.png?v=1">
  <link rel="manifest" href="manifest.json">

  <!-- Native Opaque Status Bar Setup -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VR Beta">
  <meta name="color-scheme" content="light dark">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-theme: #f8f9fa;
      --spinner-color: #1a73e8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-theme: #121212;
        --spinner-color: #8ab4f8;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      -webkit-text-size-adjust: 100%;   /* iOS must not enlarge the text on its own (it can after the app wakes up) */
      text-size-adjust: 100%;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-theme);
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      display: block;
      background-color: var(--bg-theme);
    }

    #splashScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-theme);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(128, 128, 128, 0.2);
      border-top-color: var(--spinner-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div style="position:fixed;z-index:100000;top:4px;right:6px;font:800 9px -apple-system,sans-serif;letter-spacing:.8px;color:#15161a;background:#f59e0b;border-radius:999px;padding:2px 7px;opacity:.9;pointer-events:none">BETA</div>
  <div id="splashScreen">
    <div class="spinner"></div>
  </div>

  <iframe id="appFrame" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbwVa9nlRY4PWJDLNB6tE0ZaeGPTJthu8bQ5cerEySfFXYqH3zjDdGsbfSoov0gLN-5o/exec";
    // 3.10 direct mode (native plan step 2): the app runs straight in this page (no Google frames); its page comes from the server's front door and is kept
    // in this phone's database, and every call it makes goes through the front door.
    var DIRECT = true;   // 4.0: always (the app runs straight in this page; the old way, inside Google's frames, is gone)

    // Optional access key: only used if you add a VR_KEY script property in Apps Script.
    // It is stored on this device only, never in this public file.
    // When this icon first opened, so the status readout can show whether its saved data ever got wiped (a wipe starts the date over).
    try { if (!localStorage.getItem("vrb_first")) localStorage.setItem("vrb_first", String(Date.now())); } catch (e) {}
    // 3.2.1: hint levels come from each verse's step now; the levels this page used to keep (before 3.0) are cleared once.
    try { localStorage.removeItem("vrb_hl"); localStorage.removeItem("vrb_hint"); } catch (e) {}
    // ───── 3.8 local database (native plan, step 3 piece 1) ─────
    // The phone's own database (IndexedDB) for this page. For now it keeps a copy of what this page already saves (the verse list, the unsent presses,
    // the quick view's cards, the pills), so nothing changes in how the app behaves; later stages read from it. If the phone refuses it, every call
    // fails quietly and the app works as before. Stores: verses (keyed by reference), meta (any value by name), outbox (keyed by id).
    var VRDB = (function() {
      var NAME = "vrb", VER = 1, db = null, opening = null, broken = "";
      function open() {
        if (db) return Promise.resolve(db);
        if (broken) return Promise.reject(new Error(broken));
        if (opening) return opening;
        opening = new Promise(function(res, rej) {
          var r;
          try { if (!window.indexedDB) throw new Error("no IndexedDB"); r = indexedDB.open(NAME, VER); } catch (e) { broken = String(e && e.message || e); opening = null; rej(e); return; }
          r.onupgradeneeded = function() {
            var d = r.result;
            if (!d.objectStoreNames.contains("verses")) d.createObjectStore("verses", { keyPath: "f" });
            if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
            if (!d.objectStoreNames.contains("outbox")) d.createObjectStore("outbox", { keyPath: "id" });
          };
          r.onsuccess = function() { db = r.result; opening = null; db.onversionchange = function() { try { db.close(); } catch (e) {} db = null; }; db.onclose = function() { db = null; }; res(db); };
          r.onerror = function() { broken = String(r.error && r.error.name || "open failed"); opening = null; rej(r.error); };
          r.onblocked = function() { opening = null; rej(new Error("blocked")); };
        });
        return opening;
      }
      // One transaction: fn(stores) queues the work; resolves with what fn returned (a request's result once done).
      function run(names, mode, fn) {
        return open().then(function(d) {
          return new Promise(function(res, rej) {
            var t = d.transaction(names, mode), st = {}, out;
            names.forEach(function(n) { st[n] = t.objectStore(n); });
            try { out = fn(st); } catch (e) { try { t.abort(); } catch (x) {} rej(e); return; }
            t.oncomplete = function() { res(out && typeof out === "object" && "readyState" in out ? out.result : out); };
            t.onerror = t.onabort = function() { rej(t.error || new Error("aborted")); };
          });
        });
      }
      var api = {
        ok: function() { return open().then(function() { return true; }, function() { return false; }); },
        error: function() { return broken; },
        get: function(key) { return run(["meta"], "readonly", function(s) { return s.meta.get(key); }); },
        set: function(key, val) { return run(["meta"], "readwrite", function(s) { s.meta.put(val, key); }); },
        // The verse list as a whole: rows not in the new list are removed (the list is always complete).
        setVerses: function(list) {
          return run(["verses", "meta"], "readwrite", function(s) {
            s.verses.clear();
            list.forEach(function(v) { if (v && typeof v.f === "string" && v.f) s.verses.put(v); });
            s.meta.put(Date.now(), "versesAt");
          });
        },
        verses: function() { return run(["verses"], "readonly", function(s) { return s.verses.getAll(); }); },
        count: function(name) { return run([name], "readonly", function(s) { return s[name].count(); }); },
        // The unsent presses as a whole (the app sends the full list each time).
        setOutbox: function(items) {
          return run(["outbox"], "readwrite", function(s) { s.outbox.clear(); items.forEach(function(it, i) { s.outbox.put(Object.assign({ n: i }, it, { id: it.id || ("x" + i) })); }); });
        },
        outbox: function() { return run(["outbox"], "readonly", function(s) { return s.outbox.getAll(); }).then(function(a) { return a.sort(function(x, y) { return x.n - y.n; }); }); },
        // Asks the phone not to clear this page's data when space runs low (iPhone may say no; nothing else changes).
        persist: function() {
          try { if (navigator.storage && navigator.storage.persist) return navigator.storage.persist().then(function(p) { return api.set("persist", !!p).then(function() { return !!p; }); }); } catch (e) {}
          return Promise.resolve(false);
        }
      };
      return api;
    })();
    var dbInfo = { ok: null, verses: 0, outbox: 0, persist: null, err: "" };   // for the status panel's "Local database" row
    function dbRefresh() {
      return VRDB.ok().then(function(ok) {
        dbInfo.ok = ok; dbInfo.err = ok ? "" : VRDB.error();
        if (!ok) return;
        return Promise.all([VRDB.count("verses"), VRDB.count("outbox"), VRDB.get("persist"), VRDB.get("versesAt")]).then(function(r) {
          dbInfo.verses = r[0]; dbInfo.outbox = r[1]; dbInfo.persist = r[2] === undefined ? null : r[2]; dbInfo.at = r[3] || 0;
        });
      }).catch(function(e) { dbInfo.ok = false; dbInfo.err = String(e && e.message || e); });
    }
    function dbMirror(what, v) {   // a copy into the database of what was just saved the old way; quiet on failure
      try {
        var p = what === "vl" ? VRDB.setVerses(v) : what === "outbox" ? VRDB.setOutbox(v) : VRDB.set(what, v);
        p.then(dbRefresh, function() {});
      } catch (e) {}
    }
    // First open with the database: copy in what was already saved the old way, and ask to keep it.
    (function() {
      VRDB.ok().then(function(ok) {
        if (!ok) { dbRefresh(); return; }
        VRDB.get("seeded").then(function(seeded) {
          var jobs = [];
          if (!seeded) {
            var vl = loadVl(); if (vl) jobs.push(VRDB.setVerses(vl));
            try { var ob = JSON.parse(localStorage.getItem("vrb_outbox") || "null"); if (Array.isArray(ob) && ob.length) jobs.push(VRDB.setOutbox(ob)); } catch (e) {}
            var pl = loadPills(); if (pl) jobs.push(VRDB.set("pills", pl));
            jobs.push(VRDB.set("seeded", Date.now()));
          }
          return Promise.all(jobs).then(function() { return VRDB.persist(); });
        }).then(dbRefresh, dbRefresh);
      });
    })();

    // The last verse list and the Review Complete pills, kept so the app can show them at once and then refresh them.
    function loadVl() { try { var v = JSON.parse(localStorage.getItem("vrb_vl") || "null"); return Array.isArray(v) && v.length ? v : null; } catch (e) { return null; } }
    function saveVl(v) {
      if (!Array.isArray(v) || !v.length) return;
      try { localStorage.setItem("vrb_vl", JSON.stringify(v)); } catch (e) { try { localStorage.removeItem("vrb_vl"); } catch (x) {} }
      dbMirror("vl", v);
    }
    function loadPills() { try { var v = JSON.parse(localStorage.getItem("vrb_pills") || "null"); return v && typeof v === "object" ? v : null; } catch (e) { return null; } }
    function savePills(v) { if (!v || typeof v !== "object") return; try { localStorage.setItem("vrb_pills", JSON.stringify(v)); } catch (e) {} dbMirror("pills", v); }
    // The last page/server version this phone opened; a different one on the next open means an update just arrived.
    function noteVersion(b, sv) {
      if (!b) return null;
      var prev = null, now = { b: b, s: sv || "" };
      try { prev = JSON.parse(localStorage.getItem("vrb_ver") || "null"); } catch (e) {}
      if (!now.s && prev && prev.s) now.s = prev.s;
      try { localStorage.setItem("vrb_ver", JSON.stringify(now)); } catch (e) {}
      if (!prev || typeof prev !== "object" || (prev.b === now.b && prev.s === now.s)) return null;
      return { build: now.b, srv: now.s };
    }
    var SHELL_VERSION = "4.6.15";   // 3.5.1: the app version this page last changed in (the same numbers as the app; set at /publish when this page changes)
    var SHELL_BUILD = "shell-59";   // this home-screen page's own number, shown in the status panel (an older copy cached on the phone has none)
    function shellInfo(updated) {
      var first = 0, key = false, works = false;
      try { first = Number(localStorage.getItem("vrb_first")) || 0; key = !!localStorage.getItem("vrb_key"); works = true; } catch (e) {}
      return { type: "VR_SHELL", sv: SHELL_BUILD, ver: SHELL_VERSION, wl: loadWaitLog(), ws: loadWaits(), first: first, key: key, works: works, vl: loadVl(), pills: loadPills(), updated: updated || null, db: dbInfo };
    }
    // ───── direct mode ─────
    // One call through the front door: POST {op:'api', key, name, args} as plain text (no "may I" round first). Resolves with the result.
    function directCall(name, args) {
      var key = ""; try { key = localStorage.getItem("vrb_key") || ""; } catch (e) {}
      return fetch(APP_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow",
        body: JSON.stringify({ op: "api", key: key, name: name, args: Array.isArray(args) ? args : [] }) })
        .then(function(r) { return r.text(); })
        .then(function(t) {
          var j = null; try { j = JSON.parse(t); } catch (e) {}
          if (!j) throw new Error("The server sent something unexpected.");
          if (!j.ok) { var er = new Error(j.error || "The server refused."); er.auth = /Access key/.test(j.error || ""); throw er; }
          return j.result;
        });
    }
    window.directCall = directCall;
    // The app only ever calls the server through google.script.run (its srv() wraps it); here that is a small stand-in sending each call through directCall.
    var DIRECT_SHIM = '<script>(function(){var P=window.parent;function run(s,f){var o={withSuccessHandler:function(h){return run(h,f);},withFailureHandler:function(h){return run(s,h);},withUserObject:function(){return o;},' +
      'api:function(k,name,args){P.directCall(name,args).then(function(r){if(s)s(r);},function(e){if(f)f(e);});}};return o;}window.google={script:{run:run(null,null)}};window.__vrDirect=1;})();<\/script>';
    function directPrepare(html) {
      var head = /<head[^>]*>/i;
      var add = DIRECT_SHIM + (/name=["']viewport/i.test(html) ? "" : '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">');
      return head.test(html) ? html.replace(head, function(m) { return m + add; }) : add + html;
    }
    var directShown = false, directTouched = false;
    var freshDay = null, appFrameReady = null, appSavedSession = false, newerClient = 0;
    function sendNewer() {
      if (!newerClient || !appFrameReady) return;
      try { appFrameReady.postMessage({ type: "VR_NEWER", client: newerClient }, appOrigin); } catch (e) {}
      newerClient = 0;
    }
    function sendFresh() {
      if (freshDay && (directTouched || appBusy)) { freshDay = null; return; }   // 3.19.2: in use: the app catches up by itself (a day kept for later could be older by then)
      if (!freshDay || !appFrameReady) return;
      try { appFrameReady.postMessage({ type: "VR_FRESH", s: freshDay }, appOrigin); } catch (e) {}
      freshDay = null;
    }
    function directShow(page) {
      appFrameReady = null;
      try { appSource = null; if (lastGo && Date.now() - lastGo.at < 15000 && !pendingGo) { pendingGo = lastGo.tab; pendingRef = typeof lastGo.ref === "string" ? lastGo.ref : null; } } catch (e) {}   // 3.19.2
      var f = document.getElementById("appFrame");
      directShown = true; directTouched = false;
      f.onload = function() { try { ["pointerdown", "keydown"].forEach(function(ev) { f.contentWindow.addEventListener(ev, function() { directTouched = true; }, { capture: true, once: true }); }); } catch (e) {} };
      f.removeAttribute("src");
      f.srcdoc = directPrepare(page.html);
    }
    // Opening: the saved app page at once, with today's saved deck when there is one (or with no deck, and the app loads it itself); then the fresh page and
    // session from the server, which take its place unless you have started using it. 3.10: the server sends the page and the session apart ("parts").
    function isoDay() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
    function localDay() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
    function bootJson(sessionJson, pendJson, localJson) {   // the app's BOOT, as the server writes it (the key comes from this phone); pend: review saves still to send (3.10 step 3); local: what the app needs to build a new day itself (3.11)
      var key = ""; try { key = localStorage.getItem("vrb_key") || ""; } catch (e) {}
      return '{"boot":1,"key":' + JSON.stringify(key) + ',"session":' + (sessionJson || "null") + (pendJson ? ',"pend":' + pendJson : '') + (localJson ? ',"local":' + localJson : '') + '}';
    }
    function composePage(tpl, sessionJson, pendJson, localJson) {
      var j = bootJson(sessionJson, pendJson, localJson).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
      return { html: tpl.replace(/<\?!=\s*initialSessionJson\s*\?>/, function() { return j; }) };
    }
    function directLoad() {
      directShown = false;
      var savedPend = false;
      var saved = Promise.all([VRDB.get("app"), VRDB.get("session"), VRDB.verses().catch(function() { return []; })]).then(function(r) {
        var p = r[0], ss = r[1], rows = r[2];
        // 3.10 step 3: saves still to send keep their deck even past midnight (they are sent on it first; the server then moves on to the new day)
        savedPend = !!(ss && Array.isArray(ss.pend) && ss.pend.length);
        var use = ss && ss.s && ((ss.day === localDay() && (!ss.s.date || ss.s.date === isoDay())) || savedPend);   // 3.19.2: and the day itself is today's (a copy saved just after midnight could still be yesterday's)
        // 3.11: a new day, nothing waiting, and the app said its copy of the verse list was complete: the app builds today's deck itself, at once
        var local = !use && ss && ss.s && ss.rowsOk === true && Array.isArray(rows) && rows.length && rows[0].dm !== undefined
          ? JSON.stringify({ rows: rows, prev: { learning: ss.s.learning || [], queue: ss.s.queue || [], build: ss.s.build, ver: ss.s.ver } }) : null;
        if (p && !directShown) {
          if (p.tpl) directShow(composePage(p.tpl, use ? JSON.stringify(ss.s) : null, use && savedPend ? JSON.stringify(ss.pend) : null, local));
          else if (p.html) directShow(p);   // a page saved before 3.10
        }
        return p;
      }, function() { return null; });
      directCall("appPage", ["parts"]).then(function(r) {
        var page;
        if (r && r.tpl) {
          VRDB.set("app", { tpl: r.tpl, at: Date.now(), srv: r.srv, ver: r.ver }).catch(function() {});
          try { var b = JSON.parse(r.boot); if (b && b.session && !appSavedSession && !savedPend) { b.session.skew = typeof b.session.serverNow === "number" ? b.session.serverNow - Date.now() : 0; b.session.savedAt = Date.now(); VRDB.set("session", { s: b.session, day: localDay(), at: Date.now() }).catch(function() {}); } } catch (e) {}   // 3.19.2
          page = composePage(r.tpl, (function() { try { var b = JSON.parse(r.boot); return b && b.session ? JSON.stringify(b.session) : null; } catch (e) { return null; } })());
        } else {   // an older server: the whole page
          page = { html: r.html };
          VRDB.set("app", { html: r.html, at: Date.now(), srv: r.srv, ver: r.ver }).catch(function() {});
        }
        // the server's copy takes over unless you have started using the saved one, or saves made on the phone are still on their way (the phone is ahead).
        // 3.18.1: when the page itself is the same one, only the day is handed in (no reload of the whole page, which showed as a second load)
        saved.then(function(p) {
          if (directShown && p && p.tpl && r && r.tpl && p.tpl === r.tpl) {
            try { var bs = JSON.parse(r.boot); if (bs && bs.session) { freshDay = bs.session; sendFresh(); } } catch (e) {}
            return;
          }
          if (!directShown || (!directTouched && !savedPend && !appBusy)) directShow(page);
          else {   // 4.6.15: you had already started: tell the app at once that a newer page is in (it takes it over as soon as nothing is waiting to save)
            var mm = /const CLIENT_BUILD = 'sync-(\d+)'/.exec((r && r.tpl) || "");
            if (mm) { newerClient = Number(mm[1]); sendNewer(); }
          }
        });
      }).catch(function(e) {
        saved.then(function(p) {
          if (directShown) return;   // the saved page is up and retries the server itself
          if (e && e.auth) { askKey(); return; }
          dismissSplash();
          if (window.confirm("Couldn't reach the server: " + (e && e.message || e) + "\n\nTry again?")) directLoad();
        });
      });
    }
    function askKey() {
      dismissSplash();
      var entered = window.prompt("Enter your access key");
      if (entered) {
        try { localStorage.setItem("vrb_key", entered.trim()); } catch (err) {}
        loadApp();
      }
    }
    function loadApp() { directLoad(); }
    loadApp();
    // After an Install the app asks for a reload once Google serves the new page: ask the web app which page number it serves now (a tiny JSON answer), every 3 s,
    // and reload once when it is the wanted one. A server that does not answer yet (the old version sends its page) counts as "not yet". If the check cannot be made
    // at all here (blocked), or after 100 s, reload anyway; the app keeps retrying on its own if the page still comes back old.
    // This page lives on GitHub Pages, and iOS keeps a home-screen app alive for days, so after a change here the phone could go on running the old copy (it did: the
    // quiet update check was missing for a day). At launch, and when you come back after half an hour away, ask GitHub for the current copy and, if its number is higher,
    // load it once. The same number is never tried twice within ten minutes, so a copy that is still cached cannot cause a loop.
    var hiddenAt = 0;
    function checkShellUpdate() {
      try {
        var cur = Number(String(SHELL_BUILD).replace(/\D/g, "")) || 0;
        var base = location.href.split("#")[0].split("?")[0];
        fetch(base + "?s=" + Date.now(), { cache: "no-store" })
          .then(function(r) { return r.ok ? r.text() : ""; })
          .then(function(tx) {
            var m = /var SHELL_BUILD = "shell-(\d+)"/.exec(tx || ""), n = m ? Number(m[1]) : 0;
            if (!(n > cur)) return;
            var last = null; try { last = JSON.parse(localStorage.getItem("vrb_shellupd") || "null"); } catch (e) {}
            if (last && last.n === n && Date.now() - last.at < 600000) return;
            reloadWhenIdle(function() {
              try { localStorage.setItem("vrb_shellupd", JSON.stringify({ n: n, at: Date.now() })); } catch (e) {}
              location.replace(location.pathname + "?s=" + Date.now() + (pendingGo ? "&go=" + pendingGo : ""));
            }, 0);
          }, function() {});
      } catch (e) {}
    }
    // 3.2.1: not while the app still has a save waiting (it says so with VR_BUSY): wait for it, checking every 3 s for up to 2 minutes, then leave the
    // update for the next launch.
    var appBusy = false;
    function reloadWhenIdle(go, tries) {
      if (!appBusy) { go(); return; }
      if (tries >= 40) return;
      setTimeout(function() { reloadWhenIdle(go, tries + 1); }, 3000);
    }
    setTimeout(checkShellUpdate, 2500);
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) hiddenAt = Date.now();
      else if (hiddenAt && Date.now() - hiddenAt > 30 * 60000) { hiddenAt = 0; checkShellUpdate(); }
    });
    var waitTimer = null;
    // What the last wait did, so the status panel can say (Details > Home screen page): { at, n, res: new | net | timeout, polls, s }.
    function saveWaitLog(o) {
      try {
        o.at = Date.now(); localStorage.setItem("vrb_waitlog", JSON.stringify(o));
        if (o.res === "new" && o.s > 0) { var w = loadWaits(); w.push(o.s); localStorage.setItem("vrb_waits", JSON.stringify(w.slice(-5))); }   // the last five measured switch-overs: the app's install bar uses their typical length
      } catch (e) {}
    }
    function loadWaits() { try { var w = JSON.parse(localStorage.getItem("vrb_waits") || "[]"); return Array.isArray(w) ? w.filter(function(x) { return x > 0; }) : []; } catch (e) { return []; } }
    function loadWaitLog() { try { return JSON.parse(localStorage.getItem("vrb_waitlog") || "null"); } catch (e) { return null; } }
    function waitForBuild(n) {
      clearTimeout(waitTimer);
      var t0 = Date.now(), polls = 0, netFails = 0;
      var done = function(res) { saveWaitLog({ n: n, res: res, polls: polls, s: Math.round((Date.now() - t0) / 1000) }); loadApp(); };
      (function poll() {
        if (Date.now() - t0 > 100000) { done("timeout"); return; }
        polls++;
        fetch(APP_URL + "?ping=1&_=" + Date.now(), { cache: "no-store" })
          .then(function(r) { return r.text(); })
          .then(function(tx) {
            var j = null; try { j = JSON.parse(tx); } catch (e) {}
            if (j && j.ok && Number(j.client) >= n) { done("new"); return; }
            waitTimer = setTimeout(poll, 3000);
          }, function() {
            netFails++;
            if (netFails < 2) { waitTimer = setTimeout(poll, 1500); return; }
            // The check cannot be made from here (blocked). Google can keep the old page for up to about a minute, so wait out most of that once
            // instead of reloading at once and then again every few seconds.
            var left = Math.max(0, (window.VR_NET_WAIT_MS || 40000) - (Date.now() - t0));
            waitTimer = setTimeout(function() { done("net"); }, left);
          });
      })();
    }
  </script>

  <script>
    // ── Opening a tab ──
    // 4.0: web push (OneSignal) is gone; reminders are the iPhone app's own. A link may still open us with ?go=new, ?go=review or ?go=current.
    var pendingGo = null, lastGo = null, pendingRef = null;   // 4.6.10: pendingRef: a tapped reminder about one verse (its card opens)
    try {
      var qs = new URLSearchParams(location.search);
      var g = qs.get("go");
      if (g === "new" || g === "review" || g === "current") pendingGo = g;
      if ((qs.has("go") || qs.has("s")) && history.replaceState) history.replaceState(null, "", location.pathname);
    } catch (e) {}
    // A fresh launch opens on the New tab (the card that is due, or the In progress page when nothing is due); a tapped reminder (?go=new or ?go=review) still opens its own tab. (A reload after an update keeps where it was: this is only read once.)
    if (!pendingGo) pendingGo = "new";
    var appSource = null;
    function sendGoto(src) {
      appSource = src;
      if (!pendingGo) return;
      var tab = pendingGo, ref = pendingRef; pendingGo = null; pendingRef = null; lastGo = { tab: tab, at: Date.now(), ref: ref };
      setTimeout(function() { try { src.postMessage(typeof ref === "string" ? { type: "VR_GOTO", tab: tab, ref: ref } : { type: "VR_GOTO", tab: tab }, appOrigin); } catch (e) {} }, 700);   // ref (4.6.10): from a tapped reminder ("" when it names several verses)
    }
    // No icon badge: clear any leftover one when the app opens or comes back.
    function clearIconBadge() { try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (e) {} }
    clearIconBadge();
    document.addEventListener('visibilitychange', function() { if (!document.hidden) clearIconBadge(); });
  </script>

  <script>
    // 4.6.14: the opening screen (the early view: a sealed copy of the New card shown while the app loaded) is gone. It dated from when the app page came
    // from Google on every open (seconds); now the page and today's deck are kept on the phone and the app is up in well under a second (opening timer,
    // 2 Nov: 0.06 s). What an older version saved for it is cleared.
    try { localStorage.removeItem("vrb_early"); } catch (e) {}
    dbMirror("early", null);

    // The Apps Script page sits a frame or two inside #appFrame; a message counts only when it comes from in there.
    var appOrigin = "*";
    function fromAppFrame(w) {
      var app = document.getElementById("appFrame"); app = app && app.contentWindow;
      for (var k = 0; k < 5 && w; k++) { if (w === app) return true; if (w === w.parent) return false; w = w.parent; }
      return false;
    }
    function isAppOrigin(o) { return o === location.origin; }   // 4.0: the app page runs on this page's own origin (no Google frames)


    // Keep the screen awake on the New tab (the app on its New tab). The lock lives here in the top page,
    // because the app sits inside Google's sandboxed frames. It is let go after 10 minutes with no touches, and asked for again on the next one.
    var wakeApp = false, wakeLock = null, wakePending = false, wakeIdleAt = 0, wakeTimer = null;
    var WAKE_IDLE_MS = 10 * 60 * 1000;
    // 3.4.1: what happened to the lock, for the status panel's "Screen awake" row: held, refused by the phone, let go by the phone while the page was
    // showing, and the app saying the New tab is (or is not) showing. The last 10 events are kept (vr_wake) so they survive a reload.
    var wakeHeldAt = 0, wakeMsgAt = 0, wakeEv = [];
    try { wakeEv = JSON.parse(localStorage.getItem("vrb_wake") || "[]"); if (!Array.isArray(wakeEv)) wakeEv = []; } catch (e) { wakeEv = []; }
    function wakeNote(ev, x) {
      wakeEv.push({ t: Date.now(), e: ev, x: x || "" });
      if (wakeEv.length > 10) wakeEv = wakeEv.slice(-10);
      try { localStorage.setItem("vrb_wake", JSON.stringify(wakeEv)); } catch (e) {}
    }
    function wakeInfo() {
      return { sup: !!(navigator.wakeLock && navigator.wakeLock.request), held: !!wakeLock, since: wakeHeldAt, pend: wakePending, app: wakeApp, early: false,
        msg: wakeMsgAt, idle: Date.now() - wakeIdleAt >= WAKE_IDLE_MS, ev: wakeEv.slice(-6), retry: wakeTries, db: dbInfo };   // 3.8: db rides along (asked for when Details opens)
    }
    function wakeWanted() { return wakeApp && !document.hidden && Date.now() - wakeIdleAt < WAKE_IDLE_MS; }
    function wakeRelease() {
      var l = wakeLock; wakeLock = null;
      if (l) { try { l.release(); } catch (e) {} }
    }
    // 3.7.3: when the phone says no (or lets go while the app is showing) and the screen is still wanted awake, ask again on its own a moment
    // later (1.5 s, 3 s, 5 s, then every 10 s) instead of waiting for the next touch. Opening the app often gets a "no" the first time.
    var wakeTries = 0, wakeRetryTimer = null;
    function wakeRetry() {
      clearTimeout(wakeRetryTimer);
      if (!wakeWanted()) { wakeTries = 0; return; }
      wakeTries++;
      wakeRetryTimer = setTimeout(wakeSync, wakeTries === 1 ? 1500 : wakeTries === 2 ? 3000 : wakeTries === 3 ? 5000 : 10000);
    }
    function wakeSync() {
      if (!wakeWanted()) { clearTimeout(wakeRetryTimer); wakeTries = 0; wakeRelease(); return; }
      if (wakeLock || wakePending || !navigator.wakeLock || !navigator.wakeLock.request) return;
      wakePending = true;
      navigator.wakeLock.request("screen").then(function(l) {
        wakePending = false;
        clearTimeout(wakeRetryTimer); wakeTries = 0;
        wakeLock = l; wakeHeldAt = Date.now(); wakeNote("held");
        try { l.addEventListener("release", function() {
          if (wakeLock !== l) return;   // let go by this page (it is not wanted now)
          wakeLock = null;
          if (!document.hidden) { wakeNote("phone"); wakeRetry(); }   // the phone let go while the app was showing (going to the background lets go too, which is normal)
        }); } catch (e) {}
        if (!wakeWanted()) wakeRelease();
      }, function(err) {
        wakePending = false;
        var last = wakeEv[wakeEv.length - 1];
        if (!last || last.e !== "refused") wakeNote("refused", err && err.name ? String(err.name).slice(0, 40) : "");   // noted once per run of "no"s, not on every retry
        wakeRetry();
      });
    }
    function wakeTouch() {
      wakeIdleAt = Date.now();
      clearTimeout(wakeTimer);
      wakeTimer = setTimeout(wakeSync, WAKE_IDLE_MS + 1000);
      wakeSync();
    }
    document.addEventListener("visibilitychange", wakeSync);

    function dismissSplash() {
      const splash = document.getElementById('splashScreen');
      if (splash && splash.style.display !== 'none') {
        splash.style.opacity = '0';
        setTimeout(() => { splash.style.display = 'none'; }, 250);
      }
    }

    // Unsent New-card presses, kept here so closing the app before the server answers does not lose them.
    function saveOutbox(items) {
      try {
        var clean = [];
        (Array.isArray(items) ? items : []).slice(0, 20).forEach(function(it) {
          if (!it || typeof it.ref !== "string" || !it.ref || it.ref.length > 120) return;
          if (it.action !== "press" && it.action !== "miss" && it.action !== "review" && it.action !== "skip" && it.action !== "again") return;   // a Lock Miss (Repeat) and a Review are presses too
          var rep = Number(it.rep);   // a Lock card's rep is 0 before its first pass: 0 must stay 0, or the replayed press is refused as out of date
          var x = it.x && typeof it.x === "object" ? { h: Number(it.x.h) || 0, s: Number(it.x.s) || 0, p: Number(it.x.p) || 0, v: Number(it.x.v) || 0 } : null;   // v: 3 = a 3.0 press
          clean.push({ ref: it.ref, action: it.action, rep: isFinite(rep) && rep >= 0 ? rep : 1, promote: it.promote === true, id: String(it.id || "").slice(0, 40), at: Number(it.at) || 0, x: x });
        });
        if (clean.length) localStorage.setItem("vrb_outbox", JSON.stringify(clean)); else localStorage.removeItem("vrb_outbox");
        dbMirror("outbox", clean);
      } catch (e) {}
    }
    function sendReplay(src) {
      try {
        var raw = localStorage.getItem("vrb_outbox");
        if (!raw) return;
        var items = JSON.parse(raw);
        if (Array.isArray(items) && items.length) src.postMessage({ type: "VR_REPLAY", items: items }, appOrigin);
      } catch (e) {}
    }

    window.addEventListener('message', function(e) {
      var d = e.data;
      if (!d || typeof d !== 'object') return;

      if (!isAppOrigin(e.origin) || !fromAppFrame(e.source)) return;   // 3.2.1: a Google page, and the one inside our own app frame
      appOrigin = e.origin;

      if (d.type === 'VR_WAKE') {
        wakeMsgAt = Date.now();
        if ((d.on === true) !== wakeApp) wakeNote(d.on === true ? "new" : "left");
        wakeApp = d.on === true;
        if (wakeApp) wakeTouch(); else wakeSync();
        return;
      }
      if (d.type === 'VR_CLIP_READ') {
        // the app asks us (top page, where clipboard access is allowed) to read the clipboard after the user's tap
        var src = e.source, org = e.origin, rid = d.id;
        function reply(ok, text, err) { try { src.postMessage({ type: 'VR_CLIP_TEXT', id: rid, ok: ok, text: text, error: err }, org); } catch (x) {} }
        try {
          if (!navigator.clipboard || !navigator.clipboard.readText) { reply(false, '', 'unsupported'); return; }
          navigator.clipboard.readText().then(function(tx) { reply(true, tx, ''); }, function(er) { reply(false, '', String(er && er.name || er)); });
        } catch (x) { reply(false, '', 'error'); }
        return;
      }
      if (d.type === 'VR_CACHE') {
        // 4.6.14: the opening screen's copy of the New card: not kept any more
      } else if (d.type === 'VR_VL') {
        saveVl(d.verses);
      } else if (d.type === 'VR_PILLS') {
        savePills(d.pills);
      } else if (d.type === 'VR_RELOAD') {
        // An automatic reload (the page saw a newer copy) happens at most once per minute, so a stuck old copy can only retry slowly, never spin;
        // a tap on "Update ready" or "Reload app" always goes through.
        // During an update (the page says which newer build it wants) the minute does not apply: Google can hand back the old page right after an install, and the
        // page's own retries would otherwise sit waiting for the minute to pass. Those reloads are capped on their own: six per wanted build within five minutes (the page itself spaces them 10 s apart).
        if (d.auto === true) {
          try {
            var want = Number(d.want) || 0;
            if (want > 0) {
              var w = null; try { w = JSON.parse(localStorage.getItem("vrb_autow") || "null"); } catch (x) {}
              var same = w && w.n === want && Date.now() - w.at < 300000;
              if (same && w.c >= 6) return;
              localStorage.setItem("vrb_autow", JSON.stringify({ n: want, c: (same ? w.c : 0) + 1, at: same ? w.at : Date.now() }));
            } else {
              var lastAuto = Number(localStorage.getItem("vrb_auto") || 0);
              if (Date.now() - lastAuto < 60000) return;
              localStorage.setItem("vrb_auto", String(Date.now()));
            }
          } catch (err) { return; }
        }
        if (Number(d.wait) > 0) waitForBuild(Number(d.wait)); else loadApp();
      } else if (d.type === 'VR_WAKE_Q') {
        try { e.source.postMessage({ type: "VR_WAKEINFO", wk: wakeInfo() }, appOrigin); } catch (err) {}
      } else if (d.type === 'VR_BUSY') {
        appBusy = !!d.b;
      } else if (d.type === 'VR_SESSION') {
        appSavedSession = true;
        // 3.10 instant deck: the app's current session (sent only when every save has landed), for the next open (direct mode only)
        if (DIRECT && d.s && typeof d.s === "object" && typeof d.day === "string") VRDB.set("session", { s: d.s, day: d.day, at: Date.now(), pend: Array.isArray(d.pend) ? d.pend.slice(0, 200) : [], rowsOk: d.rowsOk === true }).catch(function() {});
      } else if (d.type === 'VR_OUTBOX') {
        saveOutbox(d.items);
      } else if (d.type === 'VR_READY') {
        appFrameReady = e.source; sendFresh(); sendNewer();
        sendGoto(e.source);
        sendReplay(e.source);
        try { e.source.postMessage(shellInfo(noteVersion(d.build, d.srv)), appOrigin); } catch (err) {}
        dismissSplash();
      } else if (d.type === 'VR_APPLIED') {
        dismissSplash();
      } else if (d.type === 'VR_AUTH_REQUIRED') {
        askKey();
      }
    });

    setTimeout(dismissSplash, 4000);
  </script>
</body>
</html>
