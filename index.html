<!DOCTYPE html>
<html lang="en" style="color-scheme: light dark;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Verse Review</title>

  <!-- Preconnect & Prefetch Hints -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=15">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=15">
  <link rel="icon" type="image/png" sizes="192x192" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=15">
  <link rel="manifest" href="manifest.json">

  <!-- Native Opaque Status Bar Setup -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Verse Review">
  <meta name="color-scheme" content="light dark">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-theme: #f8f9fa;
      --spinner-color: #1a73e8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-theme: #121212;
        --spinner-color: #8ab4f8;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-theme);
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      display: block;
      background-color: var(--bg-theme);
    }

    #splashScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-theme);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(128, 128, 128, 0.2);
      border-top-color: var(--spinner-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #earlyFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      z-index: 50;
      background-color: var(--bg-theme);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splashScreen">
    <div class="spinner"></div>
  </div>

  <iframe id="appFrame" allow="clipboard-read; clipboard-write"></iframe>
  <iframe id="earlyFrame" title="Saved New verses"></iframe>

  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbyoSSJrEh4cf-YkLXIJgiQ3d4KZbzTG2Twho6JSRAlwXkaGbpZXAPfGqBegHhLc5U3YPQ/exec";

    // Optional access key: only used if you add a VR_KEY script property in Apps Script.
    // It is stored on this device only, never in this public file.
    // When this icon first opened, so the status readout can show whether its saved data ever got wiped (a wipe starts the date over).
    try { if (!localStorage.getItem("vr_first")) localStorage.setItem("vr_first", String(Date.now())); } catch (e) {}
    // The hint level of each new verse (one verse, one day), kept so it is the same the next time the app opens: "reference|verse|day" -> 1, 2 or 3.
    function loadHints() { try { var m = JSON.parse(localStorage.getItem("vr_hl") || "{}"); return m && typeof m === "object" ? m : {}; } catch (e) { return {}; } }
    // The old hints-on switch (before levels): the app turns it into Level 1 the first time, then it is gone.
    function legacyHint() { try { return localStorage.getItem("vr_hint") === "1"; } catch (e) { return false; } }
    function saveHint(key, level) {
      if (!key || typeof level !== "number") return;
      try {
        var m = loadHints();
        delete m[key];
        if (level > 0) m[key] = level;
        var ks = Object.keys(m);
        while (ks.length > 12) delete m[ks.shift()];   // only the latest few are worth keeping
        localStorage.setItem("vr_hl", JSON.stringify(m));
        localStorage.removeItem("vr_hint");
      } catch (e) {}
    }
    // The last verse list and the Review Complete pills, kept so the app can show them at once and then refresh them.
    function loadVl() { try { var v = JSON.parse(localStorage.getItem("vr_vl") || "null"); return Array.isArray(v) && v.length ? v : null; } catch (e) { return null; } }
    function saveVl(v) {
      if (!Array.isArray(v) || !v.length) return;
      try { localStorage.setItem("vr_vl", JSON.stringify(v)); } catch (e) { try { localStorage.removeItem("vr_vl"); } catch (x) {} }
    }
    function loadPills() { try { var v = JSON.parse(localStorage.getItem("vr_pills") || "null"); return v && typeof v === "object" ? v : null; } catch (e) { return null; } }
    function savePills(v) { if (!v || typeof v !== "object") return; try { localStorage.setItem("vr_pills", JSON.stringify(v)); } catch (e) {} }
    function shellInfo() {
      var first = 0, key = false, works = false;
      try { first = Number(localStorage.getItem("vr_first")) || 0; key = !!localStorage.getItem("vr_key"); works = true; } catch (e) {}
      return { type: "VR_SHELL", first: first, key: key, works: works, hl: loadHints(), legacy: legacyHint(), vl: loadVl(), pills: loadPills() };
    }
    function loadApp() {
      var key = "";
      try { key = localStorage.getItem("vr_key") || ""; } catch (e) {}
      // The changing "_" part only exists so the phone cannot reuse an old copy of the app; the server ignores it.
      var url = APP_URL + "?platform=mobile&_=" + Date.now() + (key ? "&key=" + encodeURIComponent(key) : "");
      document.getElementById("appFrame").src = url;
    }
    loadApp();
  </script>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    // ── Reminders (OneSignal web push) ──
    // The shell owns push because the service worker has to live on this site, not inside the Apps Script frame.
    var pushSource = null, pushOS = null;
    // A tapped push opens us with ?go=new or ?go=review; once the app is up we send it to that tab.
    var pendingGo = null;
    try {
      var qs = new URLSearchParams(location.search);
      var g = qs.get("go");
      if (g === "new" || g === "review") pendingGo = g;
      if (qs.has("go") && history.replaceState) history.replaceState(null, "", location.pathname);
    } catch (e) {}
    var appSource = null;
    // The service worker tells us which tab a tapped push wants, for when the app was already open.
    try {
      navigator.serviceWorker.addEventListener("message", function(ev) {
        var m = ev.data;
        if (m && m.type === "VR_GOTO" && (m.tab === "new" || m.tab === "review")) {
          pendingGo = m.tab;
          if (appSource) sendGoto(appSource);
        }
      });
    } catch (e) {}
    function sendGoto(src) {
      appSource = src;
      if (!pendingGo) return;
      var tab = pendingGo; pendingGo = null;
      setTimeout(function() { try { src.postMessage({ type: "VR_GOTO", tab: tab }, "*"); } catch (e) {} }, 700);
    }
    // No icon badge: clear any leftover one when the app opens or comes back.
    function clearIconBadge() { try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (e) {} }
    clearIconBadge();
    document.addEventListener('visibilitychange', function() { if (!document.hidden) clearIconBadge(); });
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      pushOS = OneSignal;
      await OneSignal.init({
        appId: "e9bc8efc-620e-49a8-9275-09f9d76cd272",
        serviceWorkerPath: "/VerseReviewer/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/VerseReviewer/" },
        notifyButton: { enable: false },
        promptOptions: { slidedown: { prompts: [] } }
      });
      try { OneSignal.User.PushSubscription.addEventListener("change", sendPushState); } catch (e) {}
      sendPushState();
    });
    function pushState() {
      var os = pushOS;
      var supported = !!os && ("Notification" in window);
      var on = false, denied = false;
      try { on = !!(os && os.User.PushSubscription.optedIn); } catch (e) {}
      try { denied = (Notification.permission === "denied"); } catch (e) {}
      return { type: "VR_PUSH_STATE", supported: supported, on: on, denied: denied };
    }
    function sendPushState() {
      if (!pushSource) return;
      try { pushSource.postMessage(pushState(), "*"); } catch (e) {}
    }
    function enablePush() {
      if (!pushOS) { sendPushState(); return; }
      try {
        pushOS.Notifications.requestPermission().then(sendPushState, sendPushState);
      } catch (e) { sendPushState(); }
    }
  </script>

 }\n    #verseListView input { -webkit-user-select: text; user-select: text; }\n    .vl-verse.lp-down, .picker-item.lp-down { background: var(--btn-restart-bg); }\n    .fail-list .fail-row { flex-wrap: wrap; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }\n    .fail-list .fail-row.lp-down { background: var(--btn-restart-bg); }\n    /* Peek: the first words swap in over the reference (the rank pill stays), wiping in with a soft edge */\n    .vl-peek { position: absolute; z-index: 9; top: 50%; margin-top: -15px; height: 30px; display: flex; align-items: center; box-sizing: border-box; padding: 0 2px; overflow: hidden; pointer-events: none;\n      white-space: nowrap; font-weight: 700; font-style: italic; color: var(--text-accent); -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }\n    .peek-hid { visibility: hidden; }\n    .vl-pk-date { position: absolute; z-index: 9; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 700; font-style: italic; white-space: nowrap; pointer-events: none; }   /* the next review date, in the rank pill's place while the first words show */\n    .vl-peek span { -webkit-mask-image: linear-gradient(90deg, #000 0, #000 72%, transparent 100%); mask-image: linear-gradient(90deg, #000 0, #000 72%, transparent 100%); padding-right: 6px; }\n    /* Full verse popup: the row opens into a card that looks like a review card (rank colours, same header, same verse box).\n       Hold the reference to flip the box to the verse's Background. */\n    .vp-dim { position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, 0.4); }\n    .vp-wrap { position: fixed; z-index: 91; left: 20px; right: 20px; max-width: 460px; margin: 0 auto; filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.38)); }\n    .vp-pop { position: relative; display: flex; flex-direction: column; background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-card); border-radius: 20px; overflow: hidden; }\n    .vp- erse numbers */\n    .vp-bgp .ctx-scroll { overflow: visible; padding: 0; }\n    .vp-bgp button { border: 0; background: none; color: var(--text-accent); font: inherit; margin: 0; min-height: 0; width: auto; box-shadow: none; flex-direction: row; }\n    .vp-bgp { font-size: 15px; line-height: 1.5; }\n    /* rank colours, the same recipe as .card.ranked (the glow sits on the wrapper because the popup's own clip would cut it) */\n    .vp-pop.ranked, .vp-wrap.ranked { --rc: var(--rl); }\n    @media (prefers-color-scheme: dark) { .vp-pop.ranked, .vp-wrap.ranked { --rc: var(--rd); } }\n    @supports (color: color-mix(in srgb, red 50%, blue)) {\n      .vp-pop.ranked {\n        border-color: color-mix(in srgb, var(--rc) var(--rb), var(--border-card));\n        background: linear-gradient(180deg, color-mix(in srgb, var(--rc) var(--rt), var(--bg-card)), var(--bg-card) 38%);\n      }\n      .vp-wrap.ranked { filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.40)) drop-shadow(0 4px 10px var(--card-shadow)) drop-shadow(0 0 16px color-mix(in srgb, var(--rc) var(--rg), transparent)); }\n    }\n    .vl-verse + .vl-verse { border-top: 1px solid var(--border-card); }\n\n    .rank-1 { --rl: #a8643a; --rd: #d9945f; }\n    .rank-2 { --rl: #7b8794; --rd: #b8c2cc; }\n    .rank-3 { --rl: #b88a00; --rd: #f2c94c; }\n    .rank-4 { --rl: #5b6b8c; --rd: #aebbd9; }\n    .rank-5 { --rl: #2754c5; --rd: #7da2ff; }\n    .rank-6 { --rl: #138a55; --rd: #4fd18e; }\n    .rank-7 { --rl: #c62847; --rd: #ff7088; }\n    .rank-8 { --rl: #0e92b8; --rd: #6fe0ff; }\n    @media (prefers-color-scheme: dark) {\n      .rank-badge { --rc: var(--rd); }\n      .rank-badge.is-new { --rc: var(--text-meta); }\n    }\n\n    /* Top ranks get a soft glint that sweeps across the pill now and then:\n       Diamond every 3 s, Ruby every 5 s, Emerald (fainter) every 8 s. */\n    .rank-badge.rank-6, .rank-badge.rank-7, .rank-badge.rank-8 { position: relative; overflow: hidden; }\n    .rank-badge.rank-6::after, .rank-badge.rank-7::after, .rank-badge.rank-8::after {\n      content: \"\"; position: absolute; top: 0; bottom: 0; left: 0; width: 38%; pointer-events: none;\n      transform: translateX(-110%);\n      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, var(--sh)), transparent);\n      animation: rankShimmer var(--per) ease-in-out infinite;\n    }\n    .rank-badge.rank-8 { --per: 3s; --sh: 0.8; }\n    .rank-badge.rank-7 { --per: 5s; --sh: 0.65; }\n    .rank-badge.rank-6 { --per: 8s; --sh: 0.45; }\n    @media (prefers-color-scheme: dark) {\n      .rank-badge.rank-8 { --sh: 0.44; }\n      .rank-badge.rank-7 { --sh: 0.36; }\n      .rank-badge.rank-6 { --sh: 0.25; }\n    }\n    @keyframes rankShimmer {\n      0%   { transform: translateX(-110%); }\n      30%  { transform: translateX(290%); }\n      100% { transform: translateX(290%); }\n    }\n\n    .meta-tag.is-repeat-badge {\n      color: var(--text-repeat);\n      font-weight: 700;\n      background: var(--badge-repeat-bg);\n      padding: 2px 8px;\n      border-radius: 6px;\n    }\n\n    .meta-tag.is-fasttrack-badge {\n      color: var(--text-fasttrack);\n      font-weight: 800;\n      background: var(--badge-fasttrack-bg);\n      padding: 2px 8px;\n      border-radius: 6px;\n      letter-spacing: 0.6px;\n    }\n\n    .pips-container {\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: 6px;\n      margin-bottom: 8px;\n      min-height: 14px;\n    }\n\n    .pip {\n      width: 7px;\n      height: 7px;\n      border-radius: 50%;\n      background: var(--border-body);\n      border: 1px solid var(--border-card);\n      transition: background-color 0.2s ease, transform 0.2s ease;\n    }\n\n    /* a rep filling in: the ring fills solid all at once with a little pop. When every dot is full they turn green one after another in a wave, and the pill flashes green. */\n    .pip { position: relative; color: var(--text-accent); }\n    .card.ranked .pip { color: var(--rc); }\n    .pips-container.late-1 .pip { color: #f59e0b; }\n    .pip.pop { animation: pipPop 0.42s ease-out both; }\n    .pip.grow { animation: pipGrow 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; animation-delay: calc(var(--k, 0) * 0.14s); }\n    @keyframes pipGrow { from { transform: scale(0); opacity: 0; } }\n    @keyframes pipPop {\n      0% { transform: scale(1.25); background: transparent; border-color: currentColor; }\n      38% { transform: scale(1.65); background: currentColor; border-color: currentColor; }\n      72% { transform: scale(1.05); background: currentColor; border-color: currentColor; }\n      100% { transform: scale(1.15); background: currentColor; border-color: currentColor; }\n    }\n    .pips-container { position: relative; }\n    .pips-container.fin .pip { animation: pipGreen 0.8s ease-out both; animation-delay: calc(var(--k, 0) * 0.08s); }\n    @keyframes pipGreen {\n      35% { transform: scale(1.55); background: #34c759; border-color: #34c759; box-shadow: 0 0 10px #34c759; }\n      70% { transform: scale(1.15); background: #34c759; border-color: #34c759; }\n    }\n    .rank-badge.fin-pill { animation: pipPill 0.7s ease-out 0.35s both; }\n    @keyframes pipPill { 35% { transform: scale(1.22); color: #34c759; box-shadow: 0 0 0 1px #34c759, 0 0 10px rgba(52, 199, 89, 0.45); } }\n\n    /* the rep you are on: a ring; it fills when the rep is done */\n    .pip.cur { background: transparent; border-color: var(--text-accent); transform: scale(1.25); box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.22); }\n    .pip.filled {\n      background: var(--text-accent);\n      border-color: var(--text-accent);\n      transform: scale(1.15);\n      box-shadow: 0 0 5px rgba(26, 115, 232, 0.4);\n    }\n\n    /* A New card with a rep waiting: the filled dots turn amber, a gentle reminder (late-2 is no longer used) */\n    .pips-container.late-1 .pip.filled { background: #f59e0b; border-color: #f59e0b; box-shadow: 0 0 5px rgba(245, 158, 11, 0.45); }\n    .pips-container.late-1 .pip.cur { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25); }\n    .pips-container.late-2 .pip.cur { border-color: #e5484d; box-shadow: 0 0 0 2px rgba(229, 72, 77, 0.25); }\n    .pips-container.late-2 .pip.filled { background: #e5484d; border-color: #e5484d; box-shadow: 0 0 5px rgba(229, 72, 77, 0.45); }\n    .lm-st.late-1 { color: #d98200; font-weight: 700; }\n    .lm-st.late-2 { color: #e5484d; font-weight: 700; }\n\n    /* Fast-Track Glowing Pip */\n    .fast-track-pip {\n      font-size: 15px;\n      line-height: 1;\n      color: var(--text-fasttrack);\n      filter: drop-shadow(0 0 6px rgba(217, 119, 6, 0.7));\n      animation: pulse-glow 1.8s infinite ease-in-out;\n      user-select: none;\n    }\n\n    @keyframes pulse-glow {\n      0%, 100% { transform: scale(1); opacity: 0.9; }\n      50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 9px rgba(217, 119, 6, 1)); }\n    }\n\n    .verse-body {\n      -webkit-user-select: none;\n      user-select: none;\n      flex: 1;\n      background: var(--bg-body);\n      border: 1px solid var(--border-body);\n      border-radius: 14px;\n      display: flex;\n      flex-direction: column;\n      justify-content: flex-start;\n      align-items: stretch;\n      padding: 12px 14px;\n      margin-bottom: 0;\n      overflow-y: auto;\n      overflow-x: hidden;\n      min-height: 0;\n      scroll-behavior: smooth;\n      box-sizing: border-box;\n      cursor: pointer;\n      touch-action: pan-y;   /* vertical scrolling only, so sideways swipes reach the page */\n    }\n\n    .passage-toolbar {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      padding: 0 0 8px 0;\n      margin-bottom: 10px;\n      border-bottom: 1px solid var(--border-body);\n      flex-shrink: 0;\n    }\n\n    .passage-status {\n      font-size: 11px;\n      font-weight: 700;\n      color: var(--text-muted);\n      text-transform: uppercase;\n      letter-spacing: 0.5px;\n      line-height: 15px;\n    }\n    .hint-flag { display: inline-flex; align-items: center; color: var(--text-accent); cursor: pointer; padding: 8px; margin: -8px; transition: opacity .25s; -webkit-tap-highlight-color: transparent; }   /* the bulb is the hints switch; the padding is its tap area, the margin keeps the layout the same */\n    .hint-flag.off { opacity: .3; }\n    .hint-flag.pulse svg { animation: bulbPulse .5s ease-out; }\n    @keyframes bulbPulse { 40% { transform: scale(1.45); } }\n    .v-text.hinted .hz { transition: color .22s ease; }\n    body.peek .v-text.hinted .hz, body.peek .v-text.hinted .hu { color: var(--text-primary); }   /* holding the verse: the full words of every verse showing (the one you are learning and any you revealed) fade in, in place */\n    body.peek .v-text.hinted .hu::after { opacity: 0; }   /* the dots fade out as the words fade in */\n    body.peek .v-text.blurred.cv { filter: none; opacity: 1; background-color: transparent; }   /* ...and with hints off the blurred verse you are learning shows for as long as you hold */\n    .passage-status { transition: opacity .16s ease; }\n    .passage-status.done { color: #1b7a3a; }   /* \"Verse 1 done\" while the dots celebrate */\n    @media (prefers-color-scheme: dark) { .passage-status.done { color: #7fdca0; } }\n    .hint-flag svg { width: 18px; height: 18px; display: block; }   /* the bulb draws itself: outline, filled, filled with rays */\n\n    /* 1. Mobile Default Typography (Touchscreens) */\n    .passage-stream, .pv-text {\n      font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;   /* the verse popup and the cards share one face */\n      font-size: 17.5px;\n      line-height: 1.7;\n      letter-spacing: 0.1px;\n      color: var(--text-primary);\n      text-align: justify;\n      text-justify: inter-word;\n      word-break: normal;\n    }\n\n    /* 2. Desktop Override Typography (Mouse / Precision Trackpads) */\n    @media (hover: hover) and (pointer: fine) {\n      .passage-stream, .pv-text {\n        font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n        font-size: 16.5px;\n        line-height: 1.7;\n        letter-spacing: 0px;\n      }\n    }\n\n    .verse-unit {\n      cursor: pointer;\n      display: inline;\n    }\n\n    .v-num {\n      font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n      font-size: 11px;\n      font-weight: 800;\n      color: var(--text-accent);\n      vertical-align: super;\n      margin-right: 3px;\n      margin-left: 3px;\n      user-select: none;\n      display: inline-block;\n    }\n\n    /* phrase letter (a, b, c...) in front of a revealed phrase of a split verse */\n    .p-let {\n      font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n      font-size: 10px;\n      font-weight: 700;\n      letter-spacing: 0.3px;\n      color: var(--text-meta);\n      vertical-align: super;\n      margin: 0 1px 0 0;\n      user-select: none;\n    }\n\n    /* a long press (the hint hold) must not start iOS's text highlight over the blurred words */\n    .passage-stream, .passage-stream .verse-unit, .passage-stream .v-text { -webkit-user-select: none; -webkit-touch-callout: none; }\n    .passage-stream ::selection, .passage-stream::selection { background: transparent; color: inherit; }\n    .v-text {\n      border-radius: 4px;\n      padding: 2px 4px;\n      transition: filter 0.18s ease, opacity 0.18s ease, background-color 0.18s ease;\n    }\n\n    .v-text.blurred {\n      filter: blur(var(--spoiler-blur));\n      opacity: 0.2;\n      background-color: var(--spoiler-bg);\n      user-select: none;\n    }\n\n    .v-text.revealed {\n      filter: none;\n      opacity: 1;\n      background-color: transparent;\n    }\n\n    /* Hint mode (New tab): a revealed phrase shows only its first letters in blue, in the exact spot the full text has.\n       The rest of each word keeps -fail.locked { opacity: 0.6; }\n    #btnFail.seen.only { pointer-events: none; }\n\n    .btn-pass { \n      flex: 1; \n      min-height: 54px; \n      background: var(--btn-pass-bg); \n      color: var(--btn-pass-text); \n      font-size: 16px; \n    }\n    .btn-pass.clear { background: var(--btn-restart-bg); color: var(--btn-restart-text); }   /* repeat cards: blue, like the New tab's Review button */\n\n    .btn-pass.locked { opacity: 0.5; }                      /* New card waiting for its next unlock time: still tappable (shows the time) */\n    .pt-right { display: inline-flex; align-items: center; gap: 10px; }\n    .pt-note { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; }   /* Review bar: Card N of M */\n    .pt-note b { font-weight: 800; }\n    .v-num.dim { opacity: 0.45; }                           /* verses other than the one you are learning today */\n    .lm-item { display: block; width: 100%; padding: 14px; margin-bottom: 8px; border-radius: 12px; border: 0; font-size: 16px; font-weight: 700;\n      background: var(--btn-restart-bg); color: var(--btn-restart-text); }\n    .lm-item.go { background: var(--btn-pass-bg); color: var(--btn-pass-text); }\n    .lm-item.alt { background: var(--bg-body); color: var(--text-primary); border: 1px solid var(--border-card); }\n    .lm-item.lm-row { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; text-align: left; font-weight: 600; }\n    .lm-row .lm-l { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }\n    .lm-row .lm-ref { font-weight: 700; }\n    .lm-row small { font-size: 12px; font-weight: 600; color: var(--text-muted); }\n    .lm-row .lm-r { font-size: 12px; font-weight: 700; color: var(--text-accent); flex: none; text-align: right; }\n    #lmList.lm-scroll { max-height: 52vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }\n    .vp-note { margin-top: 6px; font-s t-primary); }\n    .stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; }\n    .val-grad { color: var(--text-accent); }\n    .val-fail, .val-grad.neg { color: var(--btn-fail-text); }\n    .stat-box.tappable { cursor: pointer; }\n    /* every repeat verse cleared at least once */\n    .stat-box { position: relative; }\n    .stat-box.cleared::after { content: \"\\2713\"; position: absolute; top: 7px; right: 7px; width: 16px; height: 16px; border-radius: 50%;\n      background: var(--badge-pass); color: #fff; font-size: 11px; font-weight: 900; line-height: 16px; text-align: center; }\n    @media (prefers-color-scheme: dark) { .stat-box.cleared::after { color: #0b2a17; } }\n    .stat-box.open { border-color: var(--text-accent); box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.18); }\n    /* Leveled Up with 5 or more: soft gold fill and a bold gold number (the blue \"open\" border still wins when tapped). */\n    :root { --gold-bg-a: rgba(255, 208, 70, 0.22); --gold-bg-b: rgba(214, 158, 20, 0.13); --gold-num: #a87400; }\n    @media (prefers-color-scheme: dark) { :root { --gold-bg-a: rgba(242, 201, 76, 0.18); --gold-bg-b: rgba(200, 150, 20, 0.10); --gold-num: #ffd54a; } }\n    .stat-box.gold { background: linear-gradient(180deg, var(--gold-bg-a), var(--gold-bg-b)); }\n    .stat-box.gold .stat-val { color: var(--gold-num); font-weight: 900; }\n\n    /* Review cards take their verse's rank color: a thin outline, a faint tint at the top, colored progress dots.\n       (Rank colors come from the .rank-N classes above; the tint needs color-mix, older browsers just skip it.) */\n    /* Registered so the card's rank colors can glide from one verse's rank to the next instead of snapping. */\n    @property --rc { syntax: '<color>'; inherits: true; initial-value: transparent; }\n    @property --rb { syntax: '<percentage>'; inherits: true; initial-value: 0%; }\n    @property --rt { syntax: '<percentage>'; inherits: true; initial-value: 0%; }\n    @property --rg { syntax: '<percentage>'; inherits: true; initial-value: 0%; }\n    .card { transition: --rc 0.45s ease, --rb 0.45s ease, --rt 0.45s ease, --rg 0.45s ease; }\n    .card.ranked { --rc: var(--rl); }\n    @media (prefers-color-scheme: dark) { .card.ranked { --rc: var(--rd); } }\n    .card.ranked .pip.filled { background: var(--rc); border-color: var(--rc); }\n    .card.ranked .pip.cur { border-color: var(--rc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--rc) 28%, transparent); }\n    .dia-mark { color: var(--rc, var(--text-accent)); font-size: 13px; line-height: 14px; font-weight: 800; text-shadow: 0 0 7px var(--rc, var(--text-accent)); }\n    /* Strength grows with rank: --rb outline, --rt top tint, --rg outer glow (Silver and Platinum are greys, so they get a little extra). */\n    .rank-1 { --rb: 20%; --rt: 3%;   --rg: 0%; }\n    .rank-2 { --rb: 30%; --rt: 10%;  --rg: 0%; }\n    .rank-3 { --rb: 40%; --rt: 5%;   --rg: 0%; }\n    .rank-4 { --rb: 50%; --rt: 12%;  --rg: 0%; }\n    .rank-5 { --rb: 60%; --rt: 7.5%; --rg: 0%; }\n    .rank-6 { --rb: 70%; --rt: 9%;   --rg: 10%; }\n    .rank-7 { --rb: 80%; --rt: 11%;  --rg: 18%; }\n    .rank-8 { --rb: 90%; --rt: 14%;  --rg: 28%; }\n    @supports (color: color-mix(in srgb, red 50%, blue)) {\n      .card.ranked {\n        border-color: color-mix(in srgb, var(--rc) var(--rb), var(--border-card));\n        background: linear-gradient(180deg, color-mix(in srgb, var(--rc) var(--rt), var(--bg-card)), var(--bg-card) 38%);\n        box-shadow: 0 4px 14px var(--card-shadow), 0 0 16px color-mix(in srgb, var(--rc) var(--rg), transparent);\n      }\n      .card.ranked .pip.filled { box-shadow: 0 0 5px color-mix(in srgb, var(--rc) 55%, transparent); }\n      .dia-mark { text-shadow: 0 0 7px color-mix(in srgb, var(--rc) 70%, transparent); }\n    }\n    .fail-list { text-align: left; margin: -6px 0 14px; padding: 0 12px 6px; background: var(--bg-body); border: 1px solid var(--border-body);\n /\n    .flawless-badge { overflow: hidden; isolation: isolate; --per: 3s; --gl: rgba(255, 224, 110, 0.95); }\n    .flawless-badge::after {\n      content: \"\"; position: absolute; z-index: -1; top: 0; bottom: 0; left: 0; width: 46%; pointer-events: none;\n      transform: translateX(-130%) skewX(-20deg);\n      background: linear-gradient(90deg, transparent 0%, var(--gl) 50%, transparent 100%);\n      animation: flawlessShimmer var(--per) ease-in-out 0.7s infinite;\n    }\n    @keyframes flawlessShimmer {\n      0%   { transform: translateX(-130%) skewX(-20deg); }\n      30%  { transform: translateX(310%) skewX(-20deg); }\n      100% { transform: translateX(310%) skewX(-20deg); }\n    }\n    @media (prefers-color-scheme: dark) { .flawless-badge { --gl: rgba(255, 226, 130, 0.5); } }\n    .flawless-badge.pop { animation: flawless-pop 520ms cubic-bezier(0.2, 0.9, 0.3, 1.25) both; }\n    @keyframes flawless-pop {\n      0%   { opacity: 0; transform: translateX(-50%) scale(0.4); }\n      60%  { opacity: 1; transform: translateX(-50%) scale(1.14); }\n      100% { opacity: 1; transform: translateX(-50%) scale(1); }\n    }\n    .summary-card.top { justify-content: flex-start; padding-top: clamp(84px, 21vh, 170px); overflow-y: auto; -webkit-overflow-scrolling: touch; }\n    .tomorrow-note {\n      position: absolute;\n      left: 50%;\n      transform: translateX(-50%);\n      display: inline-flex;\n      width: max-content;\n      max-width: 90%;\n      bottom: 16px;\n      font-size: 13px;\n      font-weight: 700;\n      color: var(--text-muted);\n      background: transparent;\n      border: 1px solid var(--border-card);\n      border-radius: 999px;\n      overflow: hidden;\n      text-align: center;\n      cursor: pointer;\n      -webkit-tap-highlight-color: transparent;\n    }\n    .tomorrow-note span { padding: 7px 14px; white-space: nowrap; line-height: 16px; }\n    .tomorrow-note span + span { border-left: 1px solid var(--border-card); color: var(--ink, var(--text-a       wakeIdleAt = Date.now();
      clearTimeout(wakeTimer);
      wakeTimer = setTimeout(wakeSync, WAKE_IDLE_MS + 1000);
      wakeSync();
    }
    document.addEventListener("visibilitychange", wakeSync);

    function showEarly() {
      var c = loadEarlyCache();
      if (!c || !EARLY_DOC) return false;
      c.hl = loadHints(); c.legacy = legacyHint();
      var dataJs = JSON.stringify(c).replace(/</g, "\\u003c");
      earlyFrame.srcdoc = EARLY_DOC.replace("/*__DATA__*/null", function() { return dataJs; });
      earlyFrame.style.display = "block";
      earlyActive = true;
      wakeTouch();
      var splash = document.getElementById("splashScreen");
      if (splash) splash.style.display = "none";
      failTimer = setTimeout(function() {
        try { earlyFrame.contentWindow.postMessage({ type: "EV_FAIL" }, "*"); } catch (e) {}
      }, FAIL_AFTER_MS);
      return true;
    }

    function hideEarly() {
      clearTimeout(handoffTimer);
      clearTimeout(failTimer);
      if (!earlyActive) return;
      earlyActive = false;
      earlyFrame.style.display = "none";
      earlyFrame.srcdoc = "";
      wakeSync();
    }

    function dismissSplash() {
      const splash = document.getElementById('splashScreen');
      if (splash && splash.style.display !== 'none') {
        splash.style.opacity = '0';
        setTimeout(() => { splash.style.display = 'none'; }, 250);
      }
    }

    // Unsent New-card presses, kept here so closing the app before the server answers does not lose them.
    function saveOutbox(items) {
      try {
        var clean = [];
        (Array.isArray(items) ? items : []).slice(0, 20).forEach(function(it) {
          if (!it || typeof it.ref !== "string" || !it.ref || it.ref.length > 120) return;
          if (it.action !== "press" && it.action !== "now" && it.action !== "skip" && it.action !== "again") return;
          clean.push({ ref: it.ref, action: it.action, rep: Number(it.rep) || 1, promote: it.promote === true, id: String(it.id || "").slice(0, 40), at: Number(it.at) || 0 });
        });
        if (clean.length) localStorage.setItem("vr_outbox", JSON.stringify(clean)); else localStorage.removeItem("vr_outbox");
      } catch (e) {}
    }
    function sendReplay(src) {
      try {
        var raw = localStorage.getItem("vr_outbox");
        if (!raw) return;
        var items = JSON.parse(raw);
        if (Array.isArray(items) && items.length) src.postMessage({ type: "VR_REPLAY", items: items }, "*");
      } catch (e) {}
    }

    function handoff(src) {
      var st = earlyState || { f: "", revealed: [] };
      try { src.postMessage({ type: "VR_EARLY", f: st.f, revealed: st.revealed || [], n: st.n, hint: typeof st.hint === "number" ? st.hint : undefined }, "*"); } catch (e) {}
      clearTimeout(handoffTimer);
      // If the app never answers (an older version of the page), drop the early view anyway.
      handoffTimer = setTimeout(function() { hideEarly(); dismissSplash(); }, HANDOFF_WAIT_MS);
    }

    window.addEventListener('message', function(e) {
      var d = e.data;
      if (!d || typeof d !== 'object') return;

      if (earlyActive && e.source === earlyFrame.contentWindow) {
        if (d.type === 'EV_STATE') { wakeTouch(); earlyState = d; if (typeof d.hint === 'number') saveHint(d.hk, d.hint); }
        else if (d.type === 'EV_RETRY') {
          try { earlyFrame.contentWindow.postMessage({ type: "EV_WAIT" }, "*"); } catch (err) {}
          loadApp();
          clearTimeout(failTimer);
          failTimer = setTimeout(function() {
            try { earlyFrame.contentWindow.postMessage({ type: "EV_FAIL" }, "*"); } catch (err) {}
          }, FAIL_AFTER_MS);
        }
        return;
      }

      if (!isAppOrigin(e.origin)) return;

      if (d.type === 'VR_WAKE') {
        wakeApp = d.on === true;
        if (wakeApp) wakeTouch(); else wakeSync();
        return;
      }
      if (d.type === 'VR_CLEAR_PUSH') {
        clearDelivered(d.fresh === true, d.daily === true);
        return;
      }
      if (d.type === 'VR_PUSH_ENABLE') {
        pushSource = e.source;
        enablePush();
        return;
      }
      if (d.type === 'VR_CLIP_READ') {
        // the app asks us (top page, where clipboard access is allowed) to read the clipboard after the user's tap
        var src = e.source, org = e.origin, rid = d.id;
        function reply(ok, text, err) { try { src.postMessage({ type: 'VR_CLIP_TEXT', id: rid, ok: ok, text: text, error: err }, org); } catch (x) {} }
        try {
          if (!navigator.clipboard || !navigator.clipboard.readText) { reply(false, '', 'unsupported'); return; }
          navigator.clipboard.readText().then(function(tx) { reply(true, tx, ''); }, function(er) { reply(false, '', String(er && er.name || er)); });
        } catch (x) { reply(false, '', 'error'); }
        return;
      }
      if (d.type === 'VR_CACHE') {
        saveEarlyCache(d.cards);
      } else if (d.type === 'VR_HINT') {
        saveHint(d.key, d.level);
      } else if (d.type === 'VR_VL') {
        saveVl(d.verses);
      } else if (d.type === 'VR_PILLS') {
        savePills(d.pills);
      } else if (d.type === 'VR_RELOAD') {
        // An automatic reload (the page saw a newer copy) happens at most once per minute, so a stuck old copy can only retry slowly, never spin;
        // a tap on "Update ready" or "Reload app" always goes through.
        if (d.auto === true) {
          try {
            var lastAuto = Number(localStorage.getItem("vr_auto") || 0);
            if (Date.now() - lastAuto < 60000) return;
            localStorage.setItem("vr_auto", String(Date.now()));
          } catch (err) { return; }
        }
        loadApp();
      } else if (d.type === 'VR_OUTBOX') {
        saveOutbox(d.items);
      } else if (d.type === 'VR_READY') {
        sendGoto(e.source);
        sendReplay(e.source);
        try { e.source.postMessage(shellInfo(), "*"); } catch (err) {}
        pushSource = e.source; sendPushState();
        if (earlyActive) handoff(e.source); else dismissSplash();
      } else if (d.type === 'VR_APPLIED') {
        hideEarly();
        dismissSplash();
      } else if (d.type === 'VR_AUTH_REQUIRED') {
        hideEarly();
        dismissSplash();
        var entered = window.prompt("Enter your access key");
        if (entered) {
          try { localStorage.setItem("vr_key", entered.trim()); } catch (err) {}
          loadApp();
        }
      }
    });

    showEarly();
    setTimeout(dismissSplash, 4000);
  </script>
</body>
</html>
