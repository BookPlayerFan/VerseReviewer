<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Verse Review</title>

  <!-- iOS Home Screen Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=6">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=6">
  <link rel="icon" type="image/png" sizes="192x192" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=6">
  <link rel="manifest" href="manifest.json">

  <!-- iOS Standalone PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Verse Review">
  <meta name="color-scheme" content="light dark">

  <!-- Dynamic Theme Color for Status Bar -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-theme: #f8f9fa;
      --safe-top: max(calc(env(safe-area-inset-top) + 6px), 54px);
      --safe-bottom: max(env(safe-area-inset-bottom), 12px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-theme: #121212;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-theme);
    }

    /* Solid Safe-Area Header: Replaces frosted glass blur with a solid theme backdrop */
    .status-bar-shield {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--safe-top);
      background-color: var(--bg-theme);
      z-index: 9999;
      pointer-events: none;
      transition: background-color 0.25s ease;
    }

    /* Fixed-position viewport lock: Uses 100% of the visible screen height */
    iframe {
      position: fixed;
      top: var(--safe-top);
      left: 0;
      right: 0;
      width: 100%;
      height: calc(100dvh - var(--safe-top) - var(--safe-bottom));
      border: none;
      display: block;
      background-color: var(--bg-theme);
      min-height: 0;
    }
  </style>
</head>
<body>
  <!-- Solid background shield behind Dynamic Island and status icons -->
  <div class="status-bar-shield"></div>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbyoSSJrEh4cf-YkLXIJgiQ3d4KZbzTG2Twho6JSRAlwXkaGbpZXAPfGqBegHhLc5U3YPQ/exec" 
    allow="clipboard-read; clipboard-write">
  </iframe>
</body>
</html>
