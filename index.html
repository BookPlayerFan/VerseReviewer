<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Verse Review</title>

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=8">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=8">
  <link rel="icon" type="image/png" sizes="192x192" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=8">
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Verse Review">
  <meta name="color-scheme" content="light dark">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-theme: #f8f9fa;
      --top-barrier: 64px; /* Opaque barrier: drops content entirely below Dynamic Island */
      --bottom-barrier: max(env(safe-area-inset-bottom), 16px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-theme: #121212;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-theme);
    }

    /* 1. Opaque Shield: Completely blocks status bar and Dynamic Island frosted blur */
    .status-bar-shield {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--top-barrier);
      background-color: var(--bg-theme);
      z-index: 99999;
      pointer-events: none;
    }

    /* 2. Fixed viewport container defeats WebKit iframe auto-shrink */
    #frameContainer {
      position: fixed;
      top: var(--top-barrier);
      left: 0;
      right: 0;
      bottom: var(--bottom-barrier);
      width: 100%;
      height: calc(100% - var(--top-barrier) - var(--bottom-barrier));
      overflow: hidden;
      background-color: var(--bg-theme);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: var(--bg-theme);
    }
  </style>
</head>
<body>
  <div class="status-bar-shield"></div>

  <div id="frameContainer">
    <iframe 
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbyoSSJrEh4cf-YkLXIJgiQ3d4KZbzTG2Twho6JSRAlwXkaGbpZXAPfGqBegHhLc5U3YPQ/exec" 
      allow="clipboard-read; clipboard-write">
    </iframe>
  </div>

  <script>
    // Enforce physical pixel height on iOS to defeat iframe content-collapsing
    function enforceFrameHeight() {
      const topH = 64;
      const bottomH = Math.max(16, parseInt(getComputedStyle(document.documentElement).getPropertyValue('--bottom-barrier')) || 16);
      const trueHeight = window.innerHeight - topH - bottomH;
      const frame = document.getElementById('appFrame');
      const container = document.getElementById('frameContainer');
      if (frame && trueHeight > 250) {
        frame.style.height = trueHeight + 'px';
        if (container) container.style.height = trueHeight + 'px';
      }
    }
    window.addEventListener('resize', enforceFrameHeight);
    window.addEventListener('orientationchange', enforceFrameHeight);
    window.addEventListener('DOMContentLoaded', enforceFrameHeight);
    setTimeout(enforceFrameHeight, 350);
  </script>
</body>
</html>
