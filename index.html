<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Verse Review</title>

  <!-- iOS Home Screen App Icon & Favicon -->
  <link rel="apple-touch-icon" href="VerseReviewer.png">
  <link rel="apple-touch-icon-precomposed" href="VerseReviewer.png">
  <link rel="icon" type="image/png" href="VerseReviewer.png">

  <!-- iOS Standalone PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Verse Review">
  <meta name="color-scheme" content="light dark">

  <!-- Dynamic Theme Color for iOS Status Bar -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-theme: #f8f9fa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-theme: #121212;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-theme);
    }

    body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-theme);
      display: flex;
      flex-direction: column;

      /* Buffer to keep status bar icons clear of text/blur */
      padding-top: max(calc(env(safe-area-inset-top) + 4px), 24px);

      /* Chin gap: blends into dark or light mode */
      padding-bottom: env(safe-area-inset-bottom);

      transition: background-color 0.25s ease;
    }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: var(--bg-theme);
    }
  </style>
</head>
<body>
  <!-- Replace with your actual Google Apps Script Web App exec URL -->
  <iframe 
    src="https://script.google.com/macros/s/YOUR_ACTUAL_EXEC_ID/exec" 
    allow="clipboard-read; clipboard-write">
  </iframe>
</body>
</html>
