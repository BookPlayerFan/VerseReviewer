<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Verse Review</title>

  <!-- High-Performance Preconnect & DNS-Prefetch Hints -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=10">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=10">
  <link rel="icon" type="image/png" sizes="192x192" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=10">
  <link rel="manifest" href="manifest.json">

  <!-- iOS Standalone Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Verse Review">
  <meta name="color-scheme" content="light dark">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-theme: #f8f9fa;
      --top-barrier: 80px;
      --bottom-barrier: max(env(safe-area-inset-bottom), 20px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-theme: #121212;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-theme);
    }

    /* Solid Opaque Shield for Status Bar / Dynamic Island */
    .status-bar-shield {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--top-barrier);
      background-color: var(--bg-theme);
      z-index: 99999;
      pointer-events: none;
    }

    #frameContainer {
      position: fixed;
      top: var(--top-barrier);
      left: 0;
      right: 0;
      bottom: var(--bottom-barrier);
      width: 100%;
      overflow: hidden;
      background-color: var(--bg-theme);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: var(--bg-theme);
    }
  </style>
</head>
<body>
  <div class="status-bar-shield"></div>

  <div id="frameContainer">
    <iframe 
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbyoSSJrEh4cf-YkLXIJgiQ3d4KZbzTG2Twho6JSRAlwXkaGbpZXAPfGqBegHhLc5U3YPQ/exec" 
      allow="clipboard-read; clipboard-write">
    </iframe>
  </div>

  <script>
    function lockFrameSize() {
      const topH = 80;
      const bottomH = Math.max(20, parseInt(getComputedStyle(document.documentElement).getPropertyValue('--bottom-barrier')) || 20);
      const trueH = window.innerHeight - topH - bottomH;
      const frame = document.getElementById('appFrame');
      const container = document.getElementById('frameContainer');
      if (trueH > 300) {
        if (container) container.style.height = trueH + 'px';
        if (frame) frame.style.height = trueH + 'px';
      }
    }
    window.addEventListener('resize', lockFrameSize);
    window.addEventListener('orientationchange', lockFrameSize);
    window.addEventListener('DOMContentLoaded', lockFrameSize);
    setTimeout(lockFrameSize, 300);
  </script>
</body>
</html>
