<!DOCTYPE html>
<html lang="en" style="color-scheme: light dark;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Verse Review</title>

  <!-- Preconnect & Prefetch Hints -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=16">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=16">
  <link rel="icon" type="image/png" sizes="192x192" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=16">
  <link rel="manifest" href="manifest.json">

  <!-- Native Opaque Status Bar Setup -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Verse Review">
  <meta name="color-scheme" content="light dark">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-theme: #f8f9fa;
      --spinner-color: #1a73e8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-theme: #121212;
        --spinner-color: #8ab4f8;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      -webkit-text-size-adjust: 100%;   /* iOS must not enlarge the text on its own (it can after the app wakes up) */
      text-size-adjust: 100%;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-theme);
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      display: block;
      background-color: var(--bg-theme);
    }

    #splashScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-theme);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(128, 128, 128, 0.2);
      border-top-color: var(--spinner-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #earlyFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      z-index: 50;
      background-color: var(--bg-theme);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splashScreen">
    <div class="spinner"></div>
  </div>

  <iframe id="appFrame" allow="clipboard-read; clipboard-write"></iframe>
  <iframe id="earlyFrame" title="Saved New verses" sandbox="allow-scripts"></iframe>   <!-- 3.2.1: the quick card runs in its own sealed box (no access to this page or its storage) -->

  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbyoSSJrEh4cf-YkLXIJgiQ3d4KZbzTG2Twho6JSRAlwXkaGbpZXAPfGqBegHhLc5U3YPQ/exec";
    // 3.10 direct mode (native plan step 2): the app runs straight in this page (no Google frames); its page comes from the server's front door and is kept
    // in this phone's database, and every call it makes goes through the front door. Off here; the VR Beta copy of this page (built from this file) has it on.
    var DIRECT = false;

    // Optional access key: only used if you add a VR_KEY script property in Apps Script.
    // It is stored on this device only, never in this public file.
    // When this icon first opened, so the status readout can show whether its saved data ever got wiped (a wipe starts the date over).
    try { if (!localStorage.getItem("vr_first")) localStorage.setItem("vr_first", String(Date.now())); } catch (e) {}
    // 3.2.1: hint levels come from each verse's step now; the levels this page used to keep (before 3.0) are cleared once.
    try { localStorage.removeItem("vr_hl"); localStorage.removeItem("vr_hint"); } catch (e) {}
    // ───── 3.8 local database (native plan, step 3 piece 1) ─────
    // The phone's own database (IndexedDB) for this page. For now it keeps a copy of what this page already saves (the verse list, the unsent presses,
    // the quick view's cards, the pills), so nothing changes in how the app behaves; later stages read from it. If the phone refuses it, every call
    // fails quietly and the app works as before. Stores: verses (keyed by reference), meta (any value by name), outbox (keyed by id).
    var VRDB = (function() {
      var NAME = "vr", VER = 1, db = null, opening = null, broken = "";
      function open() {
        if (db) return Promise.resolve(db);
        if (broken) return Promise.reject(new Error(broken));
        if (opening) return opening;
        opening = new Promise(function(res, rej) {
          var r;
          try { if (!window.indexedDB) throw new Error("no IndexedDB"); r = indexedDB.open(NAME, VER); } catch (e) { broken = String(e && e.message || e); opening = null; rej(e); return; }
          r.onupgradeneeded = function() {
            var d = r.result;
            if (!d.objectStoreNames.contains("verses")) d.createObjectStore("verses", { keyPath: "f" });
            if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
            if (!d.objectStoreNames.contains("outbox")) d.createObjectStore("outbox", { keyPath: "id" });
          };
          r.onsuccess = function() { db = r.result; opening = null; db.onversionchange = function() { try { db.close(); } catch (e) {} db = null; }; db.onclose = function() { db = null; }; res(db); };
          r.onerror = function() { broken = String(r.error && r.error.name || "open failed"); opening = null; rej(r.error); };
          r.onblocked = function() { opening = null; rej(new Error("blocked")); };
        });
        return opening;
      }
      // One transaction: fn(stores) queues the work; resolves with what fn returned (a request's result once done).
      function run(names, mode, fn) {
        return open().then(function(d) {
          return new Promise(function(res, rej) {
            var t = d.transaction(names, mode), st = {}, out;
            names.forEach(function(n) { st[n] = t.objectStore(n); });
            try { out = fn(st); } catch (e) { try { t.abort(); } catch (x) {} rej(e); return; }
            t.oncomplete = function() { res(out && typeof out === "object" && "readyState" in out ? out.result : out); };
            t.onerror = t.onabort = function() { rej(t.error || new Error("aborted")); };
          });
        });
      }
      var api = {
        ok: function() { return open().then(function() { return true; }, function() { return false; }); },
        error: function() { return broken; },
        get: function(key) { return run(["meta"], "readonly", function(s) { return s.meta.get(key); }); },
        set: function(key, val) { return run(["meta"], "readwrite", function(s) { s.meta.put(val, key); }); },
        // The verse list as a whole: rows not in the new list are removed (the list is always complete).
        setVerses: function(list) {
          return run(["verses", "meta"], "readwrite", function(s) {
            s.verses.clear();
            list.forEach(function(v) { if (v && typeof v.f === "string" && v.f) s.verses.put(v); });
            s.meta.put(Date.now(), "versesAt");
          });
        },
        verses: function() { return run(["verses"], "readonly", function(s) { return s.verses.getAll(); }); },
        count: function(name) { return run([name], "readonly", function(s) { return s[name].count(); }); },
        // The unsent presses as a whole (the app sends the full list each time).
        setOutbox: function(items) {
          return run(["outbox"], "readwrite", function(s) { s.outbox.clear(); items.forEach(function(it, i) { s.outbox.put(Object.assign({ n: i }, it, { id: it.id || ("x" + i) })); }); });
        },
        outbox: function() { return run(["outbox"], "readonly", function(s) { return s.outbox.getAll(); }).then(function(a) { return a.sort(function(x, y) { return x.n - y.n; }); }); },
        // Asks the phone not to clear this page's data when space runs low (iPhone may say no; nothing else changes).
        persist: function() {
          try { if (navigator.storage && navigator.storage.persist) return navigator.storage.persist().then(function(p) { return api.set("persist", !!p).then(function() { return !!p; }); }); } catch (e) {}
          return Promise.resolve(false);
        }
      };
      return api;
    })();
    var dbInfo = { ok: null, verses: 0, outbox: 0, persist: null, err: "" };   // for the status panel's "Local database" row
    function dbRefresh() {
      return VRDB.ok().then(function(ok) {
        dbInfo.ok = ok; dbInfo.err = ok ? "" : VRDB.error();
        if (!ok) return;
        return Promise.all([VRDB.count("verses"), VRDB.count("outbox"), VRDB.get("persist"), VRDB.get("versesAt")]).then(function(r) {
          dbInfo.verses = r[0]; dbInfo.outbox = r[1]; dbInfo.persist = r[2] === undefined ? null : r[2]; dbInfo.at = r[3] || 0;
        });
      }).catch(function(e) { dbInfo.ok = false; dbInfo.err = String(e && e.message || e); });
    }
    function dbMirror(what, v) {   // a copy into the database of what was just saved the old way; quiet on failure
      try {
        var p = what === "vl" ? VRDB.setVerses(v) : what === "outbox" ? VRDB.setOutbox(v) : VRDB.set(what, v);
        p.then(dbRefresh, function() {});
      } catch (e) {}
    }
    // First open with the database: copy in what was already saved the old way, and ask to keep it.
    (function() {
      VRDB.ok().then(function(ok) {
        if (!ok) { dbRefresh(); return; }
        VRDB.get("seeded").then(function(seeded) {
          var jobs = [];
          if (!seeded) {
            var vl = loadVl(); if (vl) jobs.push(VRDB.setVerses(vl));
            try { var ob = JSON.parse(localStorage.getItem("vr_outbox") || "null"); if (Array.isArray(ob) && ob.length) jobs.push(VRDB.setOutbox(ob)); } catch (e) {}
            try { var ec = JSON.parse(localStorage.getItem("vr_early") || "null"); if (ec) jobs.push(VRDB.set("early", ec)); } catch (e) {}
            var pl = loadPills(); if (pl) jobs.push(VRDB.set("pills", pl));
            jobs.push(VRDB.set("seeded", Date.now()));
          }
          return Promise.all(jobs).then(function() { return VRDB.persist(); });
        }).then(dbRefresh, dbRefresh);
      });
    })();

    // The last verse list and the Review Complete pills, kept so the app can show them at once and then refresh them.
    function loadVl() { try { var v = JSON.parse(localStorage.getItem("vr_vl") || "null"); return Array.isArray(v) && v.length ? v : null; } catch (e) { return null; } }
    function saveVl(v) {
      if (!Array.isArray(v) || !v.length) return;
      try { localStorage.setItem("vr_vl", JSON.stringify(v)); } catch (e) { try { localStorage.removeItem("vr_vl"); } catch (x) {} }
      dbMirror("vl", v);
    }
    function loadPills() { try { var v = JSON.parse(localStorage.getItem("vr_pills") || "null"); return v && typeof v === "object" ? v : null; } catch (e) { return null; } }
    function savePills(v) { if (!v || typeof v !== "object") return; try { localStorage.setItem("vr_pills", JSON.stringify(v)); } catch (e) {} dbMirror("pills", v); }
    // The last page/server version this phone opened; a different one on the next open means an update just arrived.
    function noteVersion(b, sv) {
      if (!b) return null;
      var prev = null, now = { b: b, s: sv || "" };
      try { prev = JSON.parse(localStorage.getItem("vr_ver") || "null"); } catch (e) {}
      if (!now.s && prev && prev.s) now.s = prev.s;
      try { localStorage.setItem("vr_ver", JSON.stringify(now)); } catch (e) {}
      if (!prev || typeof prev !== "object" || (prev.b === now.b && prev.s === now.s)) return null;
      return { build: now.b, srv: now.s };
    }
    var SHELL_VERSION = "3.19.2";   // 3.5.1: the app version this page last changed in (the same numbers as the app; set at /publish when this page changes)
    var SHELL_BUILD = "shell-46";   // this home-screen page's own number, shown in the status panel (an older copy cached on the phone has none)
    function shellInfo(updated) {
      var first = 0, key = false, works = false;
      try { first = Number(localStorage.getItem("vr_first")) || 0; key = !!localStorage.getItem("vr_key"); works = true; } catch (e) {}
      return { type: "VR_SHELL", sv: SHELL_BUILD, ver: SHELL_VERSION, wl: loadWaitLog(), ws: loadWaits(), first: first, key: key, works: works, vl: loadVl(), pills: loadPills(), updated: updated || null, db: dbInfo };
    }
    // ───── direct mode ─────
    // One call through the front door: POST {op:'api', key, name, args} as plain text (no "may I" round first). Resolves with the result.
    function directCall(name, args) {
      var key = ""; try { key = localStorage.getItem("vr_key") || ""; } catch (e) {}
      return fetch(APP_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow",
        body: JSON.stringify({ op: "api", key: key, name: name, args: Array.isArray(args) ? args : [] }) })
        .then(function(r) { return r.text(); })
        .then(function(t) {
          var j = null; try { j = JSON.parse(t); } catch (e) {}
          if (!j) throw new Error("The server sent something unexpected.");
          if (!j.ok) { var er = new Error(j.error || "The server refused."); er.auth = /Access key/.test(j.error || ""); throw er; }
          return j.result;
        });
    }
    window.directCall = directCall;
    // The app only ever calls the server through google.script.run (its srv() wraps it); here that is a small stand-in sending each call through directCall.
    var DIRECT_SHIM = '<script>(function(){var P=window.parent;function run(s,f){var o={withSuccessHandler:function(h){return run(h,f);},withFailureHandler:function(h){return run(s,h);},withUserObject:function(){return o;},' +
      'api:function(k,name,args){P.directCall(name,args).then(function(r){if(s)s(r);},function(e){if(f)f(e);});}};return o;}window.google={script:{run:run(null,null)}};window.__vrDirect=1;})();<\/script>';
    function directPrepare(html) {
      var head = /<head[^>]*>/i;
      var add = DIRECT_SHIM + (/name=["']viewport/i.test(html) ? "" : '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">');
      return head.test(html) ? html.replace(head, function(m) { return m + add; }) : add + html;
    }
    var directShown = false, directTouched = false;
    var freshDay = null, appFrameReady = null, appSavedSession = false;
    function sendFresh() {
      if (freshDay && (directTouched || appBusy)) { freshDay = null; return; }   // 3.19.2: in use: the app catches up by itself (a day kept for later could be older by then)
      if (!freshDay || !appFrameReady) return;
      try { appFrameReady.postMessage({ type: "VR_FRESH", s: freshDay }, appOrigin); } catch (e) {}
      freshDay = null;
    }
    function directShow(page) {
      appFrameReady = null;
      try { appSource = null; if (lastGo && Date.now() - lastGo.at < 15000 && !pendingGo) pendingGo = lastGo.tab; } catch (e) {}   // 3.19.2
      var f = document.getElementById("appFrame");
      directShown = true; directTouched = false;
      f.onload = function() { try { ["pointerdown", "keydown"].forEach(function(ev) { f.contentWindow.addEventListener(ev, function() { directTouched = true; }, { capture: true, once: true }); }); } catch (e) {} };
      f.removeAttribute("src");
      f.srcdoc = directPrepare(page.html);
    }
    // Opening: the saved app page at once, with today's saved deck when there is one (or with no deck, and the app loads it itself); then the fresh page and
    // session from the server, which take its place unless you have started using it. 3.10: the server sends the page and the session apart ("parts").
    function isoDay() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
    function localDay() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
    function bootJson(sessionJson, pendJson, localJson) {   // the app's BOOT, as the server writes it (the key comes from this phone); pend: review saves still to send (3.10 step 3); local: what the app needs to build a new day itself (3.11)
      var key = ""; try { key = localStorage.getItem("vr_key") || ""; } catch (e) {}
      return '{"boot":1,"key":' + JSON.stringify(key) + ',"session":' + (sessionJson || "null") + (pendJson ? ',"pend":' + pendJson : '') + (localJson ? ',"local":' + localJson : '') + '}';
    }
    function composePage(tpl, sessionJson, pendJson, localJson) {
      var j = bootJson(sessionJson, pendJson, localJson).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
      return { html: tpl.replace(/<\?!=\s*initialSessionJson\s*\?>/, function() { return j; }) };
    }
    function directLoad() {
      directShown = false;
      var savedPend = false;
      var saved = Promise.all([VRDB.get("app"), VRDB.get("session"), VRDB.verses().catch(function() { return []; })]).then(function(r) {
        var p = r[0], ss = r[1], rows = r[2];
        // 3.10 step 3: saves still to send keep their deck even past midnight (they are sent on it first; the server then moves on to the new day)
        savedPend = !!(ss && Array.isArray(ss.pend) && ss.pend.length);
        var use = ss && ss.s && ((ss.day === localDay() && (!ss.s.date || ss.s.date === isoDay())) || savedPend);   // 3.19.2: and the day itself is today's (a copy saved just after midnight could still be yesterday's)
        // 3.11: a new day, nothing waiting, and the app said its copy of the verse list was complete: the app builds today's deck itself, at once
        var local = !use && ss && ss.s && ss.rowsOk === true && Array.isArray(rows) && rows.length && rows[0].dm !== undefined
          ? JSON.stringify({ rows: rows, prev: { learning: ss.s.learning || [], queue: ss.s.queue || [], build: ss.s.build, ver: ss.s.ver } }) : null;
        if (p && !directShown) {
          if (p.tpl) directShow(composePage(p.tpl, use ? JSON.stringify(ss.s) : null, use && savedPend ? JSON.stringify(ss.pend) : null, local));
          else if (p.html) directShow(p);   // a page saved before 3.10
        }
        return p;
      }, function() { return null; });
      directCall("appPage", ["parts"]).then(function(r) {
        var page;
        if (r && r.tpl) {
          VRDB.set("app", { tpl: r.tpl, at: Date.now(), srv: r.srv, ver: r.ver }).catch(function() {});
          try { var b = JSON.parse(r.boot); if (b && b.session && !appSavedSession && !savedPend) { b.session.skew = typeof b.session.serverNow === "number" ? b.session.serverNow - Date.now() : 0; b.session.savedAt = Date.now(); VRDB.set("session", { s: b.session, day: localDay(), at: Date.now() }).catch(function() {}); } } catch (e) {}   // 3.19.2
          page = composePage(r.tpl, (function() { try { var b = JSON.parse(r.boot); return b && b.session ? JSON.stringify(b.session) : null; } catch (e) { return null; } })());
        } else {   // an older server: the whole page
          page = { html: r.html };
          VRDB.set("app", { html: r.html, at: Date.now(), srv: r.srv, ver: r.ver }).catch(function() {});
        }
        // the server's copy takes over unless you have started using the saved one, or saves made on the phone are still on their way (the phone is ahead).
        // 3.18.1: when the page itself is the same one, only the day is handed in (no reload of the whole page, which showed as a second load)
        saved.then(function(p) {
          if (directShown && p && p.tpl && r && r.tpl && p.tpl === r.tpl) {
            try { var bs = JSON.parse(r.boot); if (bs && bs.session) { freshDay = bs.session; sendFresh(); } } catch (e) {}
            return;
          }
          if (!directShown || (!directTouched && !savedPend && !appBusy)) directShow(page);
        });
      }).catch(function(e) {
        saved.then(function(p) {
          if (directShown) return;   // the saved page is up and retries the server itself
          if (e && e.auth) { askKey(); return; }
          dismissSplash();
          if (window.confirm("Couldn't reach the server: " + (e && e.message || e) + "\n\nTry again?")) directLoad();
        });
      });
    }
    function askKey() {
      hideEarly();
      dismissSplash();
      var entered = window.prompt("Enter your access key");
      if (entered) {
        try { localStorage.setItem("vr_key", entered.trim()); } catch (err) {}
        loadApp();
      }
    }
    function loadApp() {
      if (DIRECT) { directLoad(); return; }
      var key = "";
      try { key = localStorage.getItem("vr_key") || ""; } catch (e) {}
      // The changing "_" part only exists so the phone cannot reuse an old copy of the app; the server ignores it.
      var url = APP_URL + "?platform=mobile&_=" + Date.now() + (key ? "&key=" + encodeURIComponent(key) : "");
      document.getElementById("appFrame").src = url;
    }
    loadApp();
    // After an Install the app asks for a reload once Google serves the new page: ask the web app which page number it serves now (a tiny JSON answer), every 3 s,
    // and reload once when it is the wanted one. A server that does not answer yet (the old version sends its page) counts as "not yet". If the check cannot be made
    // at all here (blocked), or after 100 s, reload anyway; the app keeps retrying on its own if the page still comes back old.
    // This page lives on GitHub Pages, and iOS keeps a home-screen app alive for days, so after a change here the phone could go on running the old copy (it did: the
    // quiet update check was missing for a day). At launch, and when you come back after half an hour away, ask GitHub for the current copy and, if its number is higher,
    // load it once. The same number is never tried twice within ten minutes, so a copy that is still cached cannot cause a loop.
    var hiddenAt = 0;
    function checkShellUpdate() {
      try {
        var cur = Number(String(SHELL_BUILD).replace(/\D/g, "")) || 0;
        var base = location.href.split("#")[0].split("?")[0];
        fetch(base + "?s=" + Date.now(), { cache: "no-store" })
          .then(function(r) { return r.ok ? r.text() : ""; })
          .then(function(tx) {
            var m = /var SHELL_BUILD = "shell-(\d+)"/.exec(tx || ""), n = m ? Number(m[1]) : 0;
            if (!(n > cur)) return;
            var last = null; try { last = JSON.parse(localStorage.getItem("vr_shellupd") || "null"); } catch (e) {}
            if (last && last.n === n && Date.now() - last.at < 600000) return;
            reloadWhenIdle(function() {
              try { localStorage.setItem("vr_shellupd", JSON.stringify({ n: n, at: Date.now() })); } catch (e) {}
              location.replace(location.pathname + "?s=" + Date.now() + (pendingGo ? "&go=" + pendingGo : ""));
            }, 0);
          }, function() {});
      } catch (e) {}
    }
    // 3.2.1: not while the app still has a save waiting (it says so with VR_BUSY): wait for it, checking every 3 s for up to 2 minutes, then leave the
    // update for the next launch.
    var appBusy = false;
    function reloadWhenIdle(go, tries) {
      if (!appBusy) { go(); return; }
      if (tries >= 40) return;
      setTimeout(function() { reloadWhenIdle(go, tries + 1); }, 3000);
    }
    setTimeout(checkShellUpdate, 2500);
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) hiddenAt = Date.now();
      else if (hiddenAt && Date.now() - hiddenAt > 30 * 60000) { hiddenAt = 0; checkShellUpdate(); }
    });
    var waitTimer = null;

    try {
      var qs = new URLSearchParams(location.search);
      var g = qs.get("go");
      if (g === "new" || g === "review" || g === "current") pendingGo = g;

    } catch (e) {}
    // A fresh launch opens on the New tab (the card that is due, or the In progress page when nothing is due); a tapped reminder (?go=new or ?go=review) still opens its own tab. (A reload after an update keeps where it was: this is only read once.)
    if (!pendingGo) pendingGo = "new";

      });
    } catch (e) {}

        appId: "e9bc8efc-620e-49a8-9275-09f9d76cd272",
        serviceWorkerPath: "/VerseReviewer/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/VerseReviewer/" },

    }

primary); }\n    .vl-row .vl-right { display: inline-flex; align-items: center; gap: 8px; }\n    .vl-row .vl-count { font-size: 15px; font-weight: 700; color: var(--text-primary); min-width: 22px; text-align: right; }\n    .vl-row .load-bar { width: 74px; height: 8px; border-radius: 4px; background: rgba(128, 128, 128, 0.16); overflow: hidden; flex: none; }\n    .vl-row .load-bar i { display: block; height: 100%; border-radius: 4px; background: var(--text-accent); opacity: 0.55; }\n    .vl-row .load-bar.busy i { background: var(--text-repeat); opacity: 0.9; }\n    /* Upcoming reviews: a calendar. Each day shows how many references are due; the shade is the day's word load. */\n    .cal-sum { font-size: 12px; color: var(--text-muted); margin: 0 2px 10px; min-height: 15px; }\n    .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; margin: 0 0 4px; font-size: 10px; font-weight: 700; color: var(--text-meta); text-align: center; letter-spacing: 0.04em; opacity: 0.8; }\n    .cal-wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; }\n    #upList { padding: 2px 4px 4px; }\n    .cal-s > .cal-d { width: 100%; }\n    .cal-s { padding: 3px; min-width: 0; }\n    /* a day: its date in the middle on a tile coloured by the day's word load: green for a light day, blue for medium, amber for heavy */\n    .cal-d { --h: 0; --rc: var(--text-accent, #1a73e8); position: relative; box-sizing: border-box; height: 50px; min-height: 0; width: auto; padding: 0; border: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; box-shadow: none;\n      --fill: transparent; --ink: var(--rc); background: var(--fill); color: var(--ink); }\n    /* the 1st of a month, and the first day with reviews after a gap, carry the month's short name above the date; a date in another year (or in January) adds the year below it, like Things */\n    .cal-d.lbl { flex-direction: column; font-size: 19px; line-height: 1; }\n    .cal-d.lbl.y3 { font-size: 16px; }\n    .cal-d .mn { order: -1; font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: 0.01em; line-height: 1; margin-bottom: 1px; color: var(--ink); white-space: nowrap; }\n    .cal-d .yy { order: 1; font-style: normal; font-size: 8.5px; font-weight: 700; letter-spacing: 0.03em; line-height: 1; margin-top: 2px; color: var(--ink); opacity: 0.85; }\n    .cal-d.s1, .tomorrow-note.s1 { --fill: #d4efdb; --ink: #1b6b36; }\n    .cal-d.s2, .tomorrow-note.s2 { --fill: #d0e1fc; --ink: #1a4fa8; }\n    .cal-d.s3, .tomorrow-note.s3 { --fill: #f7dcab; --ink: #8a4f00; }\n    @media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .cal-d.s1, :root:not([data-theme=\"light\"]) .tomorrow-note.s1 { --fill: #1f4a33; --ink: #8fe0ae; }\n      :root:not([data-theme=\"light\"]) .cal-d.s2, :root:not([data-theme=\"light\"]) .tomorrow-note.s2 { --fill: #1f3d6e; --ink: #9cc2ff; }\n      :root:not([data-theme=\"light\"]) .cal-d.s3, :root:not([data-theme=\"light\"]) .tomorrow-note.s3 { --fill: #5a4122; --ink: #ffb454; } }\n    :root[data-theme=\"dark\"] .cal-d.s1, :root[data-theme=\"dark\"] .tomorrow-note.s1 { --fill: #1f4a33; --ink: #8fe0ae; }\n    :root[data-theme=\"dark\"] .cal-d.s2, :root[data-theme=\"dark\"] .tomorrow-note.s2 { --fill: #1f3d6e; --ink: #9cc2ff; }\n    :root[data-theme=\"dark\"] .cal-d.s3, :root[data-theme=\"dark\"] .tomorrow-note.s3 { --fill: #5a4122; --ink: #ffb454; }\n        /* a day with nothing due is just a faint number */\n    .cal-d.z { background: none; color: var(--text-meta); font-size: 18px; font-weight: 500; opacity: 0.5; pointer-events: none; }\n    .cal-d.past { opacity: 0.22; }\n    .cal-d.today { box-shadow: 0 0 0 2px var(--bg-card), 0 0 0 3.5px var(--text-accent); }\n    .cal-d.today.z { opacity: 1; color: var(--text-accent); font-weight: 700; }\n    .cal-d:active { transform: none; filter: none; }\n    .cal-d.pk-tile { position: fixed; z-index: 58; margin: 0; opacity: 1; pointer-events: none; transform: scale(1.12); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); }\n    .cal-d.sk { animation: skPulse 1.1s ease-in-out infinite; }\n    @keyframes skPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }\n    .cal-gap { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 0; margin: 6px 0 6px; padding: 8px 0; font-size: 11.5px; font-weight: 600; color: var(--text-meta); }\n    .cal-gap::before, .cal-gap::after { content: \"\"; flex: 1; height: 1px; background: var(--border-card); }\n    .pk-bubble.pk-explain { top: 60px; left: 20px; right: 20px; padding: 6px 0; }\n    .pk-x { display: flex; align-items: center; gap: 14px; padding: 12px 18px; font-size: 14px; color: var(--text-primary); }\n    .pk-x + .pk-x { border-top: 1px solid var(--border-card); }\n    .pk-x > span { flex: none; width: 74px; display: flex; gap: 4px; justify-content: center; }\n    .pk-x .cal-d { width: 30px; height: 30px; font-size: 13px; border-radius: 8px; pointer-events: none; }\n    .pk-x b { font-weight: 700; }\n    .pk-x small { display: block; font-size: 12px; color: var(--text-muted); margin-top: 1px; }\n    /* End of a list: a divider with \"End\" after the last row, always, so every list ends the same way; and a soft fade at the bottom edge while a scrolling list has more below. */\n    .end-mark { display: flex; justify-content: center; align-items: center; gap: 7px; padding: 13px 0 15px; pointer-events: none; }\n    /* 3.12.2: the end of every list: a line that fades in from each side to the three dots, in place of the last row's own line */\n    .end-mark::before, .end-mark::after { content: \"\"; flex: 1; height: 1px; opacity: .45; }\n    .end-mark::before { background: linear-gradient(to right, transparent, var(--text-muted)); margin-right: 8px; }\n    .end-mark::after { background: linear-gradient(to left, transparent, var(--text-muted)); margin-left: 8px; }\n    .vr:has(+ .end-mark) { border-bottom-color: transparent !important; }\n    .vr + .end-mark, .vb-rows + .end-mark { padding-top: 0; margin-top: -3px; }\n    .vb-rows:has(+ .end-mark) > .vr:last-child { border-bottom-color: transparent !important; }   /* after a row: the end line sits where the row's own line was, the same spacing as every other row */\n    .end-mark i { display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted); opacity: 1; }   /* 3.12.2: darker: the end is in view */\n    /* 3.12.2: every list: while there is more below, a short fade (20 px) with three light dots in it; at the end the list's own dots, darker */\n    .scrolls::after { --dot: color-mix(in srgb, var(--text-muted) 40%, transparent); content: \"\"; display: block; position: sticky; bottom: calc(-1 * var(--pb, 0px)); height: 20px; margin-top: -20px; pointer-events: none;\n      background: radial-gradient(circle, var(--dot) 1.6px, transparent 2.1px) calc(50% - 11px) calc(100% - 7px) / 4px 4px no-repeat,\n                  radial-gradient(circle, var(--dot) 1.6px, transparent 2.1px) 50% calc(100% - 7px) / 4px 4px no-repeat,\n                  radial-gradient(circle, var(--dot) 1.6px, transparent 2.1px) calc(50% + 11px) calc(100% - 7px) / 4px 4px no-repeat,\n                  linear-gradient(to bottom, transparent, var(--fade, var(--bg-card)));\n      opacity: 0; transition: opacity .15s; }\n    .scrolls.more::after { opacity: 1; }\n    .fail-inner { --fade: var(--bg-body); }\n    .pk-bubble.pk-day { left: 14px; right: 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; border-radius: 20px; }\n    .pk-day .pk-h { padding: 18px 20px 12px; align-items: center; gap: 12px; }\n    .pk-day .pk-h .pk-m { display: grid; grid-template-columns: auto auto; column-gap: 5px; align-items: baseline; line-height: 1.3; }   /* reviews and volume: two small rows on the right, level with the date; the numbers line up in one column, the labels in the next */\n    .pk-m b { text-align: right; font-weight: 800; color: var(--text-primary); }\n    .pk-m i { font-style: normal; text-align: left; font-weight: 600; }\n    .pk-day .pk-v { color: var(--text-accent); font-weight: 800; }\n    .pk-day .pk-v.neg { color: var(--btn-fail-text); }\n    .pk-day .pk-v.tot { color: var(--text-primary); }\n    .vl-row.zero .vl-count { color: var(--text-meta); font-weight: 500; }\n    .vl-row .chev { color: var(--text-meta); font-size: 18px; line-height: 1; transition: transform 0.15s ease; }\n    .vl-row.open .chev { transform: rotate(90deg); }\n    .vl-verses { border-bottom: 1px solid var(--border-card); padding: 0; }\n    .vl-verse { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 8px 14px;\n      font-size: 15px; color: var(--text-primary); cursor: pointer; -webkit-tap-highlight-color: transparent; }\n    .vl-verse .vl-ref { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }\n    .vl-verse, .verse-body { -webkit-touch-callout: none; }\n    #verseListView, #upcomingView, .vl-verse, .vl-row, .tabbar, .tab, #cardBody { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }\n    #verseListView input { -webkit-user-select: text; user-select: text; }\n    .vl-verse.lp-down, .picker-item.lp-down { background: var(--btn-restart-bg); }\n    .ref-wrap { position: relative; display: inline-block; }   /* the version tag hangs off the right, so the reference itself stays centred (review card and popup) */\n    .ref-wrap .version-badge { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 6px; white-space: nowrap; }\n    .vl-verse + .vl-verse { border-top: 1px solid var(--border-card); }\n\n    .rank-1 { --rl: #a8643a; --rd: #d9945f; }\n    .rank-2 { --rl: #7b8794; --rd: #b8c2cc; }\n    .rank-3 { --rl: #b88a00; --rd: #f2c94c; }\n    .rank-4 { --rl: #5b6b8c; --rd: #aebbd9; }\n    .rank-5 { --rl: #2754c5; --rd: #7da2ff; }\n    .rank-6 { --rl: #138a55; --rd: #4fd18e; }\n    .rank-7 { --rl: #c62847; --rd: #ff7088; }\n    .rank-8 { --rl: #0e92b8; --rd: #6fe0ff; }\n    @media (prefers-color-scheme: dark) {\n      .rank-badge { --rc: var(--rd); }\n      .rank-badge.is-new { --rc: var(--text-meta); }\n    }\n\n    /* Top ranks get a soft glint that sweeps across the pill now and then:\n       Diamond every 3 s, Ruby every 5 s, Emerald (fainter) every 8 s. */\n    .rank-badge.rank-6, .rank-badge.rank-7, .rank-badge.rank-8 { position: relative; overflow: hidden; }\n    .rank-badge.rank-6::after, .rank-badge.rank-7::after, .rank-badge.rank-8::after {\n      content: \"\"; position: absolute; top: 0; bottom: 0; left: 0; width: 38%; pointer-events: none;\n      transform: translateX(-110%);\n      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, var(--sh)), transparent);\n      animation: rankShimmer var(--per) ease-in-out infinite;\n    }\n    .rank-badge.rank-8 { --per: 3s; --sh: 0.8; }\n    .rank-badge.rank-7 { --per: 5s; --sh: 0.65; }\n    .rank-badge.rank-6 { --per: 8s; --sh: 0.45; }\n    @media (prefers-color-scheme: dark) {\n      .rank-badge.rank-8 { --sh: 0.44; }\n      .rank-badge.rank-7 { --sh: 0.36; }\n      .rank-badge.rank-6 { --sh: 0.25; }\n    }\n    @keyframes rankShimmer {\n      0%   { transform: translateX(-110%); }\n      30%  { transform: translateX(290%); }\n      100% { transform: translateX(290%); }\n    }\n\n    .meta-tag.is-repeat-badge {\n      color: var(--text-repeat);\n      font-weight: 700;\n      background: var(--badge-repeat-bg);\n      padding: 2px 8px;\n      border-radius: 6px;\n    }\n\n    .meta-tag.is-fasttrack-badge {\n      color: var(--text-fasttrack);\n      font-weight: 800;\n      background: var(--badge-fasttrack-bg);\n      padding: 2px 8px;\n      border-radius: 6px;\n      letter-spacing: 0.6px;\n    }\n\n    .pips-container {\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: 6px;\n      margin-bottom: 8px;\n      min-height: 14px;\n    }\n\n    .pip {\n      width: 7px;\n      height: 7px;\n      border-radius: 50%;\n      background: var(--border-body);\n      border: 1px solid var(--border-card);\n      transition: background-color 0.2s ease, transform 0.2s ease;\n    }\n\n    /* a rep filling in: the ring fills solid all at once with a little pop. When every dot is full they turn green one after another in a wave, and the pill flashes green. */\n    .pip { position: relative; color: var(--text-accent); }\n    .card.ranked .pip { color: var(--rc); }\n    .pip.pop { animation: pipPop 0.42s ease-out both; }\n    .pip.grow { animation: pipGrow 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; animation-delay: calc(var(--k, 0) * 0.14s); }\n    @keyframes pipGrow { from { transform: scale(0); opacity: 0; } }\n    @keyframes pipPop {\n      0% { transform: scale(1.25); background: transparent; border-color: currentColor; }\n      38% { transform: scale(1.65); background: currentColor; border-color: currentColor; }\n      72% { transform: scale(1.05); background: currentColor; border-color: currentColor; }\n      100% { transform: scale(1.15); background: currentColor; border-color: currentColor; }\n    }\n    .pips-container { position: relative; }\n    /* a New card on its recites: a small padlock just left of the two dots, outside the row so the dots stay centred under the pill */\n    .pips-container .pip-lk { position: absolute; left: 50%; top: 50%; width: 11px; height: 11px; transform: translate(calc(-50% - 22px), -50%); color: var(--text-accent); display: flex; pointer-events: none; }\n    .pips-container .pip-lk svg { width: 11px; height: 11px; }\n    .pips-container.fin .pip { animation: pipGreen 0.8s ease-out both; animation-delay: calc(var(--k, 0) * 0.08s); }\n    @keyframes pipGreen {\n      35% { transform: scale(1.55); background: #34c759; border-color: #34c759; box-shadow: 0 0 10px #34c759; }\n      70% { transform: scale(1.15); background: #34c759; border-color: #34c759; }\n    }\n    .rank-badge.fin-pill { animation: pipPill 0.7s ease-out 0.35s both; }\n    @keyframes pipPill { 35% { transform: scale(1.22); color: #34c759; box-shadow: 0 0 0 1px #34c759, 0 0 10px rgba(52, 199, 89, 0.45); } }\n\n    /* the rep you are on: a ring; it fills when the rep is done */\n    .pip.cur { background: transparent; border-color: var(--text-accent); transform: scale(1.25); box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.22); }\n    .pip.filled {\n      background: var(--text-accent);\n      border-color: var(--text-accent);\n      transform: scale(1.15);\n      box-shadow: 0 0 5px rgba(26, 115, 232, 0.4);\n    }\n\n\n    /* learning dots: the 6 timed steps of the part (Two letters to Blurred) */\n    /* the same dots as a Review card: solid grey until that step is done, then green; the step you are on is a blue glowing ring (the Review card's ring, in blue); all green on the recites */\n    .pips-container.l3 .pip { width: 7px; height: 7px; box-sizing: content-box; background: var(--border-body); border: 1px solid var(--border-card); box-shadow: none; transform: none; }\n    .pips-container.l3 .pip.cur { background: transparent; border-color: var(--text-accent); transform: scale(1.25); box-shadow: 0 0 0 2px color-mix(in srgb, var(--text-accent) 28%, transparent); }\n    .pips-container.l3 .pip.done, .pips-container.l3 .pip.filled { background: #34a853; border-color: #34a853; box-shadow: none; }\n    .pips-container.l3 .pip { color: #34a853; }\n    /* Learn / Study: the book or bulb under the pill instead of the dots (as on the In progress line); the row keeps the dots' height */\n    .pips-container.l3 svg.ph { width: 16px; height: 16px; margin: -3.5px 0; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }\n    .pips-container.l3.rt svg.ph { color: var(--text-primary); }\n    .pips-container.l3.mem svg.ph { color: var(--text-accent); }   /* the pop when a stage is passed paints in this colour: green on Learn cards (it was blue, and the dot stayed blue) */\n    /* the New pill: white on Learn, blue from Study, the app's green once the Recite is passed (then the Bronze level-up) */\n    .rank-badge.is-new.l3-rt { --rc: var(--text-primary); font-weight: 800; }\n    .rank-badge.is-new.l3-blue { --rc: var(--text-accent); font-weight: 800; }\n    .rank-badge.is-new.l3-green { --rc: #34a853; font-weight: 800; }\n    /* the right of a learning card's bar: the step in blue (Learn, Study, Two letters ... Blurred, Recite, Promote); amber while practising ahead */\n    .pt-word { font-size: 11px; font-weight: 700; color: var(--text-accent); text-transform: uppercase; letter-spacing: 0.5px; line-height: 15px; white-space: nowrap; }\n    .pt-word.ahead { color: #f59e0b; }   /* practising one level ahead, harder (a tap on the word): amber (3.6.5; was green); the step itself is unchanged */\n    .pt-word.back { color: #34a853; }    /* 3.2.1: one level back, easier (a hold on the word): green (3.6.5; was amber) */\n    .passage-status.rec { color: #f59e0b; }   /* 3.6.5: the run over the earlier parts (6 AM warm-up, 8 PM from the top): the label in amber */\n\n    /* Fast-Track Glowing Pip */\n    .fast-track-pip {\n      font-size: 15px;\n      line-height: 1;\n      color: var(--text-fasttrack);\n      filter: drop-shadow(0 0 6px rgba(217, 119, 6, 0.7));\n      animation: pulse-glow 1.8s infinite ease-in-out;\n      user-select: none;\n    }\n\n    @keyframes pulse-glow {\n      0%, 100% { transform: scale(1); opacity: 0.9; }\n      50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 9px rgba(217, 119, 6, 1)); }\n    }\n\n    .verse-body {\n      -webkit-user-select: none;\n      user-select: none;\n      flex: 1;\n      background: var(--bg-body);\n      border: 1px solid var(--border-body);\n      border-radius: 14px;\n      display: flex;\n      flex-direction: column;\n      justify-content: flex-start;\n      align-items: stretch;\n      padding: 12px 14px;\n      margin-bottom: 0;\n      overflow-y: auto;\n      overflow-x: hidden;\n      min-height: 0;\n      scroll-behavior: smooth;\n      box-sizing: border-box;\n      cursor: pointer;\n      touch-action: pan-y;   /* vertical scrolling only, so sideways swipes reach the page */\n    }\n\n    .passage-toolbar {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      flex-shrink: 0;\n      /* 3.5.1: the bar stays put while the verse scrolls under it. It reaches up over the box's 12 px top padding (and its 14 px sides), so nothing scrolled above it shows round it;\n         its line is drawn as before, the width of the text. */\n      position: sticky; top: -12px; z-index: 4;\n      margin: -12px -14px 10px; padding: 12px 14px 9px;\n      background: linear-gradient(var(--border-body), var(--border-body)) 14px 100% / calc(100% - 28px) 1px no-repeat, var(--bg-body);\n    }\n\n    .passage-status {\n      font-size: 11px;\n      font-weight: 700;\n      color: var(--text-muted);\n      text-transform: uppercase;\n      letter-spacing: 0.5px;\n      line-height: 15px;\n    }\n    .v-text.hinted .hz { transition: color .34s cubic-bezier(.4, 0, .2, 1); }\n    body.peek .v-text.hinted .hz, body.peek .v-text.hinted .hu { color: var(--text-primary); }   /* holding the verse: the full words of every verse showing (the one you are learning and any you revealed) fade in, in place */\n    body.peek .v-text.hinted .hu::after { opacity: 0; }   /* the dots fade out as the words fade in */\n    /* 3.7.2: at Hidden the hold lays a clear copy of the part over the blur (peekPart); the blurred part itself is no longer switched (that flashed hard boxes on iPhone) */   /* ...and with hints off the blurred verse you are learning shows for as long as you hold */\n    .passage-status { transition: opacity .16s ease; }\n    .passage-status.done { color: #1b7a3a; }   /* \"Verse 1 done\" while the dots celebrate */\n    @media (prefers-color-scheme: dark) { .passage-status.done { color: #7fdca0; } }\n\n    /* 1. Mobile Default Typography (Touchscreens) */\n    .passage-stream, .pv-text {\n      font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;   /* the verse popup and the cards share one face */\n      font-size: 17.5px;\n      line-height: 1.7;\n      letter-spacing: 0.1px;\n      color: var(--text-primary);\n      text-align: justify;\n      text-justify: inter-word;\n      word-break: normal;\n    }\n\n    /* 2. Desktop Override Typography (Mouse / Precision Trackpads) */\n    @media (hover: hover) and (pointer: fine) {\n      .passage-stream, .pv-text {\n        font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n        font-size: 16.5px;\n        line-height: 1.7;\n        letter-spacing: 0px;\n      }\n    }\n\n    .verse-unit {\n      cursor: pointer;\n      display: inline;\n    }\n    /* A Learn card: the part you are learning runs on as one paragraph (justified, phrase letters kept) and is a little bigger than the rest, at every stage. */\n    .passage-stream .verse-unit.u-cur { font-size: 19px; }   /* 3.5.2: 19 px (was 20) */\n    @media (hover: hover) and (pointer: fine) { .passage-stream .verse-unit.u-cur { font-size: 18px; } }\n    /* 3.5.1: the part you are learning is left-aligned, one line per phrase, with no gap between phrases. A label column on the left holds the verse number (only where a verse or\n       the part starts; the numbers line up on their right edge) and the phrase letter (a, b, c, in their own column, the same size as the number). Every line of a phrase starts at the\n       same spot: the words have no side padding here (it only pushed the first line in a few px further than the rest). */\n    .passage-stream .verse-unit.u-cur { display: block; position: relative; padding-left: 34px; text-align: left; }\n    .verse-unit.u-cur .v-text { padding-left: 0; padding-right: 0; }\n    /* 3.5.2: the column starts where the other parts' labels start (3 px in), the numbers right-aligned in a 14 px slot (so 9 ends where 10 ends and every number is the same\n       distance from its letter), then the letter in its own 10 px slot; a phrase with no number keeps the letter in that slot. */\n    .verse-unit.u-cur .u-lab { position: absolute; left: 3px; top: 0; display: flex; gap: 3px; white-space: nowrap; line-height: inherit; }\n    .verse-unit.u-cur .u-lab .v-num { min-width: 14px; margin: 0; text-align: right; }\n    .verse-unit.u-cur .u-lab .p-let { display: inline-block; width: 10px; margin: 0; text-align: left; }\n    .verse-unit.u-cur .u-lab .p-let:first-child { margin-left: 17px; }\n    /* 3.6.4: the other parts' first label (where a part starts) uses the same column as the part you are learning: the number right-aligned in the 14 px slot 3 px in,\n       the letter in its 10 px slot, so 8 c / 9 b / 10 a line up from part to part (a single-digit number used to start at the left and sit 7 px off). */\n    .step-n + .verse-unit:not(.u-cur) > .v-num { display: inline-block; min-width: 14px; text-align: right; margin: 0 0 0 3px; }\n    .step-n + .verse-unit:not(.u-cur) > .p-let { display: inline-block; width: 10px; margin: 0 0 0 3px; text-align: left; }\n    .step-n + .verse-unit:not(.u-cur) > .p-let:first-child { margin-left: 20px; }\n    /* A reference learned in parts: one block per part. Parts already learned are green, the one you are on is blue, parts not reached yet are grey.\n       The number is a solid bubble with the digit cut out of it (so it never looks like the hint ring in the bar), and the bubble's top is the top of the line. */\n    .step-blk { --rail: rgba(150, 150, 150, 0.4); --dot: #8f959b; position: relative; margin: 0 0 8px 6px; padding: 0 0 0 13px; border-left: 3px solid var(--rail); border-radius: 2px; }   /* 22px in all: the bubble hangs out over the card's own padding */\n    .step-blk.done { --rail: var(--badge-pass); --dot: var(--badge-pass); }\n    .step-blk.on { --rail: var(--text-accent); --dot: var(--text-accent); }\n    .step-blk.rec { --rail: #f59e0b; --dot: #f59e0b; }   /* 3.6.5: a part being gone over in the run (amber until it is done, then green) */\n    .step-n { position: absolute; left: -11px; top: 0; width: 19px; height: 19px; box-sizing: border-box; border-radius: 50%; text-align: center;\n      font: 800 10.5px/19px -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; letter-spacing: 0;\n      background: var(--dot); color: var(--bg-card); }\n\n    .v-num {\n      font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n      font-size: 11px;\n      font-weight: 800;\n      color: var(--text-accent);\n      vertical-align: super;\n      margin-right: 3px;\n      margin-left: 3px;\n      user-select: none;\n      display: inline-block;\n    }\n\n    /* phrase letter (a, b, c...) in front of a revealed phrase of a split verse */\n    .p-let {\n      font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n      font-size: 11px;      /* 3.5.2: the same size and weight as the verse number, on every part (was 10 px / 700) */\n      font-weight: 800;\n      letter-spacing: 0;\n      color: var(--text-meta);\n      vertical-align: super;\n      margin: 0 1px 0 0;\n      user-select: none;\n    }\n\n    /* a long press (the hint hold) must not start iOS's text highlight over the blurred words */\n    .passage-stream, .passage-stream .verse-unit, .passage-stream .v-text { -webkit-user-select: none; -webkit-touch-callout: none; }\n    .passage-stream ::selection, .passage-stream::selection { background: transparent; color: inherit; }\n    .v-text {\n      border-radius: 4px;\n      padding: 2px 4px;\n      transition: opacity 0.28s ease, background-color 0.28s ease;   /* not the blur itself: while a blur animates, iPhone Safari clips the other blurred verses to hard boxes (a brief outline on every tap) */\n    }\n\n    .v-text.cue .cue-rest { filter: blur(var(--spoiler-blur)); opacity: 0.2; background-color: var(--spoiler-bg); border-radius: 4px; user-select: none; }\n    .v-text.cue .cue-rest.on, .v-text.cue .cue-rest.in { filter: none; opacity: 1; background-color: transparent; }\n    .v-text.cue .cue-rest.in { animation: cueIn .5s ease-out both; }\n    @keyframes cueIn { from { color: transparent; text-shadow: 0 0 8px rgba(128, 128, 128, .3); } to { text-shadow: 0 0 0 transparent; } }\n    .v-text.blurred {\n      filter: blur(var(--spoiler-blur));\n      opacity: 0.2;\n      background-color: var(--spoiler-bg);\n      user-select: none;\n    }\n\n    .v-text.revealed {\n      filter: none;\n      opacity: 1;\n      background-color: transparent;\n    }\n\n    /* Hint mode (New tab): a revealed phrase shows only its first letters in blue, in the exact spot the full text has.\n       The rest of each word keeps its width but is invisible, so the verse does not change size or shift when it is revealed. */\n    .v-text.hinted {\n      filter: none;\n      opacity: 1;\n      background-color: transparent;\n      color: var(--text-accent);\n      user-select: none;\n    }\n    .day-ring { display: inline-flex; align-items: center; gap: 5px; height: 26px; margin: -6px 0; flex: none; color: var(--text-muted); }   /* the margin keeps this from making the bar taller than the text */\n    .day-ring svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; }\n    .day-ring .dr-front { fill: var(--bg-card); }\n    .day-ring b { font: 500 13px/1 -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; color: var(--text-primary); font-variant-numeric: tabular-nums; }\n    /* Review / Lock hold: a clear copy of the first three words comes into focus over the blurred verse (which is left exactly as it was), over 0.25 s, and goes back the same way (3.5.1). */\n    .pk3-on { position: absolute; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .25s ease-out; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }\n    .pk3-on.in { opacity: 1; }\n    .pk3-on.out { opacity: 0; }\n    .pk3-bg { position: absolute; border-radius: 4px; }\n    .pk3-copy { position: absolute; left: 0; top: 0; margin: 0; background: transparent; box-sizing: border-box; }\n    .pk3-copy .v-text { transition: none; }\n    .pk3-hid { visibility: hidden; }\n    #cardBody, #cardBody * { -webkit-tap-highlight-color: transparent; outline: none; }   /* no grey box flashing round a verse (each verse is its own tap target) when you tap to reveal */\n    .v-text.hinted.fade-out { filter: blur(var(--spoiler-blur)); opacity: 0.2; background-color: var(--spoiler-bg); }   /* level 5 to 6: the hint letters blur away first, then the plain words are swapped in under the blur */\n    .v-text.hinted .hz { color: transparent; }\n    .ref-wrap { transition: opacity .3s ease; }\n    .ref-wrap.rb { filter: blur(10px); opacity: .35; }   /* 3.6.2: the reference (and its version pill) blurred while you recite; only the opacity fades (an animated blur clips on iPhone) */\n    .v-text.hinted.filled .hz, .v-text.hinted.filled .hu { color: var(--text-primary); }   /* 3.6.1: a phrase filled in by a tap: the rest of each word shows black (the cues and punctuation stay blue) */\n    .v-text.hinted.filled .hu::after { opacity: 0; }\n    .v-text.hinted .hz, .v-text.hinted .hu { text-shadow: none; }   /* 3.5.1: the focus-in glow is only on the letters that show, never on the hidden ones */\n    .v-text.hinted .hu { color: transparent; position: relative; transition: color .34s cubic-bezier(.4, 0, .2, 1); }\n    .v-text.hinted .hu::after { content: \"\"; position: absolute; left: 50%; top: 55%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--text-accent); transition: opacity .34s cubic-bezier(.4, 0, .2, 1); pointer-events: none; }   /* a hidden word: a dot where its first letter would be (drawn over the letter, so nothing changes size or moves) */\n    .v-text.hinted .hl { -webkit-text-stroke: 0.35px currentColor; } /* a touch heavier without changing the letter's width */\n\n\n    .action-container { \n      display: flex; \n      flex-direction: column; \n      flex-shrink: 0;\n    }\n\n    .btn-row { \n      display: flex; \n      gap: 10px; \n      width: 100%;\n    }\n\n    button {\n      border: none;\n      border-radius: 14px;\n      cursor: pointer;\n      font-weight: 600;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      touch-action: manipulation;\n      transition: transform 0.08s ease, filter 0.08s ease;\n    }\n    button:active { transform: scale(0.97); filter: brightness(0.92); }\n\n    .btn-fail {   /* 3.3.1: one rule on every card: the left button is a blue Repeat, the right one a green Review or the step's milestone word */\n      flex: 1; \n      min-height: 54px; \n      background: var(--btn-restart-bg); \n      color: var(--btn-restart-text); \n      font-size: 16px; \n    }\n    .btn-fail.review { background: var(--btn-restart-bg); color: var(--btn-restart-text); }\n    .btn-fail.seen, .btn-fail.locked { opacity: 0.6; }\n    #btnFail.seen.only { pointer-events: none; }\n\n    .btn-pass { \n      flex: 1; \n      min-height: 54px; \n      background: var(--btn-pass-bg); \n      color: var(--btn-pass-text); \n      font-size: 16px; \n    }\n    .btn-pass { position: relative; overflow: hidden; -webkit-touch-callout: none; }\n    .btn-pass > span { position: relative; z-index: 1; }\n    .btn-pass .hold-fill { position: absolute; inset: 0; background: currentColor; opacity: .16; transform-origin: left center; transform: scaleX(0); pointer-events: none; z-index: 0; }   /* 3.6.3: the 1-second hold on Learn / Study */\n    .btn-pass { -webkit-user-select: none; user-select: none; }\n\n    .btn-pass.locked { opacity: 0.5; }                      /* New card waiting for its next unlock time: still tappable (shows the time); a Review card before anything is revealed: inert */\n    .pt-right { display: inline-flex; align-items: center; gap: 10px; }\n    .pt-left { display: inline-flex; align-items: center; gap: 0; min-width: 0; }\n    .pt-wc { display: inline-flex; align-items: center; margin-left: 12px; padding-left: 12px; border-left: 1.5px solid var(--border-card); font: 700 11.5px/15px -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; color: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing: .3px; }\n    .pt-wc .pp-ic.ln { width: 12px; height: 12px; margin: 0 4px 0 0; }   /* 3.14.3: a thin divider, then the lines icon and the part's word count, in the label's grey */\n    .pt-note { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; }   /* Review bar: Card N of M */\n    .pt-note b { font-weight: 800; }\n    .v-num.dim { opacity: 0.45; }                           /* verses other than the one you are learning today */\n    /* 3.5.2: in dark mode the faded light blue looked grey, so it fades less there (65%); light mode stays at 45% */\n    @media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .v-num.dim { opacity: 0.65; } }\n    :root[data-theme=\"dark\"] .v-num.dim { opacity: 0.65; }\n    .vp-note { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-align: center; }\n    .shortcut-hint { font-size: 11px; opacity: 0.65; font-weight: 500; margin-top: 2px; }\n    @media (max-width: 480px) {\n      .shortcut-hint { display: none; }\n      .btn-fail, .btn-pass { min-height: 56px; }\n    }\n\n    .summary-card {\n      background: var(--bg-card);\n      border: 1px solid var(--border-card);\n      border-radius: 20px;\n      padding: 24px 20px;\n      width: 100%;\n      flex: 1;\n      display: flex;\n      flex-direction: column;\n      justify-content: center;\n      box-shadow: 0 4px 14px var(--card-shadow);\n      text-align: center;\n      box-sizing: border-box;\n      min-height: 0;\n    }\n\n    /* Compact header: a small icon beside the title instead of a big trophy. */\n    .sum-title-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }\n    .sum-ico { font-size: 22px; line-height: 1; }\n    .sum-ico.ok { width: 28px; height: 28px; border-radius: 50%; background: var(--badge-pass); color: #fff; font-size: 17px; font-weight: 900; line-height: 28px; text-align: center; flex: none; }\n    @media (prefers-color-scheme: dark) { .sum-ico.ok { color: #0b2a17; } }\n    .summary-header h2 { font-size: 22px; margin: 0; color: var(--text-primary); font-weight: 700; }\n    .summary-header p { margin: 0; color: var(--text-muted); font-size: 14px; }\n\n    .stats-grid {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 8px;\n      margin: 16px 0;\n    }\n\n    .stat-box {\n      background: var(--bg-body);\n      border: 1px solid var(--border-body);\n      border-radius: 12px;\n      padding: 12px 8px;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n    }\n\n    .stat-val { font-size: 24px; font-weight: 800; margin-bottom: 2px; color: var(--text-primary); }\n    .stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; }\n    /* 3.3.1: the boxes take their button's colour: Repeats blue (the Repeat button), Reviewed green (the Review button), Treasury gold (red on a down day).\n       A shade deeper than the buttons' lettering, which sits on a coloured fill; these sit on the grey box. */\n    :root { --num-rep: #1a73e8; --num-rev: #188038; --num-gold: #a87400; --plan-on: #d97757; }   /* --plan-on: Claude's coral, the \\u2726 while a verse is being planned */\n    @media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) { --num-rep: #669df6; --num-rev: #5bb974; --num-gold: #f2c94c; --plan-on: #e58b6f; } }\n    :root[data-theme=\"dark\"] { --num-rep: #669df6; --num-rev: #5bb974; --num-gold: #f2c94c; --plan-on: #e58b6f; }\n    .val-rev { color: var(--num-rev); }\n    .val-grad { color: var(--num-gold); }\n    .val-fail { color: var(--num-rep); }\n    .val-grad.neg { color: var(--btn-fail-text); }\n    .stat-box.tappable { cursor: pointer; }\n    /* every repeat verse cleared at least once */\n    .stat-box { position: relative; }\n    .stat-box.cleared::after { content: \"\\2713\"; position: absolute; top: 7px; right: 7px; width: 16px; height: 16px; border-radius: 50%;\n      background: var(--badge-pass); color: #fff; font-size: 11px; font-weight: 900; line-height: 16px; text-align: center; }\n    @media (prefers-color-scheme: dark) { .stat-box.cleared::after { color: #0b2a17; } }\n    .stat-box.open, .stat-box.held { border-color: var(--text-accent); box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.18); }\n    /* Leveled Up with 5 or more: soft gold fill and a bold gold number (the blue \"open\" border still wins when tapped). */\n    :root { --gold-bg-a: rgba(255, 208, 70, 0.22); --gold-bg-b: rgba(214, 158, 20, 0.13); --gold-num: #a87400; }\n    @media (prefers-color-scheme: dark) { :root { --gold-bg-a: rgba(242, 201, 76, 0.18); --gold-bg-b: rgba(200, 150, 20, 0.10); --gold-num: #ffd54a; } }\n    .stat-box.gold { background: linear-gradient(180deg, var(--gold-bg-a), var(--gold-bg-b)); }\n    .stat-box.gold .stat-val { color: var(--gold-num); font-weight: 900; }\n\n    /* 3.8 Review Complete, vertical: the title at the top, three full-width rows (Reviewed, Repeats, Treasury), and the list in a box that fills\n       the space down to the Schedule pill. A row is outlined only when you have tapped it; the box shows Reviewed until then. */\n    /* the title, rows and list sit as one block with even space above it and below it (down to the Schedule pill, which takes the bottom 48 px) */\n    .summary-card.rcx, .summary-card.top.rcx { padding-top: 12px; padding-bottom: 88px; }   /* the Schedule row takes the bottom 76 px */\n    .summary-card.rcx .summary-header { margin-top: auto; }\n    .summary-card.rcx .sum-title-row { margin-bottom: 16px; }   /* 3.14: the box sits low (where Schedule's day box sat), the rows right above it, the title 16 above them */\n    .summary-card.rcx #summarySubtitle { display: none; }\n    .summary-card.rcx .stats-grid { display: flex !important; flex-direction: column; gap: 10px; margin: 16px 0 0; }\n    .summary-card.rcx .stat-box { flex-direction: row; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; text-align: left; }\n    .summary-card.rcx .stat-lbl { flex: 1; font-size: 15px; letter-spacing: 0.6px; font-weight: 700; line-height: 1; display: flex; align-items: center; padding-top: 1px; }\n    .summary-card.rcx .stat-val { font-size: 26px; line-height: 1; margin: 0; transition: opacity .3s; display: flex; align-items: center; }\n    .summary-card.rcx .stat-val.zero { opacity: 0.35; }\n    .stat-ico { display: none; }\n    .summary-card.rcx .stat-ico { display: inline-flex; width: 28px; height: 28px; border-radius: 8px; align-items: center; justify-content: center; color: #fff; flex: none; }   /* rounded squares, as on iPhone's Settings */\n    .stat-ico svg, .tomorrow-note .sc-ico svg { width: 17px; height: 17px; }\n    .stat-ico.ico-rev { background: var(--num-rev); } .stat-ico.ico-rep { background: var(--num-rep); } .stat-ico.ico-gold { background: var(--num-gold); }\n    @media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .summary-card.rcx .stat-ico, :root:not([data-theme=\"light\"]) .tomorrow-note .sc-ico { color: #15161a; } }\n    :root[data-theme=\"dark\"] .summary-card.rcx .stat-ico, :root[data-theme=\"dark\"] .tomorrow-note .sc-ico { color: #15161a; }\n    .summary-card.rcx .stat-box.cleared::after { position: static; order: 2; margin-right: 2px : 10.5px; font-weight: 600; color: var(--text-muted); position: relative; border-radius: 0;\n      -webkit-tap-highlight-color: transparent; transition: color 0.2s; }\n    .tab:active { transform: none; filter: none; }\n    body.lp-active, body.lp-active * { -webkit-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; }\n    .pv-card:not(.paste-card), .pv-card:not(.paste-card) * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }\n    /* The icon sits centred between the sliding bar on top and the word underneath. Review and New have two icons: the outline one when nothing is waiting, a solid one when cards are. */\n    .tab .icw { flex: 1; display: flex; align-items: center; justify-content: center; }\n    .tab svg { width: 29px; height: 29px; stroke: currentColor; fill: none; stroke-width: 1.8;\n      stroke-linecap: round; stroke-linejoin: round; }\n    .tab svg .solid { fill: currentColor; }\n    .tab svg .knock { stroke: var(--bg-card); fill: none; }\n    .tab:not(.has):not(.upd):not(.late) .ic-p, .tab.has .ic-e, .tab.upd .ic-e, .tab.late .ic-e { display: none; }\n    /* Blue means cards are waiting; being on a tab never changes its color (the sliding bar and the bold word show where you are). */\n    .tab.on { font-weight: 800; }\n    .tab.has { color: var(--text-accent); }\n    .tab.upd { color: var(--text-repeat); }   /* amber and solid: an update is waiting (hold this tab for the status panel with Install) */\n    .tab.late { color: var(--text-repeat); }   /* the New tab, amber and solid: a learning step is late (the In progress chip says which) */\n    .tab-slider { position: absolute; top: -1px; left: 0; width: calc(100% / 3); height: 4px; display: flex; justify-content: center; pointer-events: none; z-index: 3;\n      transition: transform 0.32s cubic-bezier(0.3, 1.1, 0.5, 1); }\n    .tab-slider::after { content: \"\"; width: 44px; height: 4px; border-radius: 0 0 4px 4px; backgroun
