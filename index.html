<!DOCTYPE html>
<html lang="en" style="color-scheme: light dark;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Verse Review</title>

  <!-- Preconnect & Prefetch Hints -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=15">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=15">
  <link rel="icon" type="image/png" sizes="192x192" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=15">
  <link rel="manifest" href="manifest.json">

  <!-- Native Opaque Status Bar Setup -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Verse Review">
  <meta name="color-scheme" content="light dark">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-theme: #f8f9fa;
      --spinner-color: #1a73e8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-theme: #121212;
        --spinner-color: #8ab4f8;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-theme);
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      display: block;
      background-color: var(--bg-theme);
    }

    #splashScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-theme);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(128, 128, 128, 0.2);
      border-top-color: var(--spinner-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #earlyFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      z-index: 50;
      background-color: var(--bg-theme);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splashScreen">
    <div class="spinner"></div>
  </div>

  <iframe id="appFrame"></iframe>
  <iframe id="earlyFrame" title="Saved New verses"></iframe>

  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbyoSSJrEh4cf-YkLXIJgiQ3d4KZbzTG2Twho6JSRAlwXkaGbpZXAPfGqBegHhLc5U3YPQ/exec";

    // Optional access key: only used if you add a VR_KEY script property in Apps Script.
    // It is stored on this device only, never in this public file.
    function loadApp() {
      var key = "";
      try { key = localStorage.getItem("vr_key") || ""; } catch (e) {}
      var url = APP_URL + "?platform=mobile" + (key ? "&key=" + encodeURIComponent(key) : "");
      document.getElementById("appFrame").src = url;
    }
    loadApp();
  </script>

  <script>
    // ── Early view ──

    // When the app is ready it is told what you had open and revealed, picks up from there, and this view goes away.
    var EARLY_DOC = "<!DOCTYPE html>\n<html lang=\"en\" style=\"color-scheme: light dark;\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<style>\n\n    :root {\n      --bg-page: #f8f9fa;\n      --bg-card: #ffffff;\n      --bg-body: #f8f9fa;\n      --border-card: #dadce0;\n      --border-body: #e8eaed;\n      \n      --text-primary: #202124;\n      --text-muted: #5f6368;\n      --text-meta: #70757a;\n      --text-accent: #1a73e8;\n      --text-lapse: #d97706;\n      --text-fasttrack: #b45309;\n      --badge-lapse-bg: #fef3c7;\n      --badge-fasttrack-bg: #fef3c7;\n      --badge-version-bg: rgba(95, 99, 104, 0.12);\n      --btn-fail-bg: #fce8e6;\n      --btn-fail-text: #c5221f;\n      --btn-pass-bg: #e6f4ea;\n      --btn-pass-text: #137333;\n      --btn-restart-bg: #e8f0fe;\n      --btn-restart-text: #1a73e8;\n      --badge-pass: #137333;\n      --badge-fail: #c5221f;\n      --card-shadow: rgba(0, 0, 0, 0.06);\n\n      --spoiler-bg: rgba(120, 120, 120, 0.28);\n      --spoiler-blur: 8px;\n    }\n\n    @media (prefers-color-scheme: dark) {\n      :root {\n        --bg-page: #121212;\n        --bg-card: #1e1e1e;\n        --bg-body: #28292a;\n        --border-card: #38383a;\n        --border-body: #3c4043;\n        \n        --text-primary: #f1f3f4;\n        --text-muted: #9aa0a6;\n        --text-meta: #9aa0a6;\n        --text-accent: #8ab4f8;\n        --text-lapse: #fbbf24;\n        --text-fasttrack: #fcd34d;\n        --badge-lapse-bg: #451a03;\n        --badge-fasttrack-bg: #451a03;\n        --badge-version-bg: rgba(255, 255, 255, 0.12);\n        --btn-fail-bg: #4a1d1b;\n        --btn-fail-text: #f28b82;\n        --btn-pass-bg: #133a22;\n        --btn-pass-text: #81c995;\n        --btn-restart-bg: #1e3a5f;\n        --btn-restart-text: #8ab4f8;\n        --badge-pass: #81c995;\n        --badge-fail: #f28b82;\n        --card-shadow: rgba(0, 0, 0, 0.4);\n\n        --spoiler-bg: rgba(255, 255, 255, 0.22);\n        --spoiler-blur: 8px;\n      }\n    }\n\n    * {\n      box-sizing: border-box;\n      font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n      -webkit-tap-highlight-color: transparent;\n      user-select: none;\n    }\n\n    html, body {\n      position: fixed;\n      inset: 0;\n      width: 100%;\n      height: 100%;\n      margin: 0;\n      padding: 0;\n      overflow: hidden;\n      box-sizing: border-box;\n      background-color: var(--bg-page);\n    }\n\n    body {\n      color: var(--text-primary);\n      display: flex;\n      flex-direction: column;\n      padding-top: max(env(safe-area-inset-top, 0px), 8px);\n      padding-bottom: max(env(safe-area-inset-bottom, 0px), 12px);\n      padding-left: max(env(safe-area-inset-left, 0px), 12px);\n      padding-right: max(env(safe-area-inset-right, 0px), 12px);\n      transition: background-color 0.25s ease, color 0.25s ease;\n    }\n\n    .progress-track {\n      width: 100%;\n      height: 3px;\n      background: var(--border-card);\n      border-radius: 2px;\n      margin-bottom: 8px;\n      overflow: hidden;\n      flex-shrink: 0;\n    }\n\n    .progress-fill {\n      height: 100%;\n      width: 0%;\n      background: var(--text-accent);\n      border-radius: 2px;\n      transition: width 0.25s ease;\n    }\n\n    #deckContainer {\n      flex: 1;\n      width: 100%;\n      display: flex;\n      flex-direction: column;\n      position: relative;\n      min-height: 0;\n    }\n\n    .card {\n      position: relative;\n      background: var(--bg-card);\n      border: 1px solid var(--border-card);\n      border-radius: 20px;\n      padding: 16px 14px 12px 14px;\n      width: 100%;\n      flex: 1;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      box-shadow: 0 4px 14px var(--card-shadow);\n      touch-action: pan-y;\n      will-change: transform, opacity;\n      box-sizing: border-box;\n      min-height: 0;\n    }\n\n    .swipe-badge {\n      position: absolute;\n      top: 18px;\n      padding: 6px 14px;\n      font-size: 18px;\n      font-weight: 800;\n      border-radius: 8px;\n      text-transform: uppercase;\n      opacity: 0;\n      pointer-events: none;\n      z-index: 10;\n      transition: opacity 0.1s ease;\n    }\n\n    .badge-pass { left: 18px; color: var(--badge-pass); border: 3px solid var(--badge-pass); transform: rotate(-12deg); }\n    .badge-fail { right: 18px; color: var(--badge-fail); border: 3px solid var(--badge-fail); transform: rotate(12deg); }\n\n    .card-header-group {\n      flex-shrink: 0;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n    }\n\n    .ref-header-row {\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: 6px;\n      margin-bottom: 3px;\n      line-height: 1.2;\n    }\n\n    .ref-header {\n      font-size: 23px;\n      font-weight: 700;\n      color: var(--text-accent);\n      text-align: center;\n    }\n\n    .version-badge {\n      font-size: 10px;\n      font-weight: 800;\n      color: var(--text-muted);\n      background: var(--badge-version-bg);\n      border: 1px solid var(--border-body);\n      padding: 2px 5px;\n      border-radius: 5px;\n      letter-spacing: 0.6px;\n      text-transform: uppercase;\n      line-height: 1;\n      pointer-events: none;\n    }\n\n    .meta-tag {\n      text-align: center;\n      font-size: 12px;\n      color: var(--text-meta);\n      text-transform: uppercase;\n      letter-spacing: 0.8px;\n      margin-bottom: 6px;\n    }\n\n    /* Rank badge shown under the verse reference: Bronze > Silver > Gold > ... > Diamond */\n    .rank-badge {\n      --rc: var(--rl);\n      display: inline-block;\n      padding: 2px 0;\n      min-width: 86px; /* same width for every rank */\n      text-align: center;\n      text-transform: uppercase;\n      border-radius: 999px;\n      font-size: 11px;\n      font-weight: 800;\n      letter-spacing: 0.9px;\n      color: var(--rc);\n      border: 1px solid var(--rc);\n      background: transparent;\n    }\n    @supports (background: color-mix(in srgb, red 10%, transparent)) {\n      .rank-badge {\n        background: color-mix(in srgb, var(--rc) 14%, transparent);\n        border-color: color-mix(in srgb, var(--rc) 40%, transparent);\n      }\n    }\n    .rank-badge.is-new { --rc: var(--text-meta); font-weight: 700; }\n    .rank-badge.pop { animation: rankPop 0.6s ease-out both, rankGlow 1s ease-out 0.15s both; }\n    .rank-badge.pop-big { animation: rankPop 0.8s ease-out both, rankGlow 1.4s ease-out 0.15s both; }\n    @keyframes rankGlow {\n      0%   { box-shadow: 0 0 0 0 var(--rc); }\n      60%  { box-shadow: 0 0 14px 5px color-mix(in srgb, var(--rc) 45%, transparent); }\n      100% { box-shadow: 0 0 0 0 transparent; }\n    }\n    .notice.levelup { font-size: 15px; min-height: 34px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 12px; }\n    @keyframes rankPop {\n      0%   { transform: scale(0.6); opacity: 0; }\n      55%  { transform: scale(1.3); opacity: 1; }\n      100% { transform: scale(1); opacity: 1; }\n    }\n    .rank-arrow { color: var(--text-meta); margin: 0 2px; font-weight: 600; }\n    .notice .rank-badge { vertical-align: middle; }\n    .notice .rank-badge.pop, .notice .rank-badge.pop-big { margin: 0 6px; } /* room for the glow */\n    #toastNotice.levelup { padding: 8px 18px; }\n    /* Level-up toast: heading on top, old rank -> new rank below. Higher ranks add a ring and sparkles around the new pill. */\n    #toastNotice.levelup.lu-stack { flex-direction: column; flex-wrap: nowrap; gap: 8px; padding: 12px 22px; }\n    .lu-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; color: var(--badge-pass); }\n    .lu-row { display: flex; align-items: center; justify-content: center; gap: 12px; }\n    .lu-fx { position: relative; display: inline-block; --rc: var(--rl); }\n    @media (prefers-color-scheme: dark) { .lu-fx { --rc: var(--rd); } }\n    .lu-ring { position: absolute; inset: -1px; border-radius: 999px; border: 2px solid var(--rc); opacity: 0; pointer-events: none;\n      animation: luRing 0.8s ease-out forwards; animation-delay: var(--rd2, 0.22s); }\n    @keyframes luRing { 0% { transform: scale(0.95); opacity: 0.85; } 100% { transform: scale(1.22, 1.75); opacity: 0; } }\n    .lu-spark { position: absolute; left: 50%; top: 50%; font-size: 11px; line-height: 1; color: var(--rc); opacity: 0; pointer-events: none;\n      animation: luSpark 0.9s ease-out forwards; animation-delay: var(--sd, 0.2s); }\n    .lu-spark.dot { font-size: 6px; }\n    @keyframes luSpark {\n      0%   { transform: translate(calc(-50% + var(--ex)), calc(-50% + var(--ey))) scale(0.3); opacity: 0; }\n      15%  { opacity: 1; }\n      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; }\n    }\n    @media (prefers-reduced-motion: reduce) { .lu-ring, .lu-spark { display: none; } }\n\n    /* Verse List screen (reuses the full-screen sheet used by the verse picker) */\n    .vl-row:active, .vl-seg button:active, .picker-item:active, .picker-close:active, .vl-verse:active { transform: none; filter: none; }\n    .vl-row, .vl-seg button, .picker-close { transition: none; }\n    .vl-row .chev { transition: transform 0.15s ease; }\n    .vl-total { font-size: 13px; color: var(--text-muted); margin: 0; }\n    .vl-bar { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; gap: 10px; }\n    .vl-seg { display: inline-flex; border: 1px solid var(--border-card); border-radius: 10px; overflow: hidden; flex-shrink: 0; }\n    .vl-seg button { background: transparent; border: 0; box-shadow: none; min-height: 0; width: auto;\n      padding: 6px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted); border-radius: 0; flex-direction: row; }\n    .vl-seg button.active { background: var(--badge-pass-bg, rgba(26,115,232,0.12)); color: var(--text-accent, #1a73e8); }\n    .vl-row { display: flex; align-items: center; justify-content: space-between; width: 100%;\n      background: none; border: 0; box-shadow: none; min-height: 0; padding: 12px 4px;\n      border-bottom: 1px solid var(--border-card); flex-direction: row; border-radius: 0; text-align: left; }\n    .vl-row .vl-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }\n    .vl-row .vl-right { display: inline-flex; align-items: center; gap: 8px; }\n    .vl-row .vl-count { font-size: 15px; font-weight: 700; color: var(--text-primary); }\n    .vl-row.zero .vl-count { color: var(--text-meta); font-weight: 500; }\n    .vl-row .chev { color: var(--text-meta); font-size: 18px; line-height: 1; transition: transform 0.15s ease; }\n    .vl-row.open .chev { transform: rotate(90deg); }\n    .vl-verses { border-bottom: 1px solid var(--border-card); padding: 2px 0 6px; }\n    .vl-verse { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 8px 14px;\n      font-size: 15px; color: var(--text-primary); cursor: pointer; -webkit-tap-highlight-color: transparent; }\n    .vl-verse .vl-ref { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }\n    .vl-tip { position: absolute; left: 14px; top: calc(100% - 6px); z-index: 5; max-width: 80%;\n      background: #e9ecf1; color: #2b303a; font-size: 13px; font-weight: 500;\n      padding: 6px 12px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); pointer-events: none; white-space: nowrap; }\n    @media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .vl-tip { background: #3a3f4a; color: #e8eaee; box-shadow: 0 6px 18px rgba(0,0,0,0.4); } }\n    :root[data-theme=\"dark\"] .vl-tip { background: #3a3f4a; color: #e8eaee; box-shadow: 0 6px 18px rgba(0,0,0,0.4); }\n    .vl-verse + .vl-verse { border-top: 1px solid var(--border-card); }\n\n    .rank-1 { --rl: #a8643a; --rd: #d9945f; }\n    .rank-2 { --rl: #7b8794; --rd: #b8c2cc; }\n    .rank-3 { --rl: #b88a00; --rd: #f2c94c; }\n    .rank-4 { --rl: #5b6b8c; --rd: #aebbd9; }\n    .rank-5 { --rl: #2754c5; --rd: #7da2ff; }\n    .rank-6 { --rl: #138a55; --rd: #4fd18e; }\n    .rank-7 { --rl: #c62847; --rd: #ff7088; }\n    .rank-8 { --rl: #0e92b8; --rd: #6fe0ff; }\n    @media (prefers-color-scheme: dark) {\n      .rank-badge { --rc: var(--rd); }\n      .rank-badge.is-new { --rc: var(--text-meta); }\n    }\n\n    /* Top ranks get a soft glint that sweeps across the pill now and then:\n       Diamond every 3 s, Ruby every 5 s, Emerald (fainter) every 8 s. */\n    .rank-badge.rank-6, .rank-badge.rank-7, .rank-badge.rank-8 { position: relative; overflow: hidden; }\n    .rank-badge.rank-6::after, .rank-badge.rank-7::after, .rank-badge.rank-8::after {\n      content: \"\"; position: absolute; top: 0; bottom: 0; left: 0; width: 38%; pointer-events: none;\n      transform: translateX(-110%);\n      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, var(--sh)), transparent);\n      animation: rankShimmer var(--per) ease-in-out infinite;\n    }\n    .rank-badge.rank-8 { --per: 3s; --sh: 0.8; }\n    .rank-badge.rank-7 { --per: 5s; --sh: 0.65; }\n    .rank-badge.rank-6 { --per: 8s; --sh: 0.45; }\n    @media (prefers-color-scheme: dark) {\n      .rank-badge.rank-8 { --sh: 0.44; }\n      .rank-badge.rank-7 { --sh: 0.36; }\n      .rank-badge.rank-6 { --sh: 0.25; }\n    }\n    @keyframes rankShimmer {\n      0%   { transform: translateX(-110%); }\n      30%  { transform: translateX(290%); }\n      100% { transform: translateX(290%); }\n    }\n    @media (prefers-reduced-motion: reduce) {\n      .rank-badge.rank-6::after, .rank-badge.rank-7::after, .rank-badge.rank-8::after { display: none; }\n    }\n\n    .meta-tag.is-lapse-badge {\n      color: var(--text-lapse);\n      font-weight: 700;\n      background: var( \" id=\"activeCard\">\n      <div class=\"card-header-group\">\n        <div class=\"ref-header-row\">\n          <span class=\"ref-header\" id=\"cardRef\"><\/span>\n          <span class=\"version-badge\" id=\"cardVersion\" style=\"display:none\"><\/span>\n        <\/div>\n        <div class=\"meta-tag\" id=\"cardMeta\"><\/div>\n        <div class=\"pips-container\"><\/div>\n      <\/div>\n      <div class=\"verse-wrap\">\n        <div class=\"ev-nav\" id=\"evNav\" style=\"display:none\">\n          <button type=\"button\" id=\"evPrev\" onclick=\"go(-1)\" aria-label=\"Previous verse\">\u2039<\/button>\n          <span id=\"evPos\"><\/span>\n          <button type=\"button\" id=\"evNext\" onclick=\"go(1)\" aria-label=\"Next verse\">\u203a<\/button>\n        <\/div>\n        <div class=\"verse-body\" id=\"cardBody\" onclick=\"handleContainerClick(event)\"><\/div>\n      <\/div>\n      <div class=\"action-container\">\n        <div class=\"btn-row ev-dim\" id=\"evBtns\">\n          <button type=\"button\" class=\"btn-fail\" disabled tabindex=\"-1\"><span>Reviewed<\/span><span class=\"shortcut-hint\">[F]<\/span><\/button>\n          <button type=\"button\" class=\"btn-pass\" disabled tabindex=\"-1\"><span>Level Up<\/span><span class=\"shortcut-hint\">[S]<\/span><\/button>\n        <\/div>\n        <div class=\"btn-row\" id=\"evFailRow\" style=\"display:none\">\n          <button type=\"button\" class=\"btn-pass ev-wait retry\" id=\"evWait\">Couldn't reach the app \u00b7 Tap to retry<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <nav class=\"tabbar ev-dim\" id=\"tabbar\">\n    <button type=\"button\" class=\"tab\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"3\"/><path d=\"M8 12h8\"/><\/svg>Review<\/button>\n    <button type=\"button\" class=\"tab on\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 5v14M5 12h14\"/><\/svg>New<\/button>\n    <button type=\"button\" class=\"tab\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01\"/><\/svg>Verses<\/button>\n  <\/nav>\n<script>\n(function () {\n  var DATA = /*__DATA__*/null;\n  var cards = (DATA && DATA.cards) || [];\n  var idx = 0;\n  var rev = {};          // reference -> [true/false per part]\n  var touched = false;\n\n  function escapeHtml(s) { return String(s || \"\").replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\"); }\n  function midnight(s) { var p = String(s || \"\").split(\"-\"); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]).getTime() : NaN; }\n  function dayNow(c) {\n    if (!c.day) return 0;\n    var t = new Date(); t.setHours(0, 0, 0, 0);\n    var then = midnight(DATA && DATA.cachedOn);\n    var diff = isNaN(then) ? 0 : Math.max(0, Math.round((t.getTime() - then) / 86400000));\n    return c.day + diff;\n  }\n  function states(c) {\n    if (!rev[c.f]) rev[c.f] = c.segs.map(function () { return false; });\n    return rev[c.f];\n  }\n  function post() {\n    var c = cards[idx]; if (!c) return;\n    var st = states(c), list = [];\n    st.forEach(function (v, i) { if (v) list.push(i); });\n    try { parent.postMessage({ type: \"EV_STATE\", f: c.f, idx: idx, revealed: list, touched: touched }, \"*\"); } catch (e) {}\n  }\n\n  window.render = function () {\n    var c = cards[idx]; if (!c) return;\n    document.getElementById(\"cardRef\").textContent = c.f;\n    var vb = document.getElementById(\"cardVersion\"), ver = String(c.v || \"\").trim();\n    if (ver && ver.toUpperCase() !== \"ESV\") { vb.textContent = ver; vb.style.display = \"inline-block\"; } else vb.style.display = \"none\";\n    var d = dayNow(c);\n    document.getElementById(\"cardMeta\").textContent = d > 0 ? \"New Verse \u00b7 Day \" + d : \"New Verse\";\n    var nav = document.getElementById(\"evNav\");\n    nav.style.display = cards.length > 1 ? \"flex\" : \"none\";\n    document.getElementById(\"evPos\").textContent = (idx + 1) + \" of \" + cards.length;\n    document.getElementById(\"evPrev\").disabled = idx === 0;\n    document.getElementById(\"evNext\").disabled = idx === cards.length - 1;\n\n    var st = states(c), segs = c.segs;\n    var count = st.filter(Boolean).length, all = count === segs.length;\n    var h = '<div class=\"passage-toolbar\"><span class=\"passage-status\">' +\n      (segs.length > 1 ? count + \" of \" + segs.length + \" revealed\" : (all ? \"Revealed\" : \"Tap to reveal\")) +\n      '<\/span><button type=\"button\" class=\"btn-reveal-all\" onclick=\"toggleRevealAll(event)\">' +\n      (segs.length > 1 ? (all ? \"Hide All\" : \"Reveal All\") : (all ? \"Hide\" : \"Reveal\")) + \"<\/button><\/div>\";\n    h += '<div class=\"passage-stream\">';\n    segs.forEach(function (s, i) {\n      h += ' <span class=\"verse-unit\" data-idx=\"' + i + '\" onclick=\"handleVerseClick(' + i + ', event)\"> ' +\n        (s.n ? '<sup class=\"v-num\">' + escapeHtml(s.n) + \"<\/sup> \" : \"\") +\n        '<span class=\"v-text ' + (st[i] ? \"revealed\" : \"blurred\") + '\">' + escapeHtml(s.t) + \"<\/span> <\/span> \";\n    });\n    h += \"<\/div>\";\n    document.getElementById(\"cardBody\").innerHTML = h;\n  };\n  window.handleVerseClick = function (i, ev) {\n    if (ev) ev.stopPropagation();\n    var st = states(cards[idx]); st[i] = !st[i]; touched = true; render(); post();\n  };\n  window.handleContainerClick = function () {\n    var st = states(cards[idx]), n = st.indexOf(false);\n    if (n !== -1) { st[n] = true; touched = true; render(); post(); }\n  };\n  window.toggleRevealAll = function (ev) {\n    if (ev && ev.stopPropagation) ev.stopPropagation();\n    var st = states(cards[idx]), all = st.every(Boolean);\n    for (var i = 0; i < st.length; i++) st[i] = !all;\n    touched = true; render(); post();\n  };\n  window.go = function (dir) {\n    var n = idx + dir; if (n < 0 || n >= cards.length) return;\n    idx = n; touched = true; render(); post();\n  };\n\n  // Messages from the shell page: the app could not be reached.\n  window.addEventListener(\"message\", function (e) {\n    if (e.source !== parent || !e.data) return;\n    var b = document.getElementById(\"evWait\");\n    var btns = document.getElementById(\"evBtns\"), row = document.getElementById(\"evFailRow\");\n    if (e.data.type === \"EV_FAIL\") {\n      btns.style.display = \"none\"; row.style.display = \"flex\"; b.disabled = false;\n      b.onclick = function () { parent.postMessage({ type: \"EV_RETRY\" }, \"*\"); };\n    } else if (e.data.type === \"EV_WAIT\") {\n      btns.style.display = \"\"; row.style.display = \"none\"; b.onclick = null;\n    }\n  });\n\n  if (cards.length) { render(); post(); }\n})();\n<\/script>\n<\/body>\n<\/html>\n";
    var EARLY_KEY = "vr_early";
    var HANDOFF_WAIT_MS = 1500;
    var FAIL_AFTER_MS = 15000;
    var earlyFrame = document.getElementById("earlyFrame");
    var earlyActive = false;
    var earlyState = null;
    var handoffTimer = null;
    var failTimer = null;

    function isAppOrigin(o) { return /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(String(o)); }

    function todayKey() {
      var d = new Date();
      return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    }

    function loadEarlyCache() {
      try {
        var c = JSON.parse(localStorage.getItem(EARLY_KEY) || "null");
        if (c && Array.isArray(c.cards) && c.cards.length && c.cards.length <= 40) return c;
      } catch (e) {}
      return null;
    }

    function saveEarlyCache(cards) {
      try {
        if (!Array.isArray(cards)) return;
        var clean = [];
        cards.slice(0, 40).forEach(function(c) {
          if (!c || typeof c.f !== "string" || !Array.isArray(c.segs) || c.segs.length > 200) return;
          clean.push({
            f: c.f.slice(0, 120), v: String(c.v || "").slice(0, 12), day: Number(c.day) || 0,
            segs: c.segs.map(function(s) { return { n: String((s && s.n) || "").slice(0, 8), t: String((s && s.t) || "").slice(0, 4000) }; })
          });

        if (clean.length) localStorage.setItem(EARLY_KEY, JSON.stringify({ cards: clean, cachedOn: todayKey() }));
        else localStorage.removeItem(EARLY_KEY);

    }

    function showEarly() {
      var c = loadEarlyCache();
      if (!c || !EARLY_DOC) return false;
      var dataJs = JSON.stringify(c).replace(/</g, "\\u003c");
      earlyFrame.srcdoc = EARLY_DOC.replace("/*__DATA__*/null", function() { return dataJs; });
      earlyFrame.style.display = "block";
      earlyActive = true;
      var splash = document.getElementById("splashScreen");
      if (splash) splash.style.display = "none";
      failTimer = setTimeout(function() {
        try { earlyFrame.contentWindow.postMessage({ type: "EV_FAIL" }, "*"); } catch (e) {}
      }, FAIL_AFTER_MS);
      return true;
    }

    function hideEarly() {
      clearTimeout(handoffTimer);
      clearTimeout(failTimer);
      if (!earlyActive) return;
      earlyActive = false;
      earlyFrame.style.display = "none";
      earlyFrame.srcdoc = "";
    }

    function dismissSplash() {
      const splash = document.getElementById('splashScreen');
      if (splash && splash.style.display !== 'none') {
        splash.style.opacity = '0';
        setTimeout(() => { splash.style.display = 'none'; }, 250);
      }

    function handoff(src) {

    window.addEventListener('message', function(e) {
      var d = e.data;
