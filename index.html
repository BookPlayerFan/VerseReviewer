<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Verse Review</title>

  <!-- iOS Home Screen Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=4">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=4">
  <link rel="icon" type="image/png" sizes="192x192" href="https://bookplayerfan.github.io/VerseReviewer/VerseReview.png?v=4">
  <link rel="manifest" href="manifest.json">

  <!-- iOS Standalone PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Verse Review">
  <meta name="color-scheme" content="light dark">

  <!-- Dynamic Theme Color for Status Bar -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-theme: #f8f9fa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-theme: #121212;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-theme);
    }

    body {
      display: flex;
      flex-direction: column;
      /* Generous top clearance below iPhone 17 Pro Dynamic Island & blur area */
      padding-top: max(calc(env(safe-area-inset-top) + 16px), 68px);
      /* Balanced chin padding above the home indicator bar */
      padding-bottom: max(env(safe-area-inset-bottom), 12px);
      box-sizing: border-box;
      transition: background-color 0.25s ease;
    }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: var(--bg-theme);
      min-height: 0;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyoSSJrEh4cf-YkLXIJgiQ3d4KZbzTG2Twho6JSRAlwXkaGbpZXAPfGqBegHhLc5U3YPQ/exec" 
    allow="clipboard-read; clipboard-write">
  </iframe>
</body>
</html>
