      }
      if (!many) return "";
      return p[0] === p[1] ? "v" + numOf(p[0]) : "v" + numOf(p[0]) + "\u2013" + numOf(p[1]);
    }
    // The line at the left of the bar above a Learn card: always "Part N of M" and what the part holds (v13 c-d, v14, v25-26), or "Full reference" when the whole
    // reference is one step (with the verses it holds when it has several).
    function learnStatus(card) {
      const vc = card.verseCount || 1, cov = card.pm ? stepCover(card) : "";
      if (vc === 1) return "Full reference" + (cov ? " \u00b7 " + cov : "");
      return "Part " + (card.verseIndex || 1) + " of " + vc + (cov ? " \u00b7 " + cov : "");
    }

    // Flatten verses into the pieces that are shown and revealed. New tab: long verses split into phrases (a, b, c...).
    // Review tab: one piece per verse. Only the first piece of a verse carries the verse number.
    function buildUnits(segs, split) {
      const units = [];
      segs.forEach(function(s, vi) {
        const parts = split ? splitPhrases(s.text) : [s.text];
        parts.forEach(function(t, k) {
          units.push({
            num: k === 0 ? s.num : "", text: t, vi: vi,
            letter: parts.length > 1 ? String.fromCharCode(97 + k) : ""
          });
        });
      });
      return units;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function getFastTrackTarget(card) {
      if (card.group === 3 && card.rep === 5) return 5;
      if (card.group === 4 && card.rep === 6) return 6;
      if (card.group === 5 && (card.rep === 7 || card.rep === 8)) return card.rep;
      return null;
    }

    // Failing needs the verse revealed first, except for brand-new (Level 0) cards, where Fail means Skip.
    // Failed verses wait at the end of the queue (held) until Practice is started; they are not part of the deck.
    function activeEnd() {
      for (let i = 0; i < queue.length; i++) if (queue[i].isHeld) return i;
      return queue.length;
    }
    function heldCount() {
      return queue.filter(function(c) { return c.isHeld; }).length;
    }

    function hasActiveCard() {
      return mode === 'learning' ? !!learningCards[learningIndex] : currentIndex < activeEnd();
    }

    function canFail() {
      if (mode === 'learning') { const lc = learningCards[learningIndex]; return !!lc && lc.stage === 'lock' && !isLocked(lc) && isFlipped; }   // a Lock card has Miss, and (like Review) only once something is revealed
      const c = queue[currentIndex];
      return !!c && (c.group === 0 || isFlipped);
    }
    // Pass / Level Up / Recover / Clear follow the same rule as Miss: the whole reference must be unblurred first.
    function canPass() {
      if (mode === 'learning') { const lc = learningCards[learningIndex]; return !!lc && (lc.stage !== 'lock' || isFlipped); }
      const c = queue[currentIndex];
      return !!c && (c.group === 0 || isFlipped);   // a repeat card's Clear needs the whole reference revealed too
    }

    function render() {
      closeContext();
      clearLevelUp();
      const pkEl = document.getElementById("picker");
      if (pkEl.classList.contains("inline") && !pkEl.classList.contains("held") && !(mode === 'learning' && !learningCards[learningIndex])) closePicker();   // the New page is only the tab while there is no card (the hold version stays until Cancel or a choice)
      if (mode === 'learning') renderLearning();
      else renderCard();
      const kc = mode === 'learning' ? learningCards[learningIndex] : queue[currentIndex];
      if (kc && kc.reference) startCardClock(kc.reference + "|" + kc.rep + (kc.isRepeat ? "|r" : ""));
      updateFailLock();
      updateTabs();
      postCache();
    }

    function setMode(m) {
      mode = m;
      if (document.getElementById("picker").classList.contains("held")) closePicker();   // switching tabs leaves the hold version behind
      if (m !== 'learning') clearView();
      // Changing tabs doesn't change the deck, so a review from the last couple of minutes can still be undone afterwards
      const keep = { id: undoId, label: undoLabel, exp: undoExp };
      enqueueSubmit(null, snapshot(currentIndex)); // saves the screen you're on so any device reopens here
      undoId = keep.id; undoLabel = keep.label; undoExp = keep.exp;
      render();
    }

    function toggleLearning() {
      if (isScoring || isFetching || isRefreshing) return;
      if (mode === 'learning') {
        setMode('review');
      } else {
        learningIndex = 0;
        setMode('learning');
      }
    }

    // Learning screen with no card to show: the New tab is the Choose a verse page (In progress on top, Add new below). There is no separate
    // "Nothing to learn now" / "No New Verse" screen; the page itself says what is waiting, and the next card's unlock time shows in In progress.
    function renderEmptyLearning() {
      isScoring = false;
      document.getElementById("activeCard").style.display = "none";
      document.getElementById("summaryView").style.display = "none";
      document.getElementById("sessionProgressFill").style.width = "0%";
      setSummaryButtons(false, false);
      countUpToken++;
      updateStatLists(); // an open Repeats / Leveled Up list from the Review screen must not follow you here
      renderTomorrowNote();
      openNewPage();   // with no card to show, the New tab is the In progress / Add new page
    }

    function renderLearning() {
      isScoring = false;

      const cardEl = document.getElementById("activeCard");
      const summaryEl = document.getElementById("summaryView");
      const card = learningCards[learningIndex];
      if (!card) { renderEmptyLearning(); return; }

      cardEl.style.display = "flex";
      setCardRank(cardEl, 0);
      document.querySelectorAll(".shortcut-hint").forEach(function(h) { h.style.display = "none"; });
      summaryEl.style.display = "none";

      isFlipped = false;
      parsedSegments = learnUnits(card);   // New tab: long verses split into phrases; each piece's vi is its learn step
      segmentStates = parsedSegments.map(() => 'hidden');
      revealCursor = -1;
      startHints(card);

      cardEl.style.transition = "";
      cardEl.classList.remove("lu-settle");
      cardEl.style.opacity = "1";


      document.getElementById("sessionProgressFill").style.width = "0%";
      document.getElementById("btnFail").style.display = "none";            // one button on the New tab
      document.getElementById("btnFail").classList.remove("seen", "only", "review");
      revealCursor = tapStart();
      paintLearningHeader(card);

      const versionBadge = document.getElementById("cardVersion");
      const ver = (card.version || "").trim();
      if (ver && ver.toUpperCase() !== "ESV") {
        versionBadge.textContent = ver;
        versionBadge.style.display = "inline-block";
      } else {
        versionBadge.style.display = "none";
      }

      document.getElementById("cardRef").textContent = card.reference;
      renderCardBody();
      showCardContent();
    }

    // ── New card pieces ──
    const LOCK_SVG = '<svg class="lk-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1zm2 0h6V8a3 3 0 0 0-6 0v2z"/></svg>';

    // Where a plain tap starts on a multi-verse Learn card: just before the verse you are on today (so it runs to the end, then wraps).
    function curStart() {
      if (mode !== 'learning') return -1;
      const c = learningCards[learningIndex];
      if (!c || c.stage !== 'learn' || !(c.verseCount > 1)) return -1;
      const i = parsedSegments.findIndex(function(p) { return p.vi === c.verseIndex - 1; });
      return i > 0 ? i - 1 : -1;
    }

    // Where a plain tap starts on a Learn card of a multi-verse reference: with the verse you are learning not showing yet, the first tap shows it; once it is showing,
    // taps go through the reference from its first verse (skipping what is already showing).
    function tapStart() {
      const c = mode === 'learning' ? learningCards[learningIndex] : null;
      if (c && c.stage === 'learn' && c.verseCount > 1) {
        const open = parsedSegments.some(function(p, i) { return p.vi === c.verseIndex - 1 && segmentStates[i] === 'hidden'; });
        if (!open) return -1;
      }
      return curStart();
    }

    // After the shown pieces change without a tap (the app opening from the early view, or the hint level changing): taps carry on from the last piece shown of
    // another verse; with only the verse you are learning showing (or nothing), they start from the first verse (the verse you are learning first while it is hidden).
    function resetTapCursor(card) {
      if (!isLearnCard(card)) { revealCursor = segmentStates.lastIndexOf('revealed'); return; }
      const cvi = (card.verseIndex || 1) - 1;
      let lastOther = -1;
      segmentStates.forEach(function(st, i) { if (st === 'revealed' && parsedSegments[i] && parsedSegments[i].vi !== cvi) lastOther = i; });
      revealCursor = lastOther >= 0 ? lastOther : tapStart();
    }

    let growPips = false;   // set for one paint: the new dots grow in (after the old ones shrank away)
    let lastPips = { ref: "", stage: "", now: 0 };   // what the dots last showed, to pop the one that just filled
    function paintLearningHeader(card) {
      startCardClock(card.reference + "|" + card.rep);
      const metaTag = document.getElementById("cardMeta");
      metaTag.className = "meta-tag";
      metaTag.textContent = "";
      const pill = document.createElement("span");
      const isLock = card.stage === 'lock';
      pill.className = "rank-badge is-new" + (isLock ? " is-lock" : "");
      if (isLock) pill.innerHTML = LOCK_SVG + "Lock"; else pill.textContent = "Learn";
      metaTag.appendChild(pill);
      const pips = document.getElementById("cardPips");
      pips.innerHTML = "";
      pips.classList.remove("lock-chips");
      // The same dots as the review reps: the rep you are on is a ring, done reps are filled. Learn has 7 reps; Lock has two (AM, then PM).
      const total = isLock ? 2 : 7, now = isLock ? (card.lockPart === 'pm' ? 2 : 1) : (card.dot || 1);
      // the same card, one rep further on: the dot that just filled pops
      const grow = growPips; growPips = false;
      const before = lastPips.ref === card.reference && lastPips.stage === card.stage ? lastPips.now : 0;
      lastPips = { ref: card.reference, stage: card.stage, now: now };
      for (let i = 1; i <= total; i++) {
        const pip = document.createElement("div");
        pip.className = "pip" + (i < now ? " filled" : i === now ? " cur" : "") + (before > 0 && i >= before && i < now ? " pop" : "");
        if (isLock) pip.title = "Pass " + i + " of 2";
        pips.appendChild(pip);
      }
      if (grow) pipsEmerge(150);   // after the old dots went into the pill, the new ones come out of it
      paintLateState(card);
      scheduleLate(card);
      paintLearningButton(card);
    }

    // The one button: blue Review, or green Next Part / Learned / Promote. While the card waits for its time it is greyed and says when it opens ("Opens 8:00 PM"); a press does nothing.
    function opensWords(ms) { return "Opens " + clockWords(ms).replace(/^at /, ""); }
    function paintLearningButton(card) {
      if (learnHintTimer) { clearTimeout(learnHintTimer); learnHintTimer = null; }
      const label = card.label || "Review", waiting = isLocked(card), lock = card.stage === 'lock';
      const b = document.getElementById("btnPass"), f = document.getElementById("btnFail");
      document.getElementById("btnPassText").textContent = waiting ? opensWords(card.unlockAt) : label;
      b.classList.toggle("clear", label === "Review");
      const idle = lock && !waiting && !isFlipped;   // a Lock card: Miss and Pass stay grey until something is revealed
      b.classList.toggle("locked", waiting || learnPending || idle);
      f.style.display = lock && !waiting ? "flex" : "none";
      f.classList.toggle("locked", idle || learnPending);
      document.getElementById("btnFailText").textContent = "Miss";
    }

    function clockWords(ms) {
      const d = new Date(ms), n = new Date(nowSrv());
      const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      const dayDiff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000);
      if (dayDiff <= 0) return "at " + t;
      if (dayDiff === 1) return "tomorrow " + t;
      return d.toLocaleDateString([], { weekday: "long" }) + " " + t;
    }
    function lockedText(card) {
      const when = clockWords(card.unlockAt);
      if (card.stage === 'lock') return card.lockPart === 'pm' ? "Promote opens " + when : "Lock opens " + when;
      if ((card.dot || 1) === 1) return card.verseIndex > 1 ? stepWord(card) + " " + card.verseIndex + " starts " + when : "Starts " + when;
      return "Next review " + when;
    }

    // Puts the server's version of a card on screen. Stays on the same card (keeping what you have revealed) unless another card is now due.
    function applyLearnCard(c) {
      viewRef = null;
      const shown = learningCards[learningIndex] ? learningCards[learningIndex].reference : null;
      const prev = learningCards.concat(learningHeld).find(function(x) { return x.reference === c.reference; });
      const oldVerse = prev ? prev.verseIndex : 0;
      learningCards = learningCards.filter(function(x) { return x.reference !== c.reference; });
      learningHeld = learningHeld.filter(function(x) { return x.reference !== c.reference; });
      learningCards.push(c);
      sortLearning();
      learningIndex = 0;
      if (mode === 'learning' && !isScoring) {
        if (learningCards[0] && learningCards[0].reference === shown) {
          if (oldVerse && learningCards[0].verseIndex !== oldVerse) {
            // moved on to the next verse of the reference: it starts like a new verse (rep 1: the verse is showing, everything else blurred, hints at that verse's level)
            segmentStates = parsedSegments.map(function() { return 'hidden'; });
            startHints(learningCards[0]);
          }
          if (learningCards[0].verseIndex !== oldVerse || segmentStates.every(function(x) { return x === 'hidden'; })) revealCursor = tapStart(); // taps start at the verse you are on until it is showing, then from the first verse
          paintLearningHeader(learningCards[0]);
          renderCardBody();
          updateTabs();
        } else {
          render();
        }
      } else {
        updateTabs();
      }
      postCache();
    }

    // ── Hold menu on the New card's button ──
    // Cards in progress: every verse in Learn or Lock, in the order the New tab shows them, each with when it opens. Shown at the top of the Choose a verse page.
    // Read only: tapping one peeks at its verse (a Lock card that is not open yet stays out of the tab until its time).
    function progressWhen(c) {
      if (!isLocked(c)) return "Open now";
      const d = new Date(c.unlockAt), t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      const today = new Date(); const sameDay = d.toDateString() === today.toDateString();
      const tm = new Date(today.getTime() + 86400000);
      return "Opens " + (sameDay ? "" : d.toDateString() === tm.toDateString() ? "tomorrow " : d.toLocaleDateString([], { weekday: "short" }) + " ") + t;
    }
    // Tapping a card in the In progress list shows that card in the New tab, even when it is not open yet (its button then says when it opens and does nothing).
    function viewLearnCard(ref) {
      if (isScoring || learnPending) return;
      closePicker();
      if (mode !== 'learning') goTab('new');
      viewRef = ref;
      sortLearning();
      const i = learningCards.findIndex(function(x) { return x.reference === ref; });
      if (i < 0) { viewRef = null; sortLearning(); render(); return; }
      learningIndex = i;
      render();
    }
    // Gives the verse card its rank's color theme (no theme for New verses).
    function setCardRank(cardEl, g) {
      for (let i = 1; i <= 8; i++) cardEl.classList.remove("rank-" + i);
      cardEl.classList.toggle("ranked", g >= 1 && g <= 8);
      if (g >= 1 && g <= 8) cardEl.classList.add("rank-" + g);
    }

    function renderCard() {
      isScoring = false;

      const cardEl = document.getElementById("activeCard");
      const summaryEl = document.getElementById("summaryView");
      const progressFill = document.getElementById("sessionProgressFill");
      const pipsContainer = document.getElementById("cardPips");
      const metaTag = document.getElementById("cardMeta");
      const versionBadge = document.getElementById("cardVersion");
      const btnFail = document.getElementById("btnFail");
      btnFail.classList.remove("seen", "only", "review");
      document.getElementById("btnPass").classList.remove("clear", "locked");
      pipsContainer.classList.remove("lock-chips", "late-1", "late-2");
      const btnFailText = document.getElementById("btnFailText");
      const btnPassText = document.getElementById("btnPassText");

      if (currentIndex >= activeEnd()) {
        renderEndOfDayScreen();
        return;
      }

      cardEl.style.display = "flex";
      setCardRank(cardEl, queue[currentIndex].group);
      document.querySelectorAll(".shortcut-hint").forEach(function(h) { h.style.display = ""; });
      summaryEl.style.display = "none";

      const card = queue[currentIndex];
      isFlipped = false;

      parsedSegments = buildUnits(parseVerseSegments(card.text, card.reference), false);   // Review tab: whole verses
      segmentStates = parsedSegments.map(() => 'hidden');
      revealCursor = -1;

      cardEl.style.transition = "";
      cardEl.classList.remove("lu-settle");
      cardEl.style.opacity = "1";

      // Progress through today's deck, worked out only from the synced position, so every device shows the
      // same bar. Repeat cards added after a Fail come after the deck and never move it backwards.
      const percent = baseCount > 0 ? (Math.min(currentIndex, baseCount) / baseCount) * 100 : 0;
      progressFill.style.width = `${percent}%`;

      pipsContainer.innerHTML = '';
      metaTag.className = "meta-tag";

      const ver = (card.version || "").trim();
      if (ver && ver.toUpperCase() !== "ESV") {
        versionBadge.textContent = ver;
        versionBadge.style.display = "inline-block";
      } else {
        versionBadge.style.display = "none";
      }

      const fastTrackTarget = getFastTrackTarget(card);

      if (card.isRepeat) {
        // a verse you missed today comes back as a Missed card; any other repeat card is the evening Bronze card
        metaTag.textContent = (wasMissedToday(card.reference) ? "Missed" : "Evening") + " \u00B7 " + rankName(card.group);
        metaTag.classList.add("is-repeat-badge");
        // Repeat cards (practice rounds and the evening card) only have Clear: a Repeat button would just put the card
        // back at the end, so you simply keep looking at it until you know it, then tap Clear.
        btnPassText.textContent = "Clear";
        document.getElementById("btnPass").classList.add("clear");
        btnFail.style.display = "none";
      } else if (fastTrackTarget) {
        // ⚡ Fast-Track Recovery Mode
        metaTag.textContent = `⚡ Fast-Track · back to ${rankName(fastTrackTarget)}`;
        metaTag.classList.add("is-fasttrack-badge");
        btnFailText.textContent = "Miss";
        btnPassText.textContent = "Recover";
        btnFail.style.display = "flex";

        pipsContainer.innerHTML = `<span class="fast-track-pip" title="1 Pass restores ${rankName(fastTrackTarget)}">✦</span>`;
      } else {
        setRankBadge(metaTag, card.group);
        btnFailText.textContent = "Miss";
        // last rep of a level: this Pass moves the verse up; Diamond has nowhere to go, so it just says Review
        btnPassText.textContent = card.group === 8 ? "Review" : (card.rep >= card.repsNeeded ? "Level Up" : "Pass");
        btnFail.style.display = "flex";

        if (card.group === 8) {
          // Diamond is the top rank, so a plain "1 of 1" dot says nothing; show the gem instead.
          pipsContainer.innerHTML = '<span class="dia-mark" title="Diamond">\u25C6</span>';
        } else {
          for (let i = 1; i <= card.repsNeeded; i++) {
            const pip = document.createElement("div");
            pip.className = "pip" + (i < card.rep ? " filled" : i === card.rep ? " cur" : "");
            pipsContainer.appendChild(pip);
          }
        }
      }

      document.getElementById("cardRef").textContent = card.reference;
      renderCardBody();
      showCardContent();
    }

    // How one piece looks right now: its class and its inner markup (a hint level shows the markup, Full the plain words, a hidden piece is blurred).
    function pieceView(idx, learn, cv) {
      const seg = parsedSegments[idx];
      const isRev = segmentStates[idx] === 'revealed';
      const isHint = learn && isRev && hintLevel >= 2 && hintLevel <= 4 && !fullPieces[idx];   // Letters, Alternate, Phrase starts; Full shows the plain words
      return {
        cls: (isHint ? 'hinted' : (isRev ? 'revealed' : 'blurred')) + (seg.vi === cv ? ' cv' : ''),
        inner: isHint ? hintMarkup(seg.text, hintLevel - 1) : escapeHtml(seg.text),
        key: (isHint ? 'h' + hintLevel : (isRev ? 'r' : 'b'))   // what the markup depends on
      };
    }
    // A hint level change only changes the pieces that show (and the level number): the blurred pieces are left exactly as they are, not rebuilt,
    // so the blur does not flicker or redraw with a hard edge while you swipe through the levels.
    function patchLevel() {
      const units = document.querySelectorAll("#cardBody .verse-unit");
      const lc = learningCard();
      if (!lc || units.length !== parsedSegments.length) { renderCardBody(); return; }
      const cv = (lc.verseIndex || 1) - 1;
      units.forEach(function(u, idx) {
        const t = u.querySelector(".v-text"); if (!t) return;
        const pv = pieceView(idx, true, cv);
        if (t.className !== "v-text " + pv.cls) t.className = "v-text " + pv.cls;
        if (t.getAttribute("data-k") !== pv.key) { t.innerHTML = pv.inner; t.setAttribute("data-k", pv.key); }
      });
      const fl = document.querySelector("#cardBody .hint-flag");
      if (fl) { fl.className = "hint-flag" + (hintLevel === 5 ? " off" : ""); fl.innerHTML = bulbSvg(hintLevel); }
    }

    // "today", "yesterday", "12 days ago", "4 months ago"
    function agoWords(n) {
      if (n <= 0) return "today";
      if (n === 1) return "yesterday";
      if (n <= 60) return n + " days ago";
      return Math.round(n / 30) + " months ago";
    }
    // The Review bar's cards left: a small stack of cards and the number counting down (this card included).
    function dayRing(left, total) {
      return '<span class="day-ring" role="img" aria-label="' + left + ' left"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="2.5" width="13" height="16" rx="3"/><rect class="dr-front" x="2.5" y="6.5" width="13" height="16" rx="3"/></svg><b>' + left + '</b></span>';
    }
    function renderCardBody() {
      const body = document.getElementById("cardBody");
      const revealedCount = segmentStates.filter(s => s === 'revealed').length;
      const allRevealed = revealedCount === parsedSegments.length;
      const isNew = mode === 'learning';

      const lc = isNew ? learningCards[learningIndex] : null;
      const learn = !!(lc && lc.stage === 'learn');          // Learn cards have hints; Lock cards are a plain test, like Review
      const multi = !!(learn && lc.verseCount > 1);
      const cv = learn ? (lc.verseIndex || 1) - 1 : -1;     // the verse you are learning today
      // The bar above a Learn card: which verse, and the level number (1 to 5, faint at 5). Tapping the number steps the level.
      const flag = learn
        ? '<span class="hint-flag' + (hintLevel === 5 ? ' off' : '') + '" role="button" aria-label="Hint level" onclick="hintFlagTap(event)">' + bulbSvg(hintLevel) + '</span>'
        : '';
      const rc = isNew ? null : queue[currentIndex];
      const lockCard = !!(lc && lc.stage === 'lock');
      const status = learn
        ? learnStatus(lc)
        : (lockCard && typeof lc.ago === 'number' ? 'Learned ' + agoWords(lc.ago)
        : (rc && rc.isRepeat ? 'Second try'
          : (rc && typeof rc.ago === 'number' ? 'Last seen ' + agoWords(rc.ago)
          : (parsedSegments.length > 1
            ? `${revealedCount} of ${parsedSegments.length} revealed`
            : (allRevealed ? 'Revealed' : 'Tap to reveal')))));
      // right side: the level number on a Learn card; on Review a ring that fills as the deck is done, with the number of cards left in the middle (not on a repeat card); nothing on a Lock card
      let right = flag;
      if (!isNew && baseCount > 0 && currentIndex < baseCount) right = dayRing(baseCount - currentIndex, baseCount);
      const pillOn = lvlPill.until > Date.now() && mode === 'learning' && !!learningCard() && lvlPill.ref === learningCard().reference;   // a rebuild inside the 1.5 s the level notice shows keeps it
      let html = `<div class="passage-toolbar"><span class="passage-status" data-base="${escapeHtml(status)}">${pillOn ? lvlPillHtml(lvlPill.L) : status}</span>${right ? `<span class="pt-right">${right}</span>` : ''}</div>`;

      html += '<div class="passage-stream">';
      // A reference learned in parts: each part is its own block with a bar down the left and its number, the part you are on in blue.
      const blocks = !!(learn && lc.pm && lc.verseCount > 1);
      let openStep = -1;
      parsedSegments.forEach((seg, idx) => {
        if (blocks && seg.vi !== openStep) {
          if (openStep !== -1) html += '</div>';
          openStep = seg.vi;
          html += '<div class="step-blk' + (seg.vi === cv ? ' on' : seg.vi < cv ? ' done' : '') + '"><span class="step-n">' + (seg.vi + 1) + '</span>';
        }
        const pv = pieceView(idx, learn, cv);
        // phrases of a split verse always show a small grey letter (a, b, c...), so you can see a verse is split before revealing anything
        html += `
          <span class="verse-unit" data-idx="${idx}" onclick="handleVerseClick(${idx}, event)">
            ${seg.num ? `<sup class="v-num${multi && seg.vi !== lc.verseIndex - 1 ? ' dim' : ''}">${escapeHtml(seg.num)}</sup>` : ''}${seg.letter ? `<span class="p-let">${seg.letter}</span>` : ''}
            <span class="v-text ${pv.cls}" data-k="${pv.key}">${pv.inner}</span>
          </span>
        `;
      });
      if (blocks && openStep !== -1) html += '</div>';
      html += '</div>';

      body.innerHTML = html;
      syncSwipeAxis();
    }

    // The hint markup for one piece (a phrase on the New tab). Level 1: the first letter of every word. Level 2: every other word (the first, third, ...).
    // Level 3: only the first word of the phrase. A word that is not shown keeps its width and has a dot where its first letter would be.
    // The letter is blue; the rest of every word is there but invisible, so nothing changes size or moves.
    function hintMarkup(text, level) {
      let wi = -1;
      return String(text || "").split(/(\s+)/).map(function(w) {
        if (!w || /^\s+$/.test(w)) return w;
        wi++;
        const m = w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9])([\s\S]*)$/);
        if (!m) return '<span class="hz">' + escapeHtml(w) + '</span>';
        const show = level === 1 || (level === 2 && wi % 2 === 0) || (level === 3 && wi === 0);
        if (show) return escapeHtml(m[1]) + '<span class="hl">' + escapeHtml(m[2]) + '</span><span class="hz">' + escapeHtml(m[3]) + '</span>';
        return escapeHtml(m[1]) + '<span class="hu">' + escapeHtml(m[2]) + '</span><span class="hz">' + escapeHtml(m[3]) + '</span>';
      }).join("");
    }

    // The level indicator on the right of the bar: a ring with the level number (1 to 5) in it. The number is drawn as a shape centred in the ring, so it sits exactly in the middle on every phone;
    // the plain digit is kept (hidden) for screen readers. It dims a little with each level, and is still clear at 5 (where nothing helps). Tapping it steps to the next level.
    const LVL_DIGITS = {1:'M-1.5 -3 L0.7 -4.8 V4.8',2:'M-3 -2.4 C-3 -4.2 -1.6 -5 0 -5 C1.8 -5 3 -4 3 -2.4 C3 -0.8 1.8 0.2 -0.2 1.8 L-3 4.8 H3.2',3:'M-2.8 -3.8 C-2 -4.7 -1 -5 0 -5 C1.8 -5 2.9 -4 2.9 -2.6 C2.9 -1.2 1.8 -0.4 0 -0.4 C1.9 -0.4 3.1 0.6 3.1 2.2 C3.1 3.9 1.8 5 0 5 C-1.2 5 -2.3 4.6 -3 3.6',4:'M1.6 4.8 V-4.8 L-3.2 2.2 H3.4',5:'M2.7 -4.8 H-2.2 L-2.7 -0.6 C-1.9 -1.1 -1 -1.3 0 -1.3 C1.9 -1.3 3 -0.1 3 1.9 C3 3.8 1.8 5 0 5 C-1.3 5 -2.4 4.6 -3 3.6'};
    function bulbSvg(level) {
      const d = LVL_DIGITS[level] || LVL_DIGITS[1];
      return '<span class="lvl-n" data-l="' + level + '"><svg viewBox="-13 -13 26 26" width="24" height="24" aria-hidden="true"><circle r="11" fill="none" stroke="currentColor" stroke-width="2"/><path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lvl-t">' + level + '</span></span>';
    }

    // ── Reveal gestures ──
    // A "piece" is one phrase on the New tab and one whole verse on the Review and Lock tabs.
    //   Tap, anywhere   reveal the next hidden piece, in order, and stop once everything shows (nothing hides by tapping).
    //                   New: the verse you are learning first (if it is not showing), then from the first verse of the reference.
    //   Hold            a peek that ends when you let go and reveals nothing.
    //                   New: the full words show, at any level (through the blur at Off). Review / Lock: the first three words of the passage come out of the blur.
    //   Swipe right     reveal all pieces (every card)
    //   Swipe left      hide all pieces (every card; on a Learn card the verse you are learning stays showing at its level, unless Off)
    //   Swipe up/down   Learn cards: level by distance, up raises it (see below); the level number on the bar is tapped to step the level
    function nextHiddenAfter(from) {
      const n = segmentStates.length;
      for (let k = 1; k <= n; k++) {
        const i = (from + k) % n;
        if (segmentStates[i] === 'hidden') return i;
      }
      return -1;
    }

    function revealPiece(i) {
      segmentStates[i] = 'revealed';
      revealCursor = i;
      if (tapStart() === -1 && learningCard() && learningCard().verseCount > 1 && parsedSegments[i].vi === learningCard().verseIndex - 1) revealCursor = -1;   // the verse you are learning is now showing: the next tap starts from the first verse
      syncFlipState();
      renderCardBody();
    }

    function handleVerseClick(index, event) {
      if (event) event.stopPropagation();
      handleContainerClick(event);
    }

    function handleContainerClick(event) {
      if (isScoring || !hasActiveCard()) return;
      if (event && event.target && event.target.closest && event.target.closest(".passage-toolbar")) return;   // the bar is for swiping the level, not for tapping
      const i = nextHiddenAfter(revealCursor);
      if (i !== -1) revealPiece(i);
    }

    // Used by the R key: reveal everything, or hide everything if it is all showing.
    function toggleRevealAll(event) {
      if (event && event.stopPropagation) event.stopPropagation();
      if (isScoring) return;

      const allRevealed = segmentStates.every(s => s === 'revealed');
      const targetState = allRevealed ? 'hidden' : 'revealed';
      segmentStates = segmentStates.map(() => targetState);
      revealCursor = targetState === 'revealed' ? segmentStates.length - 1 : tapStart();

      syncFlipState();
      renderCardBody();
    }

    // Swipe right / left: every piece shown, or every piece hidden (Learn pieces show at the current hint level; hide all leaves the verse you are learning showing, unless the level is Off).
    function setAllPieces(show) {
      if (isScoring || !hasActiveCard()) return;
      const lc = learningCard(), keep = !show && mode === 'learning' && isLearnCard(lc) && hintLevel < 5;   // hide all keeps the verse you are learning at its level (at Off it is hidden anyway)
      segmentStates = segmentStates.map(function(st, i) { return show ? 'revealed' : (keep && parsedSegments[i] && parsedSegments[i].vi === (lc.verseIndex || 1) - 1 ? 'revealed' : 'hidden'); });
      revealCursor = show ? segmentStates.length - 1 : tapStart();
      syncFlipState();
      renderCardBody();
    }

    // ── Hint levels (New tab, Learn cards) ──
    const HINT_NAMES = ['', 'Full words', 'First letters', 'Every other', 'Phrase starts', 'Blurred text'];   // what the bar says for a moment when the level changes (the number itself is the icon)   // index = level
    function learningCard() { return mode === 'learning' ? learningCards[learningIndex] : null; }
    function isLearnCard(c) { return !!c && c.stage === 'learn'; }
    function learningHints() { return hintLevel >= 2 && hintLevel <= 4 && isLearnCard(learningCard()); }
    // A level belongs to one verse on one day (the day runs midnight to midnight): a new verse, or a new day, starts at Full again.
    function lvlDay() { const d = new Date(nowSrv()); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
    function hintKey(c) { return isLearnCard(c) ? c.reference + "|" + (c.verseIndex || 1) + "|" + lvlDay() + "|v2" : ""; }
    function startHints(card) {
      hintLevel = isLearnCard(card) ? (lvlMap[hintKey(card)] || 1) : 1;
      fullPieces = {};
      applyLevelStates(card);
      syncFlipState();
    }
    // The verse you are learning is showing (plain at Full, as hints at Letters / Alternate / Phrase starts). At Off it is blurred.
    function applyLevelStates(card) {
      if (!isLearnCard(card)) return;
      const cv = (card.verseIndex || 1) - 1, show = hintLevel < 5;
      segmentStates = parsedSegments.map(function(p, i) { return p.vi === cv ? (show ? 'revealed' : 'hidden') : (segmentStates[i] || 'hidden'); });
      resetTapCursor(card);
    }
    function saveLevel(card, L) {
      const k = hintKey(card); if (!k) return;
      if (L !== 1) lvlMap[k] = L; else delete lvlMap[k];   // Full is the start, so nothing is saved for it
      shellHintApplied = true;
      try { window.top.postMessage({ type: 'VR_HINT', key: k, level: L }, '*'); } catch (e) {}
      localHintAt = nowSrv(); hintPending = { k: k, L: L };   // and to the server, so your other phone shows the same level (a burst of swipes sends only the last)
      clearTimeout(hintSendTimer); hintSendTimer = setTimeout(function() { hintSendTimer = null; sendHint(); }, 500);
    }
    function sendHint() {
      const h = hintPending; if (!h) return;
      try {
        google.script.run
          .withSuccessHandler(function(r) { if (hintPending === h && r && r.ok) hintPending = null; })
          .withFailureHandler(function() {})   // kept in hintPending: the next sync check sends it again
          .setHint(h.k, h.L);
      } catch (e) {}
    }
    // The level another phone set for the card being learned (from the server). Only used for that same card; a newer change made on this phone wins.
    function applyServerHint(h, live) {
      if (!h || typeof h.k !== "string" || !h.k || !(h.l >= 1 && h.l <= 5)) return;
      if (hintPending || !(h.t > localHintAt)) return;
      if (h.l !== 1) lvlMap[h.k] = h.l; else delete lvlMap[h.k];
      shellHintApplied = true;
      try { window.top.postMessage({ type: 'VR_HINT', key: h.k, level: h.l }, '*'); } catch (e) {}
      const c = learningCard();
      if (live && mode === "learning" && isLearnCard(c) && hasActiveCard() && !isScoring && hintKey(c) === h.k && hintLevel !== h.l) {
        hintLevel = h.l; fullPieces = {}; applyLevelStates(c); syncFlipState(); renderCardBody();
      }
    }
    function setHintLevel(L, quiet) {
      const c = learningCard();
      if (isScoring || !isLearnCard(c) || !hasActiveCard()) return;
      L = Math.max(1, Math.min(5, L));
      const k = hintKey(c);
      if (hintLevel < 5) lastLvl[k] = hintLevel;
      if (L < 5) lastLvl[k] = L;
      const same = L === hintLevel;
      hintLevel = L; fullPieces = {};
      applyLevelStates(c);
      syncFlipState();
      saveLevel(c, L);
      patchLevel();
      if (!same) { const fl = document.querySelector(".hint-flag"); if (fl) fl.classList.add("pulse"); }
      if (!quiet) flashHintLabel(HINT_NAMES[L]);
    }
    function hintFlagTap(e) { if (e) { e.stopPropagation(); e.preventDefault(); } setHintLevel(hintLevel >= 5 ? 1 : hintLevel + 1); }   // tap the number: the next level, and round to 1 after 5
    function stepHintLevel(dir) { setHintLevel(hintLevel + dir); }   // dir > 0: less help (toward Off), dir < 0: more help (toward Full)
    let shellHintApplied = false;   // the saved levels are applied once per page load, then your own changes rule

    // The left label of the bar says the new level for a moment, then goes back to the verse.
    function swapLabel(el, text) { el.style.opacity = 0; setTimeout(function() { el.textContent = text; el.style.opacity = 1; }, 160); }
    function flashHintLabel(text) {
      const el = document.querySelector("#cardBody .passage-toolbar .passage-status"); if (!el) return;
      clearTimeout(lvlFlashTimer);
      swapLabel(el, text);
      lvlFlashTimer = setTimeout(function() {
        const e2 = document.querySelector("#cardBody .passage-toolbar .passage-status");
        if (e2 && !peeking) swapLabel(e2, e2.getAttribute("data-base") || "");
      }, 1500);
    }

    // A held Review press that raised the level: the bar's left label becomes a small pill, "Level 3 · Every other", for a moment, then goes back to the verse.
    const LVL_ARROW = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
    let lvlPill = { L: 0, ref: "", until: 0 };
    function lvlPillHtml(L) { return '<span class="lvl-pill">' + LVL_ARROW + "Level " + L + " \u00b7 " + HINT_NAMES[L] + "</span>"; }
    function flashLevelUp(L) {
      const card = learningCards[learningIndex];
      lvlPill = { L: L, ref: card ? card.reference : "", until: Date.now() + 1500 };
      const el = document.querySelector("#cardBody .passage-toolbar .passage-status"); if (!el) return;
      clearTimeout(lvlFlashTimer);
      el.style.opacity = 0;
      setTimeout(function() { const e1 = document.querySelector("#cardBody .passage-toolbar .passage-status"); if (e1) { e1.innerHTML = lvlPillHtml(L); e1.style.opacity = 1; } }, 120);
      lvlFlashTimer = setTimeout(function() {
        const e2 = document.querySelector("#cardBody .passage-toolbar .passage-status");
        if (e2 && !peeking) swapLabel(e2, e2.getAttribute("data-base") || "");
      }, 1500);
    }

    // Hold the Review button on a Learn card: the button fills, and at the end that press is a Review that also raises the hint level by one. A tap is a plain Review.
    // Its own timing (CLIMB_*), apart from the 350 ms of every other hold in the app. Not offered at level 5, on a step's last rep, or while the button is not open yet:
    // there a press is just a Review.
    const CLIMB_HOLD_MS = 400, CLIMB_FILL_DELAY_MS = 150;
    function canClimb() {
      if (mode !== 'learning' || isScoring || learnPending) return false;
      const c = learningCard();
      return !!(c && isLearnCard(c) && hasActiveCard() && !isLocked(c) && hintLevel < 5 && (c.dot || 1) < 7);
    }
    function attachClimbHold(btn) {
      const fill = btn.querySelector(".climb-fill");
      let t1 = null, t2 = null, sx = 0, sy = 0, fired = false;
      function reset(fast) { clearTimeout(t1); clearTimeout(t2); t1 = t2 = null; fill.style.transition = fast ? "width .08s linear" : "none"; fill.style.width = "0"; }
      btn.addEventListener("pointerdown", function(e) {
        fired = false;
        if (e.pointerType === "mouse" && e.button !== 0) return;
        if (!canClimb()) return;
        sx = e.clientX; sy = e.clientY; reset(false);
        document.body.classList.add("lp-active"); bindLongPressWindow();
        t1 = setTimeout(function() { t1 = null; fill.style.transition = "width " + (CLIMB_HOLD_MS - CLIMB_FILL_DELAY_MS) + "ms linear"; fill.style.width = "100%"; }, CLIMB_FILL_DELAY_MS);
        t2 = setTimeout(function() {
          t2 = null; fired = true;
          fill.style.transition = "none"; fill.style.width = "0";
          if (!canClimb()) return;
          pressLearning("press", true);
        }, CLIMB_HOLD_MS);
      });
      btn.addEventListener("pointermove", function(e) { if (t2 && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) reset(true); });
      ["pointerup", "pointercancel", "pointerleave"].forEach(function(n) { btn.addEventListener(n, function() { if (t2) reset(true); }); });
      btn.addEventListener("click", function(e) { if (fired) { fired = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);   // the click after a hold is not a tap
      btn.addEventListener("contextmenu", function(e) { if (t2 || fired) e.preventDefault(); });
      btn.addEventListener("selectstart", function(e) { if (t2 || fired) e.preventDefault(); });
    }

    // Press and hold in the verse box is a peek; it never reveals anything and it ends when you let go.
    // Learn cards: the full words of every verse that is showing (and the verse you are learning, even blurred at Off) show for as long as you hold.
    // Review and Lock cards: the first three words of the passage show clear over the blur, to confirm you have the start of it right.
    // The tap on the end of a hold must not also reveal a piece.
    let heldBody = null, peeking = false, peek3 = null;
    function startPeek(e) {
      if (!hasActiveCard()) return;
      const learn = mode === 'learning' && isLearnCard(learningCard());
      peeking = true; peekCount++;
      if (learn) document.body.classList.add("peek"); else peekFirstWords();
    }
    function peekFirstWords() {
      const el = document.querySelector("#cardBody .v-text");
      if (!el || !el.classList.contains("blurred")) return;   // already showing: nothing to peek at
      // The first three words unblur right where they are (the text is split in two spans for as long as you hold); the rest stays blurred.
      const txt = el.textContent, m = /^\s*\S+(?:\s+\S+){0,2}/.exec(txt);
      if (!m) return;
      peek3 = { el: el, html: el.innerHTML };
      // Both changes happen with the box's own fade switched off and in one go, so no frame ever shows the whole text clear (the box fading out of its blur while
      // the pieces are swapped is what flashed the card).
      el.style.transition = "none";
      el.classList.add("pk3");
      el.innerHTML = '<span class="pk3-on">' + escapeHtml(m[0]) + '</span><span class="pk3-rest">' + escapeHtml(txt.slice(m[0].length)) + '</span>';
      clearSel();
    }
    function undoPeek3() {
      if (!peek3) return;
      const el = peek3.el;
      el.style.transition = "none";
      el.classList.remove("pk3");
      el.innerHTML = peek3.html;
      peek3 = null;
      void el.offsetWidth;                   // apply that now, then give the box its fade back for its next change
      el.style.transition = "";
      clearSel();
    }
    function clearSel() { try { const sel = window.getSelection && window.getSelection(); if (sel && sel.rangeCount) sel.removeAllRanges(); } catch (e) {} }
    function endPeek() {
      if (!peeking) return;
      peeking = false;
      document.body.classList.remove("peek");
      undoPeek3();
    }
    function attachRevealHold() {
      const body = document.getElementById("cardBody");
      heldBody = attachLongPress(body, function(e) {
        startPeek(e);
      }, function(e) { return !isScoring && hasActiveCard() && !e.target.closest("button") && !e.target.closest(".hint-flag"); });
      window.addEventListener("pointerup", endPeek);
      window.addEventListener("pointercancel", endPeek);
      body.addEventListener("touchmove", function(e) { if (peeking && e.cancelable) e.preventDefault(); }, { passive: false });   // a hold must not scroll the verse
      body.addEventListener("click", function(e) {
        if (heldBody()) { e.stopImmediatePropagation(); e.preventDefault(); }
      }, true);
    }

    // Swipe up or down on a New (Learn) card changes the hint level by distance: the first level as soon as the finger has clearly gone up or down, then one more
    // per VSWIPE_STEP px, so one long swipe can cross all five (up raises the level, down lowers it). It only works where the verse box does not scroll;
    // a long verse keeps its scrolling and the level number on the bar is tapped instead. The very edge of the screen is left to iOS.
    const SWIPE_MIN = 25;      // px sideways: used by the swipe-to-go-back screens
    const SWIPE_RATIO = 1.2;   // sideways must beat vertical by this much
    const VSWIPE_START = 14;   // px before the first step
    const VSWIPE_STEP = 80;    // px for each further step
    let swipeFired = false;
    function cardFits() { const b = document.getElementById("cardBody"); return !!b && b.scrollHeight <= b.clientHeight + 1; }
    function syncSwipeAxis() {   // a verse that fits does not scroll, so the box gives the vertical swipe to the hint level; the bar always does
      const b = document.getElementById("cardBody"); if (!b) return;
      const learn = mode === 'learning' && isLearnCard(learningCard());
      b.style.touchAction = (learn && cardFits()) ? 'none' : 'pan-y';
    }
    window.addEventListener("resize", function() { syncSwipeAxis(); });
    function attachSwipe() {
      const body = document.getElementById("cardBody");
      let tracking = false, active = "", vert = false, sx = 0, sy = 0, startLevel = 1;
      body.addEventListener("pointerdown", function(e) {
        tracking = false; active = ""; swipeFired = false;
        if (!e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;
        if (e.target.closest("button") || e.target.closest(".hint-flag")) return;
        if (e.pointerType === "touch" && (e.clientX < 14 || e.clientX > window.innerWidth - 14)) return;   // the very edge of the screen is iOS's
        // sideways (reveal all / hide all) works on every card; up and down (level) only on Learn cards, and only where the verse box does not scroll
        vert = mode === 'learning' && isLearnCard(learningCard()) && cardFits();
        tracking = true; sx = e.clientX; sy = e.clientY; startLevel = hintLevel;
      });
      body.addEventListener("pointermove", function(e) {
        if (!tracking) return;
        if (peeking) { tracking = false; return; }
        const dx = e.clientX - sx, dy = e.clientY - sy, ax = Math.abs(dx), ay = Math.abs(dy);
        if (!active) {
          if (ax >= SWIPE_MIN && ax >= ay * SWIPE_RATIO) {
            active = "h"; swipeFired = true;
            setAllPieces(dx > 0);   // right: reveal all, left: hide all
            return;
          }
          if (!vert || ay < VSWIPE_START || ay < ax * 1.2) return;
          active = "v"; swipeFired = true;
        }
        if (active !== "v" || isScoring || !hasActiveCard()) return;
        const steps = Math.floor((ay - VSWIPE_START) / VSWIPE_STEP) + 1;
        const target = Math.max(1, Math.min(5, startLevel + (dy < 0 ? steps : -steps)));   // up raises the level, down lowers it
        if (target !== hintLevel) setHintLevel(target);
      });
      window.addEventListener("pointerup", function() { tracking = false; active = ""; });
      window.addEventListener("pointercancel", function() { tracking = false; active = ""; });
      // the click that can follow a swipe must not also reveal a piece
      body.addEventListener("click", function(e) {
        if (swipeFired) { swipeFired = false; e.stopImmediatePropagation(); e.preventDefault(); }
      }, true);
    }

    function syncFlipState() {
      isFlipped = segmentStates.length > 0 && segmentStates.every(s => s === 'revealed');   // Review and Lock buttons wake up only when the whole reference is unblurred
      if (mode === 'learning') { const lc = learningCards[learningIndex]; if (lc && lc.stage === 'lock') paintLearningButton(lc); return; }

      const card = queue[currentIndex];
      updateFailLock();
    }

    // Miss and Pass (Level Up, Recover) are always on screen in Review, but dimmed and inert until some of the verse text is showing.
    function updateFailLock() {
      const b = document.getElementById("btnFail");
      if (mode === 'learning') { const lc = learningCards[learningIndex]; if (lc) paintLearningButton(lc); return; }
      b.classList.toggle("locked", hasActiveCard() && !canFail());
      document.getElementById("btnPass").classList.toggle("locked", hasActiveCard() && !canPass());
    }

    // ───────────── Scoring ─────────────

    // Buttons and keys fade the card out in place.
    // The card frame stays put; only what changes (reference, rank tag, dots, verse text) fades, so there is no blink.
    const CARD_FADE_OUT_MS = 220, CARD_FADE_IN_MS = 340; // old verse fades out, next verse fades in
    const PASS_SWAP_MS = 320, REPEAT_SWAP_MS = 400;      // when the next card is put in place after Pass / Repeat
    let cardContentFaded = false;
    function cardContentEls() {
      const c = document.getElementById("activeCard");
      return [c.querySelector(".card-header-group"), c.querySelector(".verse-wrap")].filter(Boolean);
    }
    function fadeCardContent() {
      cardContentEls().forEach(function(e) { e.style.transition = "opacity " + CARD_FADE_OUT_MS + "ms ease-out"; e.style.opacity = "0"; });
      cardContentFaded = true;
    }
    function showCardContent() {
      const animate = cardContentFaded;
      cardContentFaded = false;
      cardContentEls().forEach(function(e) {
        e.style.transition = "none";
        if (animate) {
          e.style.opacity = "0";
          void e.offsetWidth;
          e.style.transition = "opacity " + CARD_FADE_IN_MS + "ms ease-out";
        }
        e.style.opacity = "1";
      });
    }
    function animateOut() { fadeCardContent(); }

    let practicing = false; // a practice round started from the Review Complete screen is running
    const LEVELUP_MS = 2600; // how long the card shows its new rank before moving on
    const PROMOTE_MS = 3400; // a New verse promoted to Bronze gets the longest Bronze moment
    const LU_FADE_MS = 350;  // the rank-up overlay fades away over this long at the end

    function advanceAfter(ms) {
      const startedIn = epoch;
      setTimeout(function() { advanceCard(startedIn); }, ms);
    }
