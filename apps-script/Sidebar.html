<!DOCTYPE html>
<html style="color-scheme: light dark;">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-page: #f8f9fa;
      --bg-card: #ffffff;
      --bg-body: #f8f9fa;
      --border-card: #dadce0;
      --border-body: #e8eaed;
      
      --text-primary: #202124;
      --text-muted: #5f6368;
      --text-meta: #70757a;
      --text-accent: #1a73e8;
      --text-lapse: #d97706;
      --text-fasttrack: #b45309;
      --badge-lapse-bg: #fef3c7;
      --badge-fasttrack-bg: #fef3c7;
      --badge-version-bg: rgba(95, 99, 104, 0.12);
      --btn-fail-bg: #fce8e6;
      --btn-fail-text: #c5221f;
      --btn-pass-bg: #e6f4ea;
      --btn-pass-text: #137333;
      --btn-restart-bg: #e8f0fe;
      --btn-restart-text: #1a73e8;
      --badge-pass: #137333;
      --badge-fail: #c5221f;
      --card-shadow: rgba(0, 0, 0, 0.06);

      --spoiler-bg: rgba(120, 120, 120, 0.28);
      --spoiler-blur: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #121212;
        --bg-card: #1e1e1e;
        --bg-body: #28292a;
        --border-card: #38383a;
        --border-body: #3c4043;
        
        --text-primary: #f1f3f4;
        --text-muted: #9aa0a6;
        --text-meta: #9aa0a6;
        --text-accent: #8ab4f8;
        --text-lapse: #fbbf24;
        --text-fasttrack: #fcd34d;
        --badge-lapse-bg: #451a03;
        --badge-fasttrack-bg: #451a03;
        --badge-version-bg: rgba(255, 255, 255, 0.12);
        --btn-fail-bg: #4a1d1b;
        --btn-fail-text: #f28b82;
        --btn-pass-bg: #133a22;
        --btn-pass-text: #81c995;
        --btn-restart-bg: #1e3a5f;
        --btn-restart-text: #8ab4f8;
        --badge-pass: #81c995;
        --badge-fail: #f28b82;
        --card-shadow: rgba(0, 0, 0, 0.4);

        --spoiler-bg: rgba(255, 255, 255, 0.22);
        --spoiler-blur: 8px;
      }
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
      background-color: var(--bg-page);
    }

    body {
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      padding-top: max(env(safe-area-inset-top, 0px), 8px);
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 12px);
      padding-left: max(env(safe-area-inset-left, 0px), 12px);
      padding-right: max(env(safe-area-inset-right, 0px), 12px);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      padding: 0 4px;
      font-weight: 500;
      flex-shrink: 0;
      height: 20px;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: var(--border-card);
      border-radius: 2px;
      margin-bottom: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--text-accent);
      border-radius: 2px;
      transition: width 0.25s ease;
    }

    #deckContainer {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
    }

    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 16px 14px 12px 14px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 14px var(--card-shadow);
      touch-action: pan-y;
      will-change: transform, opacity;
      box-sizing: border-box;
      min-height: 0;
    }

    .swipe-badge {
      position: absolute;
      top: 18px;
      padding: 6px 14px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 8px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.1s ease;
    }

    .badge-pass { left: 18px; color: var(--badge-pass); border: 3px solid var(--badge-pass); transform: rotate(-12deg); }
    .badge-fail { right: 18px; color: var(--badge-fail); border: 3px solid var(--badge-fail); transform: rotate(12deg); }

    .card-header-group {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ref-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 3px;
      line-height: 1.2;
    }

    .ref-header {
      font-size: 23px;
      font-weight: 700;
      color: var(--text-accent);
      text-align: center;
    }

    .version-badge {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      background: var(--badge-version-bg);
      border: 1px solid var(--border-body);
      padding: 2px 5px;
      border-radius: 5px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      line-height: 1;
      pointer-events: none;
    }

    .meta-tag {
      text-align: center;
      font-size: 12px;
      color: var(--text-meta);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    /* Rank badge shown under the verse reference: Bronze > Silver > Gold > ... > Diamond */
    .rank-badge {
      --rc: var(--rl);
      display: inline-block;
      padding: 2px 0;
      min-width: 86px; /* same width for every rank */
      text-align: center;
      text-transform: uppercase;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.9px;
      color: var(--rc);
      border: 1px solid var(--rc);
      background: transparent;
    }
    @supports (background: color-mix(in srgb, red 10%, transparent)) {
      .rank-badge {
        background: color-mix(in srgb, var(--rc) 14%, transparent);
        border-color: color-mix(in srgb, var(--rc) 40%, transparent);
      }
    }
    .rank-badge.is-new { --rc: var(--text-meta); font-weight: 700; }
    .rank-badge.pop { animation: rankPop 0.6s ease-out both, rankGlow 1s ease-out 0.15s both; }
    .rank-badge.pop-big { animation: rankPop 0.8s ease-out both, rankGlow 1.4s ease-out 0.15s both; }
    @keyframes rankGlow {
      0%   { box-shadow: 0 0 0 0 var(--rc); }
      60%  { box-shadow: 0 0 14px 5px color-mix(in srgb, var(--rc) 45%, transparent); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .notice.levelup { font-size: 15px; min-height: 34px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 12px; }
    @keyframes rankPop {
      0%   { transform: scale(0.6); opacity: 0; }
      55%  { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .rank-arrow { color: var(--text-meta); margin: 0 2px; font-weight: 600; }
    .notice .rank-badge { vertical-align: middle; }
    .notice .rank-badge.pop, .notice .rank-badge.pop-big { margin: 0 6px; } /* room for the glow */
    #toastNotice.levelup { padding: 8px 18px; }

    /* Verse List screen (reuses the full-screen sheet used by the verse picker) */
    .vl-row:active, .vl-seg button:active, .picker-item:active, .picker-close:active, .vl-verse:active { transform: none; filter: none; }
    .vl-row, .vl-seg button, .picker-close { transition: none; }
    .vl-row .chev { transition: transform 0.15s ease; }
    .vl-total { font-size: 13px; color: var(--text-muted); margin: 0; }
    .vl-bar { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; gap: 10px; }
    .vl-seg { display: inline-flex; border: 1px solid var(--border-card); border-radius: 10px; overflow: hidden; flex-shrink: 0; }
    .vl-seg button { background: transparent; border: 0; box-shadow: none; min-height: 0; width: auto;
      padding: 6px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted); border-radius: 0; flex-direction: row; }
    .vl-seg button.active { background: var(--badge-pass-bg, rgba(26,115,232,0.12)); color: var(--text-accent, #1a73e8); }
    .vl-row { display: flex; align-items: center; justify-content: space-between; width: 100%;
      background: none; border: 0; box-shadow: none; min-height: 0; padding: 12px 4px;
      border-bottom: 1px solid var(--border-card); flex-direction: row; border-radius: 0; text-align: left; }
    .vl-row .vl-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .vl-row .vl-right { display: inline-flex; align-items: center; gap: 8px; }
    .vl-row .vl-count { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .vl-row.zero .vl-count { color: var(--text-meta); font-weight: 500; }
    .vl-row .chev { color: var(--text-meta); font-size: 18px; line-height: 1; transition: transform 0.15s ease; }
    .vl-row.open .chev { transform: rotate(90deg); }
    .vl-verses { border-bottom: 1px solid var(--border-card); padding: 2px 0 6px; }
    .vl-verse { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 8px 14px;
      font-size: 15px; color: var(--text-primary); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .vl-verse .vl-ref { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .vl-tip { position: absolute; left: 14px; top: calc(100% - 6px); z-index: 5; max-width: 80%;
      background: #e9ecf1; color: #2b303a; font-size: 13px; font-weight: 500;
      padding: 6px 12px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); pointer-events: none; white-space: nowrap; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .vl-tip { background: #3a3f4a; color: #e8eaee; box-shadow: 0 6px 18px rgba(0,0,0,0.4); } }
    :root[data-theme="dark"] .vl-tip { background: #3a3f4a; color: #e8eaee; box-shadow: 0 6px 18px rgba(0,0,0,0.4); }
    .vl-verse + .vl-verse { border-top: 1px solid var(--border-card); }

    .link-quiet { background: none; border: 0; box-shadow: none; min-height: 0; width: auto;
      padding: 8px 10px; font-size: 13px; font-weight: 600; color: var(--text-muted); align-self: center; }

    .rank-1 { --rl: #a8643a; --rd: #d9945f; }
    .rank-2 { --rl: #7b8794; --rd: #b8c2cc; }
    .rank-3 { --rl: #b88a00; --rd: #f2c94c; }
    .rank-4 { --rl: #5b6b8c; --rd: #aebbd9; }
    .rank-5 { --rl: #2754c5; --rd: #7da2ff; }
    .rank-6 { --rl: #138a55; --rd: #4fd18e; }
    .rank-7 { --rl: #c62847; --rd: #ff7088; }
    .rank-8 { --rl: #0e92b8; --rd: #6fe0ff; }
    @media (prefers-color-scheme: dark) {
      .rank-badge { --rc: var(--rd); }
      .rank-badge.is-new { --rc: var(--text-meta); }
    }

    .meta-tag.is-lapse-badge {
      color: var(--text-lapse);
      font-weight: 700;
      background: var(--badge-lapse-bg);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .meta-tag.is-fasttrack-badge {
      color: var(--text-fasttrack);
      font-weight: 800;
      background: var(--badge-fasttrack-bg);
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.6px;
    }

    .pips-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      min-height: 14px;
    }

    .pip {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border-body);
      border: 1px solid var(--border-card);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .pip.filled {
      background: var(--text-accent);
      border-color: var(--text-accent);
      transform: scale(1.15);
      box-shadow: 0 0 5px rgba(26, 115, 232, 0.4);
    }

    /* Fast-Track Glowing Pip */
    .fast-track-pip {
      font-size: 15px;
      line-height: 1;
      color: var(--text-fasttrack);
      filter: drop-shadow(0 0 6px rgba(217, 119, 6, 0.7));
      animation: pulse-glow 1.8s infinite ease-in-out;
      user-select: none;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 9px rgba(217, 119, 6, 1)); }
    }

    .verse-body {
      user-select: text;
      flex: 1;
      background: var(--bg-body);
      border: 1px solid var(--border-body);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 12px 14px;
      margin-bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      scroll-behavior: smooth;
      box-sizing: border-box;
      cursor: pointer;
    }

    .passage-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0 8px 0;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-body);
      flex-shrink: 0;
    }

    .passage-status {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-reveal-all {
      background: var(--btn-restart-bg);
      color: var(--btn-restart-text);
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* 1. Mobile Default Typography (Touchscreens) */
    .passage-stream {
      font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
      font-size: 17.5px;
      line-height: 1.7;
      letter-spacing: 0.1px;
      color: var(--text-primary);
      text-align: justify;
      text-justify: inter-word;
      word-break: normal;
    }

    /* 2. Desktop Override Typography (Mouse / Precision Trackpads) */
    @media (hover: hover) and (pointer: fine) {
      .passage-stream {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16.5px;
        line-height: 1.7;
        letter-spacing: 0px;
      }
    }

    .verse-unit {
      cursor: pointer;
      display: inline;
    }

    .v-num {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-accent);
      vertical-align: super;
      margin-right: 3px;
      margin-left: 3px;
      user-select: none;
      display: inline-block;
    }

    .v-text {
      border-radius: 4px;
      padding: 2px 4px;
      transition: filter 0.18s ease, opacity 0.18s ease, background-color 0.18s ease;
    }

    .v-text.blurred {
      filter: blur(var(--spoiler-blur));
      opacity: 0.2;
      background-color: var(--spoiler-bg);
      user-select: none;
    }

    .v-text.revealed {
      filter: none;
      opacity: 1;
      background-color: transparent;
    }

    .notice {
      font-size: 13px;
      text-align: center;
      color: var(--badge-pass);
      font-weight: 700;
      min-height: 18px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .action-container { 
      display: flex; 
      flex-direction: column; 
      flex-shrink: 0;
    }

    .btn-row { 
      display: flex; 
      gap: 10px; 
      width: 100%;
    }

    button {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: transform 0.08s ease, filter 0.08s ease;
    }
    button:active { transform: scale(0.97); filter: brightness(0.92); }

    .btn-fail { 
      flex: 1; 
      min-height: 54px; 
      background: var(--btn-fail-bg); 
      color: var(--btn-fail-text); 
      font-size: 16px; 
    }

    .btn-pass { 
      flex: 1; 
      min-height: 54px; 
      background: var(--btn-pass-bg); 
      color: var(--btn-pass-text); 
      font-size: 16px; 
    }

    .shortcut-hint { font-size: 11px; opacity: 0.65; font-weight: 500; margin-top: 2px; }
    @media (max-width: 480px) {
      .shortcut-hint { display: none; }
      .btn-fail, .btn-pass { min-height: 56px; }
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 4px 14px var(--card-shadow);
      text-align: center;
      box-sizing: border-box;
      min-height: 0;
    }

    .summary-header .crown-icon { font-size: 44px; margin-bottom: 6px; }
    .summary-header h2 { font-size: 24px; margin: 0 0 6px 0; color: var(--text-primary); font-weight: 700; }
    .summary-header p { margin: 0; color: var(--text-muted); font-size: 14px; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .stat-box {
      background: var(--bg-body);
      border: 1px solid var(--border-body);
      border-radius: 12px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-val { font-size: 24px; font-weight: 800; margin-bottom: 2px; color: var(--text-primary); }
    .stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; }
    .val-pass { color: var(--btn-pass-text); }
    .val-grad { color: var(--text-accent); }
    .val-fail { color: var(--btn-fail-text); }
    .stat-box.tappable { cursor: pointer; }
    .stat-box.open { border-color: var(--text-accent); box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.18); }
    .fail-list { text-align: left; margin: -6px 0 14px; padding: 10px 14px 8px; background: var(--bg-body); border: 1px solid var(--border-body);
      border-radius: 12px; color: var(--text-primary); }
    .fail-list .fail-title { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-muted); font-weight: 600; padding-bottom: 7px; margin-bottom: 6px; border-bottom: 1px solid var(--border-body); }
    .fail-list .fail-inner { display: grid; grid-auto-flow: column; column-gap: 14px; row-gap: 1px; font-size: 14px; line-height: 1.55;
      max-height: 150px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .fail-list .fail-inner > div { min-width: 0; overflow-wrap: anywhere; }

    .summary-btn-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn-add-verse {
      width: 100%;
      min-height: 52px;
      background: var(--btn-pass-bg);
      color: var(--btn-pass-text);
      font-size: 15px;
      font-weight: 700;
    }

    .btn-restart { 
      width: 100%; 
      min-height: 48px; 
      background: var(--btn-restart-bg); 
      color: var(--btn-restart-text); 
      font-size: 14px; 
    }
    /* Three columns so the mode label sits in the true center of the bar. */
    .status-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
    }

    .sb-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .sb-left > span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sb-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    #sessionStatus {
      text-align: right;
      white-space: nowrap;
    }

    /* Quiet "Undo": invisible until a card was just scored, then fades out on its own. */
    .undo-link {
      background: none;
      border: 0;
      box-shadow: none;
      padding: 5px 4px;
      margin: -5px 0;
      min-height: 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .undo-link.show { opacity: 0.75; pointer-events: auto; }

    /* Tiny muted line pinned to the bottom of the Review Complete card. */
    .summary-card { position: relative; }
    .tomorrow-note {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      font-size: 11px;
      color: var(--text-meta);
      opacity: 0.8;
      text-align: center;
      pointer-events: none;
    }

    /* Names the screen you're on; tap it to switch. Plain in Review, blue in Learning. */
    .learning-chip {
      flex-direction: row;
      justify-content: center;
      min-width: 76px;
      min-height: 0;
      /* extra padding enlarges the tap area; negative margin keeps the bar the same height */
      padding: 5px 12px;
      margin: -5px 0;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      letter-spacing: 0.2px;
      background: transparent;
      color: var(--text-muted);
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .learning-chip.active {
      background: var(--btn-restart-bg);
      color: var(--btn-restart-text);
    }

    .diag-line {
      font-size: 10px;
      line-height: 1.35;
      color: var(--text-muted);
      margin: -4px 4px 6px 4px;
      word-break: break-all;
      user-select: text;
      flex-shrink: 0;
    }


    /* ── Bottom tab bar navigation ── */
    :root { --tab-h: calc(53px + max(env(safe-area-inset-bottom, 0px) - 14px, 0px)); }
    body { padding-bottom: calc(var(--tab-h) + 4px); }
    .status-bar { display: none !important; }
    /* Blue progress line along the top of the tab bar: only while reviewing cards (hidden on New, Verses and Review Complete) */
    .progress-track { display: none; position: absolute; top: -1px; left: 0; right: 0; height: 3px; margin: 0;
      background: transparent; border-radius: 0; z-index: 2; }
    .progress-track.show { display: block; }
    .progress-track .progress-fill { border-radius: 0 2px 2px 0; }
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; background: var(--bg-card); border-top: 1px solid var(--border-card);
      padding: 14px 0 max(env(safe-area-inset-bottom, 0px) - 14px, 0px); height: var(--tab-h);
    }
    .tab { flex: 1; background: none; border: 0; box-shadow: none; min-height: 0; width: auto; padding: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px;
      font-size: 10.5px; font-weight: 600; color: var(--text-muted); position: relative; border-radius: 0;
      -webkit-tap-highlight-color: transparent; }
    .tab:active { transform: none; filter: none; }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; }
    .tab.on { color: var(--text-accent); }
    .tab .tab-count { position: absolute; top: -3px; left: calc(50% + 6px); min-width: 18px; text-align: center;
      background: var(--text-muted); color: var(--bg-card); font-size: 10px; font-weight: 700;
      border-radius: 99px; padding: 1px 6px; line-height: 14px; }
    .tab.on .tab-count { background: var(--text-accent); }
    #verseListView { bottom: var(--tab-h); padding-bottom: 8px; z-index: 40; }
    #verseListView .picker-close { display: none; }
    .vl-iconbtn { background: none; border: 0; box-shadow: none; width: auto; min-height: 0; margin: -6px 0; padding: 6px 4px 6px 12px; }
    .vl-iconbtn svg { width: 22px; height: 22px; display: block; stroke: var(--text-accent, #1a73e8); fill: none; stroke-width: 2; stroke-linecap: round; }
    .vl-iconbtn.on svg { stroke: var(--text-muted); }
    #verseListView .picker-head { gap: 10px; }
    #verseListView .picker-title { flex: none; }
    #verseListView .vl-total { flex: 1; min-width: 0; text-align: right; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #verseListView .vl-bar .vl-seg { width: 100%; }
    #verseListView .vl-bar .vl-seg button { flex: 1; }
    .vl-search { margin: 0 0 2px; }
    .vl-search .picker-search { margin-bottom: 8px; }
    .vl-verse.hit { flex-wrap: wrap; }
    .vl-snip { flex-basis: 100%; margin-top: 3px; font-size: 13px; line-height: 1.4; color: var(--text-muted); }
    .vl-snip.full { color: var(--text-primary); }
    .vl-snip mark { background: rgba(255, 196, 0, 0.35); color: inherit; border-radius: 3px; padding: 0 1px; }
    #picker { z-index: 70; }
    .picker-actions { display: inline-flex; gap: 14px; align-items: center; }
    #picker .picker-close:first-child { color: var(--text-accent); font-weight: 600; }
    .picker-divider { font-size: 12px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-meta);
      padding: 16px 4px 6px; border-bottom: 1px solid var(--border-card); }
    .picker-note { font-size: 13px; color: var(--badge-pass); min-height: 0; margin: -4px 0 8px; font-weight: 600; }
    .picker-note:empty { display: none; }
    .paste-area { width: 100%; min-height: 200px; resize: none; outline: none; border: 1px solid var(--border-card); border-radius: 10px;
      background: transparent; color: var(--text-primary); font-size: 16px; line-height: 1.4; padding: 10px 12px; user-select: text; }
    .paste-area:focus { border-color: var(--text-accent); }
    .paste-hint { font-size: 12px; color: var(--text-muted); margin: 8px 2px 0; min-height: 16px; }
    .paste-hint.bad { color: var(--badge-fail); }
    .paste-hint.ok { color: var(--text-muted); }
    .pv { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45); padding: 24px 20px; }
    .pv.open { display: flex; }
    .pv-card { background: var(--bg-card); color: var(--text-primary); border-radius: 18px; width: 100%; max-width: 420px;
      max-height: 78%; display: flex; flex-direction: column; padding: 18px 18px 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
    .pv-head { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 700;
      color: var(--text-accent); margin-bottom: 10px; }
    .pv-text { overflow-y: auto; -webkit-overflow-scrolling: touch; font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
      font-size: 17px; line-height: 1.55; user-select: text; padding: 2px 2px 8px; }
    .pv-text sup, .pv-text .pv-n { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700;
      color: var(--text-accent); margin-right: 3px; }
    .pv-btns { display: flex; gap: 10px; margin-top: 10px; }
    .pv-btns button { flex: 1; min-height: 0; padding: 13px; border-radius: 12px; font-size: 16px; font-weight: 700; flex-direction: row; justify-content: center; }
    .pv-close { background: var(--bg-body); color: var(--text-muted); border: 1px solid var(--border-card); }
    .pv-add { background: var(--btn-pass-bg); color: var(--btn-pass-text); }
    /* Undo: small pill just above the Reveal button, only while it can be used */
    .undo-link { position: absolute; top: -38px; right: 6px; z-index: 6; margin: 0; padding: 5px 11px;
      border: 1px solid var(--border-card); border-radius: 99px; background: var(--bg-body); opacity: 0; }
    .undo-link.show { opacity: 0.95; }
    .corner-add { position: absolute; top: 10px; left: 12px; z-index: 6; margin: 0; width: 30px; min-height: 0; height: 30px;
      padding: 0; border: 1px solid var(--border-card); border-radius: 99px; background: var(--bg-body); color: var(--text-muted);
      display: flex; align-items: center; justify-content: center; flex-direction: row; opacity: 0.9; }
    .corner-add svg { width: 16px; height: 16px; display: block; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .sync-warning { position: fixed; top: max(env(safe-area-inset-top, 0px), 8px); left: 50%; transform: translateX(-50%);
      z-index: 60; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .diag-line { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-h) + 4px); z-index: 60;
      background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 8px; padding: 6px 8px; margin: 0; }
    #btnRanks { display: none !important; }
    /* Notices (level up, "Added to end of queue", errors) float over the bottom of the verse box,
       so they take no room between the verse and the buttons. */
    .verse-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 8px; }
    .verse-wrap .verse-body { flex: 1; margin-bottom: 0; }
    #toastNotice { position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); z-index: 5;
      width: max-content; max-width: 94%; min-height: 0; margin: 0; padding: 6px 14px; border-radius: 14px;
      background: var(--bg-card); border: 1px solid var(--border-card); box-shadow: 0 4px 14px rgba(0,0,0,0.14);
      pointer-events: none; text-align: center; animation: noticeIn 0.18s ease-out both; }
    #toastNotice:empty { display: none; }
    #toastNotice.levelup { min-height: 0; margin: 0; flex-wrap: wrap; justify-content: center; }
    @keyframes noticeIn { from { opacity: 0; transform: translateX(-50%) translateY(6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    button:disabled { opacity: 0.55; cursor: default; }
    button:disabled:active { transform: none; filter: none; }

    /* Simple "pick a verse" sheet */
    .picker {
      position: fixed; inset: 0; z-index: 50;
      background: var(--bg-card);
      display: none; flex-direction: column;
      padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    }
    .picker.open { display: flex; }
    .picker-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .picker-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .picker-close { background: none; border: 0; box-shadow: none; min-height: 0; width: auto;
      padding: 6px 4px; font-size: 14px; color: var(--text-muted); }
    .picker-search { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px;
      border: 1px solid var(--border-card); border-radius: 10px; background: transparent;
      color: var(--text-primary); margin-bottom: 8px; }
    .picker-list { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior-x: none; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
    #verseListView { overflow-x: hidden; touch-action: pan-y; overscroll-behavior: contain; }
    .picker-item { display: block; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0;
      box-shadow: none; min-height: 0; padding: 12px 4px; font-size: 16px; font-weight: 500;
      color: var(--text-primary); border-bottom: 1px solid var(--border-card); }
    .picker-empty { padding: 20px 4px; color: var(--text-muted); font-size: 14px; text-align: center; }

    .notice.is-error { color: var(--badge-fail); }

    .sync-warning {
      flex-direction: row;
      min-height: 0;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      background: var(--badge-lapse-bg);
      color: var(--text-lapse);
    }
  </style>
</head>
<body>

  <div class="status-bar">
    <div class="sb-left">
      <span id="queueProgress" onclick="toggleDiag()"></span>
    </div>
    <button type="button" class="learning-chip" id="learningChip" onclick="toggleLearning()" style="display: none;"></button>
    <div class="sb-right">
      <span id="sessionStatus"></span>
    </div>
  </div>

  <div class="diag-line" id="diagLine" style="display: none;"></div>

  <button type="button" class="sync-warning" id="syncWarning" onclick="onSyncWarningTap()" style="display: none;"></button>

  <div id="deckContainer">
    <button type="button" class="corner-add" id="cornerAdd" onclick="addNewVerse()" aria-label="Add a new verse" style="display: none;"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
    <div class="notice" id="toastNotice"></div>
    <div class="card" id="activeCard">
      <div class="swipe-badge badge-pass" id="badgePass">PASS</div>
      <div class="swipe-badge badge-fail" id="badgeFail">FAIL</div>

      <div class="card-header-group">
        <div class="ref-header-row">
          <span class="ref-header" id="cardRef">---</span>
          <span class="version-badge" id="cardVersion" style="display: none;"></span>
        </div>
        <div class="meta-tag" id="cardMeta">---</div>
        <div class="pips-container" id="cardPips"></div>
      </div>

      <div class="verse-wrap">
        <button type="button" class="undo-link" id="undoBtn" onclick="undoLast()">↶ Undo</button>
        <div class="verse-body" id="cardBody" onclick="handleContainerClick(event)">
        </div>
      </div>

      <div class="action-container">
        <div class="btn-row">
          <button type="button" class="btn-fail" id="btnFail" onclick="scoreCard('Fail')" style="display: none;">
            <span id="btnFailText">Fail</span>
            <span class="shortcut-hint">[F]</span>
          </button>
          <button type="button" class="btn-pass" id="btnPass" onclick="scoreCard('Pass')">
            <span id="btnPassText">Pass</span>
            <span class="shortcut-hint">[S]</span>
          </button>
        </div>
      </div>
    </div>

    <div class="summary-card" id="summaryView" style="display: none;">
      <div class="summary-header">
        <div class="crown-icon" id="summaryIcon">🏆</div>
        <h2 id="summaryTitle">Review Complete!</h2>
        <p id="summarySubtitle">You have finished all verses scheduled for today.</p>
      </div>

      <div class="stats-grid" id="summaryStats">
        <div class="stat-box">
          <div class="stat-val" id="statReviewed">0</div>
          <div class="stat-lbl">Reviewed</div>
        </div>
        <div class="stat-box">
          <div class="stat-val val-pass" id="statPassed">0</div>
          <div class="stat-lbl">Flawless</div>
        </div>
        <div class="stat-box">
          <div class="stat-val val-grad" id="statGraduated">0</div>
          <div class="stat-lbl">Leveled Up</div>
        </div>
        <div class="stat-box" id="statFailBox" onclick="toggleFailList()">
          <div class="stat-val val-fail" id="statFailed">0</div>
          <div class="stat-lbl">Repeats</div>
        </div>
      </div>
      <div class="fail-list" id="failList" style="display: none;"></div>

      <div class="tomorrow-note" id="tomorrowNote" style="display: none;"></div>

      <div class="summary-btn-stack">
        <div class="notice" id="summaryNotice"></div>
        <button type="button" class="btn-add-verse" id="btnAddVerse" onclick="addNewVerse()" style="display: none;">
          Add New Verse
        </button>
        <button type="button" class="btn-restart" id="btnRestart" onclick="restartSession()" style="display: none;">
          Try again
        </button>
        <button type="button" class="link-quiet" id="btnRanks" onclick="openVerseList()" style="display: none;">Verse List</button>
      </div>
    </div>
  </div>

  <div class="picker" id="verseListView">
    <div class="picker-head">
      <span class="picker-title" onclick="toggleDiag()">Verse List</span>
      <span class="vl-total" id="vlTotal"></span>
      <button type="button" class="vl-iconbtn" id="vlSearchBtn" onclick="toggleVlSearch()" aria-label="Search verses"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button type="button" class="picker-close" onclick="closeVerseList()">Close</button>
    </div>
    <div class="vl-search" id="vlSearchRow" style="display:none"><input id="vlSearch" type="search" class="picker-search" placeholder="Search reference or verse text" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="onVlSearch()"></div>
    <div class="vl-bar">
      <div class="vl-seg">
        <button type="button" id="vlSortBook" class="active" onclick="setVlSort('book')">Book</button>
        <button type="button" id="vlSortRank" onclick="setVlSort('rank')">Rank</button>
        <button type="button" id="vlSortDate" onclick="setVlSort('date')">Date</button>
      </div>
    </div>
    <div class="picker-list" id="vlList"></div>
  </div>


  <nav class="tabbar" id="tabbar">
    <div class="progress-track"><div class="progress-fill" id="sessionProgressFill"></div></div>
    <button type="button" class="tab on" id="tabReview" onclick="goTab('review')">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 12h8"/></svg>
      Review<span class="tab-count" id="tabReviewCount" style="display:none"></span>
    </button>
    <button type="button" class="tab" id="tabNew" onclick="goTab('new')">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New<span class="tab-count" id="tabNewCount" style="display:none"></span>
    </button>
    <button type="button" class="tab" id="tabVerses" onclick="goTab('verses')">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      Verses
    </button>
  </nav>

  <div class="pv" id="pickerPreview" onclick="if (event.target === this) closePreview()">
    <div class="pv-card">
      <div class="pv-head"><span id="pvRef"></span><span class="version-badge" id="pvVer" style="display:none"></span></div>
      <div class="pv-text" id="pvText"></div>
      <div class="pv-btns">
        <button type="button" class="pv-close" onclick="closePreview()">Close</button>
        <button type="button" class="pv-add" id="pvAdd">Add</button>
      </div>
    </div>
  </div>

  <div class="pv" id="pasteModal" onclick="if (event.target === this) closePaste()">
    <div class="pv-card">
      <div class="pv-head" style="color: var(--text-primary); font-size: 16px;">Paste new verse</div>
      <textarea class="paste-area" id="pasteText" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="Romans 8:35-37 ESV&#10;Verse text… (use [36] for verse numbers)" oninput="updatePasteHint()"></textarea>
      <div class="paste-hint" id="pasteHint"></div>
      <div class="pv-btns">
        <button type="button" class="pv-close" onclick="closePaste()">Cancel</button>
        <button type="button" class="pv-add" id="pasteAdd" onclick="submitPaste()">Add</button>
      </div>
    </div>
  </div>

  <div class="picker" id="picker">
    <div class="picker-head">
      <span class="picker-title">Choose a verse</span>
      <span class="picker-actions">
        <button type="button" class="picker-close" onclick="openPaste()">Paste verse</button>
        <button type="button" class="picker-close" onclick="closePicker()">Cancel</button>
      </span>
    </div>
    <div class="picker-note" id="pickerNote"></div>
    <input type="search" class="picker-search" id="pickerSearch" placeholder="Search" autocomplete="off" oninput="renderPicker()">
    <div class="picker-list" id="pickerList"></div>
  </div>

  <script>
    // Mirrors GROUP_CONFIG in Code.gs for names and repsNeeded only.
    // Review intervals live on the server, which computes every due date.
    const GROUP_CONFIG = {
      0: { name: "New",       repsNeeded: 1 },
      1: { name: "Bronze",     repsNeeded: 4 },
      2: { name: "Silver",     repsNeeded: 3 },
      3: { name: "Gold",     repsNeeded: 2 },
      4: { name: "Platinum",    repsNeeded: 2 },
      5: { name: "Sapphire",   repsNeeded: 2 },
      6: { name: "Emerald", repsNeeded: 1 },
      7: { name: "Ruby", repsNeeded: 1 },
      8: { name: "Diamond",   repsNeeded: 1 }
    };

    // Level names, shown as a badge under each verse. Level 0 is simply "New".
    const RANK_NAMES = ["New", "Bronze", "Silver", "Gold", "Platinum", "Sapphire", "Emerald", "Ruby", "Diamond"];
    function rankName(g) { return RANK_NAMES[Math.max(0, Math.min(8, g | 0))]; }
    function setRankBadge(metaTag, g) {
      metaTag.textContent = "";
      const b = document.createElement("span");
      b.className = "rank-badge " + (g > 0 ? "rank-" + Math.min(8, g) : "is-new");
      b.textContent = rankName(g);
      metaTag.appendChild(b);
    }

    function makePill(g, popClass) {
      const b = document.createElement("span");
      b.className = "rank-badge " + (g > 0 ? "rank-" + Math.min(8, g) : "is-new") + (popClass ? " " + popClass : "");
      b.textContent = rankName(g);
      return b;
    }

    // Brief rank-up moment in the toast: old badge, arrow, new badge popping in. Diamond gets a bigger one.
    // The notice lives outside the card (the card fades away when you score it, and a notice inside it
    // would fade too), so each time it changes it is lined up with the bottom of the verse box.
    function placeNotice() {
      const n = document.getElementById("toastNotice");
      const card = document.getElementById("activeCard");
      const wrap = card && card.querySelector(".verse-wrap");
      const deck = document.getElementById("deckContainer");
      if (!n || !wrap || !deck || !n.firstChild) return;
      const bottomEdge = card.offsetTop + wrap.offsetTop + wrap.offsetHeight;
      n.style.bottom = Math.max(0, deck.clientHeight - bottomEdge + 10) + "px";
      n.style.left = (card.offsetLeft + wrap.offsetLeft + wrap.offsetWidth / 2) + "px";
    }
    // Undo is centered over the Reveal button (its width changes with the label, so measure it).
    function placeUndo() {
      const u = document.getElementById("undoBtn");
      const wrap = document.querySelector(".verse-wrap");
      const rv = document.querySelector("#cardBody .btn-reveal-all");
      if (!u || !wrap || !rv) return;
      const wr = wrap.getBoundingClientRect(), rr = rv.getBoundingClientRect();
      if (!rr.width) return;
      u.style.right = "auto";
      u.style.left = Math.round(rr.left + rr.width / 2 - wr.left - u.offsetWidth / 2) + "px";
    }
    window.addEventListener("resize", placeUndo);
    try {
      new MutationObserver(placeUndo).observe(document.getElementById("cardBody"), { childList: true, subtree: true, characterData: true });
    } catch (e) {}
    try {
      new MutationObserver(placeNotice).observe(document.getElementById("toastNotice"), { childList: true, characterData: true, subtree: true });
    } catch (e) {}

    function showRankUp(fromG, toG, restored) {
      const el = document.getElementById("toastNotice");
      el.textContent = "";
      el.classList.add("levelup");
      clearTimeout(showRankUp.t);
      // Stays up about 1.5 s after the next card appears (the card changes after 1.2 s, or 1.7 s for the top rank).
      showRankUp.t = setTimeout(function() {
        el.classList.remove("levelup");
        if (el.querySelector(".rank-badge")) el.textContent = ""; // leave any newer message alone
      }, (toG >= 8 ? 1700 : 1200) + 1500);
      if (restored) {
        el.appendChild(document.createTextNode("Restored to "));
      } else if (fromG >= 0) {
        el.appendChild(makePill(fromG));
        const a = document.createElement("span");
        a.className = "rank-arrow";
        a.textContent = "→";
        el.appendChild(a);
      }
      el.appendChild(makePill(toG, toG >= 8 ? "pop-big" : "pop"));
      el.appendChild(document.createTextNode(toG >= 8 ? "  Top rank!" : restored ? "" : "  Level up!"));
    }

    // ── Verse List ──
