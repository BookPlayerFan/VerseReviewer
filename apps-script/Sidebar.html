      const dots = document.querySelectorAll("#cardPips .pip");
      if (!pill || !dots.length || !dots[0].animate) return;
      const pr = pill.getBoundingClientRect(), px = pr.left + pr.width / 2, py = pr.top + pr.height / 2;
      const step = Math.min(110, Math.round(560 / dots.length));
      dots.forEach(function(d, k) {
        const r = d.getBoundingClientRect();
        const dx = Math.round(px - (r.left + r.width / 2)), dy = Math.round(py - (r.top + r.height / 2));
        d.animate([{ transform: "translate(" + dx + "px, " + dy + "px) scale(0.2)", opacity: 0 }, { opacity: 1 }], { duration: 450, delay: delay0 + k * step, easing: "cubic-bezier(0.2, 0.9, 0.3, 1.3)", fill: "both" });
      });
    }
    // A review card's last rep: the full dots lift into the rank badge and disappear; then the rank-up plays.
    function pipsIntoBadge(done) {
      const pips = document.querySelectorAll("#cardPips .pip");
      const pill = document.querySelector("#cardMeta .rank-badge");
      if (!pips.length || !pill || !pips[0].animate) { done(); return; }
      const pr = pill.getBoundingClientRect(), px = pr.left + pr.width / 2, py = pr.top + pr.height / 2;
      pips.forEach(function(p, k) {
        const r = p.getBoundingClientRect();
        const dx = Math.round(px - (r.left + r.width / 2)), dy = Math.round(py - (r.top + r.height / 2));
        p.animate([{ transform: "translate(0px, 0px) scale(1.15)", opacity: 1 }, { transform: "translate(" + dx + "px, " + dy + "px) scale(0.2)", opacity: 0 }], { duration: 300, delay: k * 70, easing: "ease-in", fill: "forwards" });
      });
      setTimeout(done, 300 + (pips.length - 1) * 70 + 40);
    }
    // Every dot is full: they turn green one after another in a wave, the pill flashes green, then it all settles back. Runs about 1.7 seconds.
    const PIP_FINALE_MS = 1700;
    function pipFinale() {
      const pips = document.getElementById("cardPips");
      const list = pips.querySelectorAll(".pip");
      if (!list.length) return;
      list.forEach(function(p, k) { p.style.setProperty("--k", k); });
      pips.classList.add("fin");
      const pill = document.querySelector("#cardMeta .rank-badge");
      if (pill) pill.classList.add("fin-pill");
      setTimeout(function() { pips.classList.remove("fin"); if (pill) pill.classList.remove("fin-pill"); }, PIP_FINALE_MS + 200);
    }

    // The Treasury bar on the Review Complete screen: total points and the rank bar; tapping it opens the Treasury.
    function renderEndOfDayScreen() {
      const cardEl = document.getElementById("activeCard");
      const summaryEl = document.getElementById("summaryView");
      const progressFill = document.getElementById("sessionProgressFill");

      cardEl.style.display = "none";
      summaryEl.style.display = "flex";
      closeTrBox();
      document.getElementById("summaryIcon").style.display = "";
      setSummaryButtons(false, false);
      renderTomorrowNote();
      progressFill.style.width = "100%";

      // Both end-of-day screens start at the same height, so the trophy / sparkle and title line up.
      document.getElementById("summaryView").classList.add("top");
      document.getElementById("flawlessBadge").style.display = "none";
      if (totalCardsProcessed === 0) {
        document.getElementById("summaryIcon").textContent = "✨";
        document.getElementById("summaryIcon").className = "sum-ico";
        document.getElementById("summaryTitle").textContent = "All Caught Up!";
        document.getElementById("summarySubtitle").textContent = "No verses are due for review right now.";
        document.getElementById("summaryStats").style.display = "none";
        updateStatLists();
      } else {
        document.getElementById("summaryIcon").textContent = "\u2713";
        document.getElementById("summaryIcon").className = "sum-ico ok";
        document.getElementById("summaryTitle").textContent = "Review Complete!";
        document.getElementById("summarySubtitle").textContent = "You have finished all verses scheduled for today.";
        document.getElementById("summaryStats").style.display = "grid";

        document.getElementById("statReviewed").textContent = sessionStats.reviewed;
        paintPts(sessionStats.pts || 0);
        document.getElementById("statFailed").textContent = sessionStats.failed;
        // A day with reviews and no repeats gets the gold badge.
        updateStatLists();
        // Count up only when the numbers actually changed; clearing a same-day repeat or evening card leaves them as they were.
        const sig = [sessionStats.reviewed, sessionStats.passed, sessionStats.pts || 0, sessionStats.failed].join("|");
        // The gold badge pops in once the numbers finish counting; with no count-up it is simply there.
        let counting = false;
        if (countUpPending) {
          countUpPending = false;
          if (sig !== lastCountUpSig) { counting = true; runCountUp(); }
        }
        lastCountUpSig = sig;
        if (!counting) showFlawlessBadge(false);
      }
    }

    // When you finish the deck, the four numbers count up one after another (once; reopening the app shows them straight away).
    // Gold "Perfect Day" badge: reviewed something and no repeats. animate = pop in like a badge earned.
    function showFlawlessBadge(animate) {
      const el = document.getElementById("flawlessBadge");
      el.classList.remove("pop");
      if (!(sessionStats.reviewed > 0 && sessionStats.failed === 0)) { el.style.display = "none"; return; }
      el.style.display = "block";
      if (animate) { void el.offsetWidth; el.classList.add("pop"); }
    }

    // The Treasury box: points added today (+3, 0, or \u22122 after misses). Gold above +5.
    function fmtPts(v) { return v > 0 ? "+" + v : (v < 0 ? "\u2212" + (-v) : "0"); }
    function paintPts(v) {
      const el = document.getElementById("statGraduated");
      el.textContent = fmtPts(v);
      el.classList.toggle("neg", v < 0);
      document.getElementById("statGradBox").classList.toggle("gold", v >= 10);
    }
    const SUMMARY_SETTLE_MS = 800, PUMP_MS = 2000, PILL_COUNT_MS = 1500, BADGE_DELAY_MS = 1200;
    function pillRepaint() { const p = document.getElementById("trPill"); if (p && p.style.display !== "none") paintTreasuryPill(knownTreasury()); }
    // The pill takes today's points: it swells gently with a soft glow while its total counts to the new number, then settles back.
    function pumpPoints(pts, token) {
      trFreeze = null;
      const pill = document.getElementById("trPill"), total = knownTreasury();
      const b = pill && pill.style.display !== "none" ? pill.querySelector("b") : null;
      if (!b || typeof total !== "number") { pillRepaint(); return; }
      const base = total - pts, t0 = Date.now(), up = pts > 0;
      const glow = up ? "0 0 10px 1px color-mix(in srgb, var(--text-accent) 22%, transparent)" : "0 0 0 0 transparent", none = "0 0 0 0 transparent";
      const sc = up ? 1.08 : 1.04;
      if (pill.animate) pill.animate([
        { transform: "translateX(-50%) scale(1)", boxShadow: none },
        { transform: "translateX(-50%) scale(" + sc + ")", boxShadow: glow, offset: 0.25 },
        { transform: "translateX(-50%) scale(" + sc + ")", boxShadow: glow, offset: 0.75 },
        { transform: "translateX(-50%) scale(1)", boxShadow: none }
      ], { duration: PUMP_MS, easing: "ease-in-out" });
      if (up) { b.style.transition = "color .3s"; b.style.color = "var(--text-accent)"; }
      (function step() {
        if (token !== countUpToken) { b.style.color = ""; pillRepaint(); return; }
        const x = Math.min(1, (Date.now() - t0) / PILL_COUNT_MS);
        b.textContent = Math.round(base + pts * (1 - Math.pow(1 - x, 3))).toLocaleString("en-US");
        if (x < 1) { setTimeout(step, 33); return; }
        b.style.color = "";
        pillRepaint();
      })();
    }
    function runCountUp() {
      const pts = sessionStats.pts || 0;
      const items = [
        ["statReviewed", sessionStats.reviewed],
        ["statGraduated", pts], ["statFailed", sessionStats.failed]
      ];
      const show = function(id, v) { document.getElementById(id).textContent = id === "statGraduated" ? fmtPts(v) : v; };
      const gold = document.getElementById("statGradBox");
      const token = ++countUpToken;
      // The numbers wait (showing 0) until the screen has fully settled, then count up a little slower; a big number does not drag on (capped at 1.8 s).
      // Order: Reviewed, then Treasury points; then the pill at the top pumps and its total counts up (or down) by those points; only then do the Missed count and the badge come.
      const GAP = 200, start = Date.now() + SUMMARY_SETTLE_MS;
      const pumpOn = pts !== 0 && typeof knownTreasury() === "number";
      const plan = []; let t = 0, pumpAt = -1, endAt = 0;
      items.forEach(function(it) {
        const d = it[1] > 0 ? Math.min(1800, 1000 + it[1] * 50) : (it[0] === "statGraduated" && it[1] < 0 ? 900 : 0);
        plan.push({ id: it[0], v: it[1], from: t, d: d });
        t += d + (d > 0 ? GAP : 0);
        if (it[0] === "statGraduated" && pumpOn) { pumpAt = t; t += PUMP_MS + 250; }
      });
      endAt = t;
      if (pumpOn) { trFreeze = pts; pillRepaint(); }
      plan.forEach(function(p) { show(p.id, 0); });
      document.getElementById("statGraduated").classList.toggle("neg", pts < 0);
      gold.classList.remove("gold");
      const flawlessEl = document.getElementById("flawlessBadge");
      flawlessEl.classList.remove("pop");
      flawlessEl.style.display = "none";
      let pumped = false;
      function finish() {
        plan.forEach(function(p) { show(p.id, p.v); });
        gold.classList.toggle("gold", pts >= 10);
        if (trFreeze !== null) { trFreeze = null; pillRepaint(); }
        if (token === countUpToken) showFlawlessBadge(false);
      }
      (function tick() {
        const summary = document.getElementById("summaryView");
        if (token !== countUpToken || summary.style.display === "none") { finish(); return; }
        const now = Date.now() - start;
        plan.forEach(function(p) {
          let v;
          if (now < p.from) v = 0;
          else if (p.d === 0 || now >= p.from + p.d) v = p.v;
          else { const x = (now - p.from) / p.d; v = Math.round(p.v * (1 - Math.pow(1 - x, 3))); }
          show(p.id, v);
        });
        if (pumpOn && !pumped && now >= pumpAt) { pumped = true; pumpPoints(pts, token); }
        gold.classList.toggle("gold", (parseInt(document.getElementById("statGraduated").textContent, 10) || 0) >= 10);
        if (now < endAt) { setTimeout(tick, 33); return; }
        setTimeout(function() { if (token === countUpToken && summary.style.display !== "none") showFlawlessBadge(true); }, BADGE_DELAY_MS);   // a beat before the badge pops in
      })();
    }

    // Remember a verse for the Repeats / Leveled Up lists with the level it now sits at
    // (a verse recorded twice is listed once).
    // A repeat verse passed (Clear) at least once today.
    function noteCleared(ref) {
      if (!Array.isArray(sessionStats.clearedRefs)) sessionStats.clearedRefs = [];
      if (!Array.isArray(sessionStats.doneRefs)) sessionStats.doneRefs = [];
      const has = sessionStats.clearedRefs.some(function(r) { return (typeof r === "string" ? r : r.f) === ref; });
      if (!has) sessionStats.clearedRefs.push(ref);
    }

    function wasMissedToday(ref) {
      return (Array.isArray(sessionStats.failedRefs) ? sessionStats.failedRefs : []).some(function(r) { return (typeof r === "string" ? r : r.f) === ref; });
    }

    // True once every verse in Repeats has been cleared at least once.
    function allRepeatsCleared() {
      const failed = Array.isArray(sessionStats.failedRefs) ? sessionStats.failedRefs : [];
      if (!failed.length) return false;
      const cleared = (sessionStats.clearedRefs || []).map(function(r) { return typeof r === "string" ? r : r.f; });
      return failed.every(function(r) { return cleared.indexOf(typeof r === "string" ? r : r.f) >= 0; });
    }

    // Treasury points: the total, and what each verse gave or took today (a verse that nets to 0 drops out of the list).
    function notePts(ref, delta, g) {
      sessionStats.pts = (sessionStats.pts || 0) + delta;
      if (!Array.isArray(sessionStats.ptsRefs)) sessionStats.ptsRefs = [];
      const list = sessionStats.ptsRefs;
      const at = list.findIndex(function(x) { return x.f === ref; });
      if (at < 0) { list.push({ f: ref, g: g, d: delta }); return; }
      list[at].d += delta; list[at].g = g;
      if (list[at].d === 0) list.splice(at, 1);
    }

    function recordStatRef(key, ref, g) {
      if (!Array.isArray(sessionStats[key])) sessionStats[key] = [];
      const list = sessionStats[key];
      for (let i = 0; i < list.length; i++) {
        const f = typeof list[i] === "string" ? list[i] : list[i].f;
        if (f === ref) { list[i] = { f: ref, g: g }; return; }
      }
      list.push({ f: ref, g: g });
    }

    const STAT_LISTS = {
      fail: { key: "failedRefs", box: "statFailBox", title: "Missed", count: "failed" },
      grad: { key: "ptsRefs", box: "statGradBox", title: "Treasury", count: "pts" },
      done: { key: "doneRefs", box: "statRevBox", title: "Reviewed", count: "reviewed" }
    };
    let openStatList = null;

    // Verses for a list, highest level first, then Bible order.
    // Verse text for a reference, from today's deck (or the Verses list if it has been opened).
    function verseInfoFor(ref) {
      let v = "", txt = "";
      for (let i = queue.length - 1; i >= 0; i--) {
        if (queue[i].reference === ref && queue[i].text) { v = queue[i].version || ""; txt = queue[i].text; break; }
      }
      if (!txt && Array.isArray(vlVerses)) {
        const m = vlVerses.find(function(x) { return x.f === ref; });
        if (m) { v = m.v || ""; txt = m.t || m.x || ""; }
      }
      if (/^\(No verse text found/.test(txt)) txt = "";
      const words = txt.replace(/\[\d+\]/g, " ").replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
      const w = words.slice(0, 3).join(" ") + (words.length > 3 ? "\u2026" : "");
      return { v: v, t: txt, w: w };
    }

    // Days from today until a verse's next review, from the Verses list (null when that list has not arrived or the verse is not in it).
    function dueDaysOf(ref) {
      for (let i = 0; i < vlVerses.length; i++) if (vlVerses[i].f === ref) return typeof vlVerses[i].d === "number" ? vlVerses[i].d : null;
      return null;
    }
    // Times a verse has been missed (column A of the sheet, counted from sync-379 on), from the Verses list; null until that list has arrived.
    function missOf(ref) {
      for (let i = 0; i < vlVerses.length; i++) if (vlVerses[i].f === ref) return typeof vlVerses[i].m === "number" ? vlVerses[i].m : null;
      return null;
    }
    // What each Review Complete list shows on the right of its rows, and where its words and days come from.
    function statRowOpt(kind) {
      return {
        text: function(v) { return plainVerse(verseInfoFor(v.f).t); },
        ver: function(v) { return verseInfoFor(v.f).v; },
        days: function(v) { return dueDaysOf(v.f); },
                right: function(v) {
          if (kind === "done") {
            const n = dueDaysOf(v.f);
            return n === null ? null : vlEl("span", "vr-nx" + (n <= 0 ? " now" : ""), vlDueShort(n));
          }
          if (kind === "grad") return v.d ? vlEl("span", "vr-pts " + (v.d > 0 ? "up" : "down"), fmtPts(v.d)) : null;
          const m = missOf(v.f);
          return m ? vlEl("span", "vr-ms", "\u00d7" + m) : null;
        }
      };
    }
    function statItems(kind) {
      const raw = Array.isArray(sessionStats[STAT_LISTS[kind].key]) ? sessionStats[STAT_LISTS[kind].key] : [];
      const items = raw.map(function(r) {
        const f = typeof r === "string" ? r : String((r && r.f) || "");
        const g = (r && typeof r === "object" && Number.isInteger(r.g)) ? Math.max(0, Math.min(8, r.g)) : null;
        return { f: f, g: g, p: parseRef(f), d: (r && typeof r === "object" && Number.isInteger(r.d)) ? r.d : 0 };
      }).filter(function(it) { return it.f; });
      if (kind === "done") items.forEach(function(it) { it.n = dueDaysOf(it.f); });
      items.sort(function(a, b) {
        if (kind === "done" && a.n !== b.n) return (a.n === null ? 999999 : a.n) - (b.n === null ? 999999 : b.n);   // soonest next review first
        if (kind === "grad" && (a.d < 0) !== (b.d < 0)) return a.d < 0 ? -1 : 1;   // lost points first so they are not hidden below the scroll, then the biggest gains
        if (kind === "grad" && a.d !== b.d) return Math.abs(b.d) - Math.abs(a.d);
        const ga = a.g === null ? -1 : a.g, gb = b.g === null ? -1 : b.g;
        return (gb - ga) || (a.p.book - b.p.book) || (a.p.chapter - b.p.chapter) || (a.p.verse - b.p.verse);
      });
      return items;
    }

    // Tapping Repeats or Leveled Up shows the verses behind the number; the other box closes.
    function updateStatLists() {
      Object.keys(STAT_LISTS).forEach(function(k) {
        const box = document.getElementById(STAT_LISTS[k].box);
        box.classList.toggle("tappable", ((k === "fail" || k === "done") && (sessionStats[STAT_LISTS[k].count] || 0) > 0) || statItems(k).length > 0);
        box.classList.remove("open");
      });
      document.getElementById("statFailBox").classList.toggle("cleared", allRepeatsCleared());
      openStatList = null;
      const list = document.getElementById("failList");
      list.style.display = "none";
      list.innerHTML = "";
    }

    // Starts a practice round: the held repeats join the deck as Repeat / Clear cards. Nothing is written to the sheet.
    function startPractice() {
      if (isScoring || heldCount() === 0) return;
      queue.forEach(function(c) { if (c.isHeld) c.isHeld = false; });
      practicing = true;
      enqueueSubmit(null, snapshot(currentIndex));
      render();
    }

    // Another trip through the same repeat verses (the latest copy of each). The server is told this is not a score.
    function practiceAgain() {
      if (isScoring || heldCount() > 0) return;
      const failed = Array.isArray(sessionStats.failedRefs) ? sessionStats.failedRefs : [];
      const fresh = [];
      failed.forEach(function(r) {
        const ref = typeof r === "string" ? r : r.f;
        for (let i = queue.length - 1; i >= 0; i--) {
          if (queue[i].isRepeat && queue[i].reference === ref) {
            fresh.push(Object.assign({}, queue[i], { isRepeat: true, isHeld: false }));
            return;
          }
        }
      });
      if (!fresh.length) return;
      fresh.forEach(function(c) { queue.push(c); });
      practicing = true;
      const st = snapshot(currentIndex);
      st.practice = true;
      enqueueSubmit(null, st);
      render();
    }

    function canPracticeAgain() {
      if (heldCount() > 0 || !allRepeatsCleared()) return false;
      return queue.some(function(c) { return c.isRepeat; });
    }

    function resortDone() { openStatList = null; toggleStatList('done', true); }   // the dates just arrived: draw the list again in the new order
    function toggleStatList(kind, noLoad) {
      if (kind === "grad" && ptsHeld && ptsHeld()) return;   // the hold just opened the points peek
      const cfg = STAT_LISTS[kind];
      const items = statItems(kind);
      const list = document.getElementById("failList");
      const missing = (kind === "fail" || kind === "done") ? Math.max(0, (sessionStats[cfg.count] || 0) - items.length) : 0;
      if (!items.length && !missing) return;
      closeTrBox();
      Object.keys(STAT_LISTS).forEach(function(k) { document.getElementById(STAT_LISTS[k].box).classList.remove("open"); });
      if (openStatList === kind) {
        openStatList = null;
        list.style.display = "none";
        return;
      }
      openStatList = kind;
      document.getElementById(cfg.box).classList.add("open");
      list.innerHTML = "";
      const head = document.createElement("div");
      head.className = "fail-head";
      const held = kind === "fail" ? heldCount() : 0;
      if (held > 0) {
        const pb = document.createElement("button");
        pb.type = "button";
        pb.textContent = (held === 1 ? "Practice this verse" : held <= 4 ? "Practice these " + held : "Practice all " + held) + " \u203A";
        pb.onclick = startPractice;
        head.appendChild(pb);
      } else if (kind === "fail" && canPracticeAgain()) {
        const pb = document.createElement("button");
        pb.type = "button";
        pb.textContent = "Practice again \u203A";
        pb.onclick = practiceAgain;
        head.appendChild(pb);
      } else {
        const title = document.createElement("span");
        title.className = "fail-title";
        title.textContent = cfg.title;
        head.appendChild(title);
        if (kind === "grad") {
          const gain = items.reduce(function(a, it) { return a + (it.d > 0 ? it.d : 0); }, 0), loss = items.reduce(function(a, it) { return a + (it.d < 0 ? -it.d : 0); }, 0);
          const sum = document.createElement("span");
          sum.className = "fail-title pts-sum";
          if (gain) { const g = document.createElement("span"); g.className = "up"; g.textContent = "+" + gain + " gained"; sum.appendChild(g); }
          if (loss) { const l = document.createElement("span"); l.className = "down"; l.textContent = "\u2212" + loss + " lost"; sum.appendChild(l); }
          head.appendChild(sum);
        }
      }
      const inner = document.createElement("div");
      inner.className = "fail-inner";
      vrReset(inner);
      const opt = statRowOpt(kind);
      items.forEach(function(it) { inner.appendChild(vrRow(inner, it.f, it, opt)); });
      if (missing) {
        const note = document.createElement("div");
        note.className = "fail-note";
        note.textContent = items.length
          ? "+ " + missing + " earlier today (names weren't saved)"
          : "Names weren't saved for today's earlier reviews. New ones will be listed.";
        inner.appendChild(note);
      }
      list.appendChild(head);
      list.appendChild(inner);
      list.style.display = "block";
      // fresh dates and miss counts: the Reviewed list is drawn again in the new order, the others just redraw their rows
      if (!noLoad) loadVlVerses(function(changed) {
        if (openStatList !== kind) return;
        if (kind === "done" && changed) resortDone();
        else { const inn = document.querySelector("#failList .fail-inner"); if (inn) vrRefresh(inn); }
      }, function() {});
      endCue(inner, "End \u00b7 " + items.length + (items.length === 1 ? " verse" : " verses"));
    }

    // Refresh: saves anything pending, then asks the server for the current session.
    // If today's deck is finished the server starts a new batch of due cards (today's stats carry over).
    function restartSession() {
      if (isFetching || isRefreshing) return;
      isRefreshing = true;
      showSummaryNotice("");
      setSummaryBusy(true, pendingCount() > 0 ? "Saving…" : "Loading…");
      if (submitFailed) retrySubmit();
      whenWritesSettled(function() {
        isRefreshing = false;
        isFetching = true;
        google.script.run
          .withSuccessHandler(function(session) {
            isFetching = false;
            if (!session || !Array.isArray(session.cards)) {
              renderLoadError("The server returned no session data.");
              return;
            }
            adoptSession(session);
          })
          .withFailureHandler(function(err) {
            isFetching = false;
            renderLoadError((err && err.message) ? err.message : String(err || "Unknown error"));
          })
          .refreshSession();
      });
    }

    // "Add New Verse": opens a short list of unassigned verses; tapping one starts learning it.
    let pickerItems = [];

    let pickerLoading = false;
    let pickerToken = 0;
    let pickerAddOpen = false;   // the list of waiting verses is behind the Add Verse button; this is true while that list is up
    function openAddList() {   // the waiting verses, from the "Choose from your list" row (the Add Verse button itself goes straight to pasting)
      if (pickerLoading || pickerItems.length === 0) return;
      pickerAddOpen = true; renderPicker();
      const wr = document.getElementById("ipWaiting"); if (wr && wr.scrollIntoView) wr.scrollIntoView({ block: "nearest" });   // keep the row and the start of its list in view
    }
    function closeAddList() { pickerAddOpen = false; renderPicker(); }
    function addNewVerse() { openPicker(false); }
    // The New tab with no card showing: the same page, as the tab itself (the tab bar stays; no Cancel).
    function openNewPage() {
      const pk = document.getElementById("picker");
      if (pk.classList.contains("open") && !pk.classList.contains("held")) { renderPicker(); return; }   // already up: just refresh it
      if (pk.classList.contains("open")) return;                                                         // the hold version is up over it
      openPicker(true);
    }
    function openPicker(inline) {
      const btn = document.getElementById("btnAddVerse");
      if (!inline && (!btn || btn.disabled)) return;
      if (pickerLoading) return;
      pickerAddOpen = false;
      showSummaryNotice("");
      // open right away; the list fills in when the sheet answers
      const token = ++pickerToken;
      pickerLoading = true;
      pickerItems = [];
      addNote("");
      document.getElementById("pickerNote").textContent = "";
      const pk = document.getElementById("picker");
      pk.classList.add("inline");                    // always sits above the tab bar (the tab bar stays visible)
      pk.classList.toggle("held", !inline);          // opened by holding the New tab over a card: keeps its Cancel
      pk.classList.add("open");
      renderPicker();
      google.script.run
        .withSuccessHandler(function(list) {
          pickerLoading = false;
          if (token !== pickerToken) return;
          pickerItems = Array.isArray(list) ? list : [];
          renderPicker();
        })
        .withFailureHandler(function(err) {
          pickerLoading = false;
          if (token !== pickerToken) return;
          if (document.getElementById("picker").classList.contains("held")) closePicker();
          showSummaryNotice("Couldn't load verses: " + ((err && err.message) || err), true);
        })
        .listUnassigned();
    }


    // ── Paste a new verse ──
    // Tapping "Paste verse" reads the clipboard and shows what it understood in a popup (reference, version, text) with
    // Add / Edit / Cancel. If the phone won't let the page read the clipboard, a paste box opens instead; pasting into it
    // shows the same popup. The reference can be the first line ("Romans 8:35-37 ESV"), the last line ("— John 3:16 ESV"),
    // or at the start of a single line.
    const REF_RX = "((?:[1-3]\\s?)?[A-Za-z]+(?:\\s+(?:of\\s+)?[A-Za-z]+){0,2}\\s+\\d+(?::\\d+(?:\\s?[-–—]\\s?\\d+)?)?)";
    function splitRefVersion(head) {
      head = String(head || "").replace(/[–—]/g, "-").replace(/\s*-\s*/g, "-").replace(/\s+/g, " ").trim()
        .replace(/^[\s"'“”‘’\-]+|[\s"'“”‘’\-]+$/g, "");
      let ver = "";
      const m = head.match(/^(.*\S)[\s,]+\(?([A-Za-z][A-Za-z0-9]{1,7})\)?$/);
      if (m && /\d/.test(m[1])) { head = m[1].replace(/[,\s]+$/, ""); ver = m[2].toUpperCase(); }
      return { head: head, ver: ver };
    }
    function looksLikeRef(h) { return /\d/.test(h) && /^[1-3]?\s?[A-Za-z]/.test(h) && h.length <= 60; }
    function cleanBody(t) {
      return String(t || "").replace(/\s+/g, " ").trim().replace(/^[“"]\s*/, "").replace(/\s*[”"]$/, "").trim();
    }
    function parsePasted(raw) {
      const lines = String(raw || "").replace(/\r/g, "").split("\n").map(function(l) { return l.trim(); });
      while (lines.length && !lines[0]) lines.shift();
      while (lines.length && !lines[lines.length - 1]) lines.pop();
      if (!lines.length) return { empty: true };
      function done(rv, body, needsWords) {
        const text = cleanBody(body);
        if (!looksLikeRef(rv.head)) return null;
        if (needsWords && text.split(" ").length < 4) return null; // one line: don't mistake "ESV" or a stray word for the verse text
        if (!text) return { error: "I found the reference but no verse text." };
        return { ref: rv.head.replace(/^\s*psalms?(?=[\s\d]|$)/i, "Psalms"), ver: rv.ver || "ESV", defaultVer: !rv.ver, text: text };   // "Psalm 23:1" is saved as "Psalms 23:1"
      }
      // 1. reference on the first line, text below
      if (lines.length > 1) {
        const a = done(splitRefVersion(lines[0]), lines.slice(1).join(" "));
        if (a) return a;
        // 2. reference on the last line (e.g. "— John 3:16 ESV"), text above
        const b = done(splitRefVersion(lines[lines.length - 1]), lines.slice(0, -1).join(" "));
        if (b) return b;
      }
      // 3. one block of text: reference first, then text on the same line ("John 3:16 ESV For God so loved…")
      const all = lines.join(" ").replace(/\s+/g, " ");
      let m = all.match(new RegExp("^" + REF_RX + "\\s*\\(?([A-Za-z]{2,6})?\\)?\\s*[:\\-–—]?\\s+(.+)$"));
      if (m) {
        const ver = (m[2] && /^[A-Z0-9]+$/.test(m[2].toUpperCase()) && m[2].length <= 5) ? m[2] : "";
        const body = ver ? m[3] : ((m[2] ? m[2] + " " : "") + m[3]);
        const c = done({ head: splitRefVersion(m[1]).head, ver: ver.toUpperCase() }, body, true);
        if (c) return c;
      }
      // 4. text first, reference at the end on the same line
      m = all.match(new RegExp("^(.+?)\\s*[–—\\-~]\\s*" + REF_RX + "\\s*\\(?([A-Za-z]{2,6})?\\)?\\s*$"));
      if (m) {
        const d = done({ head: splitRefVersion(m[2]).head, ver: (m[3] || "").toUpperCase() }, m[1], true);
        if (d) return d;
      }
      return { error: "I couldn't find a reference. Put it on the first line, like Romans 8:35-37 ESV." };
    }

    let pasteParsed = null;

    function openPaste(prefill, note) {
      document.getElementById("pasteText").value = prefill || "";
      pasteLastLen = (prefill || "").length;
      pasteParsed = null; pasteShown = "";
      document.getElementById("pasteChoices").classList.remove("on");
      const pn = document.getElementById("ppNote"); pn.textContent = ""; pn.className = "pp-note";
      const hint = document.getElementById("pasteHint");
      hint.textContent = note || "";
      hint.className = note ? "paste-hint bad" : "paste-hint";
      document.getElementById("pasteModal").classList.add("open");
      if (prefill) updatePasteHint();
      // Focus right here, while the tap that opened the box is still in progress: iPhone only raises the keyboard
      // for a focus that comes straight from a tap (a delayed focus leaves a blinking cursor and no typing).
      try {
        const t = document.getElementById("pasteText");
        t.focus();
        const n = t.value.length; t.setSelectionRange(n, n);
      } catch (e) {}
    }

    function closePaste() {
      document.getElementById("pasteModal").classList.remove("open");
    }

    // The paste box opens right away (so the keyboard and iPhone's Paste suggestion work). There is no Paste button: the clipboard cannot be read inside the app frame.
    function startPaste() { openPaste(); }

    // Text just landed in the paste box: check it at once.
    function pasteLanded() {
      setTimeout(function() {
        const p = parsePasted(document.getElementById("pasteText").value);
        updatePasteHint();
        if (!p.error && !p.empty) { try { document.getElementById("pasteText").blur(); } catch (e) {} }   // pasted and understood: the keyboard goes away, the choices are showing
      }, 30);
    }

    let pasteShown = "";
    // The verse was understood: the choices appear in the same box (Learn now or Add to queue, Save for later).
    function showPasteChoices(p) {
      pasteParsed = p;
      const note = document.getElementById("ppNote");
      note.textContent = ""; note.className = "pp-note";
      document.getElementById("ppAdd").disabled = false;
      // one new verse at a time: while one is in Learn the only choice is Save for later (it goes to the waiting list)
      const busy = haveVerseInLearn(), ch = document.getElementById("pasteChoices");
      document.getElementById("ppLearn").style.display = busy ? "none" : "";
      ch.classList.toggle("solo", busy);
      ch.classList.add("on");
    }
    function hidePasteChoices() {
      pasteParsed = null; pasteShown = "";
      document.getElementById("pasteChoices").classList.remove("on");
      document.getElementById("ppNote").textContent = "";
    }

    function addFromPaste(learn) {
      const p = pasteParsed;
      if (!p) return;
      const note = document.getElementById("ppNote");
      const btn = document.getElementById("ppAdd"), lbtn = document.getElementById("ppLearn");
      const lWas = lbtn.disabled;
      btn.disabled = true; lbtn.disabled = true;
      if (learn === true) { note.textContent = "Saving and starting\u2026"; note.className = "pp-note"; }
      addParsedVerse(p, function(res, msg) {
        btn.disabled = false; lbtn.disabled = lWas;
        if (res) {
          closePaste();
          hidePasteChoices();
        } else {
          note.textContent = msg;
          note.className = "pp-note bad";
        }
      }, learn === true);
    }

    // iPhone's keyboard "Paste from ..." suggestion inserts text without sending a paste event, so a big jump in
    // length in one go is treated as a paste too.
    let pasteLastLen = 0;
    function onPasteInput(e) {
      const v = document.getElementById("pasteText").value;
      const jump = v.length - pasteLastLen;
      pasteLastLen = v.length;
      if (jump >= 12) { pasteLanded(); return; }
      updatePasteHint();
    }

    function updatePasteHint() {
      const el = document.getElementById("pasteHint");
      const p = parsePasted(document.getElementById("pasteText").value);
      el.textContent = "";
      if (p.empty) { el.className = "paste-hint"; hidePasteChoices(); return; }   // nothing yet: just the box
      if (p.error) { el.textContent = p.error; el.className = "paste-hint bad"; hidePasteChoices(); return; }
      const ck = document.createElement("span"); ck.className = "ck"; ck.textContent = "\u2713"; el.appendChild(ck);
      const t = document.createElement("span"); t.className = "ph-t";
      const b = document.createElement("b"); b.textContent = p.ref; t.appendChild(b);
      const vb = document.createElement("span"); vb.className = "version-badge"; vb.textContent = p.ver; t.appendChild(vb);
      el.appendChild(t);
      el.className = "paste-hint ok";
      const sig = p.ref + "|" + p.ver + "|" + p.text;
      if (sig !== pasteShown) { pasteShown = sig; showPasteChoices(p); } else pasteParsed = p;   // the same text again: keep the choices as they are
    }

    // Saves the verse to the sheet (it joins the waiting list in the picker).
    function addParsedVerse(p, cb, learn) {
      if (learn && adding) { cb(false, "One moment, a verse is still being added."); return; }
      if (learn) { adding = true; addT0 = Date.now(); addNote((haveVerseInLearn() ? "Adding " : "Starting ") + p.ref + "\u2026"); }
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success && learn) {
            cb(true);
            if (res.startFailed) {   // saved, but the server could not start it
              pickerItems = pickerItems.filter(function(x) { return x.f !== res.reference; });
              pickerItems.unshift({ r: res.rowIndex || 2, f: res.reference, v: "", t: "", d: 0, a: "", n: 1 });
              renderPicker();
              adding = false;
              addNote("Saved to your list, but it didn't start: " + res.startFailed, true);
            } else {
              finishAdd(res, "Saved to your list, but ");
            }
          } else if (res && res.success) {
            cb(true);
            addNote("");
            document.getElementById("pickerNote").textContent = "Added " + res.reference + " (waiting in your list)";
            google.script.run
              .withSuccessHandler(function(list) { if (Array.isArray(list)) { pickerItems = list; renderPicker(); } })
              .listUnassigned();
          } else {
            adding = false;
            cb(false, (res && res.message) || "Couldn't add that verse.");
          }
        })
        .withFailureHandler(function(err) { if (learn) adding = false; cb(false, "Couldn't add: " + ((err && err.message) || err)); })
        .addPastedVerse(p.ref, p.ver, p.text, learn === true);
    }

    function closePicker() {
      pickerToken++; pickerLoading = false; pickerAddOpen = false;
      const pk = document.getElementById("picker");
      pk.classList.remove("open"); pk.classList.remove("inline"); pk.classList.remove("held");
    }

    // The New tab's page (also what holding the New tab shows over a card): In progress cards on top (the one on screen is outlined, a queued verse is dashed),
    // then, only after Add Verse is tapped, the verses you can add (with a Paste row first). The Add Verse button is pinned below the list.
    function renderPicker() {
      const box = document.getElementById("pickerList");
      box.textContent = "";
      // Lock cards first, then the Learn card, then the queue (the card order on the New tab itself is still Learn first)
      const prog = learningCards.concat(learningHeld.slice().sort(function(a, b) { return a.unlockAt - b.unlockAt; }))
        .map(function(c, i) { return { c: c, i: i }; })
        .sort(function(x, y) { return ((x.c.stage === 'lock' ? 0 : 1) - (y.c.stage === 'lock' ? 0 : 1)) || (x.i - y.i); })
        .map(function(x) { return x.c; });
      const onScreen = mode === 'learning' && !isScoring && learningCards[learningIndex] ? learningCards[learningIndex].reference : "";
      const head = function(text, gap) {
        const h = document.createElement("div"); h.className = "ip-head" + (gap ? " gap" : ""); h.textContent = text; box.appendChild(h);
      };
      const qd = learnQueue.slice();
      if (prog.length || qd.length) {
        head("In progress", false);
        prog.forEach(function(c) {
          const b = document.createElement("button"); b.type = "button"; b.className = "ip-item" + (c.reference === onScreen ? " here" : "");
          const main = document.createElement("span"); main.className = "ip-main";
          const r = document.createElement("span"); r.className = "ip-ref"; r.textContent = c.reference; main.appendChild(r);
          const isLock = c.stage === 'lock';
          const w = document.createElement("span"); w.className = "ip-when";
          w.appendChild(document.createTextNode((isLock ? "Lock" : "Learn") + (!isLock && c.verseCount > 1 ? " \u00b7 " + stepWord(c) + " " + c.verseIndex + " of " + c.verseCount : "")));
          const total = isLock ? 2 : 7, now = isLock ? (c.lockPart === 'pm' ? 2 : 1) : (c.dot || 1);
          const pips = document.createElement("span"); pips.className = "ip-pips" + (lateLevel(c) ? " late" : "");
          for (let i = 1; i <= total; i++) { const d = document.createElement("i"); d.className = i < now ? "f" : i === now ? "c" : ""; pips.appendChild(d); }
          w.appendChild(pips);
          main.appendChild(w);
          b.appendChild(main);
          const chip = document.createElement("span"); chip.className = "ip-chip" + (isLocked(c) ? "" : " open"); chip.textContent = progressWhen(c); b.appendChild(chip);
          b.onclick = function() { if (c.reference === onScreen) closePicker(); else viewLearnCard(c.reference); };   // the one on screen: back to it
          box.appendChild(b);
        });
        // Verses waiting for the Learn slot, in the order they were added: tapping one takes it back out of the queue
        qd.forEach(function(f) {
          const b = document.createElement("button"); b.type = "button"; b.className = "ip-item queued";
          const main = document.createElement("span"); main.className = "ip-main";
          const r = document.createElement("span"); r.className = "ip-ref"; r.textContent = f; main.appendChild(r);
          const w = document.createElement("span"); w.className = "ip-when"; w.textContent = (learnQueue.indexOf(f) === 0 ? "Next up" : "Queued #" + (learnQueue.indexOf(f) + 1)) + " \u00b7 tap to remove"; main.appendChild(w);
          b.appendChild(main);
          const chip = document.createElement("span"); chip.className = "ip-chip"; chip.textContent = "Queued"; b.appendChild(chip);
          b.onclick = function() { unqueueVerse(f); };
          box.appendChild(b);
        });
      }
      const bar = document.getElementById("npBar"); if (bar) bar.style.display = "";   // Add Verse stays on screen
      // verses waiting in your list: one quiet row under the in-progress and queued ones; tapping it opens the list right below it (tap again to fold it up)
      if (!pickerLoading && pickerItems.length) {
        const wb = document.createElement("button"); wb.type = "button"; wb.className = "ip-item waiting" + (pickerAddOpen ? " open" : ""); wb.id = "ipWaiting";
        const wm = document.createElement("span"); wm.className = "ip-main";
        const wr = document.createElement("span"); wr.className = "ip-ref"; wr.textContent = "Choose from your list"; wm.appendChild(wr);
        wb.appendChild(wm);
        const wc = document.createElement("span"); wc.className = "ip-chip"; wc.textContent = pickerAddOpen ? "Hide" : pickerItems.length + " waiting"; wc.appendChild(document.createElement("i")).className = "chev"; wb.appendChild(wc);
        wb.onclick = pickerAddOpen ? closeAddList : openAddList;
        box.appendChild(wb);
      }
      if (!pickerAddOpen) {
        if (!prog.length && !qd.length) {
          const e = document.createElement("div"); e.className = "ip-none"; e.textContent = "Nothing in progress. Tap Add Verse to paste one."; box.appendChild(e);   // no Loading line here: the list loads quietly and shows its own once opened
        }
        return;
      }
      if (!pickerItems.length && !pickerLoading) { pickerAddOpen = false; return renderPicker(); }
      const panel = document.createElement("div"); panel.className = "ip-panel"; panel.id = "ipPanel"; box.appendChild(panel);
      if (pickerLoading) {
        const e = document.createElement("div"); e.className = "picker-empty"; e.textContent = "Loading verses\u2026"; panel.appendChild(e);
        return;
      }
      // Oldest added first. Verses added on the same day (the sheet only keeps the date) go in Bible order; verses with no date go last.
      const ordered = pickerItems.slice().sort(function(x, y) {
        const ax = x.a || "9999", ay = y.a || "9999";
        if (ax !== ay) return ax < ay ? -1 : 1;
        const px = parseRef(x.f), py = parseRef(y.f);   // same day: Bible order
        return (px.book - py.book) || (px.chapter - py.chapter) || (px.verse - py.verse) || (x.r || 0) - (y.r || 0);
      });
      const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      ordered.forEach(function(it) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "picker-item";
        const main = document.createElement("span");
        main.className = "pk-main";
        const ref = document.createElement("span");
        ref.className = "pk-ref";
        ref.textContent = it.f;
        main.appendChild(ref);
        const n = Math.max(1, Number(it.n) || 1);
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(it.a || "");
        const sub = document.createElement("span");
        sub.className = "pk-added";
        sub.textContent = (m ? "Added " + MON[Number(m[2]) - 1] + " " + Number(m[3]) + " \u00b7 " : "") + n + (n === 1 ? " part" : " parts");
        main.appendChild(sub);
        b.appendChild(main);
        const add = document.createElement("span");
        add.className = "pk-parts";
        add.textContent = "Add";
        b.appendChild(add);
        const heldItem = attachLongPress(b, function() { showPreview(it, true, true); });
        b.onclick = function() { if (heldItem()) return; showPreview(it); };
        panel.appendChild(b);
      });
    }

    // Tapping a verse in the list previews its text; adding is a separate button.
    // Fills a verse popup (reference, version badge, text with verse numbers); alwaysVer shows the badge even for ESV.
    function fillVersePopup(refId, verId, textId, it, alwaysVer) {
      document.getElementById(refId).textContent = it.f;
      const ver = (it.v || "").trim();
      const vb = document.getElementById(verId);
      if (ver && (alwaysVer || ver.toUpperCase() !== "ESV")) { vb.textContent = ver; vb.style.display = "inline-flex"; } else { vb.style.display = "none"; }
      fillVerseText(document.getElementById(textId), it);
    }

    // mode "delete" (press and hold in the Choose a verse list): the popup offers Delete instead of Add.
    function showPreview(it, noAdd, canDelete) {
      fillVersePopup("pvRef", "pvVer", "pvText", it, !!canDelete);   // the delete view always shows the version pill
      document.getElementById("pvCard").classList.toggle("delmode", !!canDelete);
      const addBtn = document.getElementById("pvAdd");
      addBtn.style.display = (noAdd || canDelete) ? "none" : "";
      // one new verse at a time: while one is on the New tab, the Add button says Add to queue
      const haveNew = haveVerseInLearn();
      addBtn.disabled = false;
      addBtn.textContent = haveNew ? "Add to queue" : "Add";   // one verse in Learn at a time: the next ones wait in the queue and start by themselves
      addBtn.onclick = function() { closePreview(); chooseVerse(it); };
      const del = document.getElementById("pvDel"), note = document.getElementById("pvNote");
      note.textContent = "";
      note.className = "pp-note";
      del.disabled = false;
      if (canDelete) {
        let armed = false;
        del.style.display = "";
        del.classList.remove("armed");
        del.textContent = "Delete";
        del.onclick = function() {
          if (!armed) { // first tap asks, second tap deletes
            armed = true; del.textContent = "Tap again to delete"; del.classList.add("armed");
            return;
          }
          deletePickerVerse(it, del, note);
        };
      } else {
        del.style.display = "none"; del.onclick = null;
      }
      document.getElementById("pickerPreview").classList.add("open");
    }

    function deletePickerVerse(it, del, note) {
      del.disabled = true; del.textContent = "Deleting…";
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            closePreview();
            pickerItems = pickerItems.filter(function(x) { return x.f !== it.f; });
            renderPicker();
          } else {
            del.disabled = false; del.textContent = "Delete"; del.classList.remove("armed");
            note.textContent = (res && res.message) ? res.message : "Couldn't delete that verse.";
            note.className = "pp-note bad";
          }
        })
        .withFailureHandler(function(err) {
          del.disabled = false; del.textContent = "Delete"; del.classList.remove("armed");
          note.textContent = "Couldn't delete: " + ((err && err.message) || err);
          note.className = "pp-note bad";
        })
        .deleteUnassignedVerse(it.r, it.f);
    }

    function closePreview() {
      document.getElementById("pickerPreview").classList.remove("open");
    }

    // Takes a verse back out of the queue: it returns to the Add new list.
    function unqueueVerse(ref) {
      learnQueue = learnQueue.filter(function(f) { return f !== ref; });
      renderPicker();
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && Array.isArray(res.queue)) learnQueue = res.queue.slice();
          google.script.run.withSuccessHandler(function(list) { if (Array.isArray(list)) { pickerItems = list; renderPicker(); } }).listUnassigned();
        })
        .withFailureHandler(function() { renderPicker(); })
        .unqueueVerse(ref);
    }
    // A message about adding a verse. Progress ("Starting ...") shows in the Choose a verse page while it is up (it is a loading state); a problem is an amber banner.
    function addNote(msg, isError) {
      if (isError) {
        const pn = document.getElementById("pickerNote"); pn.textContent = ""; pn.style.color = "";
        toastBanner(msg, true, 5000);
      } else if (document.getElementById("picker").classList.contains("open")) {
        const el = document.getElementById("pickerNote");
        el.textContent = msg || "";
        el.style.color = msg ? "var(--text-meta)" : "";
      } else if (msg) toastBanner(msg, false, 3000);
    }
    // One call answers both the save and the start, and carries the started card, so the page shows it at once (no reload of the whole session).
    function finishAdd(res, failPrefix) {
      adding = false; pickerAddOpen = false;
      if (res && res.success && addT0) { const t = new Date(); diag.add = (Date.now() - addT0) + " ms \u00b7 " + t.getHours() + ":" + ("0" + t.getMinutes()).slice(-2) + (res.card ? "" : " (queued)"); }
      addT0 = 0;
      if (res && res.success && res.queued && !res.started) {
        learnQueue = Array.isArray(res.queue) ? res.queue.slice() : learnQueue.concat([res.reference]);
        pickerItems = pickerItems.filter(function(x) { return x.f !== res.reference; });
        if (document.getElementById("picker").classList.contains("open")) { addNote(""); renderPicker(); } else showSummaryNotice("Added " + res.reference + " to the queue");
      } else if (res && res.success && res.card) {
        if (Array.isArray(res.queue)) learnQueue = res.queue.slice();
        const c = res.card;
        viewRef = null;
        learningCards = learningCards.filter(function(x) { return x.reference !== c.reference; });
        learningHeld = learningHeld.filter(function(x) { return x.reference !== c.reference; });
        learningCards.push(c);
        sortLearning();
        const want = res.started || res.reference;
        const at = learningCards.findIndex(function(x) { return x.reference === want; });
        learningIndex = at >= 0 ? at : 0;
        pickerItems = pickerItems.filter(function(x) { return x.f !== res.reference; });
        addNote("");
        closePicker();
        if (mode !== 'learning') setMode('learning'); else render();
        postCache();
        schedulePushSync("learn");   // the day's Learn reminders for the new card
      } else if (res && res.success) {
        // an older server answered without a card: reload the session, then jump to the verse
        addNote("");
        closePicker();
        enterLearningAfterLoad = res.started || res.reference;
        restartSession();
      } else {
        const m = (res && res.message) ? res.message : "Couldn't add that verse.";
        addNote(failPrefix ? failPrefix + "it didn't start: " + m : m, true);
      }
    }
    let adding = false, addT0 = 0;
    function chooseVerse(it, failPrefix) {
      if (adding) return;
      const queueing = haveVerseInLearn();   // Learn is busy: the verse joins the queue and the list stays open
      adding = true; addT0 = Date.now();
      // The Choose a verse page stays up until the answer is back, so nothing else shows in between.
      addNote(queueing ? "Adding to the queue\u2026" : "Starting " + it.f + "\u2026");
      google.script.run
        .withSuccessHandler(function(res) { finishAdd(res, failPrefix); })
        .withFailureHandler(function(err) {
          adding = false;
          addNote((failPrefix ? failPrefix + "it didn't start: " : "Error adding verse: ") + ((err && err.message) || err), true);
        })
        .addChosenVerse(it.r, it.f);
    }

    window.addEventListener("keydown", function(e) {
      // Never act while typing in a box, or with Cmd/Ctrl/Alt held (browser shortcuts).
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const key = e.key.toLowerCase();
      const helpEl = document.getElementById("helpModal");
      if (helpEl.classList.contains("open")) {
        if (e.key === "?" || e.key === "Escape") { e.preventDefault(); toggleHelp(false); }
        return;
      }
      // Not while a popup is open
      const popupOpen = ["picker", "pickerPreview", "pasteModal", "undoConfirm", "vlLegend", "searchView"].some(function(id) {
        return document.getElementById(id).classList.contains("open");
      });
      if (popupOpen) return;
      if (e.key === "?") { e.preventDefault(); toggleHelp(true); return; }
      // Shortcuts are for the Review cards only: not the New screen, not over the Verse List
      if (mode === "learning") return;
      if (document.getElementById("verseListView").classList.contains("open")) return;
      if (e.code === "Space") {
        e.preventDefault();
        handleContainerClick(e);
      } else if (key === "r") {
        e.preventDefault();
        toggleRevealAll(e);
      } else if (key === "d") {
        scoreCard("Fail");
      } else if (key === "f") {
        scoreCard("Pass");
      } else if (key === "z") {
        undoLast();
      }
    });

    // One sheet: the status readout with its Test notification and Reload buttons. A two-finger tap anywhere in the app (or the ? key) shows or hides it.
    let notif = null, notifOpen = false;
    function toggleHelp(open) {
      open = !!open;
      diagOn = open;
      document.getElementById("helpModal").classList.toggle("open", open);
      if (open) { renderDiag(); loadNotif(); }
    }
    // What the server has set to go out today, and whether the pieces that send it are in place (so the phone can say it, not the spreadsheet).
    function loadNotif() {
      notif = null; renderDiag();
      google.script.run
        .withSuccessHandler(function(r) { notif = r && r.ok ? r : { failed: true }; renderDiag(); })
        .withFailureHandler(function() { notif = { failed: true }; renderDiag(); })
        .notifStatus();
    }
    function renderNotif() {
      const el = document.getElementById("notifList");
      if (!el) return;
      el.textContent = "";
      if (!notif || notif.failed || !notif.pending.length) {
        const n = document.createElement("div"); n.className = "st-note";
        n.textContent = !notif ? "Checking\u2026" : notif.failed ? "Couldn't check right now." : "Nothing else to send today.";
        el.appendChild(n);
        return;
      }
      notif.pending.forEach(function(p) {
        const r = document.createElement("div"); r.className = "st-row st-sub";
        const t = document.createElement("span"); t.textContent = new Date(p.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        const b = document.createElement("b"); b.textContent = p.text;
        r.appendChild(t); r.appendChild(b); el.appendChild(r);
      });
    }

    // A quick tap with two fingers, neither moving far (a pinch or a two-finger scroll does not count).
    (function() {
      let t0 = 0, p0 = null;
      document.addEventListener("touchstart", function(e) {
        if (e.touches.length === 2) { t0 = Date.now(); p0 = [[e.touches[0].clientX, e.touches[0].clientY], [e.touches[1].clientX, e.touches[1].clientY]]; }
        else if (e.touches.length > 2) t0 = 0;
      }, { passive: true, capture: true });
      document.addEventListener("touchmove", function(e) {
        if (!t0 || e.touches.length !== 2) return;
        for (let i = 0; i < 2; i++) if (Math.abs(e.touches[i].clientX - p0[i][0]) > 24 || Math.abs(e.touches[i].clientY - p0[i][1]) > 24) { t0 = 0; return; }
      }, { passive: true, capture: true });
      document.addEventListener("touchend", function(e) {
        if (!t0) return;
        const quick = Date.now() - t0 < 400; t0 = 0;
        if (quick && e.touches.length <= 1) toggleHelp(!document.getElementById("helpModal").classList.contains("open"));
      }, { passive: true, capture: true });
      document.addEventListener("touchcancel", function() { t0 = 0; }, { passive: true, capture: true });
    })();

    // ───────────── Staying in sync with your other device ─────────────
    // We ask the server whether the session has moved on: when you come back to the app,
    // when the window gains focus, on a tap after a pause, and every few seconds.

    let shellInfo = null;   // what the home-screen page says about itself (when this icon first opened, whether the key is saved)
    function renderDiag() {
      const el = document.getElementById("diagText");
      if (!el || !diagOn) return;
      el.textContent = "";
      const row = function(label, value, cls) {
        const r = document.createElement("div"); r.className = "st-row";
        const l = document.createElement("span"); l.textContent = label;
        const v = document.createElement("b"); v.textContent = value; if (cls) v.className = cls;
        r.appendChild(l); r.appendChild(v); el.appendChild(r);
      };
      row("Page", CLIENT_BUILD + (updateReady ? " \u00b7 update waiting" : ""), updateReady ? "bad" : "");
      if (diag.expects && "sync-" + diag.expects !== CLIENT_BUILD) row("Server expects", "sync-" + diag.expects, "bad");
      row("Server", serverBuild || "?");
      row("Last verse add", diag.add || "none yet");
      row("Button got stuck", diag.stuck || "never", diag.stuck ? "bad" : "ok");
      row("Session", "v" + sessionVersion + " \u00b7 " + (sessionDate || "no date"));
      row("Last check", (diag.checkedAt || "never") + (diag.result ? " \u00b7 " + diag.result : ""));
      if (diag.error) row("Error", diag.error, "bad");
      row("Loaded", (diag.adopted || "never") + (initialSession && initialSession.ms !== undefined ? " \u00b7 " + initialSession.ms + " ms" : ""));
      if (initialSession && initialSession.ph) row("Server time", initialSession.ph + " (ms)");
      row("Queued saves", pendingCount() + (submitFailed ? " (failing)" : ""), pendingCount() === 0 && !submitFailed ? "ok" : "bad");
      if (shellInfo) {
        row("This icon since", shellInfo.first ? new Date(shellInfo.first).toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + new Date(shellInfo.first).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "?");
        row("Access key", (shellInfo.key ? "saved" : "not saved") + (shellInfo.works ? "" : " (storage blocked)"), shellInfo.key ? "ok" : "bad");
      }
      const nr = !notif ? ["checking\u2026", ""] : notif.failed ? ["couldn't check", "bad"] : !notif.key ? ["push key not set", "bad"] :
        notif.trigger === false ? ["daily trigger missing", "bad"] : ["on \u00b7 " + notif.pending.length + " waiting today", "ok"];
      row("Notifications", nr[0], nr[1]);
      const last = el.lastChild;
      last.classList.add("st-tap"); last.setAttribute("role", "button"); last.setAttribute("aria-expanded", notifOpen ? "true" : "false");
      const caret = document.createElement("i"); caret.className = "st-caret" + (notifOpen ? " open" : ""); caret.textContent = "\u203a";
      last.firstChild.appendChild(caret);
      last.onclick = function() { notifOpen = !notifOpen; renderDiag(); };
      if (notifOpen) { const nl = document.createElement("div"); nl.id = "notifList"; el.appendChild(nl); renderNotif(); }
    }

    // Sends a test push through the server (from the status panel).
    function sendTestPush() {
      const b = document.getElementById("diagTest");
      if (!b || b.disabled) return;
      b.disabled = true; b.textContent = "Sending\u2026";
      function done(msg) { b.textContent = msg; setTimeout(function() { b.disabled = false; b.textContent = "Test notification"; }, 4000); }
      google.script.run
        .withSuccessHandler(function(r) { done(r && r.ok ? "Sent \u2713" : "Failed: " + ((r && r.message) || "unknown")); })
        .withFailureHandler(function(err) { done("Failed: " + ((err && err.message) || err)); })
        .sendTestPush();
    }

    // Hold the Verses tab (from any tab) for the legend of combined chips. A plain tap switches to the Verses tab.
    let versesTabHeld = null;
    function onVersesTabClick() {
      if (versesTabHeld && versesTabHeld()) return;   // the click that follows a hold is not a tap
      goTab("verses");
    }
    versesTabHeld = attachLongPress(document.getElementById("tabVerses"), openVlLegend);

    function noteCheck(result, error) {
      diag.checkedAt = new Date().toLocaleTimeString();
      diag.result = result;
      diag.error = error || "";
      renderDiag();
    }

    function syncCheck() {
      if (document.visibilityState === "hidden") return;
      openDueCards();
      if (submitFailed && !inFlight) retrySubmit();
      if (hintPending && !hintSendTimer) sendHint();
      if (isFetching || isRefreshing || isScoring || pendingCount() > 0) return;

      if (!loadedAt) {
        restartSession(); // the last load failed; try again
        return;
      }

      lastCheckAt = Date.now();
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res) { noteCheck("empty reply"); return; }
          if (res.build) serverBuild = res.build;
          if (res.client) noteClientBuild(res.client);
          if (res.hint) applyServerHint(res.hint, true);
          if (!res.changed) { noteCheck("up to date"); return; }
          noteCheck("changed on server, loading");
          // Re-check: the user may have started scoring while the request was in flight.
          if (isFetching || isRefreshing || isScoring || pendingCount() > 0) return;
          isFetching = true;
          google.script.run
            .withSuccessHandler(function(session) {
              isFetching = false;
              if (!session || !Array.isArray(session.cards)) { noteCheck("bad session reply"); return; }
              if (isScoring || pendingCount() > 0) return;
              adoptSession(session);
              noteCheck("synced");
            })
            .withFailureHandler(function(err) {
              isFetching = false;
              noteCheck("load failed", (err && err.message) || String(err));
            })
            .loadSession();
        })
        .withFailureHandler(function(err) {
          noteCheck("check failed", (err && err.message) || String(err));
        })
        .checkSession(sessionVersion, sessionDate);
    }

    // A tap after a pause checks first, so you catch up before acting.
    function syncIfIdle() {
      if (Date.now() - lastCheckAt > TOUCH_SYNC_GAP_MS) syncCheck();
    }

    document.addEventListener("visibilitychange", syncCheck);
    window.addEventListener("focus", syncCheck);
    window.addEventListener("pageshow", syncCheck);
    document.addEventListener("touchstart", syncIfIdle, { passive: true, capture: true });
    document.addEventListener("mousedown", syncIfIdle, { capture: true });
    setInterval(syncCheck, POLL_MS);
  </script>
</body>
</html>
