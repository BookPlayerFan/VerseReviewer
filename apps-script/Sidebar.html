<!DOCTYPE html>
<html style="color-scheme: light dark;">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-page: #f8f9fa;
      --bg-card: #ffffff;
      --bg-body: #f8f9fa;
      --border-card: #dadce0;
      --border-body: #e8eaed;
      
      --text-primary: #202124;
      --text-muted: #5f6368;
      --text-meta: #70757a;
      --text-accent: #1a73e8;
      --text-repeat: #d97706;
      --text-fasttrack: #b45309;
      --badge-repeat-bg: #fef3c7;
      --badge-fasttrack-bg: #fef3c7;
      --badge-version-bg: rgba(95, 99, 104, 0.12);
      --btn-fail-bg: #fce8e6;
      --btn-fail-text: #c5221f;
      --btn-pass-bg: #e6f4ea;
      --btn-pass-text: #137333;
      --btn-restart-bg: #e8f0fe;
      --btn-restart-text: #1a73e8;
      --badge-pass: #137333;
      --badge-fail: #c5221f;
      --card-shadow: rgba(0, 0, 0, 0.06);

      --spoiler-bg: rgba(120, 120, 120, 0.28);
      --spoiler-blur: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #121212;
        --bg-card: #1e1e1e;
        --bg-body: #28292a;
        --border-card: #38383a;
        --border-body: #3c4043;
        
        --text-primary: #f1f3f4;
        --text-muted: #9aa0a6;
        --text-meta: #9aa0a6;
        --text-accent: #8ab4f8;
        --text-repeat: #fbbf24;
        --text-fasttrack: #fcd34d;
        --badge-repeat-bg: #451a03;
        --badge-fasttrack-bg: #451a03;
        --badge-version-bg: rgba(255, 255, 255, 0.12);
        --btn-fail-bg: #4a1d1b;
        --btn-fail-text: #f28b82;
        --btn-pass-bg: #133a22;
        --btn-pass-text: #81c995;
        --btn-restart-bg: #1e3a5f;
        --btn-restart-text: #8ab4f8;
        --badge-pass: #81c995;
        --badge-fail: #f28b82;
        --card-shadow: rgba(0, 0, 0, 0.4);

        --spoiler-bg: rgba(255, 255, 255, 0.22);
        --spoiler-blur: 8px;
      }
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      scrollbar-width: none;
    }
    /* No scroll bars anywhere; everything still scrolls. */
    *::-webkit-scrollbar { display: none; width: 0; height: 0; }

    html, body {
      -webkit-text-size-adjust: 100%;   /* iOS must not enlarge the text on its own (it can after the app wakes up) */
      text-size-adjust: 100%;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
      background-color: var(--bg-page);
    }

    body {
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      padding-top: max(env(safe-area-inset-top, 0px), 8px);
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 12px);
      padding-left: max(env(safe-area-inset-left, 0px), 12px);
      padding-right: max(env(safe-area-inset-right, 0px), 12px);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: var(--border-card);
      border-radius: 2px;
      margin-bottom: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--text-accent);
      border-radius: 2px;
      transition: width 0.25s ease;
    }

    #deckContainer {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
    }

    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 16px 14px 12px 14px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 14px var(--card-shadow);
      will-change: opacity;
      box-sizing: border-box;
      min-height: 0;
    }

    .card-header-group {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ref-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 3px;
      line-height: 1.2;
    }

    .ref-header {
      font-size: 23px;
      font-weight: 700;
      color: var(--text-accent);
      text-align: center;
    }

    .version-badge {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      background: var(--badge-version-bg);
      border: 1px solid var(--border-body);
      padding: 2px 5px;
      border-radius: 5px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      line-height: 1;
      pointer-events: none;
    }

    .meta-tag {
      text-align: center;
      font-size: 12px;
      color: var(--text-meta);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    /* Rank badge shown under the verse reference: Bronze > Silver > Gold > ... > Diamond */
    .rank-badge {
      --rc: var(--rl);
      display: inline-block;
      padding: 2px 0;
      min-width: 86px; /* same width for every rank */
      text-align: center;
      text-transform: uppercase;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.9px;
      color: var(--rc);
      border: 1px solid var(--rc);
      background: transparent;
    }
    @supports (background: color-mix(in srgb, red 10%, transparent)) {
      .rank-badge {
        background: color-mix(in srgb, var(--rc) 14%, transparent);
        border-color: color-mix(in srgb, var(--rc) 40%, transparent);
      }
    }
    .rank-badge.is-new { --rc: var(--text-meta); font-weight: 700; }
    /* a Lock card's pill: blue, with a padlock, so it reads differently from Learn */
    .rank-badge.is-new.is-lock { --rc: var(--text-accent); background: color-mix(in srgb, var(--text-accent) 12%, transparent); }
    .rank-badge .lk-ic { width: 10px; height: 10px; fill: currentColor; vertical-align: -1px; margin-right: 4px; }
    @keyframes rankGlow {
      0%   { box-shadow: 0 0 0 0 var(--rc); }
      60%  { box-shadow: 0 0 14px 5px color-mix(in srgb, var(--rc) 45%, transparent); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    @keyframes luSettle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    .lu-settle { animation: luSettle 0.55s ease-out 0.45s both; }
    /* Rank-up extras, by rank: a glow of the rank colour around the card (Silver+), a light sweep (Platinum+),
       drifting sparkles (Emerald+) and a second sweep (Diamond). The button fills with the rank colour at the start. */
    @keyframes luPulse {
      0%   { box-shadow: 0 0 0 0 transparent; }
      35%  { box-shadow: 0 0 0 2px color-mix(in srgb, var(--rc) 70%, transparent), 0 0 34px 8px color-mix(in srgb, var(--rc) 42%, transparent); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .lu-glow { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 8; opacity: 0; will-change: opacity;
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--rc) 70%, transparent), 0 0 34px 8px color-mix(in srgb, var(--rc) 42%, transparent);
      animation: luGlow 1.2s ease-out 0.3s both; }
    @keyframes luGlow { 0% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 0; } }
    .lu-sweepbox { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; z-index: 9; transform: translateZ(0); isolation: isolate; -webkit-mask-image: -webkit-radial-gradient(white, black); }
    .lu-sweepbox i { position: absolute; top: -10%; bottom: -10%; left: 0; width: 38%; opacity: 0.8; will-change: transform; backface-visibility: hidden;
      transform: translate3d(-110%, 0, 0) skewX(-18deg);
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent);
      animation: luSweep 0.9s cubic-bezier(0.3, 0.1, 0.4, 1) both; animation-delay: var(--sw, 0.6s); }
    @media (prefers-color-scheme: dark) { .lu-sweepbox i { opacity: 0.35; } }
    :root[data-theme="dark"] .lu-sweepbox i { opacity: 0.35; }
    :root[data-theme="light"] .lu-sweepbox i { opacity: 0.8; }
    @keyframes luSweep { 0% { transform: translate3d(-110%, 0, 0) skewX(-18deg); } 100% { transform: translate3d(310%, 0, 0) skewX(-18deg); } }
    .lu-twk { position: absolute; color: var(--rc); pointer-events: none; z-index: 9; opacity: 0; animation: luTwk 1.2s ease-in-out both; }
    @keyframes luTwk { 0%, 100% { opacity: 0; transform: scale(0.4); } 50% { opacity: 1; transform: scale(1); } }
    .lu-btnmorph { transition: background 0.35s ease, color 0.35s ease; background: var(--rc) !important; color: #fff !important; }
    @media (prefers-color-scheme: dark) { .lu-btnmorph { color: #0b1a33 !important; } }
    :root[data-theme="dark"] .lu-btnmorph { color: #0b1a33 !important; }
    :root[data-theme="light"] .lu-btnmorph { color: #fff !important; }
    .lu-fx { position: relative; display: inline-block; --rc: var(--rl); }
    @media (prefers-color-scheme: dark) { .lu-fx { --rc: var(--rd); } }
    .lu-ring { position: absolute; inset: -1px; border-radius: 999px; border: 2px solid var(--rc); opacity: 0; pointer-events: none;
      animation: luRing 0.8s ease-out forwards; animation-delay: var(--rd2, 0.22s); }
    @keyframes luRing { 0% { transform: scale(0.95); opacity: 0.85; } 100% { transform: scale(1.22, 1.75); opacity: 0; } }
    .lu-spark { position: absolute; left: 50%; top: 50%; font-size: 11px; line-height: 1; color: var(--rc); opacity: 0; pointer-events: none; will-change: transform, opacity; }
    .lu-spark.dot { font-size: 6px; }

    /* Verse List screen (reuses the full-screen sheet used by the verse picker) */
    .vl-row:active, .picker-item:active, .picker-close:active, .vl-verse:active { transform: none; filter: none; }
    .vl-row, .picker-close { transition: none; }
    .vl-row .chev { transition: transform 0.15s ease; }
    .vl-total { font-size: 13px; color: var(--text-muted); margin: 0; }
    /* Hold a book: a small preview bubble over a dimmed map. */
    .pk-dim { position: fixed; inset: 0; z-index: 55; background: rgba(0, 0, 0, 0.32); animation: pkFade 0.2s ease; }
    .pk-tile { position: fixed; z-index: 58; margin: 0; pointer-events: none; transform: scale(1.18); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); background-color: var(--bg-card); }
    .pk-bubble { position: fixed; left: 30px; right: 30px; z-index: 60; background: var(--bg-card); color: var(--text-primary); border-radius: 18px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.32);
      overflow: hidden; animation: pkPop 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
    .pk-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 8px; font-size: 17px; font-weight: 800; }
    .pk-h span { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    @keyframes pkFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pkPop { from { opacity: 0; transform: scale(0.82); } to { opacity: 1; transform: none; } }
    .tr-mini { display: flex; gap: 8px; margin-top: 12px; }
    .tr-mini > div { flex: 1; text-align: center; padding: 6px 4px 7px; border: 1px solid var(--border-card); border-radius: 10px; line-height: 1.15; }
    .tr-mini b { display: block; font-size: 16px; font-weight: 800; color: var(--text-primary); }
    .tr-mini span { font-size: 10.5px; color: var(--text-meta); }
    /* a book opens as a nearly full-screen card that fades in right over the map, and fades back out to it */
    #upcomingView.open { animation: bkIn 0.2s ease-out; }
    #upcomingView.closing { animation: bkOut 0.16s ease-in forwards; }
    #searchView.open { animation: pkFade 0.18s ease-out; }
    #searchView.closing { animation: skOut 0.15s ease-in forwards; }
    @keyframes skOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes bkIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes bkOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(0.97); } }
    .bk-dim { position: fixed; left: 0; right: 0; top: 0; bottom: var(--tab-h); z-index: 41; background: rgba(0, 0, 0, 0.34); opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .bk-dim.on { opacity: 1; pointer-events: auto; }
    .vl-due { font-size: 12px; color: var(--text-meta); white-space: nowrap; margin-left: 10px; }
    .vl-due.now { color: var(--text-accent); font-weight: 700; }
    .vl-row { display: flex; align-items: center; justify-content: space-between; width: 100%;
      background: none; border: 0; box-shadow: none; min-height: 0; padding: 12px 4px;
      border-bottom: 1px solid var(--border-card); flex-direction: row; border-radius: 0; text-align: left; }
    .vl-row .vl-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .vl-row .vl-right { display: inline-flex; align-items: center; gap: 8px; }
    .vl-row .vl-count { font-size: 15px; font-weight: 700; color: var(--text-primary); min-width: 22px; text-align: right; }
    .vl-row .load-bar { width: 74px; height: 8px; border-radius: 4px; background: rgba(128, 128, 128, 0.16); overflow: hidden; flex: none; }
    .vl-row .load-bar i { display: block; height: 100%; border-radius: 4px; background: var(--text-accent); opacity: 0.55; }
    .vl-row .load-bar.busy i { background: var(--text-repeat); opacity: 0.9; }
    /* Upcoming reviews: a calendar. Each day shows how many references are due; the shade is the day's word load. */
    .cal-sum { font-size: 12px; color: var(--text-muted); margin: 0 2px 10px; min-height: 15px; }
    .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; margin: 0 0 4px; font-size: 10px; font-weight: 700; color: var(--text-meta); text-align: center; letter-spacing: 0.04em; opacity: 0.8; }
    .cal-wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; }
    #upList { padding: 2px 4px 4px; }
    .cal-s > .cal-d { width: 100%; }
    .cal-s { padding: 3px; min-width: 0; }
    /* a day: its date in the middle on a tile coloured by the day's word load: green for a light day, blue for medium, amber for heavy */
    .cal-d { --h: 0; --rc: var(--text-accent, #1a73e8); position: relative; box-sizing: border-box; height: 50px; min-height: 0; width: auto; padding: 0; border: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; box-shadow: none;
      --fill: transparent; --ink: var(--rc); background: var(--fill); color: var(--ink); }
    /* the 1st of a month, and the first day with reviews after a gap, carry the month's short name above the date; a date in another year (or in January) adds the year below it, like Things */
    .cal-d.lbl { flex-direction: column; font-size: 19px; line-height: 1; }
    .cal-d.lbl.y3 { font-size: 16px; }
    .cal-d .mn { order: -1; font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: 0.01em; line-height: 1; margin-bottom: 1px; color: var(--ink); white-space: nowrap; }
    .cal-d .yy { order: 1; font-style: normal; font-size: 8.5px; font-weight: 700; letter-spacing: 0.03em; line-height: 1; margin-top: 2px; color: var(--ink); opacity: 0.85; }
    .cal-d.s1, .tomorrow-note.s1 { --fill: #d4efdb; --ink: #1b6b36; }
    .cal-d.s2, .tomorrow-note.s2 { --fill: #d0e1fc; --ink: #1a4fa8; }
    .cal-d.s3, .tomorrow-note.s3 { --fill: #f7dcab; --ink: #8a4f00; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cal-d.s1, :root:not([data-theme="light"]) .tomorrow-note.s1 { --fill: #1f4a33; --ink: #8fe0ae; }
      :root:not([data-theme="light"]) .cal-d.s2, :root:not([data-theme="light"]) .tomorrow-note.s2 { --fill: #1f3d6e; --ink: #9cc2ff; }
      :root:not([data-theme="light"]) .cal-d.s3, :root:not([data-theme="light"]) .tomorrow-note.s3 { --fill: #5a4122; --ink: #ffb454; } }
    :root[data-theme="dark"] .cal-d.s1, :root[data-theme="dark"] .tomorrow-note.s1 { --fill: #1f4a33; --ink: #8fe0ae; }
    :root[data-theme="dark"] .cal-d.s2, :root[data-theme="dark"] .tomorrow-note.s2 { --fill: #1f3d6e; --ink: #9cc2ff; }
    :root[data-theme="dark"] .cal-d.s3, :root[data-theme="dark"] .tomorrow-note.s3 { --fill: #5a4122; --ink: #ffb454; }
        /* a day with nothing due is just a faint number */
    .cal-d.z { background: none; color: var(--text-meta); font-size: 18px; font-weight: 500; opacity: 0.5; pointer-events: none; }
    .cal-d.past { opacity: 0.22; }
    .cal-d.today { box-shadow: 0 0 0 2px var(--bg-card), 0 0 0 3.5px var(--text-accent); }
    .cal-d.today.z { opacity: 1; color: var(--text-accent); font-weight: 700; }
    .cal-d:active { transform: none; filter: none; }
    .cal-d.pk-tile { position: fixed; z-index: 58; margin: 0; opacity: 1; pointer-events: none; transform: scale(1.12); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); }
    .cal-d.sk { animation: skPulse 1.1s ease-in-out infinite; }
    @keyframes skPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    .cal-gap { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 0; margin: 6px 0 6px; padding: 8px 0; font-size: 11.5px; font-weight: 600; color: var(--text-meta); }
    .cal-gap::before, .cal-gap::after { content: ""; flex: 1; height: 1px; background: var(--border-card); }
    .pk-bubble.pk-explain { top: 60px; left: 20px; right: 20px; padding: 6px 0; }
    .pk-x { display: flex; align-items: center; gap: 14px; padding: 12px 18px; font-size: 14px; color: var(--text-primary); }
    .pk-x + .pk-x { border-top: 1px solid var(--border-card); }
    .pk-x > span { flex: none; width: 74px; display: flex; gap: 4px; justify-content: center; }
    .pk-x .cal-d { width: 30px; height: 30px; font-size: 13px; border-radius: 8px; pointer-events: none; }
    .pk-x b { font-weight: 700; }
    .pk-x small { display: block; font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    /* End of a list: a divider with "End" after the last row, always, so every list ends the same way; and a soft fade at the bottom edge while a scrolling list has more below. */
    .end-mark { display: flex; align-items: center; gap: 10px; padding: 12px 14px 14px; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; pointer-events: none; }
    .end-mark i { flex: 1; height: 1px; background: var(--border-card); }
    .scrolls::after { content: ""; display: block; position: sticky; bottom: 0; height: 30px; margin-top: -30px; pointer-events: none; background: linear-gradient(to bottom, transparent, var(--fade, var(--bg-card))); opacity: 0; transition: opacity .15s; }
    .scrolls.more::after { opacity: 1; }
    .fail-inner { --fade: var(--bg-body); }
    .pk-bubble.pk-day { left: 14px; right: 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; border-radius: 20px; }
    .pk-day .pk-h { padding: 18px 20px 12px; align-items: center; gap: 12px; }
    .pk-day .pk-h .pk-m { display: grid; grid-template-columns: auto auto; column-gap: 5px; align-items: baseline; line-height: 1.3; }   /* reviews and volume: two small rows on the right, level with the date; the numbers line up in one column, the labels in the next */
    .pk-m b { text-align: right; font-weight: 800; color: var(--text-primary); }
    .pk-m i { font-style: normal; text-align: left; font-weight: 600; }
    .pk-day .pk-v { color: var(--text-accent); font-weight: 800; }
    .pk-day .pk-v.neg { color: var(--btn-fail-text); }
    .pk-day .pk-v.tot { color: var(--text-primary); }
    .vl-row.zero .vl-count { color: var(--text-meta); font-weight: 500; }
    .vl-row .chev { color: var(--text-meta); font-size: 18px; line-height: 1; transition: transform 0.15s ease; }
    .vl-row.open .chev { transform: rotate(90deg); }
    .vl-verses { border-bottom: 1px solid var(--border-card); padding: 0; }
    .vl-verse { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 8px 14px;
      font-size: 15px; color: var(--text-primary); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .vl-verse .vl-ref { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .vl-verse, .verse-body { -webkit-touch-callout: none; }
    #verseListView, #upcomingView, .vl-verse, .vl-row, .tabbar, .tab, #cardBody { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #verseListView input { -webkit-user-select: text; user-select: text; }
    .vl-verse.lp-down, .picker-item.lp-down { background: var(--btn-restart-bg); }
    /* Peek: the first words swap in over the reference (the rank pill stays), wiping in with a soft edge */
    .vl-peek { position: absolute; z-index: 9; top: 50%; margin-top: -15px; height: 30px; display: flex; align-items: center; box-sizing: border-box; padding: 0 2px; overflow: hidden; pointer-events: none;
      white-space: nowrap; font-weight: 700; font-style: italic; color: var(--text-accent); -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
    .peek-hid { visibility: hidden; }
    .vl-pk-date { position: absolute; z-index: 9; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 700; font-style: italic; white-space: nowrap; pointer-events: none; }   /* the next review date, in the rank pill's place while the first words show */
    .vl-peek span { -webkit-mask-image: linear-gradient(90deg, #000 0, #000 72%, transparent 100%); mask-image: linear-gradient(90deg, #000 0, #000 72%, transparent 100%); padding-right: 6px; }
    .ref-wrap { position: relative; display: inline-block; }   /* the version tag hangs off the right, so the reference itself stays centred (review card and popup) */
    .ref-wrap .version-badge { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 6px; white-space: nowrap; }
    .vl-verse + .vl-verse { border-top: 1px solid var(--border-card); }

    .rank-1 { --rl: #a8643a; --rd: #d9945f; }
    .rank-2 { --rl: #7b8794; --rd: #b8c2cc; }
    .rank-3 { --rl: #b88a00; --rd: #f2c94c; }
    .rank-4 { --rl: #5b6b8c; --rd: #aebbd9; }
    .rank-5 { --rl: #2754c5; --rd: #7da2ff; }
    .rank-6 { --rl: #138a55; --rd: #4fd18e; }
    .rank-7 { --rl: #c62847; --rd: #ff7088; }
    .rank-8 { --rl: #0e92b8; --rd: #6fe0ff; }
    @media (prefers-color-scheme: dark) {
      .rank-badge { --rc: var(--rd); }
      .rank-badge.is-new { --rc: var(--text-meta); }
    }

    /* Top ranks get a soft glint that sweeps across the pill now and then:
       Diamond every 3 s, Ruby every 5 s, Emerald (fainter) every 8 s. */
    .rank-badge.rank-6, .rank-badge.rank-7, .rank-badge.rank-8 { position: relative; overflow: hidden; }
    .rank-badge.rank-6::after, .rank-badge.rank-7::after, .rank-badge.rank-8::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 38%; pointer-events: none;
      transform: translateX(-110%);
      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, var(--sh)), transparent);
      animation: rankShimmer var(--per) ease-in-out infinite;
    }
    .rank-badge.rank-8 { --per: 3s; --sh: 0.8; }
    .rank-badge.rank-7 { --per: 5s; --sh: 0.65; }
    .rank-badge.rank-6 { --per: 8s; --sh: 0.45; }
    @media (prefers-color-scheme: dark) {
      .rank-badge.rank-8 { --sh: 0.44; }
      .rank-badge.rank-7 { --sh: 0.36; }
      .rank-badge.rank-6 { --sh: 0.25; }
    }
    @keyframes rankShimmer {
      0%   { transform: translateX(-110%); }
      30%  { transform: translateX(290%); }
      100% { transform: translateX(290%); }
    }

    .meta-tag.is-repeat-badge {
      color: var(--text-repeat);
      font-weight: 700;
      background: var(--badge-repeat-bg);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .meta-tag.is-fasttrack-badge {
      color: var(--text-fasttrack);
      font-weight: 800;
      background: var(--badge-fasttrack-bg);
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.6px;
    }

    .pips-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      min-height: 14px;
    }

    .pip {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border-body);
      border: 1px solid var(--border-card);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    /* a rep filling in: the ring fills solid all at once with a little pop. When every dot is full they turn green one after another in a wave, and the pill flashes green. */
    .pip { position: relative; color: var(--text-accent); }
    .card.ranked .pip { color: var(--rc); }
    .pips-container.late-1 .pip { color: #f59e0b; }
    .pip.pop { animation: pipPop 0.42s ease-out both; }
    .pip.grow { animation: pipGrow 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; animation-delay: calc(var(--k, 0) * 0.14s); }
    @keyframes pipGrow { from { transform: scale(0); opacity: 0; } }
    @keyframes pipPop {
      0% { transform: scale(1.25); background: transparent; border-color: currentColor; }
      38% { transform: scale(1.65); background: currentColor; border-color: currentColor; }
      72% { transform: scale(1.05); background: currentColor; border-color: currentColor; }
      100% { transform: scale(1.15); background: currentColor; border-color: currentColor; }
    }
    .pips-container { position: relative; }
    .pips-container.fin .pip { animation: pipGreen 0.8s ease-out both; animation-delay: calc(var(--k, 0) * 0.08s); }
    @keyframes pipGreen {
      35% { transform: scale(1.55); background: #34c759; border-color: #34c759; box-shadow: 0 0 10px #34c759; }
      70% { transform: scale(1.15); background: #34c759; border-color: #34c759; }
    }
    .rank-badge.fin-pill { animation: pipPill 0.7s ease-out 0.35s both; }
    @keyframes pipPill { 35% { transform: scale(1.22); color: #34c759; box-shadow: 0 0 0 1px #34c759, 0 0 10px rgba(52, 199, 89, 0.45); } }

    /* the rep you are on: a ring; it fills when the rep is done */
    .pip.cur { background: transparent; border-color: var(--text-accent); transform: scale(1.25); box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.22); }
    .pip.filled {
      background: var(--text-accent);
      border-color: var(--text-accent);
      transform: scale(1.15);
      box-shadow: 0 0 5px rgba(26, 115, 232, 0.4);
    }

    /* A New card with a rep waiting: the filled dots turn amber, a gentle reminder (late-2 is no longer used) */
    .pips-container.late-1 .pip.filled { background: #f59e0b; border-color: #f59e0b; box-shadow: 0 0 5px rgba(245, 158, 11, 0.45); }
    .pips-container.late-1 .pip.cur { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25); }
    .pips-container.late-2 .pip.cur { border-color: #e5484d; box-shadow: 0 0 0 2px rgba(229, 72, 77, 0.25); }
    .pips-container.late-2 .pip.filled { background: #e5484d; border-color: #e5484d; box-shadow: 0 0 5px rgba(229, 72, 77, 0.45); }

    /* Fast-Track Glowing Pip */
    .fast-track-pip {
      font-size: 15px;
      line-height: 1;
      color: var(--text-fasttrack);
      filter: drop-shadow(0 0 6px rgba(217, 119, 6, 0.7));
      animation: pulse-glow 1.8s infinite ease-in-out;
      user-select: none;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 9px rgba(217, 119, 6, 1)); }
    }

    .verse-body {
      -webkit-user-select: none;
      user-select: none;
      flex: 1;
      background: var(--bg-body);
      border: 1px solid var(--border-body);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 12px 14px;
      margin-bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      scroll-behavior: smooth;
      box-sizing: border-box;
      cursor: pointer;
      touch-action: pan-y;   /* vertical scrolling only, so sideways swipes reach the page */
    }

    .passage-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0 8px 0;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-body);
      flex-shrink: 0;
    }

    .passage-status {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 15px;
    }
    .hint-flag { display: inline-flex; align-items: center; justify-content: center; color: var(--text-accent); padding: 10px; margin: -10px; transition: opacity .25s; -webkit-tap-highlight-color: transparent; cursor: pointer; }   /* the level number: tap it to step the level; the padding is its tap area */
    .hint-flag.pulse .lvl-n { animation: bulbPulse .5s ease-out; }
    .hint-flag .lvl-n { display: block; position: relative; width: 24px; height: 24px; }
    .hint-flag .lvl-n svg { display: block; width: 24px; height: 24px; }
    .hint-flag .lvl-t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }   /* the digit for screen readers */
    .hint-flag .lvl-n[data-l="2"] { opacity: .9; } .hint-flag .lvl-n[data-l="3"] { opacity: .8; } .hint-flag .lvl-n[data-l="4"] { opacity: .7; } .hint-flag .lvl-n[data-l="5"] { opacity: .58; }
    @keyframes bulbPulse { 40% { transform: scale(1.45); } }
    .v-text.hinted .hz { transition: color .22s ease; }
    body.peek .v-text.hinted .hz, body.peek .v-text.hinted .hu { color: var(--text-primary); }   /* holding the verse: the full words of every verse showing (the one you are learning and any you revealed) fade in, in place */
    body.peek .v-text.hinted .hu::after { opacity: 0; }   /* the dots fade out as the words fade in */
    body.peek .v-text.blurred.cv { filter: none; opacity: 1; background-color: transparent; }   /* ...and with hints off the blurred verse you are learning shows for as long as you hold */
    .passage-status { transition: opacity .16s ease; }
    .passage-status.done { color: #1b7a3a; }   /* "Verse 1 done" while the dots celebrate */
    @media (prefers-color-scheme: dark) { .passage-status.done { color: #7fdca0; } }

    /* 1. Mobile Default Typography (Touchscreens) */
    .passage-stream, .pv-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;   /* the verse popup and the cards share one face */
      font-size: 17.5px;
      line-height: 1.7;
      letter-spacing: 0.1px;
      color: var(--text-primary);
      text-align: justify;
      text-justify: inter-word;
      word-break: normal;
    }

    /* 2. Desktop Override Typography (Mouse / Precision Trackpads) */
    @media (hover: hover) and (pointer: fine) {
      .passage-stream, .pv-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16.5px;
        line-height: 1.7;
        letter-spacing: 0px;
      }
    }

    .verse-unit {
      cursor: pointer;
      display: inline;
    }
    /* A reference learned in parts: one block per part. Parts already learned are green, the one you are on is blue, parts not reached yet are grey.
       The number is a solid bubble with the digit cut out of it (so it never looks like the hint ring in the bar), and the bubble's top is the top of the line. */
    .step-blk { --rail: rgba(150, 150, 150, 0.4); --dot: #8f959b; position: relative; margin: 0 0 8px 6px; padding: 0 0 0 13px; border-left: 3px solid var(--rail); border-radius: 2px; }   /* 22px in all: the bubble hangs out over the card's own padding */
    .step-blk.done { --rail: var(--badge-pass); --dot: var(--badge-pass); }
    .step-blk.on { --rail: var(--text-accent); --dot: var(--text-accent); }
    .step-n { position: absolute; left: -11px; top: 0; width: 19px; height: 19px; box-sizing: border-box; border-radius: 50%; text-align: center;
      font: 800 10.5px/19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: 0;
      background: var(--dot); color: var(--bg-card); }

    .v-num {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-accent);
      vertical-align: super;
      margin-right: 3px;
      margin-left: 3px;
      user-select: none;
      display: inline-block;
    }

    /* phrase letter (a, b, c...) in front of a revealed phrase of a split verse */
    .p-let {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--text-meta);
      vertical-align: super;
      margin: 0 1px 0 0;
      user-select: none;
    }

    /* a long press (the hint hold) must not start iOS's text highlight over the blurred words */
    .passage-stream, .passage-stream .verse-unit, .passage-stream .v-text { -webkit-user-select: none; -webkit-touch-callout: none; }
    .passage-stream ::selection, .passage-stream::selection { background: transparent; color: inherit; }
    .v-text {
      border-radius: 4px;
      padding: 2px 4px;
      transition: filter 0.18s ease, opacity 0.18s ease, background-color 0.18s ease;
    }

    .v-text.blurred {
      filter: blur(var(--spoiler-blur));
      opacity: 0.2;
      background-color: var(--spoiler-bg);
      user-select: none;
    }

    .v-text.revealed {
      filter: none;
      opacity: 1;
      background-color: transparent;
    }

    /* Hint mode (New tab): a revealed phrase shows only its first letters in blue, in the exact spot the full text has.
       The rest of each word keeps its width but is invisible, so the verse does not change size or shift when it is revealed. */
    .v-text.hinted {
      filter: none;
      opacity: 1;
      background-color: transparent;
      color: var(--text-accent);
      user-select: none;
    }
    .day-ring { display: inline-flex; align-items: center; gap: 5px; height: 26px; margin: -6px 0; flex: none; color: var(--text-muted); }   /* the margin keeps this from making the bar taller than the text */
    .day-ring svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; }
    .day-ring .dr-front { fill: var(--bg-card); }
    .day-ring b { font: 500 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .v-text.blurred.pk3 { filter: none; opacity: 1; background-color: transparent; }   /* Review / Lock hold: the first three words unblur in place; the rest stays blurred */
    .pk3-on { animation: pk3in .18s ease; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .pk3-rest { filter: blur(var(--spoiler-blur)); opacity: 0.2; background-color: var(--spoiler-bg); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #cardBody, #cardBody .v-text, #cardBody .v-text * { -webkit-tap-highlight-color: transparent; outline: none; }
    @keyframes pk3in { from { filter: blur(var(--spoiler-blur)); opacity: 0.2; } to { filter: none; opacity: 1; } }
    .v-text.hinted .hz { color: transparent; }
    .v-text.hinted .hu { color: transparent; position: relative; transition: color .22s ease; }
    .v-text.hinted .hu::after { content: ""; position: absolute; left: 50%; top: 55%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--text-accent); transition: opacity .22s ease; pointer-events: none; }   /* a hidden word: a dot where its first letter would be (drawn over the letter, so nothing changes size or moves) */
    .v-text.hinted .hl { -webkit-text-stroke: 0.35px currentColor; } /* a touch heavier without changing the letter's width */


    .action-container { 
      display: flex; 
      flex-direction: column; 
      flex-shrink: 0;
    }

    .btn-row { 
      display: flex; 
      gap: 10px; 
      width: 100%;
    }

    button {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: transform 0.08s ease, filter 0.08s ease;
    }
    button:active { transform: scale(0.97); filter: brightness(0.92); }

    .btn-fail { 
      flex: 1; 
      min-height: 54px;

    .btn-pass { 
      flex: 1; 
      min-height: 54px; 
      background: var(--btn-pass-bg); 
      color: var(--btn-pass-text);

    .btn-pass { position: relative; overflow: hidden; -webkit-touch-callout: none; }
    .btn-pass > span:not(.climb-fill) { position: relative; z-index: 1; }
    .climb-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; z-index: 0; pointer-events: none; background: color-mix(in srgb, var(--text-accent) 22%, transparent); }
    .lvl-pill { display: inline-flex; align-items: center; gap: 5px; background: color-mix(in srgb, var(--text-accent) 14%, var(--bg-card)); color: var(--text-accent); border-radius: 999px; padding: 4px 10px; }
    .btn-pass.clear { background: var(--btn-restart-bg); color: var(--btn-restart-text); }   /* repeat cards: blue, like the New tab's Review button */

    .btn-pass.locked { opacity: 0.5; }                      /* New card waiting for its next unlock time: still tappable (shows the time); a Review card before anything is revealed: inert */
    .pt-right { display: inline-flex; align-items: center; gap: 10px; }

    .summary-card {
      background: var(--bg-card);

      box-sizing: border-box;

    }

    /* Compact header: a small icon beside the title instead of a big trophy. */
    .sum-title-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .sum-ico { font-size: 22px; line-height: 1; }
    .sum-ico.ok { width: 28px; height: 28px; border-radius: 50%; background: var(--badge-pass); color: #fff; font-size: 17px; font-weight: 900; line-height: 28px; text-align: center; flex: none; }
    @media (prefers-color-scheme: dark) { .sum-ico.ok { color: #0b2a17; } }
    .summary-header h2 { font-size: 22px; margin: 0; color: var(--text-primary); font-weight: 700; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

    }

    .stat-box {
      background: var(--bg-body);

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-val { font-size: 24px; font-weight: 800; margin-bottom: 2px; color: var(--text-primary); }
    .stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; }
    .val-grad { color: var(--text-accent); }
    .val-fail, .val-grad.neg { color: var(--btn-fail-text); }
    .stat-box.tappable { cursor: pointer; }
    /* every repeat verse cleared at least once */
    .stat-box { position: relative; }
    .stat-box.cleared::after { content: "\2713"; position: absolute; top: 7px; right: 7px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--badge-pass); color: #fff; font-size: 11px; font-weight: 900; line-height: 16px; text-align: center; }
    @media (prefers-color-scheme: dark) { .stat-box.cleared::after { color: #0b2a17; } }
    .stat-box.open, .stat-box.held { border-color: var(--text-accent); box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.18); }
    /* Leveled Up with 5 or more: soft gold fill and a bold gold number (the blue "open" border still wins when tapped). */
    :root { --gold-bg-a: rgba(255, 208, 70, 0.22); --gold-bg-b: rgba(214, 158, 20, 0.13); --gold-num: #a87400; }
    @media (prefers-color-scheme: dark) { :root { --gold-bg-a: rgba(242, 201, 76, 0.18); --gold-bg-b: rgba(200, 150, 20, 0.10); --gold-num: #ffd54a; } }
    .stat-box.gold { background: linear-gradient(180deg, var(--gold-bg-a), var(--gold-bg-b)); }
    .stat-box.gold .stat-val { color: var(--gold-num); font-weight: 900; }

    /* Review cards take their verse's rank color: a thin outline, a faint tint at the top, colored progress dots.
       (Rank colors come from the .rank-N classes above; the tint needs color-mix, older browsers just skip it.) */
    /* Registered so the card's rank colors can glide from one verse's rank to the next instead of snapping. */
    @property --rc { syntax: '<color>'; inherits: true; initial-value: transparent; }
    @property --rb { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
    @property --rt { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
    @property --rg { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
    .card { transition: --rc 0.45s ease, --rb 0.45s ease, --rt 0.45s ease, --rg 0.45s ease; }
    .card.ranked { --rc: var(--rl); }
    @media (prefers-color-scheme: dark) { .card.ranked { --rc: var(--rd); } }
    .card.ranked .pip.filled { background: var(--rc); border-color: var(--rc); }
    .card.ranked .pip.cur { border-color: var(--rc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--rc) 28%, transparent); }
    .dia-mark { color: var(--rc, var(--text-accent)); font-size: 13px; line-height: 14px; font-weight: 800; text-shadow: 0 0 7px var(--rc, var(--text-accent)); }
    /* Strength grows with rank: --rb outline, --rt top tint, --rg outer glow (Silver and Platinum are greys, so they get a little extra). */
    .rank-1 { --rb: 20%; --rt: 3%;   --rg: 0%; }

    @supports (color: color-mix(in srgb, red 50%, blue)) {

    /* Hold the Treasury box on Review Complete: the box below with the rank icons and, at the bottom, the same three counts as the Verses legend. */
    .tr-box { text-align: left; margin: -6px 0 14px; padding: 12px 12px 12px; background: var(--bg-body); border: 1px solid var(--border-body); border-radius: 12px; color: var(--text-primary); animation: noteFadeIn .25s ease-out both; }

    .tr-box .rcell { --rc: var(--rl); display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 2px 7px; border: 1px solid var(--border-card); border-radius: 12px; line-height: 1.15; }

    .fail-list { text-align: left; margin: -6px 0 14px; padding: 0 12px 6px; background: var(--bg-body); border: 1px solid var(--border-body);

    /* Tiny muted line pinned to the bottom of the Review Complete card. */

    /* Content starts near the top so opening the Repeats / Leveled Up list doesn't move the boxes. */
    /* Gold badge floating at the top of the card on a day with no repeats; it doesn't move anything. */
    .flawless-badge { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
      padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.9px; text-transform: uppercase;
      color: #b88a00; border: 1px solid rgba(184, 138, 0, 0.45);
      background: linear-gradient(110deg, rgba(184, 138, 0, 0.12) 30%, rgba(255, 215, 90, 0.45) 50%, rgba(184, 138, 0, 0.12) 70%); }
    @media (prefers-color-scheme: dark) {
      .flawless-badge { color: #f2c94c; border-color: rgba(242, 201, 76, 0.45);
        background: linear-gradient(110deg, rgba(242, 201, 76, 0.12) 30%, rgba(255, 230, 140, 0.35) 50%, rgba(242, 201, 76, 0.12) 70%); }
    }
    /* The same soft glint that sweeps across the top-rank pills, every 3 s like Diamond (first sweep waits for the pop-in).
       It sits behind the lettering so the words stay crisp, and is tinted gold rather than white. */
    .flawless-badge { overflow: hidden; isolation: isolate; --per: 3s; --gl: rgba(255, 224, 110, 0.95); }
    .flawless-badge::after {
      content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; left: 0; width: 46%; pointer-events: none;
      transform: translateX(-130%) skewX(-20deg);
      background: linear-gradient(90deg, transparent 0%, var(--gl) 50%, transparent 100%);
      animation: flawlessShimmer var(--per) ease-in-out 0.7s infinite;
    }
    @keyframes flawlessShimmer {
      0%   { transform: translateX(-130%) skewX(-20deg); }
      30%  { transform: translateX(310%) skewX(-20deg); }
      100% { transform: translateX(310%) skewX(-20deg); }
    }
    @media (prefers-color-scheme: dark) { .flawless-badge { --gl: rgba(255, 226, 130, 0.5); } }
    .flawless-badge.pop { animation: flawless-pop 520ms cubic-bezier(0.2, 0.9, 0.3, 1.25) both; }
    @keyframes flawless-pop {

    /* ── Bottom tab bar navigation ── */

    .tab-slider { position: absolute; top: -1px; left: 0; width: calc(100% / 3); height: 4px; display: flex; justify-content: center; pointer-events: none; z-index: 3;

      background: var(--text-muted); color: var(--bg-card); font-size: 10px; font-weight: 700;
      border-radius: 99px; padding: 1px 6px; line-height: 14px; }

    #verseListView { --vb-a: color-mix(in srgb, var(--text-muted) 9%, var(--bg-card)); --vb-b: color-mix(in srgb, var(--text-muted) 17%, var(--bg-card)); }

    .help-row span { padding-right: 12px; }
    .help-row kbd.nw { white-space: nowrap; max-width: none; }
    .help-row kbd { white-space: normal; text-align: right; max-width: 62%; flex-shrink: 0; font: 600 13px -apple-system, Helvetica, Arial, sans-serif; min-width: 26px; text-align: center; padding: 3px 8px; border-radius: 6px;
      background: var(--bg-body); border: 1px solid var(--border-card); border-bottom-width: 2px; color: var(--text-primary); }
    .pv-card { background: var(--bg-card); color: var(--text-primary); border-radius: 18px; width: 100%; max-width: 420px;
      max-height: 78%; display: flex; flex-direction: column; padding: 18px 18px 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
    .pv-head { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 700;
      color: var(--text-accent); margin-bottom: 10px; }
    .pv-head .version-badge { align-items: center; margin: 0; position: relative; top: -1.5px; } /* caps sit above the line-box middle, so lift the pill a hair to center it on the text */

    .pv-close { background: var(--bg-body); color: var(--text-muted); border: 1px solid var(--border-card); }
    .pv-add { background: var(--btn-pass-bg); color: var(--btn-pass-text); }

    /* Hold-to-delete view: calm, same family as the outlined Add Verse and the paste box. No Close button (tap outside closes), the button itself asks. */

    /* Hold the reference: background note (Context) under it */
    .ref-header { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }

      border-left: 1px solid var(--border-card); border-top: 1px solid var(--border-card); transform: translateX(-50%) rotate(45deg); }
    .card-header-group.ctx-open .meta-tag, .card-header-group.ctx-open .pips-container { visibility: hidden; } /* the note flows straight out of the reference */

    .ctx-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 6px 7px 14px; border-bottom: 1px solid var(--border-body); flex-shrink: 0; }

    .ctx-sec + .ctx-sec { margin-top: 12px; }

    .ctx-sec.key .ctx-text { font-weight: 600; }

    .ctx-hint { margin: 8px 0 0; font-size: 13px; color: var(--text-muted); }
    .ctx-retry { font-weight: 700 !important; padding: 8px 0 0 !important; }
    /* disclaimer + Regenerate sit at the very end of the scrolling note, out of the way until you scroll down to them */
    .ctx-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 18px; padding-top: 6px; border-top: 1px solid var(--border-body); font-size: 12px; color: var(--text-muted); }
    .ctx-foot button { font-size: 12px !important; font-weight: 700 !important; padding: 6px 0 6px 6px !important; }
    .ctx-spin { display: inline-block; width: 15px; height: 15px; border: 2px solid var(--border-card); border-top-color: var(--text-accent); border-radius: 50%;
      animation: ctxspin .9s linear infinite; vertical-align: -3px; margin-right: 8px; }
    @keyframes ctxspin { to { transform: rotate(360deg); } }
    .sync-warning.is-saving { pointer-events: none; }
    /* Status readout */
    .pv-card.help-card { height: auto; max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; }   /* the status on one panel: it fits, and only the opened notification list can need a scroll */
    .help-card .st-row { padding: 7px 0; }
    .st-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--border-card); font-size: 14px; }
    .st-row:first-child { border-top: 0; }
    .st-row span { color: var(--text-muted); flex: none; }

    .st-row b.ok { color: #1e8e3e; } .st-row b.bad { color: var(--badge-fail); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st-row b.ok { color: #81c995; } }
    :root[data-theme="dark"] .st-row b.ok { color: #81c995; }
    .st-tap { cursor: pointer; }

    .st-caret.open { transform: rotate(90deg); }
    .st-sub { padding: 6px 0 6px 14px; font-size: 13.5px; border-top: 0; }

    /* Treasury pill at the top of Review Complete: Treasury | total points. Only shows the total; the Treasury page opens from the Verses tab (swipe right). */
    .tr-pill { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 94%; cursor: default;

        .tr-pill.fade-in { animation: noteFadeIn .35s ease-out both; }

    /* Simple "pick a verse" sheet */
    .picker {

      padding: 6px 4px; font-size: 14px; color: var(--text-muted); }
    .picker-search { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px;
      border: 1px solid var(--border-card); border-radius: 10px; background: transparent;
      color: var(--text-primary); margin-bottom: 8px; }
    .picker-list { --fade: var(--bg-card); flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior-x: none; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 3px 3px 12px; margin: 0 -3px; }   /* room for the outline and shadow, which the list's own clipping would otherwise cut at the edges */
    .np-bar { flex: none; padding: 8px 0 14px; }   /* the Add Verse button stays put; the list scrolls above it */
    .np-add { width: 100%; min-height: 0; padding: 13px; border: 1.5px solid color-mix(in srgb, var(--text-accent) 45%, var(--border-card)); border-radius: 14px; background: none; color: var(--text-accent); font-size: 16px; font-weight: 600; box-shadow: none; }

    /* section label, then cards: In progress cards (the one on screen is outlined), a dashed card for the queue, and one panel for the verses to add */
    .ip-head { margin: 4px 4px 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-meta); }
    .ip-head.gap { margin-top: 20px; }

      background: none; border: 0; box-shadow: none; color: var(--text-accent); font-size: 15px; font-weight: 600; transition: none; -webkit-tap-highlight-color: transparent; }
    .ip-none { padding: 14px 4px; color: var(--text-muted); font-size: 14px; }
    .ip-item { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; box-sizing: border-box; margin: 0 0 8px;
      min-height: 0; padding: 12px 14px; border-radius: 16px; background: var(--bg-card); border: 1px solid var(--border-card); box-shadow: 0 1px 3px rgba(60,64,67,.12); color: var(--text-primary); }

    .ip-item.waiting { background: transparent; border-style: dashed; box-shadow: none; }

    .ip-item.waiting { background: transparent; border-style: dashed; box-shadow: none; }

    /* the dashed row stays exactly where it is while pressed (no shrink): a soft tint says it is being pressed, a chevron says it opens/folds */

    .ip-item.waiting.open .ip-chip .chev { transform: translateY(-2px) rotate(45deg); }   /* pointing down while open */
    .ip-item.queued { background: var(--bg-page); border-style: dashed; box-shadow: none; }
    .ip-item .ip-main { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; text-align: left; }
    .ip-item .ip-ref { font-size: 17px; font-weight: 600; }

    .ip-pips i { width: 7px; height: 7px; border-radius: 50%; background: var(--border-body); border: 1px solid var(--border-card); box-sizing: border-box; }

    .ip-pips i.c { background: transparent; border-color: var(--text-accent); transform: scale(1.25); box-shadow: 0 0 0 2px rgba(26,115,232,.22); }
    .ip-pips.late i.f { background: #f59e0b; border-color: #f59e0b; box-shadow: 0 0 5px rgba(245,158,11,.45); }
    .ip-pips.late i.c { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,.25); }
    .ip-panel { animation: pkFade .18s ease-out; border: 1px solid var(--border-card); border-radius: 16px; overflow: hidden; background: var(--bg-card); }
    .picker-item { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none; border: 0; box-sizing: border-box;
      box-shadow: none; min-height: 0; padding: 12px 14px; font-size: 17px; font-weight: 600; color: var(--text-primary); border-radius: 0; }

    /* One notification style for the whole app: a rounded banner in the same spot on every screen (just above the buttons).
       Blue is information, amber is something that went wrong. .sync-warning holds the ones that wait for you (unsaved, update ready); .vr-toast is the short ones. */
    .sync-warning, .vr-toast { position: fixed; bottom: calc(var(--tab-h) + 95px); left: 50%; transform: translateX(-50%); z-index: 95;
      width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; flex-direction: row; align-items: center; justify-content: center; min-height: 0;
      padding: 10px 20px; border-radius: 999px; border: 0; font-size: 16px; font-weight: 600; line-height: 1.25; text-align: center; white-space: normal;
      background: #8ab4f8; color: #14213d; box-shadow: 0 4px 14px rgba(0,0,0,0.22); }
    .sync-warning.is-warn, .vr-toast.is-warn { background: #fdd663; color: #2b1d00; }
    .vr-toast.is-new { background: #81c995; color: #0b2e13; }   /* green: only ever "Updated to …" after a new version loads */
    .sync-warning.bn-under { visibility: hidden; }   /* a short message takes the spot while it shows */
    .sync-warning, .vr-toast { animation: toastIn 0.18s ease-out both; }   /* every banner fades up when it appears ... */

    @keyframes toastOut { from { opacity: 1; transform: translateX(-50%) translateY(0); } to { opacity: 0; transform: translateX(-50%) translateY(6px); } }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

<body>


  <button type="button" class="sync-warning" id="syncWarning" onclick="onSyncWarningTap()" style="display: none;"></button>
  <button type="button" class="vr-toast" id="vrToast" onclick="toastBanner('')" style="display: none;"></button>

  <div id="deckContainer">
    <div class="card" id="activeCard">

      <div class="card-header-group">
        <div class="ref-header-row">
          <span class="ref-wrap">
            <span class="ref-header" id="cardRef">---</span>
            <span class="version-badge" id="cardVersion" style="display: none;"></span>
          </span>
        </div>
        <div class="meta-tag" id="cardMeta">---</div>
        <div class="pips-container" id="cardPips"></div>
      </div>

      <div class="verse-wrap">
        <div class="verse-body" id="cardBody" onclick="handleContainerClick(event)">
        </div>
      </div>

      <div class="action-container">
        <div class="btn-row">
          <button type="button" class="btn-fail" id="btnFail" onclick="scoreCard('Fail')" style="display: none;">
            <span id="btnFailText">Miss</span>
            <span class="shortcut-hint">[D]</span>
          </button>
          <button type="button" class="btn-pass" id="btnPass" onclick="scoreCard('Pass')">
            <span class="climb-fill" aria-hidden="true"></span>
            <span id="btnPassText">Pass</span>
            <span class="shortcut-hint">[F]</span>
          </button>
        </div>
      </div>
    </div>

    <div class="summary-card" id="summaryView" style="display: none;">

  <div class="picker" id="picker">

  <script>
    // Mirrors GROUP_CONFIG in Code.gs for names and repsNeeded only.
    // Review intervals live on the server, which computes every due date.
    const GROUP_CONFIG = {
      0: { name: "New",       repsNeeded: 1 },
      1: { name: "Bronze",     repsNeeded: 3 },
      2: { name: "Silver",     repsNeeded: 3 },
      3: { name: "Gold",     repsNeeded: 2 },
      4: { name: "Platinum",    repsNeeded: 2 },
      5: { name: "Sapphire",   repsNeeded: 2 },
      6: { name: "Emerald", repsNeeded: 1 },
      7: { name: "Ruby", repsNeeded: 1 },
      8: { name: "Diamond",   repsNeeded: 1 }
    };

    // Level names, shown as a badge under each verse. Level 0 is simply "New".
    const RANK_NAMES = ["New", "Bronze", "Silver", "Gold", "Platinum", "Sapphire", "Emerald", "Ruby", "Diamond"];
    function rankName(g) { return RANK_NAMES[Math.max(0, Math.min(8, g | 0))]; }
    function setRankBadge(metaTag, g) {
      metaTag.textContent = "";
      const b = document.createElement("span");
      b.className = "rank-badge " + (g > 0 ? "rank-" + Math.min(8, g) : "is-new");
      b.textContent = rankName(g);
      metaTag.appendChild(b);
    }

    function makePill(g, popClass) {
      const b = document.createElement("span");
      b.className = "rank-badge " + (g > 0 ? "rank-" + Math.min(8, g) : "is-new") + (popClass ? " " + popClass : "");
      b.textContent = rankName(g);
      return b;
    }

    // The notice lives outside the card (the card fades away when you score it, and a notice inside it
    // would fade too), so each time it changes it is lined up with the bottom of the verse box.
    // Level-up moment: the card itself turns into the new rank (badge, dots, outline and tint cross-fade),
    // settles with a small bounce, then fades away. Higher ranks add a ring and sparkles around the new badge.
    let luOverlay = null;
    let luSkipFn = null; // a tap while the rank-up shows ends it early
    function clearLevelUp() {
      luSkipFn = null;
      if (luOverlay) { luOverlay.remove(); luOverlay = null; }
    }
    // Higher ranks get a longer moment: Bronze-Gold 2.6 s, Platinum/Sapphire 3.2 s, Emerald/Ruby 3.8 s, Diamond 4.6 s (a tap skips it).
    function luMs(g) { return g >= 8 ? 4600 : g >= 6 ? 3800 : g >= 4 ? 3200 : LEVELUP_MS; }
    // Runs the fade-out and then finish() after ms; a tap (after the first 0.4 s) fades out at once and finishes right after.
    function levelUpThen(ms, finish) {
      const born = Date.now();
      let over = false, fadeT, doneT;
      function end() { if (over) return; over = true; clearTimeout(fadeT); clearTimeout(doneT); luSkipFn = null; finish(); }
      fadeT = setTimeout(fadeOutLevelUp, ms - LU_FADE_MS - 20);
      doneT = setTimeout(end, ms);
      luSkipFn = function() {
        if (over || Date.now() - born < 400) return;
        luSkipFn = null;
        clearTimeout(fadeT); clearTimeout(doneT);
        fadeOutLevelUp();
        doneT = setTimeout(end, LU_FADE_MS);
      };
    }
    document.addEventListener("pointerdown", function() { if (luSkipFn) luSkipFn(); }, true);
    // label: what the button says once it fills with the rank colour ("Promoted \u2713" for a New verse, else "Level Up \u2713").
    function playLevelUp(toG, rep, label) {
      clearLevelUp();
      const card = document.getElementById("activeCard");
      const deck = document.getElementById("deckContainer");
      if (!card || !deck) return;
      const clone = card.cloneNode(true);
      clone.querySelectorAll("[id]").forEach(function(n) { n.removeAttribute("id"); });
      clone.removeAttribute("id");
      clone.querySelectorAll("button").forEach(function(n) { n.removeAttribute("onclick"); });
      setCardRank(clone, toG);
      const meta = clone.querySelector(".meta-tag");
      if (meta) { meta.className = "meta-tag"; setRankBadge(meta, toG); }
      const pips = clone.querySelector(".pips-container");
      if (pips) {
        pips.innerHTML = "";
        if (toG >= 8) {
          pips.innerHTML = '<span class="dia-mark">\u25C6</span>';
        } else {
          const cfg = GROUP_CONFIG[toG] || { repsNeeded: 1 };
          const filled = rep >= 1 && rep <= cfg.repsNeeded ? rep : 1;
          for (let i = 1; i <= cfg.repsNeeded; i++) {
            const p = document.createElement("div");
            p.className = "pip" + (i < filled ? " filled" : i === filled ? " cur" : "");
            pips.appendChild(p);
          }
          pips.classList.remove("lock-chips");
        }
      }
      const badge = meta && meta.querySelector(".rank-badge");
      if (badge) badge.style.animation = "rankGlow 1s ease-out 0.45s both";
      if (badge && toG >= 4) {
        const fx = document.createElement("span");
        fx.className = "lu-fx rank-" + Math.min(8, toG);
        badge.parentNode.insertBefore(fx, badge);
        const rings = toG >= 8 ? 2 : 1;
        const sparks = toG >= 8 ? 12 : toG >= 6 ? 8 : 5;
        for (let r = 0; r < rings; r++) {
          const ring = document.createElement("span");
          ring.className = "lu-ring";
          ring.style.setProperty("--rd2", (0.4 + r * 0.18) + "s");
          fx.appendChild(ring);
        }
        fx.appendChild(badge);
        for (let i = 0; i < sparks; i++) {
          const sp = document.createElement("span");
          const ang = (i / sparks) * Math.PI * 2 + 0.4;
          const ex = Math.cos(ang) * 46, ey = Math.sin(ang) * 11, more = 10 + ((i * 7) % 9);
          sp.className = "lu-spark" + (i % 3 === 0 ? " dot" : "");
          sp.textContent = i % 3 === 0 ? "\u25CF" : "\u2726";
          fx.appendChild(sp);
          // literal keyframes (no var() inside), so the phone can run them on its compositor
          const ex0 = Math.round(ex), ey0 = Math.round(ey), dx0 = Math.round(ex + Math.cos(ang) * more), dy0 = Math.round(ey + Math.sin(ang) * more * 0.6);
          if (sp.animate) sp.animate([
            { transform: "translate(calc(-50% + " + ex0 + "px), calc(-50% + " + ey0 + "px)) scale(0.3)", opacity: 0, offset: 0 },
            { opacity: 1, offset: 0.15 },
            { transform: "translate(calc(-50% + " + dx0 + "px), calc(-50% + " + dy0 + "px)) scale(1)", opacity: 0, offset: 1 }
          ], { duration: 900, delay: Math.round((0.4 + (i % 3) * 0.06) * 1000), easing: "ease-out", fill: "both" });
        }
      }
      const passBtn = clone.querySelector(".btn-pass");
      if (passBtn) setTimeout(function() { passBtn.textContent = label || "Level Up \u2713"; passBtn.classList.add("lu-btnmorph"); }, 450);
      if (toG >= 2) { const gl = document.createElement("div"); gl.className = "lu-glow"; clone.appendChild(gl); }
      if (toG >= 4) {
        const sw = document.createElement("div");
        sw.className = "lu-sweepbox";
        sw.innerHTML = "<i></i>" + (toG >= 8 ? '<i style="--sw:1.8s"></i>' : "");
        clone.appendChild(sw);
      }
      if (toG >= 6) {
        const n = toG >= 8 ? 14 : 8, span = Math.max(0.6, luMs(toG) / 1000 - 1.6);
        for (let k = 0; k < n; k++) {
          const t = document.createElement("span");
          t.className = "lu-twk";
          t.textContent = k % 2 ? "\u2726" : "\u25CF";
          t.style.left = (8 + Math.random() * 84) + "%";
          t.style.top = (6 + Math.random() * 60) + "%";
          t.style.fontSize = (7 + Math.random() * 7) + "px";
          t.style.animationDelay = (0.3 + Math.random() * span) + "s";
          clone.appendChild(t);
        }
      }
      const dr = deck.getBoundingClientRect(), cr = card.getBoundingClientRect();
      clone.style.position = "absolute";
      clone.style.left = (cr.left - dr.left) + "px";
      clone.style.top = (cr.top - dr.top) + "px";
      clone.style.width = cr.width + "px";
      clone.style.height = cr.height + "px";
      clone.style.flex = "none";
      clone.style.margin = "0";
      clone.style.pointerEvents = "none";
      clone.style.zIndex = "6";
      clone.style.opacity = "0";
      clone.style.transition = "opacity 0.45s ease";
      deck.appendChild(clone);
      luOverlay = clone;
      void clone.offsetWidth;
      clone.style.opacity = "1";
      // the new rank's dots come out of the badge once it has changed
      const cpill = clone.querySelector(".meta-tag .rank-badge");
      const cdots = clone.querySelectorAll(".pips-container .pip, .pips-container .dia-mark");
      if (cpill && cdots.length && cdots[0].animate) {
        const pr = cpill.getBoundingClientRect(), px = pr.left + pr.width / 2, py = pr.top + pr.height / 2;
        cdots.forEach(function(d, k) {
          const r = d.getBoundingClientRect();
          const dx = Math.round(px - (r.left + r.width / 2)), dy = Math.round(py - (r.top + r.height / 2));
          d.animate([{ transform: "translate(" + dx + "px, " + dy + "px) scale(0.2)", opacity: 0 }, { opacity: 1 }], { duration: 450, delay: 600 + k * 110, easing: "cubic-bezier(0.2, 0.9, 0.3, 1.3)", fill: "both" });
        });
      }
      card.classList.add("lu-settle");
      clone.classList.add("lu-settle");
    }
    function fadeOutLevelUp() {
      const card = document.getElementById("activeCard");
      if (card) fadeCardContent();
      if (luOverlay) { luOverlay.style.transition = "opacity " + LU_FADE_MS + "ms ease-out"; luOverlay.style.opacity = "0"; }
    }

    // ── Verse List ──
    // Books in Bible order, with the names and abbreviations a reference might start with.
    const BIBLE_BOOKS = [
      ["Genesis", "gen|ge|gn"], ["Exodus", "exod|exo|ex"], ["Leviticus", "lev|le|lv"], ["Numbers", "num|nu|nm|nb"],
      ["Deuteronomy", "deut|dt|de"], ["Joshua", "josh|jos|jsh"], ["Judges", "judg|jdg|jg|jdgs"], ["Ruth", "rth|ru"],
      ["1 Samuel", "1 sam|1 sm|1 sa|1sam|first samuel"], ["2 Samuel", "2 sam|2 sm|2 sa|2sam|second samuel"],
      ["1 Kings", "1 kgs|1 ki|1kgs|first kings"], ["2 Kings", "2 kgs|2 ki|2kgs|second kings"],
      ["1 Chronicles", "1 chron|1 chr|1 ch|1chr|first chronicles"], ["2 Chronicles", "2 chron|2 chr|2 ch|2chr|second chronicles"],
      ["Ezra", "ezr"], ["Nehemiah", "neh|ne"], ["Esther", "esth|est|es"], ["Job", "jb"],
      ["Psalms", "psalm|ps|psa|pss|psm|pslm"], ["Proverbs", "prov|pro|prv|pr"], ["Ecclesiastes", "eccles|eccl|ecc|ec|qoh"],
      ["Song of Solomon", "song of songs|song|sos|ss|canticles|cant"], ["Isaiah", "isa|is"], ["Jeremiah", "jer|je|jr"],
      ["Lamentations", "lam|la"], ["Ezekiel", "ezek|eze|ezk"], ["Daniel", "dan|da|dn"], ["Hosea", "hos|ho"],
      ["Joel", "jl"], ["Amos", "am"], ["Obadiah", "obad|ob"], ["Jonah", "jon|jnh"], ["Micah", "mic|mi"],
      ["Nahum", "nah|na"], ["Habakkuk", "hab|hb"], ["Zephaniah", "zeph|zep|zp"], ["Haggai", "hag|hg"],
      ["Zechariah", "zech|zec|zc"], ["Malachi", "mal|ml"],
      ["Matthew", "matt|mat|mt"], ["Mark", "mrk|mk|mr"], ["Luke", "luk|lk"], ["John", "jhn|jn"], ["Acts", "act|ac"],
      ["Romans", "rom|ro|rm"], ["1 Corinthians", "1 cor|1 co|1cor|first corinthians"], ["2 Corinthians", "2 cor|2 co|2cor|second corinthians"],
      ["Galatians", "gal|ga"], ["Ephesians", "eph|ephes"], ["Philippians", "phil|php|pp"], ["Colossians", "col|co"],
      ["1 Thessalonians", "1 thess|1 thes|1 th|1thess|first thessalonians"], ["2 Thessalonians", "2 thess|2 thes|2 th|2thess|second thessalonians"],
      ["1 Timothy", "1 tim|1 ti|1tim|first timothy"], ["2 Timothy", "2 tim|2 ti|2tim|second timothy"],
      ["Titus", "tit|ti"], ["Philemon", "philem|phlm|phm"], ["Hebrews", "heb"], ["James", "jas|jm"],
      ["1 Peter", "1 pet|1 pe|1pet|1 pt|first peter"], ["2 Peter", "2 pet|2 pe|2pet|2 pt|second peter"],
      ["1 John", "1 jn|1 jhn|1john|first john"], ["2 John", "2 jn|2 jhn|2john|second john"], ["3 John", "3 jn|3 jhn|3john|third john"],
      ["Jude", "jud"], ["Revelation", "rev|re|revelations|apocalypse"]
    ];
    const BOOK_INDEX = (function() {
      const m = {};
      BIBLE_BOOKS.forEach(function(b, i) {
        m[normBook(b[0])] = i;
        b[1].split("|").forEach(function(a) { m[normBook(a)] = i; });
      });
      return m;
    })();

    function normBook(t) {
      return String(t || "").toLowerCase().replace(/\./g, "").replace(/\s+/g, " ").trim()
        .replace(/^(1st|i)\s+/, "1 ").replace(/^(2nd|ii)\s+/, "2 ").replace(/^(3rd|iii)\s+/, "3 ")
        .replace(/^([123])(?=[a-z])/, "$1 ");
    }

    // "John 10:27-30" -> { book: index in the Bible (or 999), chapter, verse }
    function parseRef(ref) {
      // Optional book number ("1", "II", "2nd"), then the book name, then chapter and verse.
      const m = String(ref || "").match(/^\s*((?:(?:[1-3]|1st|2nd|3rd)\.?\s*|(?:iii|ii|i)\.?\s+)?[A-Za-z][A-Za-z.\s]*?)\s*(\d+)(?:\s*[:.]\s*(\d+))?/i);
      let name = ref, chapter = 0, verse = 0;
      if (m) { name = m[1]; chapter = parseInt(m[2], 10) || 0; verse = parseInt(m[3], 10) || 0; }
      let key = normBook(name);
      let idx = BOOK_INDEX[key];
      if (idx === undefined) idx = 999;
      return { book: idx, name: idx === 999 ? (String(name).trim() || "Other") : BIBLE_BOOKS[idx][0], chapter: chapter, verse: verse };
    }

    // How many verses a reference covers: "John 10:27-30" is 4, "Rom 8:28,30" is 2, "Ps 23:1" is 1.
    // A range that crosses chapters, or a whole chapter with no verse numbers, can't be counted
    // without a table of chapter lengths, so each of those counts as 1.
    function verseCount(ref) {
      const m = String(ref || "").match(/\d+\s*[:.]\s*([^]*)$/);
      if (!m) return 1;
      const tail = m[1];
      let total = 0;
      tail.split(/[,;]/).forEach(function(tok) {
        const t = tok.trim();
        if (!t) return;
        if (t.indexOf(":") >= 0) { total += 1; return; }
        const r = t.match(/^(\d+)[a-z]?\s*[-\u2013\u2014]\s*(\d+)[a-z]?$/i);
        if (r) {
          const lo = parseInt(r[1], 10), hi = parseInt(r[2], 10);
          total += hi >= lo ? (hi - lo + 1) : 1;
        } else if (/^\d+[a-z]?$/i.test(t)) {
          total += 1;
        } else {
          total += 1;
        }
      });
      return Math.max(1, total);
    }

    // Treasury points for a verse at each level (0 = New ... 8 = Diamond); the top two ranks are worth more. Same table as the server's PTS_TABLE.
    const PTS_TABLE = [0, 1, 2, 3, 4, 5, 6, 8, 10];
    function ptsOf(g) { return PTS_TABLE[Math.max(0, Math.min(8, Math.floor(Number(g) || 0)))]; }
    // Treasury points count verses: a card's verse count comes from the [n] markers in its text, the same way the server counts them.
    function textVerses(text, ref) {
      const t = String(text === null || text === undefined ? "" : text);

    // Small popup under a verse with its first few words.

    // The colour behind a row (the first ancestor that has one), so the peek can cover the reference cleanly.

    // when that does not fit beside the first words it shrinks to "Oct 31", and when even that does not fit the pill simply stays. Nothing for a verse with no review date.
    function dueTexts(v) {
      if (!v || !(v.g > 0) || v.d === null || v.d === undefined) return [];
      const d = Math.max(0, v.d | 0);
      if (d === 0) return ["Today"];

    function fillVerseText(box, it) {
      box.textContent = "";
      const segs = parseVerseSegments(it.t || "", it.f);
      if (!segs.length) { box.textContent = "No text saved for this verse."; return; }
      segs.forEach(function(sg, i) {

    // ── Verse List search ──
    let vlQuery = "";

    // Search is its own screen, opened from the search bar on the Verses page.

      if (!toks.length) return null;
      const hits = vlVerses.filter(function(v) {
        const hay = " " + vlNorm(v.f + " " + v.v + " " + v.x) + " ";

    }
    function vlSnippet(text, raw, full) {

    // The end-of-list cues (see .end-mark): marks a scrolling element as scrolling or not, and fades its bottom edge while there is more below.

    // Pull past the top of a list card (a swipe down that starts with the list already at its top), or push past its end (a swipe up that starts at the

    // ───────────── Verse rendering ─────────────

    function parseVerseSegments(rawText, reference) {
      if (!rawText) return [];

      const hasBrackets = /\[\d+\]/.test(rawText);
      if (!hasBrackets) {
        return [{ num: "", text: rawText.trim() }];
      }

      let startNum = "";
      if (reference) {
        const m = reference.match(/:(\d+)/);
        if (m) startNum = m[1];
      }

      const regex = /\[(\d+)\]/g;
      const segments = [];

      let currentNum = startNum || "1";
      let match;

      while ((match = regex.exec(rawText)) !== null) {
        const chunk = rawText.substring(lastIndex, match.index).trim();
        if (chunk || segments.length > 0) {
          segments.push({ num: currentNum, text: chunk });
        }
        currentNum = match[1];
        lastIndex = regex.lastIndex;
      }

      const tail = rawText.substring(lastIndex).trim();
      if (tail) {
        segments.push({ num: currentNum, text: tail });
      }

      return segments;
    }

    // ── Phrase splitting (New tab) ──
    // A numbered verse longer than PHRASE_CAP words is cut into phrases so you can learn it a piece at a time.
    // Aim is about PHRASE_TARGET words per phrase; up to PHRASE_CAP (25% more) is allowed when it gives a cleaner break.
    // Breaks go where the sentence naturally pauses: sentence ends first, then ; : dashes, then a comma before
    // and / but / that / who ..., and plain commas last. Lists ("faith, hope, and love") are kept together.
    const PHRASE_TARGET = 12.5, PHRASE_CAP = 15, PHRASE_MIN = 5;
    const PHRASE_CONJ = /^(and|but|for|so|yet|or|nor|that|because|who|whom|whose|which|when|while|if|though|although|since|until|unless|whether|as|then|therefore|thus|lest|where|whoever|whatever|whenever|wherever)$/;

    function splitPhrases(text) {
      const whole = String(text || "").trim();
      // words; an em dash with no spaces ("authorities\u2014all") is a possible break, so it is cut there and glued back after
      const words = [], glue = [];
      whole.split(/\s+/).filter(Boolean).forEach(function(tok) {
        const parts = tok.match(/[^\u2014]+\u2014?|\u2014/g) || [tok];
        parts.forEach(function(p, k) { words.push(p); glue.push(k > 0); });
      });
      const n = words.length;
      if (n <= PHRASE_CAP) return [whole];

      const core = function(w) { return w.replace(/[”"’')\]]+$/, ""); };           // word without closing quotes
      const bare = function(w) { return w.replace(/^[“"‘'(\[]+/, "").replace(/[^A-Za-z']+$/, "").toLowerCase(); };
      const punct = words.map(function(w) { return /[,;:.!?—–]$/.test(core(w)); });
      const itemLen = new Array(n).fill(0);   // words since the previous punctuation (for spotting lists)
      let last = -1;
      for (let i = 0; i < n; i++) { if (punct[i]) { itemLen[i] = i - last; last = i; } }

      function isListComma(i) {
        if (itemLen[i] > 3) return false;
        const p = i - itemLen[i];
        if (p >= 0 && /,$/.test(core(words[p])) && itemLen[p] <= 3) return true;   // second short item in a row
        let j = i + 1; while (j < n && !punct[j]) j++;
        return j < n && (j - i) <= 3 && /,$/.test(core(words[j]));                  // next item is short and a comma item too
      }
      function firmAfter(i) { return i < 0 || i >= n - 1 || /[.!?;]$/.test(core(words[i])); }
      // cost of ending a phrase after word i
      function breakCost(i) {
        const w = core(words[i]), next = bare(words[i + 1]);
        if (/[.!?;]$/.test(w)) return 0;
        if (/[:—–]$/.test(w)) return 0.5;

      }

        c += sentSum[to - 1] - sentSum[from];                                            // a phrase running across a sentence end
        if (L > PHRASE_TARGET) c += (L - PHRASE_TARGET) * 0.2;

    // ── Learn steps (parts) ──
    // A reference started under the learn plan arrives with card.plan: its steps as [firstVerse, lastVerse, parts, firstPhrase, endPhrase] (0-based). A step is
    // whole verses (two or more are joined into one step) or one part of a long verse, cut at phrase breaks. Every piece carries the step it belongs to in

    function learnUnits(card) {

    function stepWord(card) { return card && card.pm ? "Part" : "Verse"; }
    // What a step covers, for the bar: "v17\u201318" (joined verses), "v13 a\u2013b" (part of a verse), "a\u2013b" (part of a single-verse reference).
    function stepCover(card) {
