      const r = document.getElementById("cardRef"); if (r) r.classList.remove("um-open");
      document.removeEventListener("pointerdown", onUndoOutside, true);
    }
    function onUndoOutside(e) { if (!e.target.closest(".undo-menu")) closeUndoMenu(); }
    function openUndoMenu() {
      closeUndoMenu();
      const ref = document.getElementById("cardRef");
      if (!ref) return;
      const m = document.createElement("div");
      m.className = "undo-menu";
      const ok = undoAvailable();
      const b = document.createElement("button");
      b.type = "button";
      b.className = ok ? "" : "off";
      b.textContent = "\u21B6 " + (ok ? "Undo " + undoLabel : "Nothing to undo");
      b.onclick = function(e) { e.stopPropagation(); closeUndoMenu(); if (ok) undoLast(); };
      m.appendChild(b);
      const grp = ref.closest(".card-header-group") || ref.parentNode;
      grp.appendChild(m);
      m.style.top = (ref.getBoundingClientRect().bottom - grp.getBoundingClientRect().top + 8) + "px";
      ref.classList.add("um-open");
      setTimeout(function() { document.addEventListener("pointerdown", onUndoOutside, true); }, 0);
    }
    // Size the blue highlight to the real ink of the reference (works with any font, so it looks centered on every device).
    function fitRefHighlight() {
      try {
        const ref = document.getElementById("cardRef");
        const cs = getComputedStyle(ref);
        const ctx = document.createElement("canvas").getContext("2d");
        ctx.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
        const txt = ref.firstChild && ref.firstChild.nodeType === 3 ? ref.firstChild.nodeValue : ref.textContent;
        const m = ctx.measureText(txt), cap = ctx.measureText("H");
        const probe = document.createElement("span");
        probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
        ref.appendChild(probe);
        const rr = ref.getBoundingClientRect(), base = probe.getBoundingClientRect().bottom - rr.top;
        ref.removeChild(probe);
        const capMid = base + (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
        const padY = 15, padX = 14;
        const w = m.width, inkL = (rr.width - w) / 2 - m.actualBoundingBoxLeft, inkR = (rr.width - w) / 2 + m.actualBoundingBoxRight;
        ref.style.setProperty("--hl-l", (-(inkL - (-0)) - padX) + "px");
        ref.style.setProperty("--hl-r", (-(rr.width - inkR) - padX) + "px");
        ref.style.setProperty("--hl-t", (capMid - padY) + "px");
        ref.style.setProperty("--hl-b", (rr.height - capMid - padY) + "px");
      } catch (e) {}
    }
    let heldRef = null;
    function attachUndoHold() {
      const ref = document.getElementById("cardRef");
      // Review tab only: the New tab has nothing to undo from here
      heldRef = attachLongPress(ref, function() { if (mode !== 'learning' && hasActiveCard()) openUndoMenu(); }, function(e) { if (mode === 'learning' || e.target.closest(".undo-menu")) return false; fitRefHighlight(); return true; });
      ref.addEventListener("click", function(e) { if (heldRef()) { e.stopPropagation(); e.preventDefault(); } }, true);
    }

    function undoLast() {
      if (!undoAvailable()) { if (!undoId) return; flashNotice("Nothing to undo"); return; }
      const id = undoId;
      hideUndo();
      isScoring = true;
      google.script.run
        .withSuccessHandler(function(res) {
          isScoring = false;
          if (res && res.session) {
            adoptSession(res.session);
            flashNotice(res.ok ? "Undone" : "Nothing to undo");
          } else {
            flashNotice("Couldn't undo");
          }
        })
        .withFailureHandler(function() {
          isScoring = false;
          flashNotice("Couldn't undo");
        })
        .undoLast(id);
    }

    function renderTomorrowNote() {
      const el = document.getElementById("tomorrowNote");
      if (!el) return;
      const onComplete = document.getElementById("summaryView").style.display !== "none" &&
        document.getElementById("btnAddVerse").style.display === "none" &&
        document.getElementById("btnRestart").style.display === "none" &&
        mode !== 'learning';
      if (!onComplete || typeof tomorrowCount !== 'number') { el.style.display = "none"; return; }
      el.textContent = tomorrowCount > 0 ? tomorrowCount + " due tomorrow" : "Nothing due tomorrow";
      el.style.display = "block";
    }

    // Short message that works on both the card and summary screens.
    function flashNotice(msg) {
      const summaryVisible = document.getElementById("summaryView").style.display !== "none";
      const el = document.getElementById(summaryVisible ? "summaryNotice" : "toastNotice");
      if (!el) return;
      el.textContent = msg;
      el.classList.remove("is-error");
      setTimeout(function() { if (el.textContent === msg) el.textContent = ""; }, 2500);
    }

    // ───────────── Verse rendering ─────────────

    function parseVerseSegments(rawText, reference) {
      if (!rawText) return [];

      const hasBrackets = /\[\d+\]/.test(rawText);
      if (!hasBrackets) {
        return [{ num: "", text: rawText.trim() }];
      }

      let startNum = "";
      if (reference) {
        const m = reference.match(/:(\d+)/);
        if (m) startNum = m[1];
      }

      const regex = /\[(\d+)\]/g;
      const segments = [];
      let lastIndex = 0;
      let currentNum = startNum || "1";
      let match;

      while ((match = regex.exec(rawText)) !== null) {
        const chunk = rawText.substring(lastIndex, match.index).trim();
        if (chunk || segments.length > 0) {
          segments.push({ num: currentNum, text: chunk });
        }
        currentNum = match[1];
        lastIndex = regex.lastIndex;
      }

      const tail = rawText.substring(lastIndex).trim();
      if (tail) {
        segments.push({ num: currentNum, text: tail });
      }

      return segments;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function getFastTrackTarget(card) {
      if (card.group === 3 && card.rep === 5) return 5;
      if (card.group === 4 && card.rep === 6) return 6;
      if (card.group === 5 && (card.rep === 7 || card.rep === 8)) return card.rep;
      return null;
    }

    // Failing needs the verse revealed first, except for brand-new (Level 0) cards, where Fail means Skip.
    // Failed verses wait at the end of the queue (held) until Practice is started; they are not part of the deck.
    function activeEnd() {
      for (let i = 0; i < queue.length; i++) if (queue[i].isHeld) return i;
      return queue.length;
    }
    function heldCount() {
      return queue.filter(function(c) { return c.isHeld; }).length;
    }

    function hasActiveCard() {
      return mode === 'learning' ? !!learningCards[learningIndex] : currentIndex < activeEnd();
    }

    function canFail() {
      if (mode === 'learning') return true; // "Next" / "Done" never need the verse revealed
      const c = queue[currentIndex];
      return !!c && (c.group === 0 || isFlipped);
    }

    function render() {
      clearLevelUp();
      if (mode === 'learning') renderLearning();
      else renderCard();
      updateFailLock();
      updateTabs();
      placeNotice();
      postCache();
    }

    function setMode(m) {
      mode = m;
      enqueueSubmit(null, snapshot(currentIndex)); // saves the screen you're on so any device reopens here
      render();
    }

    function toggleLearning() {
      if (isScoring || isFetching || isRefreshing) return;
      if (mode === 'learning') {
        setMode('review');
      } else {
        learningIndex = 0;
        setMode('learning');
      }
    }

    // Learning screen with no Level 0 verses: offer to add one.
    function renderEmptyLearning() {
      isScoring = false;
      document.getElementById("activeCard").style.display = "none";
      document.getElementById("summaryView").style.display = "flex";
      document.getElementById("sessionProgressFill").style.width = "0%";

      const icon = document.getElementById("summaryIcon");
      icon.textContent = "";
      icon.style.display = "none";
      document.getElementById("summaryTitle").textContent = "No New Verse";
      document.getElementById("summarySubtitle").textContent = "Would you like to add a new verse?";
      document.getElementById("summaryStats").style.display = "none";
      document.getElementById("flawlessBadge").style.display = "none";
      countUpToken++;
      updateStatLists(); // an open Repeats / Leveled Up list from the Review screen must not follow you here
      setSummaryButtons(true, false);
      renderTomorrowNote();
    }

    function renderLearning() {
      isScoring = false;

      const cardEl = document.getElementById("activeCard");
      const summaryEl = document.getElementById("summaryView");
      const card = learningCards[learningIndex];
      if (!card) { renderEmptyLearning(); return; }

      cardEl.style.display = "flex";
      setCardRank(cardEl, 0);
      document.querySelectorAll(".shortcut-hint").forEach(function(h) { h.style.display = "none"; });
      summaryEl.style.display = "none";

      isFlipped = false;
      parsedSegments = parseVerseSegments(card.text, card.reference);
      segmentStates = parsedSegments.map(() => 'hidden');

      cardEl.style.transition = "";
      cardEl.classList.remove("lu-settle");
      cardEl.style.opacity = "1";


      const doneLabel = "Review";
      document.getElementById("sessionProgressFill").style.width = "0%";

      const metaTag = document.getElementById("cardMeta");
      metaTag.className = "meta-tag";
      metaTag.textContent = card.day > 0 ? "New Verse · Day " + card.day : "New Verse";
      const lp = document.getElementById("cardPips");
      lp.innerHTML = "";
      if (learningCards.length > 1 && learningCards.length <= 10) {
        learningCards.forEach(function(_, i) {
          const pip = document.createElement("div");
          pip.className = "pip" + (i === learningIndex ? " filled" : "");
          lp.appendChild(pip);
        });
      }

      const versionBadge = document.getElementById("cardVersion");
      const ver = (card.version || "").trim();
      if (ver && ver.toUpperCase() !== "ESV") {
        versionBadge.textContent = ver;
        versionBadge.style.display = "inline-block";
      } else {
        versionBadge.style.display = "none";
      }

      document.getElementById("btnPassText").textContent = "Level Up";
      document.getElementById("btnFailText").textContent = doneLabel;
      document.getElementById("btnFail").style.display = "flex";
      document.getElementById("btnFail").classList.add("review");
      { const b = document.getElementById("btnFail"); const sn = isSeen(card.reference); b.classList.toggle("seen", sn); b.classList.toggle("only", sn && learningCards.length === 1); }

      document.getElementById("cardRef").textContent = card.reference;
      renderCardBody();
      showCardContent();
    }

    // Gives the verse card its rank's color theme (no theme for New verses).
    function setCardRank(cardEl, g) {
      for (let i = 1; i <= 8; i++) cardEl.classList.remove("rank-" + i);
      cardEl.classList.toggle("ranked", g >= 1 && g <= 8);
      if (g >= 1 && g <= 8) cardEl.classList.add("rank-" + g);
    }

    function renderCard() {
      isScoring = false;

      const cardEl = document.getElementById("activeCard");
      const summaryEl = document.getElementById("summaryView");
      const progressFill = document.getElementById("sessionProgressFill");
      const pipsContainer = document.getElementById("cardPips");
      const metaTag = document.getElementById("cardMeta");
      const versionBadge = document.getElementById("cardVersion");
      const btnFail = document.getElementById("btnFail");
      btnFail.classList.remove("seen", "only", "review");
      const btnFailText = document.getElementById("btnFailText");
      const btnPassText = document.getElementById("btnPassText");

      if (currentIndex >= activeEnd()) {
        renderEndOfDayScreen();
        return;
      }

      cardEl.style.display = "flex";
      setCardRank(cardEl, queue[currentIndex].group);
      document.querySelectorAll(".shortcut-hint").forEach(function(h) { h.style.display = ""; });
      summaryEl.style.display = "none";

      const card = queue[currentIndex];
      isFlipped = false;

      parsedSegments = parseVerseSegments(card.text, card.reference);
      segmentStates = parsedSegments.map(() => 'hidden');

      cardEl.style.transition = "";
      cardEl.classList.remove("lu-settle");
      cardEl.style.opacity = "1";

      // Progress through today's deck, worked out only from the synced position, so every device shows the
      // same bar. Repeat cards added after a Fail come after the deck and never move it backwards.
      const percent = baseCount > 0 ? (Math.min(currentIndex, baseCount) / baseCount) * 100 : 0;
      progressFill.style.width = `${percent}%`;

      pipsContainer.innerHTML = '';
      metaTag.className = "meta-tag";

      const ver = (card.version || "").trim();
      if (ver && ver.toUpperCase() !== "ESV") {
        versionBadge.textContent = ver;
        versionBadge.style.display = "inline-block";
      } else {
        versionBadge.style.display = "none";
      }

      const fastTrackTarget = getFastTrackTarget(card);

      if (card.isRepeat) {
        metaTag.textContent = `Repeat · ${rankName(card.group)}`;
        metaTag.classList.add("is-repeat-badge");
        btnFailText.textContent = "Repeat";
        btnPassText.textContent = "Clear";
        btnFail.style.display = "flex";
      } else if (fastTrackTarget) {
        // ⚡ Fast-Track Recovery Mode
        metaTag.textContent = `⚡ Fast-Track · back to ${rankName(fastTrackTarget)}`;
        metaTag.classList.add("is-fasttrack-badge");
        btnFailText.textContent = "Repeat";
        btnPassText.textContent = "Recover";
        btnFail.style.display = "flex";

        pipsContainer.innerHTML = `<span class="fast-track-pip" title="1 Pass restores ${rankName(fastTrackTarget)}">✦</span>`;
      } else {
        setRankBadge(metaTag, card.group);
        btnFailText.textContent = "Repeat";
        // last rep of a level: this Pass moves the verse up; Diamond has nowhere to go, so it just says Review
        btnPassText.textContent = card.group === 8 ? "Review" : (card.rep >= card.repsNeeded ? "Level Up" : "Pass");
        btnFail.style.display = "flex";

        if (card.group === 8) {
          // Diamond is the top rank, so a plain "1 of 1" dot says nothing; show the gem instead.
          pipsContainer.innerHTML = '<span class="dia-mark" title="Diamond">\u25C6</span>';
        } else {
          for (let i = 1; i <= card.repsNeeded; i++) {
            const pip = document.createElement("div");
            pip.className = "pip" + (i <= card.rep ? " filled" : "");
            pipsContainer.appendChild(pip);
          }
        }
      }

      document.getElementById("cardRef").textContent = card.reference;
      renderCardBody();
      showCardContent();
    }

    function renderCardBody() {
      const body = document.getElementById("cardBody");
      const revealedCount = segmentStates.filter(s => s === 'revealed').length;
      const allRevealed = revealedCount === parsedSegments.length;

      let html = '';

      if (parsedSegments.length > 1) {
        html += `
          <div class="passage-toolbar">
            <span class="passage-status">${revealedCount} of ${parsedSegments.length} revealed${allRevealed ? '' : ' \u00B7 hold to reveal all'}</span>
          </div>
        `;
      } else {
        html += `
          <div class="passage-toolbar">
            <span class="passage-status">${allRevealed ? 'Revealed' : 'Tap to reveal'}</span>
          </div>
        `;
      }

      html += '<div class="passage-stream">';
      parsedSegments.forEach((seg, idx) => {
        const isRev = segmentStates[idx] === 'revealed';
        html += `
          <span class="verse-unit" data-idx="${idx}" onclick="handleVerseClick(${idx}, event)">
            ${seg.num ? `<sup class="v-num">${escapeHtml(seg.num)}</sup>` : ''}
            <span class="v-text ${isRev ? 'revealed' : 'blurred'}">${escapeHtml(seg.text)}</span>
          </span>
        `;
      });
      html += '</div>';

      body.innerHTML = html;
    }

    // Press and hold anywhere in the verse box to reveal everything (hold again to hide it all).
    let heldBody = null;
    function attachRevealHold() {
      const body = document.getElementById("cardBody");
      heldBody = attachLongPress(body, function() {
        if (isScoring || !hasActiveCard()) return;
        toggleRevealAll();
      }, function(e) { return !e.target.closest("button"); });
      // the click that ends a hold must not also reveal or hide a piece
      body.addEventListener("click", function(e) {
        if (heldBody()) { e.stopImmediatePropagation(); e.preventDefault(); }
      }, true);
    }

    function handleVerseClick(index, event) {
      if (event) event.stopPropagation();
      if (isScoring) return;

      segmentStates[index] = segmentStates[index] === 'revealed' ? 'hidden' : 'revealed';
      syncFlipState();
      renderCardBody();
    }

    function handleContainerClick(event) {
      if (isScoring || !hasActiveCard()) return;

      const nextHiddenIdx = segmentStates.findIndex(s => s === 'hidden');
      if (nextHiddenIdx !== -1) {
        segmentStates[nextHiddenIdx] = 'revealed';
        syncFlipState();
        renderCardBody();
      }
    }

    function toggleRevealAll(event) {
      if (event && event.stopPropagation) event.stopPropagation();
      if (isScoring) return;

      const allRevealed = segmentStates.every(s => s === 'revealed');
      const targetState = allRevealed ? 'hidden' : 'revealed';
      segmentStates = segmentStates.map(() => targetState);

      syncFlipState();
      renderCardBody();
    }

    function syncFlipState() {
      const anyRevealed = segmentStates.some(s => s === 'revealed');
      isFlipped = anyRevealed;
      if (mode === 'learning') return;

      const card = queue[currentIndex];
      updateFailLock();
    }

    // Fail is always on screen in Review, but dimmed and inert until some of the verse text is showing.
    function updateFailLock() {
      const b = document.getElementById("btnFail");
      b.classList.toggle("locked", mode !== 'learning' && hasActiveCard() && !canFail());
    }

    // ───────────── Scoring ─────────────

    // Buttons and keys fade the card out in place.
    // The card frame stays put; only what changes (reference, rank tag, dots, verse text) fades, so there is no blink.
    const CARD_FADE_OUT_MS = 220, CARD_FADE_IN_MS = 340; // old verse fades out, next verse fades in
    const PASS_SWAP_MS = 320, REPEAT_SWAP_MS = 400;      // when the next card is put in place after Pass / Repeat
    let cardContentFaded = false;
    function cardContentEls() {
      const c = document.getElementById("activeCard");
      return [c.querySelector(".card-header-group"), c.querySelector(".verse-wrap")].filter(Boolean);
    }
    function fadeCardContent() {
      cardContentEls().forEach(function(e) { e.style.transition = "opacity " + CARD_FADE_OUT_MS + "ms ease-out"; e.style.opacity = "0"; });
      cardContentFaded = true;
    }
    function showCardContent() {
      const animate = cardContentFaded;
      cardContentFaded = false;
      cardContentEls().forEach(function(e) {
        e.style.transition = "none";
        if (animate) {
          e.style.opacity = "0";
          void e.offsetWidth;
          e.style.transition = "opacity " + CARD_FADE_IN_MS + "ms ease-out";
        }
        e.style.opacity = "1";
      });
    }
    function animateOut() { fadeCardContent(); }

    let practicing = false; // a practice round started from the Review Complete screen is running
    const LEVELUP_MS = 2000; // how long the card shows its new rank before moving on
    const LU_FADE_MS = 350;  // the rank-up overlay fades away over this long at the end

    function advanceAfter(ms) {
      const startedIn = epoch;
      setTimeout(function() {
        if (startedIn !== epoch) return; // the session was replaced meanwhile; don't skip a card
        document.getElementById("toastNotice").textContent = "";
        currentIndex++;
        if (currentIndex >= activeEnd()) {
          if (practicing) practicing = false;
          else if (totalCardsProcessed > 0) countUpPending = true; // just finished: play the count-up once
        }
        render();
      }, ms);
    }

    // Learning screen: "Level Up" promotes the verse to Level 1; "Next" / "Done" just move on.
    function scoreLearning(action) {
      if (isScoring) return;
      const card = learningCards[learningIndex];
      if (!card) return;
      // Already reviewed (dimmed): pressing again must not restart its snooze or push. With a single New verse it does nothing.
      if (action === "Fail" && isSeen(card.reference) && learningCards.length === 1) return;
      isScoring = true;

      const notice = document.getElementById("toastNotice");
      let ms = PASS_SWAP_MS;

      if (action === "Pass") {
        playLevelUp(1, 1);
        learningCards.splice(learningIndex, 1);
        learningIndex = Math.min(learningIndex, Math.max(0, learningCards.length - 1));
        enqueueSubmit(
          { rowIndex: card.rowIndex, reference: card.reference, rep: 1, group: 1 },
          snapshot(currentIndex), "Level Up \u00B7 " + card.reference
        );
        ms = LEVELUP_MS;
        setTimeout(fadeOutLevelUp, ms - LU_FADE_MS - 20);
      } else {
        const alreadySeen = isSeen(card.reference); // moving past a dimmed verse keeps its original snooze
        if (!alreadySeen) learningSeen[card.reference] = Date.now() + NEW_SNOOZE_MS;
        // ask the server for a push when this snooze ends (it is cancelled if the verse is finished first)
        if (!alreadySeen) { try { google.script.run.withSuccessHandler(function() {}).withFailureHandler(function() {}).pushSnooze(card.reference, learningSeen[card.reference]); } catch (e) {} }
        learningIndex = (learningIndex + 1) % learningCards.length; // loops back to the first verse
        enqueueSubmit(null, snapshot(currentIndex));
        if (learningCards.length === 1) {
          // Only one new verse: nothing to move on to, so the card stays put. The button dims and the badge clears.
          isScoring = false;
          updateTabs();
          return;
        }
        animateOut();
      }

      const startedIn = epoch;
      setTimeout(function() {
        if (startedIn !== epoch) return;
        document.getElementById("toastNotice").textContent = "";
        render();
      }, ms);
    }

    function scoreCard(action) {
      if (mode === 'learning') { scoreLearning(action); return; }
      if (isScoring || currentIndex >= activeEnd()) return;
      if (action === "Fail" && !canFail()) return;

      isScoring = true;

      const card = queue[currentIndex];
      const notice = document.getElementById("toastNotice");

      totalCardsProcessed++;

      // Intraday retries are never written to the sheet.
      if (card.isRepeat) {
        if (action === "Pass") {
          noteCleared(card.reference);
          notice.textContent = "🎉 Cleared for today!";
        } else {
          queue.push(card);
          notice.textContent = "🔄 Re-queued for repeat";
        }
        enqueueSubmit(null, snapshot(currentIndex + 1));
        animateOut();
        advanceAfter(REPEAT_SWAP_MS);
        return;
      }

      const currentConfig = GROUP_CONFIG[card.group] || GROUP_CONFIG[0];
      const fastTrackTarget = getFastTrackTarget(card);

      let newRep = card.rep;
      let newGroup = card.group;
      let graduated = false;
      let isFastTrackRestored = false;

      if (card.group > 0) {
        sessionStats.reviewed++;
        if (action === "Pass") {
          sessionStats.passed++;
        } else {
          sessionStats.failed++;
        }
      }

      if (action === "Pass") {
        if (fastTrackTarget) {
          // ⚡ Fast-Track Success: restores immediately to the mature level
          newGroup = fastTrackTarget;
          newRep = 1;
          graduated = true;
          isFastTrackRestored = true;
        } else if (card.rep >= currentConfig.repsNeeded) {
          if (card.group < 8) {
            newGroup = card.group + 1;
            newRep = 1;
            graduated = true;
          } else {
            newGroup = 8;
            newRep = card.rep + 1;
          }
        } else {
          newRep = card.rep + 1;
        }
      } else {
        // ─── TIERED FAIL MATRIX ───
        if (fastTrackTarget) {
          // Failed during Fast-Track probation (true memory break)
          // Gold/Platinum recovery -> Silver; Sapphire-level recovery (Emerald, Ruby, Diamond) -> Gold
          newGroup = (card.group === 3 || card.group === 4) ? 2 : 3;
          newRep = 1;
        } else {
          switch (card.group) {
            case 0:
              newGroup = 0; newRep = 1; break;
            case 1:
              newGroup = 1; newRep = 1; break;
            case 2:
              // Soft landing: drops to L1 at rep 3 of 4 (only 2 days to re-graduate)
              newGroup = 1; newRep = 3; break;
            case 3:
              // Soft landing: drops to Silver at rep 2 of 3
              newGroup = 2; newRep = 2; break;
            case 4:
              newGroup = 3; newRep = 1; break;
            case 5:
              // Fast-Track to L5: 5d check at Gold; one pass restores Sapphire
              newGroup = 3; newRep = 5; break;
            case 6:
              // Fast-Track to L6: 12d check at Level 4
              newGroup = 4; newRep = 6; break;
            case 7:
              // Fast-Track to L7: 30d check at Level 5
              newGroup = 5; newRep = 7; break;
            case 8:
              // Fast-Track to L8: 30d check at Level 5
              newGroup = 5; newRep = 8; break;
            default:
              newGroup = 1; newRep = 1; break;
          }
        }

        // Re-queue a clone for intraday repeat verification
        if (card.group > 0) {
          recordStatRef('failedRefs', card.reference, newGroup);
          queue.push(Object.assign({}, card, {
            group: newGroup,
            rep: newRep,
            isRepeat: true,
            isHeld: true // waits for the Practice button on the Review Complete screen
          }));
        }
      }

      if (graduated && card.group > 0) {
        sessionStats.graduated++;
        recordStatRef('gradRefs', card.reference, newGroup);
      }

      // The server computes the due date and stores the session; we send the new level and rep.
      enqueueSubmit(
        { rowIndex: card.rowIndex, reference: card.reference, rep: newRep, group: newGroup,
          // first Bronze review passed: ask the server for the evening practice card
          later: (action === "Pass" && card.group === 1 && card.rep === 1) ? true : undefined },
        snapshot(currentIndex + 1), (action === "Fail" ? "Repeat" : action) + " \u00B7 " + card.reference
      );

      if (isFastTrackRestored || graduated) {
        playLevelUp(newGroup, newRep);
        const ms = newGroup >= 8 ? LEVELUP_MS + 500 : LEVELUP_MS;
        setTimeout(fadeOutLevelUp, ms - LU_FADE_MS - 20);
        advanceAfter(ms);
      } else if (action === "Fail" && card.group > 0) {
        animateOut();
        advanceAfter(REPEAT_SWAP_MS);
      } else {
        animateOut();
        advanceAfter(PASS_SWAP_MS);
      }
    }

    function renderEndOfDayScreen() {
      const cardEl = document.getElementById("activeCard");
      const summaryEl = document.getElementById("summaryView");
      const progressFill = document.getElementById("sessionProgressFill");

      cardEl.style.display = "none";
      summaryEl.style.display = "flex";
      document.getElementById("summaryIcon").style.display = "";
      setSummaryButtons(false, false);
      renderTomorrowNote();
      progressFill.style.width = "100%";

      // Both end-of-day screens start at the same height, so the trophy / sparkle and title line up.
      document.getElementById("summaryView").classList.add("top");
      document.getElementById("flawlessBadge").style.display = "none";
      if (totalCardsProcessed === 0) {
        document.getElementById("summaryIcon").textContent = "✨";
        document.getElementById("summaryIcon").className = "sum-ico";
        document.getElementById("summaryTitle").textContent = "All Caught Up!";
        document.getElementById("summarySubtitle").textContent = "No verses are due for review right now.";
        document.getElementById("summaryStats").style.display = "none";
        updateStatLists();
      } else {
        document.getElementById("summaryIcon").textContent = "\u2713";
        document.getElementById("summaryIcon").className = "sum-ico ok";
        document.getElementById("summaryTitle").textContent = "Review Complete!";
        document.getElementById("summarySubtitle").textContent = "You have finished all verses scheduled for today.";
        document.getElementById("summaryStats").style.display = "grid";

        document.getElementById("statReviewed").textContent = sessionStats.reviewed;
        document.getElementById("statGraduated").textContent = sessionStats.graduated;
        document.getElementById("statGradBox").classList.toggle("gold", sessionStats.graduated >= 7);
        document.getElementById("statFailed").textContent = sessionStats.failed;
        // A day with reviews and no repeats gets the gold badge.
        updateStatLists();
        // Count up only when the numbers actually changed; clearing a same-day repeat or evening card leaves them as they were.
        const sig = [sessionStats.reviewed, sessionStats.passed, sessionStats.graduated, sessionStats.failed].join("|");
        // The gold badge pops in once the numbers finish counting; with no count-up it is simply there.
        let counting = false;
        if (countUpPending) {
          countUpPending = false;
          if (sig !== lastCountUpSig) { counting = true; runCountUp(); }
        }
        lastCountUpSig = sig;
        if (!counting) showFlawlessBadge(false);
      }
    }

    // When you finish the deck, the four numbers count up one after another (once; reopening the app shows them straight away).
    // Gold "Flawless day" badge: reviewed something and no repeats. animate = pop in like a badge earned.
    function showFlawlessBadge(animate) {
      const el = document.getElementById("flawlessBadge");
      el.classList.remove("pop");
      if (!(sessionStats.reviewed > 0 && sessionStats.failed === 0)) { el.style.display = "none"; return; }
      el.style.display = "block";
      if (animate) { void el.offsetWidth; el.classList.add("pop"); }
    }

    function runCountUp() {
      const items = [
        ["statReviewed", sessionStats.reviewed],
        ["statGraduated", sessionStats.graduated], ["statFailed", sessionStats.failed]
      ];
      const gold = document.getElementById("statGradBox");
      const token = ++countUpToken;
      const DUR = 900, GAP = 100;
      let start = Date.now();
      const plan = []; let t = 0;
      items.forEach(function(it) {
        const d = it[1] > 0 ? DUR : 0;
        plan.push({ id: it[0], v: it[1], from: t, d: d });
        t += d + (it[1] > 0 ? GAP : 0);
      });
      plan.forEach(function(p) { document.getElementById(p.id).textContent = 0; });
      gold.classList.remove("gold");
      const flawlessEl = document.getElementById("flawlessBadge");
      flawlessEl.classList.remove("pop");
      flawlessEl.style.display = "none";
      function finish() {
        plan.forEach(function(p) { document.getElementById(p.id).textContent = p.v; });
        gold.classList.toggle("gold", sessionStats.graduated >= 7);
        if (token === countUpToken) showFlawlessBadge(false);
      }
      (function tick() {
        const summary = document.getElementById("summaryView");
        if (token !== countUpToken || summary.style.display === "none") { finish(); return; }
        const now = Date.now() - start;
        let done = true;
        plan.forEach(function(p) {
          let v;
          if (now < p.from) { v = 0; done = false; }
          else if (p.d === 0 || now >= p.from + p.d) { v = p.v; }
          else { const x = (now - p.from) / p.d; v = Math.round(p.v * (1 - Math.pow(1 - x, 3))); done = false; }
          document.getElementById(p.id).textContent = v;
        });
        gold.classList.toggle("gold", (parseInt(document.getElementById("statGraduated").textContent, 10) || 0) >= 7);
        if (!done) setTimeout(tick, 33);
        else showFlawlessBadge(true);
      })();
    }

    // Remember a verse for the Repeats / Leveled Up lists with the level it now sits at
    // (a verse recorded twice is listed once).
    // A repeat verse passed (Clear) at least once today.
    function noteCleared(ref) {
      if (!Array.isArray(sessionStats.clearedRefs)) sessionStats.clearedRefs = [];
      const has = sessionStats.clearedRefs.some(function(r) { return (typeof r === "string" ? r : r.f) === ref; });
      if (!has) sessionStats.clearedRefs.push(ref);
    }

    // True once every verse in Repeats has been cleared at least once.
    function allRepeatsCleared() {
      const failed = Array.isArray(sessionStats.failedRefs) ? sessionStats.failedRefs : [];
      if (!failed.length) return false;
      const cleared = (sessionStats.clearedRefs || []).map(function(r) { return typeof r === "string" ? r : r.f; });
      return failed.every(function(r) { return cleared.indexOf(typeof r === "string" ? r : r.f) >= 0; });
    }

    function recordStatRef(key, ref, g) {
      if (!Array.isArray(sessionStats[key])) sessionStats[key] = [];
      const list = sessionStats[key];
      for (let i = 0; i < list.length; i++) {
        const f = typeof list[i] === "string" ? list[i] : list[i].f;
        if (f === ref) { list[i] = { f: ref, g: g }; return; }
      }
      list.push({ f: ref, g: g });
    }

    const STAT_LISTS = {
      fail: { key: "failedRefs", box: "statFailBox", title: "Repeats", count: "failed" },
      grad: { key: "gradRefs", box: "statGradBox", title: "Leveled Up", count: "graduated" }
    };
    let openStatList = null;

    // Verses for a list, highest level first, then Bible order.
    // Verse text for a reference, from today's deck (or the Verses list if it has been opened).
    function verseInfoFor(ref) {
      let v = "", txt = "";
      for (let i = queue.length - 1; i >= 0; i--) {
        if (queue[i].reference === ref && queue[i].text) { v = queue[i].version || ""; txt = queue[i].text; break; }
      }
      if (!txt && Array.isArray(vlVerses)) {
        const m = vlVerses.find(function(x) { return x.f === ref; });
        if (m) { v = m.v || ""; txt = m.t || m.x || ""; }
      }
      if (/^\(No verse text found/.test(txt)) txt = "";
      const words = txt.replace(/\[\d+\]/g, " ").replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
      const w = words.slice(0, 3).join(" ") + (words.length > 3 ? "\u2026" : "");
      return { v: v, t: txt, w: w };
    }

    function statItems(kind) {
      const raw = Array.isArray(sessionStats[STAT_LISTS[kind].key]) ? sessionStats[STAT_LISTS[kind].key] : [];
      const items = raw.map(function(r) {
        const f = typeof r === "string" ? r : String((r && r.f) || "");
        const g = (r && typeof r === "object" && Number.isInteger(r.g)) ? Math.max(0, Math.min(8, r.g)) : null;
        return { f: f, g: g, p: parseRef(f) };
      }).filter(function(it) { return it.f; });
      items.sort(function(a, b) {
        const ga = a.g === null ? -1 : a.g, gb = b.g === null ? -1 : b.g;
        return (gb - ga) || (a.p.book - b.p.book) || (a.p.chapter - b.p.chapter) || (a.p.verse - b.p.verse);
      });
      return items;
    }

    // Tapping Repeats or Leveled Up shows the verses behind the number; the other box closes.
    function updateStatLists() {
      Object.keys(STAT_LISTS).forEach(function(k) {
        const box = document.getElementById(STAT_LISTS[k].box);
        box.classList.toggle("tappable", (sessionStats[STAT_LISTS[k].count] || 0) > 0 || statItems(k).length > 0);
        box.classList.remove("open");
      });
      document.getElementById("statFailBox").classList.toggle("cleared", allRepeatsCleared());
      openStatList = null;
      const list = document.getElementById("failList");
      list.style.display = "none";
      list.innerHTML = "";
    }

    // Starts a practice round: the held repeats join the deck as Repeat / Clear cards. Nothing is written to the sheet.
    function startPractice() {
      if (isScoring || heldCount() === 0) return;
      queue.forEach(function(c) { if (c.isHeld) c.isHeld = false; });
      practicing = true;
      enqueueSubmit(null, snapshot(currentIndex));
      render();
    }

    // Another trip through the same repeat verses (the latest copy of each). The server is told this is not a score.
    function practiceAgain() {
      if (isScoring || heldCount() > 0) return;
      const failed = Array.isArray(sessionStats.failedRefs) ? sessionStats.failedRefs : [];
      const fresh = [];
      failed.forEach(function(r) {
        const ref = typeof r === "string" ? r : r.f;
        for (let i = queue.length - 1; i >= 0; i--) {
          if (queue[i].isRepeat && queue[i].reference === ref) {
            fresh.push(Object.assign({}, queue[i], { isRepeat: true, isHeld: false }));
            return;
          }
        }
      });
      if (!fresh.length) return;
      fresh.forEach(function(c) { queue.push(c); });
      practicing = true;
      const st = snapshot(currentIndex);
      st.practice = true;
      enqueueSubmit(null, st);
      render();
    }

    function canPracticeAgain() {
      if (heldCount() > 0 || !allRepeatsCleared()) return false;
      return queue.some(function(c) { return c.isRepeat; });
    }

    function toggleStatList(kind) {
      const cfg = STAT_LISTS[kind];
      const items = statItems(kind);
      const list = document.getElementById("failList");
      const missing = Math.max(0, (sessionStats[cfg.count] || 0) - items.length);
      if (!items.length && !missing) return;
      Object.keys(STAT_LISTS).forEach(function(k) { document.getElementById(STAT_LISTS[k].box).classList.remove("open"); });
      if (openStatList === kind) {
        openStatList = null;
        list.style.display = "none";
        return;
      }
      openStatList = kind;
      document.getElementById(cfg.box).classList.add("open");
      list.innerHTML = "";
      const head = document.createElement("div");
      head.className = "fail-head";
      const held = kind === "fail" ? heldCount() : 0;
      if (held > 0) {
        const pb = document.createElement("button");
        pb.type = "button";
        pb.textContent = (held === 1 ? "Practice this verse" : held <= 4 ? "Practice these " + held : "Practice all " + held) + " \u203A";
        pb.onclick = startPractice;
        head.appendChild(pb);
      } else if (kind === "fail" && canPracticeAgain()) {
        const pb = document.createElement("button");
        pb.type = "button";
        pb.textContent = "Practice again \u203A";
        pb.onclick = practiceAgain;
        head.appendChild(pb);
      } else {
        const title = document.createElement("span");
        title.className = "fail-title";
        title.textContent = cfg.title;
        head.appendChild(title);
      }
      const inner = document.createElement("div");
      inner.className = "fail-inner";
      items.forEach(function(it) {
        const row = document.createElement("div");
        row.className = "fail-row";
        const name = document.createElement("span");
        name.className = "fail-ref";
        name.textContent = it.f;
        row.appendChild(name);
        if (it.g !== null) row.appendChild(makePill(it.g));
        // tap: quick three-word peek; hold: the full verse (same as the Verses list)
        const heldStat = attachLongPress(row, function() {
          hideVerseTip();
          const info = verseInfoFor(it.f);
          showPreview({ f: it.f, v: info.v, t: info.t }, true);
        });
        row.onclick = function(ev) {
          ev.stopPropagation();
          if (heldStat()) return;
          showVerseTip(row, verseInfoFor(it.f).w);
        };
        inner.appendChild(row);
      });
      if (missing) {
        const note = document.createElement("div");
        note.className = "fail-note";
        note.textContent = items.length
          ? "+ " + missing + " earlier today (names weren't saved)"
          : "Names weren't saved for today's earlier reviews. New ones will be listed.";
        inner.appendChild(note);
      }
      list.appendChild(head);
      list.appendChild(inner);
      list.style.display = "block";
    }

    // Refresh: saves anything pending, then asks the server for the current session.
    // If today's deck is finished the server starts a new batch of due cards (today's stats carry over).
    function restartSession() {
      if (isFetching || isRefreshing) return;
      isRefreshing = true;
      showSummaryNotice("");
      setSummaryBusy(true, pendingCount() > 0 ? "Saving…" : "Loading…");
      if (submitFailed) retrySubmit();
      whenWritesSettled(function() {
        isRefreshing = false;
        isFetching = true;
        google.script.run
          .withSuccessHandler(function(session) {
            isFetching = false;
            if (!session || !Array.isArray(session.cards)) {
              renderLoadError("The server returned no session data.");
              return;
            }
            adoptSession(session);
          })
          .withFailureHandler(function(err) {
            isFetching = false;
            renderLoadError((err && err.message) ? err.message : String(err || "Unknown error"));
          })
          .refreshSession();
      });
    }

    // "Add New Verse": opens a short list of unassigned verses; tapping one starts learning it.

    // ── Paste a new verse ──
    // Tapping "Paste verse" reads the clipboard and shows what it understood in a popup (reference, version, text) with
    // Add / Edit / Cancel. If the phone won't let the page read the clipboard, a paste box opens instead; pasting into it
    // shows the same popup. The reference can be the first line ("Romans 8:35-37 ESV"), the last line ("— John 3:16 ESV"),
    // or at the start of a single line.
    const REF_RX = "((?:[1-3]\\s?)?[A-Za-z]+(?:\\s+(?:of\\s+)?[A-Za-z]+){0,2}\\s+\\d+(?::\\d+(?:\\s?[-–—]\\s?\\d+)?)?)";
    function splitRefVersion(head) {
      head = String(head || "").replace(/[–—]/g, "-").replace(/\s*-\s*/g, "-").replace(/\s+/g, " ").trim()
        .replace(/^[\s"'“”‘’\-]+|[\s"'“”‘’\-]+$/g, "");
      let ver = "";
      const m = head.match(/^(.*\S)[\s,]+\(?([A-Za-z][A-Za-z0-9]{1,7})\)?$/);
      if (m && /\d/.test(m[1])) { head = m[1].replace(/[,\s]+$/, ""); ver = m[2].toUpperCase(); }
      return { head: head, ver: ver };
    }
    function looksLikeRef(h) { return /\d/.test(h) && /^[1-3]?\s?[A-Za-z]/.test(h) && h.length <= 60; }
    function cleanBody(t) {
      return String(t || "").replace(/\s+/g, " ").trim().replace(/^[“"]\s*/, "").replace(/\s*[”"]$/, "").trim();
    }
    function parsePasted(raw) {
      const lines = String(raw || "").replace(/\r/g, "").split("\n").map(function(l) { return l.trim(); });
      while (lines.length && !lines[0]) lines.shift();
      while (lines.length && !lines[lines.length - 1]) lines.pop();
      if (!lines.length) return { empty: true };
      function done(rv, body, needsWords) {
        const text = cleanBody(body);
        if (!looksLikeRef(rv.head)) return null;
        if (needsWords && text.split(" ").length < 4) return null; // one line: don't mistake "ESV" or a stray word for the verse text
        if (!text) return { error: "I found the reference but no verse text." };
        return { ref: rv.head, ver: rv.ver || "ESV", defaultVer: !rv.ver, text: text };
      }
      // 1. reference on the first line, text below
      if (lines.length > 1) {
        const a = done(splitRefVersion(lines[0]), lines.slice(1).join(" "));
        if (a) return a;
        // 2. reference on the last line (e.g. "— John 3:16 ESV"), text above
        const b = done(splitRefVersion(lines[lines.length - 1]), lines.slice(0, -1).join(" "));
        if (b) return b;
      }
      // 3. one block of text: reference first, then text on the same line ("John 3:16 ESV For God so loved…")
      const all = lines.join(" ").replace(/\s+/g, " ");
      let m = all.match(new RegExp("^" + REF_RX + "\\s*\\(?([A-Za-z]{2,6})?\\)?\\s*[:\\-–—]?\\s+(.+)$"));
      if (m) {
        const ver = (m[2] && /^[A-Z0-9]+$/.test(m[2].toUpperCase()) && m[2].length <= 5) ? m[2] : "";
        const body = ver ? m[3] : ((m[2] ? m[2] + " " : "") + m[3]);
        const c = done({ head: splitRefVersion(m[1]).head, ver: ver.toUpperCase() }, body, true);
        if (c) return c;
      }
      // 4. text first, reference at the end on the same line
      m = all.match(new RegExp("^(.+?)\\s*[–—\\-~]\\s*" + REF_RX + "\\s*\\(?([A-Za-z]{2,6})?\\)?\\s*$"));
      if (m) {
        const d = done({ head: splitRefVersion(m[2]).head, ver: (m[3] || "").toUpperCase() }, m[1], true);
        if (d) return d;
      }
      return { error: "I couldn't find a reference. Put it on the first line, like Romans 8:35-37 ESV." };
    }

    let pasteParsed = null;
    let pasteReading = false;

    function openPaste(prefill, note) {
      document.getElementById("pasteText").value = prefill || "";
      const hint = document.getElementById("pasteHint");
      hint.textContent = note || "";
      hint.className = note ? "paste-hint bad" : "paste-hint";
      document.getElementById("pasteAdd").disabled = false;
      document.getElementById("pasteModal").classList.add("open");
      if (prefill) updatePasteHint();
      setTimeout(function() { try { document.getElementById("pasteText").focus(); } catch (e) {} }, 50);
    }

    function closePaste() {
      document.getElementById("pasteModal").classList.remove("open");
    }

    // "Paste verse": take what is on the clipboard, or fall back to the paste box.
    function startPaste() {
      if (pasteReading) return;
      let cb = null;
      try { cb = navigator.clipboard && navigator.clipboard.readText ? navigator.clipboard.readText() : null; } catch (e) { cb = null; }
      if (!cb) { openPaste(); return; }
      pasteReading = true;
      const guard = setTimeout(function() { pasteReading = false; }, 10000);
      cb.then(function(text) {
        clearTimeout(guard); pasteReading = false;
        text = String(text || "").trim();
        if (!text) { openPaste("", "The clipboard is empty. Copy a verse first, then paste it here."); return; }
        const p = parsePasted(text);
        if (p.error || p.empty) { openPaste(text, p.error); return; }
        showPastePreview(p);
      }, function() {
        clearTimeout(guard); pasteReading = false;
        openPaste(); // this phone won't let the page read the clipboard: paste into the box instead
      });
    }

    // Text just landed in the paste box: show the popup straight away when it makes sense.
    function pasteLanded() {
      setTimeout(function() {
        const p = parsePasted(document.getElementById("pasteText").value);
        if (!p.error && !p.empty) showPastePreview(p);
        else updatePasteHint();
      }, 30);
    }

    function showPastePreview(p) {
      pasteParsed = p;
      fillVersePopup("ppRef", "ppVer", "ppText", { f: p.ref, v: p.ver, t: p.text }, true);
      const note = document.getElementById("ppNote");
      note.textContent = p.defaultVer ? "No version found, so I used ESV. Tap Edit to change it." : "";
      note.className = "pp-note";
      document.getElementById("ppAdd").disabled = false;
      try { document.getElementById("pasteText").blur(); } catch (e) {}
      document.getElementById("pastePreview").classList.add("open");
    }

    function cancelPastePreview() {
      document.getElementById("pastePreview").classList.remove("open");
      closePaste();
      pasteParsed = null;
    }

    function editPastePreview() {
      const p = pasteParsed;
      document.getElementById("pastePreview").classList.remove("open");
      if (!p) { openPaste(); return; }
      openPaste(p.ref + " " + p.ver + "\n" + p.text);
    }

    function addFromPreview() {
      const p = pasteParsed;
      if (!p) return;
      const note = document.getElementById("ppNote");
      const btn = document.getElementById("ppAdd");
      btn.disabled = true;
      addParsedVerse(p, function(res, msg) {
        btn.disabled = false;
        if (res) {
          document.getElementById("pastePreview").classList.remove("open");
          closePaste();
          pasteParsed = null;
        } else {
          note.textContent = msg;
          note.className = "pp-note bad";
        }
      });
    }

    function updatePasteHint() {
      const el = document.getElementById("pasteHint");
      const p = parsePasted(document.getElementById("pasteText").value);
      if (p.empty) { el.textContent = ""; el.className = "paste-hint"; return; }
      if (p.error) { el.textContent = p.error; el.className = "paste-hint bad"; return; }
      el.textContent = p.ref + " · " + p.ver + (p.defaultVer ? " (no version given)" : "");
      el.className = "paste-hint ok";
    }

    // Add button inside the paste box (typed text): same popup first, so you see what was understood.
    function submitPaste() {
      const el = document.getElementById("pasteHint");
      const p = parsePasted(document.getElementById("pasteText").value);
      if (p.empty || p.error) { el.textContent = p.error || "Paste a verse first."; el.className = "paste-hint bad"; return; }
      showPastePreview(p);
    }

    // Saves the verse to the sheet (it joins the waiting list in the picker).
    function addParsedVerse(p, cb) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            cb(true);
            document.getElementById("pickerNote").textContent = "Added " + res.reference + " (waiting in your list)";
            google.script.run
              .withSuccessHandler(function(list) { if (Array.isArray(list)) { pickerItems = list; renderPicker(); } })
              .listUnassigned();
          } else {
            cb(false, (res && res.message) || "Couldn't add that verse.");
          }
        })
        .withFailureHandler(function(err) { cb(false, "Couldn't add: " + ((err && err.message) || err)); })
        .addPastedVerse(p.ref, p.ver, p.text);
    }

    function closePicker() {
      pickerToken++; pickerLoading = false;
      document.getElementById("picker").classList.remove("open");
    }

    function renderPicker() {
      const q = document.getElementById("pickerSearch").value.trim().toLowerCase();
      const box = document.getElementById("pickerList");
      box.textContent = "";
      if (pickerLoading) {
        const e = document.createElement("div");
        e.className = "picker-empty";
        e.textContent = "Loading verses\u2026";
        box.appendChild(e);
        return;
      }
      const shown = pickerItems.filter(function(it) { return !q || it.f.toLowerCase().indexOf(q) >= 0; });
      if (shown.length === 0) {
        const e = document.createElement("div");
        e.className = "picker-empty";
        e.textContent = pickerItems.length === 0 ? "No unassigned verses. Tap \u201cPaste verse\u201d to add one." : "No matches";
        box.appendChild(e);
        return;
      }
      // Verses that have waited more than 14 days go below a divider (Bible order is kept within each group).
      const LONG_WAIT = 14;
      const recent = shown.filter(function(it) { return !(it.d > LONG_WAIT); });
      const old = shown.filter(function(it) { return it.d > LONG_WAIT; });
      const ordered = recent.concat(old);
      ordered.forEach(function(it, idx) {
        if (old.length && recent.length && idx === recent.length) {
          const dv = document.createElement("div");
          dv.className = "picker-divider";
          dv.textContent = "Waiting over 14 days";
          box.appendChild(dv);
        } else if (old.length && !recent.length && idx === 0) {
          const dv = document.createElement("div");
          dv.className = "picker-divider";
          dv.textContent = "Waiting over 14 days";
          box.appendChild(dv);
        }
        const b = document.createElement("button");
        b.type = "button";
        b.className = "picker-item";
        b.textContent = it.f;
        b.onclick = function() { showPreview(it); };
        box.appendChild(b);
      });
    }

    // Tapping a verse in the list previews its text; adding is a separate button.
    // Fills a verse popup (reference, version badge, text with verse numbers); alwaysVer shows the badge even for ESV.
    function fillVersePopup(refId, verId, textId, it, alwaysVer) {
      document.getElementById(refId).textContent = it.f;
      const ver = (it.v || "").trim();
      const vb = document.getElementById(verId);
      if (ver && (alwaysVer || ver.toUpperCase() !== "ESV")) { vb.textContent = ver; vb.style.display = "inline-block"; } else { vb.style.display = "none"; }
      const box = document.getElementById(textId);
      box.textContent = "";
      const segs = parseVerseSegments(it.t || "", it.f);
      if (!segs.length) {
        box.textContent = "No text saved for this verse.";
      } else {
        segs.forEach(function(sg, i) {
          if (sg.num && segs.length > 1) {
            const n = document.createElement("span");
            n.className = "pv-n";
            n.textContent = sg.num;
            box.appendChild(n);
          }
          box.appendChild(document.createTextNode(sg.text + (i < segs.length - 1 ? " " : "")));
        });
      }
    }

    function showPreview(it, noAdd) {
      fillVersePopup("pvRef", "pvVer", "pvText", it, false);
      const addBtn = document.getElementById("pvAdd");
      addBtn.style.display = noAdd ? "none" : "";
      addBtn.onclick = function() { closePreview(); chooseVerse(it); };
      document.getElementById("pickerPreview").classList.add("open");
    }

    function closePreview() {
      document.getElementById("pickerPreview").classList.remove("open");
    }

    function chooseVerse(it) {
      closePicker();
      const btn = document.getElementById("btnAddVerse");
      if (btn) { btn.disabled = true; btn.textContent = "Adding..."; }
      google.script.run
        .withSuccessHandler(function(res) {
          if (btn) { btn.disabled = false; btn.textContent = "Add New Verse"; }
          if (res && res.success) {
            enterLearningAfterLoad = res.reference;
            restartSession();
          } else {
            showSummaryNotice((res && res.message) ? res.message : "Couldn't add that verse.", true);
          }
        })
        .withFailureHandler(function(err) {
          if (btn) { btn.disabled = false; btn.textContent = "Add New Verse"; }
          showSummaryNotice("Error adding verse: " + ((err && err.message) || err), true);
        })
        .addChosenVerse(it.r, it.f);
    }

    window.addEventListener("keydown", function(e) {
      // Never act while typing in a box, or with Cmd/Ctrl/Alt held (browser shortcuts).
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const key = e.key.toLowerCase();
      const helpEl = document.getElementById("helpModal");
      if (helpEl.classList.contains("open")) {
        if (e.key === "?" || e.key === "Escape") { e.preventDefault(); toggleHelp(false); }
        return;
      }
      // Not while a popup is open
      const popupOpen = ["picker", "pickerPreview", "pasteModal", "pastePreview"].some(function(id) {
        return document.getElementById(id).classList.contains("open");
      });
      if (popupOpen) return;
      if (e.key === "?") { e.preventDefault(); toggleHelp(true); return; }
      // Shortcuts are for the Review cards only: not the New screen, not over the Verse List
      if (mode === "learning") return;
      if (document.getElementById("verseListView").classList.contains("open")) return;
      if (e.code === "Space") {
        e.preventDefault();
        handleContainerClick(e);
      } else if (key === "r") {
        e.preventDefault();
        toggleRevealAll(e);
      } else if (key === "d") {
        scoreCard("Fail");
      } else if (key === "f") {
        scoreCard("Pass");
      } else if (key === "z") {
        undoLast();
      }
    });

    function toggleHelp(open) {
      document.getElementById("helpModal").classList.toggle("open", open);
    }

    // ───────────── Staying in sync with your other device ─────────────
    // We ask the server whether the session has moved on: when you come back to the app,
    // when the window gains focus, on a tap after a pause, and every few seconds.

    function renderDiag() {
      const el = document.getElementById("diagText");
      if (!el || !diagOn) return;
      el.textContent =
        "page " + CLIENT_BUILD + " · server " + (serverBuild || "?") +
        " · v" + sessionVersion + " · " + (sessionDate || "no date") +
        " · last check " + (diag.checkedAt || "never") + ": " + diag.result +
        (diag.error ? " · error: " + diag.error : "") +
        " · loaded " + (diag.adopted || "never") +
        (initialSession && initialSession.ms !== undefined ? " · server load " + initialSession.ms + " ms" : "") +
        " · queued saves " + pendingCount() + (submitFailed ? " (failing)" : "");
    }

    // Sends a test push through the server (tap the "Verse List" title, then the button).
    function sendTestPush() {
      const b = document.getElementById("diagTest");
      if (!b || b.disabled) return;
      b.disabled = true; b.textContent = "Sending\u2026";
      function done(msg) { b.textContent = msg; setTimeout(function() { b.disabled = false; b.textContent = "Send test notification"; }, 4000); }
      google.script.run
        .withSuccessHandler(function(r) { done(r && r.ok ? "Sent \u2713" : "Failed: " + ((r && r.message) || "unknown")); })
        .withFailureHandler(function(err) { done("Failed: " + ((err && err.message) || err)); })
        .sendTestPush();
    }

    function toggleDiag() {
      diagOn = !diagOn;
      const el = document.getElementById("diagLine");
      el.style.display = diagOn ? "block" : "none";
      renderDiag();
    }

    function noteCheck(result, error) {
      diag.checkedAt = new Date().toLocaleTimeString();
      diag.result = result;
      diag.error = error || "";
      renderDiag();
    }

    function syncCheck() {
      if (document.visibilityState === "hidden") return;
      if (submitFailed && !inFlight) retrySubmit();
      if (isFetching || isRefreshing || isScoring || pendingCount() > 0) return;

      if (!loadedAt) {
        restartSession(); // the last load failed; try again
        return;
      }

      lastCheckAt = Date.now();
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res) { noteCheck("empty reply"); return; }
          if (res.build) serverBuild = res.build;
          if (!res.changed) { noteCheck("up to date"); return; }
          noteCheck("changed on server, loading");
          // Re-check: the user may have started scoring while the request was in flight.
          if (isFetching || isRefreshing || isScoring || pendingCount() > 0) return;
          isFetching = true;
          google.script.run
            .withSuccessHandler(function(session) {
              isFetching = false;
              if (!session || !Array.isArray(session.cards)) { noteCheck("bad session reply"); return; }
              if (isScoring || pendingCount() > 0) return;
              adoptSession(session);
              flashNotice("Synced");
              noteCheck("synced");
            })
            .withFailureHandler(function(err) {
              isFetching = false;
              noteCheck("load failed", (err && err.message) || String(err));
            })
            .loadSession();
        })
        .withFailureHandler(function(err) {
          noteCheck("check failed", (err && err.message) || String(err));
        })
        .checkSession(sessionVersion, sessionDate);
    }

    // A tap after a pause checks first, so you catch up before acting.
    function syncIfIdle() {
      if (Date.now() - lastCheckAt > TOUCH_SYNC_GAP_MS) syncCheck();
    }

    document.addEventListener("visibilitychange", syncCheck);
    window.addEventListener("focus", syncCheck);
    window.addEventListener("pageshow", syncCheck);
    document.addEventListener("touchstart", syncIfIdle, { passive: true, capture: true });
    document.addEventListener("mousedown", syncIfIdle, { capture: true });
    setInterval(syncCheck, POLL_MS);
  </script>
</body>
</html>
