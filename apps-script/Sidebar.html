<!DOCTYPE html>
<html style="color-scheme: light dark;">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">

  <style>
    :root {
      --bg-page: #f8f9fa;
      --bg-card: #ffffff;
      --bg-body: #f8f9fa;
      --border-card: #dadce0;
      --border-body: #e8eaed;
      
      --text-primary: #202124;
      --text-muted: #5f6368;
      --text-meta: #70757a;
      --text-accent: #1a73e8;
      --text-repeat: #d97706;
      --text-fasttrack: #b45309;
      --badge-repeat-bg: #fef3c7;
      --badge-fasttrack-bg: #fef3c7;
      --badge-version-bg: rgba(95, 99, 104, 0.12);
      --btn-fail-bg: #fce8e6;
      --btn-fail-text: #c5221f;
      --btn-pass-bg: #e6f4ea;
      --btn-pass-text: #137333;
      --btn-restart-bg: #e8f0fe;
      --btn-restart-text: #1a73e8;
      --badge-pass: #137333;
      --badge-fail: #c5221f;
      --card-shadow: rgba(0, 0, 0, 0.06);

      --spoiler-bg: rgba(120, 120, 120, 0.28);
      --spoiler-blur: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #121212;
        --bg-card: #1e1e1e;
        --bg-body: #28292a;
        --border-card: #38383a;
        --border-body: #3c4043;
        
        --text-primary: #f1f3f4;
        --text-muted: #9aa0a6;
        --text-meta: #9aa0a6;
        --text-accent: #8ab4f8;
        --text-repeat: #fbbf24;
        --text-fasttrack: #fcd34d;
        --badge-repeat-bg: #451a03;
        --badge-fasttrack-bg: #451a03;
        --badge-version-bg: rgba(255, 255, 255, 0.12);
        --btn-fail-bg: #4a1d1b;
        --btn-fail-text: #f28b82;
        --btn-pass-bg: #133a22;
        --btn-pass-text: #81c995;
        --btn-restart-bg: #1e3a5f;
        --btn-restart-text: #8ab4f8;
        --badge-pass: #81c995;
        --badge-fail: #f28b82;
        --card-shadow: rgba(0, 0, 0, 0.4);

        --spoiler-bg: rgba(255, 255, 255, 0.22);
        --spoiler-blur: 8px;
      }
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
      background-color: var(--bg-page);
    }

    body {
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      padding-top: max(env(safe-area-inset-top, 0px), 8px);
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 12px);
      padding-left: max(env(safe-area-inset-left, 0px), 12px);
      padding-right: max(env(safe-area-inset-right, 0px), 12px);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: var(--border-card);
      border-radius: 2px;
      margin-bottom: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--text-accent);
      border-radius: 2px;
      transition: width 0.25s ease;
    }

    #deckContainer {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
    }

    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 16px 14px 12px 14px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 14px var(--card-shadow);
      will-change: opacity;
      box-sizing: border-box;
      min-height: 0;
    }

    .card-header-group {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ref-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 3px;
      line-height: 1.2;
    }

    .ref-header {
      font-size: 23px;
      font-weight: 700;
      color: var(--text-accent);
      text-align: center;
    }

    .version-badge {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      background: var(--badge-version-bg);
      border: 1px solid var(--border-body);
      padding: 2px 5px;
      border-radius: 5px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      line-height: 1;
      pointer-events: none;
    }

    .meta-tag {
      text-align: center;
      font-size: 12px;
      color: var(--text-meta);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    /* Rank badge shown under the verse reference: Bronze > Silver > Gold > ... > Diamond */
    .rank-badge {
      --rc: var(--rl);
      display: inline-block;
      padding: 2px 0;
      min-width: 86px; /* same width for every rank */
      text-align: center;
      text-transform: uppercase;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.9px;
      color: var(--rc);
      border: 1px solid var(--rc);
      background: transparent;
    }
    @supports (background: color-mix(in srgb, red 10%, transparent)) {
      .rank-badge {
        background: color-mix(in srgb, var(--rc) 14%, transparent);
        border-color: color-mix(in srgb, var(--rc) 40%, transparent);
      }
    }
    .rank-badge.is-new { --rc: var(--text-meta); font-weight: 700; }
    @keyframes rankGlow {
      0%   { box-shadow: 0 0 0 0 var(--rc); }
      60%  { box-shadow: 0 0 14px 5px color-mix(in srgb, var(--rc) 45%, transparent); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    @keyframes luSettle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    .lu-settle { animation: luSettle 0.55s ease-out 0.45s both; }
    .lu-fx { position: relative; display: inline-block; --rc: var(--rl); }
    @media (prefers-color-scheme: dark) { .lu-fx { --rc: var(--rd); } }
    .lu-ring { position: absolute; inset: -1px; border-radius: 999px; border: 2px solid var(--rc); opacity: 0; pointer-events: none;
      animation: luRing 0.8s ease-out forwards; animation-delay: var(--rd2, 0.22s); }
    @keyframes luRing { 0% { transform: scale(0.95); opacity: 0.85; } 100% { transform: scale(1.22, 1.75); opacity: 0; } }
    .lu-spark { position: absolute; left: 50%; top: 50%; font-size: 11px; line-height: 1; color: var(--rc); opacity: 0; pointer-events: none;
      animation: luSpark 0.9s ease-out forwards; animation-delay: var(--sd, 0.2s); }
    .lu-spark.dot { font-size: 6px; }
    @keyframes luSpark {
      0%   { transform: translate(calc(-50% + var(--ex)), calc(-50% + var(--ey))) scale(0.3); opacity: 0; }
      15%  { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; }
    }

    /* Verse List screen (reuses the full-screen sheet used by the verse picker) */
    .vl-row:active, .vl-seg button:active, .picker-item:active, .picker-close:active, .vl-verse:active { transform: none; filter: none; }
    .vl-row, .vl-seg button, .picker-close { transition: none; }
    .vl-row .chev { transition: transform 0.15s ease; }
    .vl-total { font-size: 13px; color: var(--text-muted); margin: 0; }
    .vl-bar { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; gap: 10px; }
    .vl-seg { display: inline-flex; border: 1px solid var(--border-card); border-radius: 10px; overflow: hidden; flex-shrink: 0; }
    .vl-seg button { background: transparent; border: 0; box-shadow: none; min-height: 0; width: auto;
      padding: 6px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted); border-radius: 0; flex-direction: row; }
    .vl-seg button.active { background: var(--badge-pass-bg, rgba(26,115,232,0.12)); color: var(--text-accent, #1a73e8); }
    .vl-chips { display: flex; gap: 8px; margin: 0 0 8px; }
    .vl-chips button { flex: 1; background: transparent; border: 1px solid var(--border-card); box-shadow: none; min-height: 0; width: auto;
      padding: 7px 0; font-size: 13px; font-weight: 600; color: var(--text-muted); border-radius: 999px; flex-direction: row; }
    .vl-chips button.active { background: var(--badge-pass-bg, rgba(26,115,232,0.12)); color: var(--text-accent, #1a73e8); border-color: var(--text-accent, #1a73e8); }
    .vl-row { display: flex; align-items: center; justify-content: space-between; width: 100%;
      background: none; border: 0; box-shadow: none; min-height: 0; padding: 12px 4px;
      border-bottom: 1px solid var(--border-card); flex-direction: row; border-radius: 0; text-align: left; }
    .vl-row .vl-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .vl-row .vl-right { display: inline-flex; align-items: center; gap: 8px; }
    .vl-row .vl-count { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .vl-row.zero .vl-count { color: var(--text-meta); font-weight: 500; }
    .vl-row .chev { color: var(--text-meta); font-size: 18px; line-height: 1; transition: transform 0.15s ease; }
    .vl-row.open .chev { transform: rotate(90deg); }
    .vl-verses { border-bottom: 1px solid var(--border-card); padding: 2px 0 6px; }
    .vl-verse { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 8px 14px;
      font-size: 15px; color: var(--text-primary); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .vl-verse .vl-ref { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .vl-verse, .verse-body { -webkit-touch-callout: none; }
    #verseListView, .vl-verse, .vl-row, .vl-tip, .tabbar, .tab, #cardBody { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #verseListView input { -webkit-user-select: text; user-select: text; }
    .vl-verse.lp-down { background: var(--btn-restart-bg); }
    .fail-list .fail-row { flex-wrap: wrap; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .fail-list .fail-row.lp-down { background: var(--btn-restart-bg); }
    .fail-list .fail-row .vl-tip { position: static; flex-basis: 100%; max-width: 100%; margin: 0 0 6px; box-shadow: none; white-space: normal; background: var(--btn-restart-bg); color: var(--text-primary); }
    .vl-tip { position: absolute; left: 14px; top: calc(100% - 6px); z-index: 5; max-width: 80%;
      background: #e9ecf1; color: #2b303a; font-size: 13px; font-weight: 500;
      padding: 6px 12px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); pointer-events: none; white-space: nowrap; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .vl-tip { background: #3a3f4a; color: #e8eaee; box-shadow: 0 6px 18px rgba(0,0,0,0.4); } }
    :root[data-theme="dark"] .vl-tip { background: #3a3f4a; color: #e8eaee; box-shadow: 0 6px 18px rgba(0,0,0,0.4); }
    .vl-verse + .vl-verse { border-top: 1px solid var(--border-card); }

    .rank-1 { --rl: #a8643a; --rd: #d9945f; }
    .rank-2 { --rl: #7b8794; --rd: #b8c2cc; }
    .rank-3 { --rl: #b88a00; --rd: #f2c94c; }
    .rank-4 { --rl: #5b6b8c; --rd: #aebbd9; }
    .rank-5 { --rl: #2754c5; --rd: #7da2ff; }
    .rank-6 { --rl: #138a55; --rd: #4fd18e; }
    .rank-7 { --rl: #c62847; --rd: #ff7088; }
    .rank-8 { --rl: #0e92b8; --rd: #6fe0ff; }
    @media (prefers-color-scheme: dark) {
      .rank-badge { --rc: var(--rd); }
      .rank-badge.is-new { --rc: var(--text-meta); }
    }

    /* Top ranks get a soft glint that sweeps across the pill now and then:
       Diamond every 3 s, Ruby every 5 s, Emerald (fainter) every 8 s. */
    .rank-badge.rank-6, .rank-badge.rank-7, .rank-badge.rank-8 { position: relative; overflow: hidden; }
    .rank-badge.rank-6::after, .rank-badge.rank-7::after, .rank-badge.rank-8::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 38%; pointer-events: none;
      transform: translateX(-110%);
      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, var(--sh)), transparent);
      animation: rankShimmer var(--per) ease-in-out infinite;
    }
    .rank-badge.rank-8 { --per: 3s; --sh: 0.8; }
    .rank-badge.rank-7 { --per: 5s; --sh: 0.65; }
    .rank-badge.rank-6 { --per: 8s; --sh: 0.45; }
    @media (prefers-color-scheme: dark) {
      .rank-badge.rank-8 { --sh: 0.44; }
      .rank-badge.rank-7 { --sh: 0.36; }
      .rank-badge.rank-6 { --sh: 0.25; }
    }
    @keyframes rankShimmer {
      0%   { transform: translateX(-110%); }
      30%  { transform: translateX(290%); }
      100% { transform: translateX(290%); }
    }

    .meta-tag.is-repeat-badge {
      color: var(--text-repeat);
      font-weight: 700;
      background: var(--badge-repeat-bg);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .meta-tag.is-fasttrack-badge {
      color: var(--text-fasttrack);
      font-weight: 800;
      background: var(--badge-fasttrack-bg);
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.6px;
    }

    .pips-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      min-height: 14px;
    }

    .pip {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border-body);
      border: 1px solid var(--border-card);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .pip.filled {
      background: var(--text-accent);
      border-color: var(--text-accent);
      transform: scale(1.15);
      box-shadow: 0 0 5px rgba(26, 115, 232, 0.4);
    }

    /* Fast-Track Glowing Pip */
    .fast-track-pip {
      font-size: 15px;
      line-height: 1;
      color: var(--text-fasttrack);
      filter: drop-shadow(0 0 6px rgba(217, 119, 6, 0.7));
      animation: pulse-glow 1.8s infinite ease-in-out;
      user-select: none;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 9px rgba(217, 119, 6, 1)); }
    }

    .verse-body {
      -webkit-user-select: none;
      user-select: none;
      flex: 1;
      background: var(--bg-body);
      border: 1px solid var(--border-body);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 12px 14px;
      margin-bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      scroll-behavior: smooth;
      box-sizing: border-box;
      cursor: pointer;
    }

    .passage-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0 8px 0;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-body);
      flex-shrink: 0;
    }

    .passage-status {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-reveal-all {
      background: var(--btn-restart-bg);
      color: var(--btn-restart-text);
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* 1. Mobile Default Typography (Touchscreens) */
    .passage-stream, .pv-text {
      font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
      font-size: 17.5px;
      line-height: 1.7;
      letter-spacing: 0.1px;
      color: var(--text-primary);
      text-align: justify;
      text-justify: inter-word;
      word-break: normal;
    }

    /* 2. Desktop Override Typography (Mouse / Precision Trackpads) */
    @media (hover: hover) and (pointer: fine) {
      .passage-stream, .pv-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16.5px;
        line-height: 1.7;
        letter-spacing: 0px;
      }
    }

    .verse-unit {
      cursor: pointer;
      display: inline;
    }

    .v-num {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-accent);
      vertical-align: super;
      margin-right: 3px;
      margin-left: 3px;
      user-select: none;
      display: inline-block;
    }

    .v-text {
      border-radius: 4px;
      padding: 2px 4px;
      transition: filter 0.18s ease, opacity 0.18s ease, background-color 0.18s ease;
    }

    .v-text.blurred {
      filter: blur(var(--spoiler-blur));
      opacity: 0.2;
      background-color: var(--spoiler-bg);
      user-select: none;
    }

    .v-text.revealed {
      filter: none;
      opacity: 1;
      background-color: transparent;
    }

    .notice {
      font-size: 13px;
      text-align: center;
      color: var(--badge-pass);
      font-weight: 700;
      min-height: 18px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .action-container { 
      display: flex; 
      flex-direction: column; 
      flex-shrink: 0;
    }

    .btn-row { 
      display: flex; 
      gap: 10px; 
      width: 100%;
    }

    button {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: transform 0.08s ease, filter 0.08s ease;
    }
    button:active { transform: scale(0.97); filter: brightness(0.92); }

    .btn-fail { 
      flex: 1; 
      min-height: 54px; 
      background: var(--btn-fail-bg); 
      color: var(--btn-fail-text); 
      font-size: 16px; 
    }
    .btn-fail.review { background: var(--btn-restart-bg); color: var(--btn-restart-text); }
    .btn-fail.seen, .btn-fail.locked { opacity: 0.6; }
    #btnFail.seen.only { pointer-events: none; }

    .btn-pass { 
      flex: 1; 
      min-height: 54px; 
      background: var(--btn-pass-bg); 
      color: var(--btn-pass-text); 
      font-size: 16px; 
    }

    .shortcut-hint { font-size: 11px; opacity: 0.65; font-weight: 500; margin-top: 2px; }
    @media (max-width: 480px) {
      .shortcut-hint { display: none; }
      .btn-fail, .btn-pass { min-height: 56px; }
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 4px 14px var(--card-shadow);
      text-align: center;
      box-sizing: border-box;
      min-height: 0;
    }

    /* Compact header: a small icon beside the title instead of a big trophy. */
    .sum-title-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .sum-ico { font-size: 22px; line-height: 1; }
    .sum-ico.ok { width: 28px; height: 28px; border-radius: 50%; background: var(--badge-pass); color: #fff; font-size: 17px; font-weight: 900; line-height: 28px; text-align: center; flex: none; }
    @media (prefers-color-scheme: dark) { .sum-ico.ok { color: #0b2a17; } }
    .summary-header h2 { font-size: 22px; margin: 0; color: var(--text-primary); font-weight: 700; }
    .summary-header p { margin: 0; color: var(--text-muted); font-size: 14px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 16px 0;
    }

    .stat-box {
      background: var(--bg-body);
      border: 1px solid var(--border-body);
      border-radius: 12px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-val { font-size: 24px; font-weight: 800; margin-bottom: 2px; color: var(--text-primary); }
    .stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; }
    .val-pass { color: var(--btn-pass-text); }
    .val-grad { color: var(--text-accent); }
    .val-fail { color: var(--btn-fail-text); }
    .stat-box.tappable { cursor: pointer; }
    /* every repeat verse cleared at least once */
    .stat-box { position: relative; }
    .stat-box.cleared::after { content: "\2713"; position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%;
      background: var(--badge-pass); color: #fff; font-size: 17px; font-weight: 900; line-height: 26px; text-align: center;
      box-shadow: 0 0 0 3px var(--btn-pass-bg), 0 1px 4px rgba(0, 0, 0, 0.25); }
    @media (prefers-color-scheme: dark) { .stat-box.cleared::after { color: #0b2a17; } }
    .stat-box.open { border-color: var(--text-accent); box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.18); }
    /* Leveled Up with 5 or more: soft gold fill and a bold gold number (the blue "open" border still wins when tapped). */
    :root { --gold-bg-a: rgba(255, 208, 70, 0.22); --gold-bg-b: rgba(214, 158, 20, 0.13); --gold-num: #a87400; }
    @media (prefers-color-scheme: dark) { :root { --gold-bg-a: rgba(242, 201, 76, 0.18); --gold-bg-b: rgba(200, 150, 20, 0.10); --gold-num: #ffd54a; } }
    .stat-box.gold { background: linear-gradient(180deg, var(--gold-bg-a), var(--gold-bg-b)); }
    .stat-box.gold .stat-val { color: var(--gold-num); font-weight: 900; }

    /* Review cards take their verse's rank color: a thin outline, a faint tint at the top, colored progress dots.
       (Rank colors come from the .rank-N classes above; the tint needs color-mix, older browsers just skip it.) */
    /* Registered so the card's rank colors can glide from one verse's rank to the next instead of snapping. */
    @property --rc { syntax: '<color>'; inherits: true; initial-value: transparent; }
    @property --rb { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
    @property --rt { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
    @property --rg { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
    .card { transition: --rc 0.45s ease, --rb 0.45s ease, --rt 0.45s ease, --rg 0.45s ease; }
    .card.ranked { --rc: var(--rl); }
    @media (prefers-color-scheme: dark) { .card.ranked { --rc: var(--rd); } }
    .card.ranked .pip.filled { background: var(--rc); border-color: var(--rc); }
    .dia-mark { color: var(--rc, var(--text-accent)); font-size: 13px; line-height: 14px; font-weight: 800; text-shadow: 0 0 7px var(--rc, var(--text-accent)); }
    /* Strength grows with rank: --rb outline, --rt top tint, --rg outer glow (Silver and Platinum are greys, so they get a little extra). */
    .rank-1 { --rb: 20%; --rt: 3%;   --rg: 0%; }
    .rank-2 { --rb: 30%; --rt: 10%;  --rg: 0%; }
    .rank-3 { --rb: 40%; --rt: 5%;   --rg: 0%; }
    .rank-4 { --rb: 50%; --rt: 12%;  --rg: 0%; }
    .rank-5 { --rb: 60%; --rt: 7.5%; --rg: 0%; }
    .rank-6 { --rb: 70%; --rt: 9%;   --rg: 10%; }
    .rank-7 { --rb: 80%; --rt: 11%;  --rg: 18%; }
    .rank-8 { --rb: 90%; --rt: 14%;  --rg: 28%; }
    @supports (color: color-mix(in srgb, red 50%, blue)) {
      .card.ranked {
        border-color: color-mix(in srgb, var(--rc) var(--rb), var(--border-card));
        background: linear-gradient(180deg, color-mix(in srgb, var(--rc) var(--rt), var(--bg-card)), var(--bg-card) 38%);
        box-shadow: 0 4px 14px var(--card-shadow), 0 0 16px color-mix(in srgb, var(--rc) var(--rg), transparent);
      }
      .card.ranked .pip.filled { box-shadow: 0 0 5px color-mix(in srgb, var(--rc) 55%, transparent); }
      .dia-mark { text-shadow: 0 0 7px color-mix(in srgb, var(--rc) 70%, transparent); }
    }
    .fail-list { text-align: left; margin: -6px 0 14px; padding: 0 12px 6px; background: var(--bg-body); border: 1px solid var(--border-body);
      border-radius: 12px; color: var(--text-primary); overflow: hidden; }
    /* Header stays put while the verses scroll beneath it; both lists are always five rows tall. */
    .fail-list .fail-head { display: flex; align-items: center; justify-content: center; height: 44px; box-sizing: border-box;
      border-bottom: 1px solid var(--border-body); background: var(--bg-body); position: relative; z-index: 1; }
    .fail-list .fail-head .fail-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; }
    .fail-list .fail-head button { width: 100%; height: 32px; min-height: 0; border: 0; border-radius: 9px; padding: 0; font-family: inherit;
      background: var(--btn-restart-bg); color: var(--btn-restart-text); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .fail-list .fail-inner { height: 180px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .fail-list .fail-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; padding: 0 4px 0 6px; font-size: 14px; }
    .fail-list .fail-row + .fail-row { border-top: 1px solid var(--border-body); }
    .fail-list .fail-note { padding: 8px 6px; font-size: 12px; color: var(--text-muted); text-align: center; }
    .fail-list .fail-row + .fail-note { border-top: 1px solid var(--border-body); }
    .fail-list .fail-ref { min-width: 0; overflow-wrap: anywhere; }

    .summary-btn-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn-add-verse {
      width: 100%;
      min-height: 52px;
      background: var(--btn-pass-bg);
      color: var(--btn-pass-text);
      font-size: 15px;
      font-weight: 700;
    }

    .btn-restart { 
      width: 100%; 
      min-height: 48px; 
      background: var(--btn-restart-bg); 
      color: var(--btn-restart-text); 
      font-size: 14px; 
    }

    /* Tiny muted line pinned to the bottom of the Review Complete card. */
    .summary-card { position: relative; }
    .summary-header { position: relative; }
    /* Content starts near the top so opening the Repeats / Leveled Up list doesn't move the boxes. */
    /* Gold badge floating at the top of the card on a day with no repeats; it doesn't move anything. */
    .flawless-badge { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
      padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.9px; text-transform: uppercase;
      color: #b88a00; border: 1px solid rgba(184, 138, 0, 0.45);
      background: linear-gradient(110deg, rgba(184, 138, 0, 0.12) 30%, rgba(255, 215, 90, 0.45) 50%, rgba(184, 138, 0, 0.12) 70%); }
    @media (prefers-color-scheme: dark) {
      .flawless-badge { color: #f2c94c; border-color: rgba(242, 201, 76, 0.45);
        background: linear-gradient(110deg, rgba(242, 201, 76, 0.12) 30%, rgba(255, 230, 140, 0.35) 50%, rgba(242, 201, 76, 0.12) 70%); }
    }
    .flawless-badge.pop { animation: flawless-pop 520ms cubic-bezier(0.2, 0.9, 0.3, 1.25) both; }
    @keyframes flawless-pop {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.4); }
      60%  { opacity: 1; transform: translateX(-50%) scale(1.14); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }
    .summary-card.top { justify-content: flex-start; padding-top: clamp(36px, 11vh, 110px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .tomorrow-note {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      font-size: 11px;
      color: var(--text-meta);
      opacity: 0.8;
      text-align: center;
      pointer-events: none;
    }



    /* ── Bottom tab bar navigation ── */
    :root { --tab-h: calc(53px + max(env(safe-area-inset-bottom, 0px) - 14px, 0px)); }
    body { padding-bottom: calc(var(--tab-h) + 6px); }
    /* Blue progress line along the top of the tab bar: only while reviewing cards (hidden on New, Verses and Review Complete) */
    .progress-track { display: none; position: absolute; top: -1px; left: 0; right: 0; height: 3px; margin: 0;
      background: transparent; border-radius: 0; z-index: 2; }
    .progress-track.show { display: block; }
    .progress-track .progress-fill { border-radius: 0 2px 2px 0; }
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; background: var(--bg-card); border-top: 1px solid var(--border-card);
      padding: 14px 0 max(env(safe-area-inset-bottom, 0px) - 14px, 0px); height: var(--tab-h);
    }
    .tab { flex: 1; background: none; border: 0; box-shadow: none; min-height: 0; width: auto; padding: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px;
      font-size: 10.5px; font-weight: 600; color: var(--text-muted); position: relative; border-radius: 0;
      -webkit-tap-highlight-color: transparent; }
    .tab:active { transform: none; filter: none; }
    body.lp-active, body.lp-active * { -webkit-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; }
    .pv-card, .pv-card * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; }
    .tab.on { color: var(--text-accent); }
    .tab .tab-count { position: absolute; top: -3px; left: calc(50% + 6px); min-width: 18px; text-align: center;
      background: var(--text-muted); color: var(--bg-card); font-size: 10px; font-weight: 700;
      border-radius: 99px; padding: 1px 6px; line-height: 14px; }
    .tab.on .tab-count { background: var(--text-accent); }
    #verseListView { bottom: var(--tab-h); padding-bottom: 8px; z-index: 40; }
    #verseListView .picker-close { display: none; }
    .vl-iconbtn { background: none; border: 0; box-shadow: none; width: auto; min-height: 0; margin: -6px 0; padding: 6px 4px 6px 12px; }
    .vl-iconbtn svg { width: 22px; height: 22px; display: block; stroke: var(--text-accent, #1a73e8); fill: none; stroke-width: 2; stroke-linecap: round; }
    .vl-iconbtn.on svg { stroke: var(--text-muted); }
    #verseListView .picker-head { gap: 10px; }
    #verseListView .picker-title { flex: none; }
    #verseListView .vl-total { flex: 1; min-width: 0; text-align: right; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #verseListView .vl-bar .vl-seg { width: 100%; }
    #verseListView .vl-bar .vl-seg button { flex: 1; }
    .vl-search { margin: 0 0 2px; }
    .vl-search .picker-search { margin-bottom: 8px; }
    .vl-verse.hit { flex-wrap: wrap; }
    .vl-snip { flex-basis: 100%; margin-top: 3px; font-size: 13px; line-height: 1.4; color: var(--text-muted); }
    .vl-snip.full { color: var(--text-primary); }
    .vl-snip mark { background: rgba(255, 196, 0, 0.35); color: inherit; border-radius: 3px; padding: 0 1px; }
    #picker { z-index: 70; }
    .picker-actions { display: inline-flex; gap: 14px; align-items: center; }
    #picker .picker-close:first-child { color: var(--text-accent); font-weight: 600; }
    .picker-divider { font-size: 12px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-meta);
      padding: 16px 4px 6px; border-bottom: 1px solid var(--border-card); }
    .picker-note { font-size: 13px; color: var(--badge-pass); min-height: 0; margin: -4px 0 8px; font-weight: 600; }
    .picker-note:empty { display: none; }
    .paste-area { width: 100%; min-height: 200px; resize: none; outline: none; border: 1px solid var(--border-card); border-radius: 10px;
      background: transparent; color: var(--text-primary); font-size: 16px; line-height: 1.4; padding: 10px 12px; user-select: text; }
    .pv-card .paste-area { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    .paste-area:focus { border-color: var(--text-accent); }
    .pp-note { font-size: 12px; color: var(--text-muted); margin: 8px 2px 0; min-height: 16px; }
    .pp-note.bad { color: var(--badge-fail); }
    .pv-edit { background: transparent; color: var(--text-accent); border: 0; font-size: 15px; font-weight: 600; padding: 10px 14px; cursor: pointer; }
    .paste-hint { font-size: 12px; color: var(--text-muted); margin: 8px 2px 0; min-height: 16px; }
    .paste-hint.bad { color: var(--badge-fail); }
    .paste-hint.ok { color: var(--text-muted); }
    .pv { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45); padding: 24px 20px; }
    .pv.open { display: flex; }
    .help-sub { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin: 4px 0 2px; }
    .help-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 15px; border-top: 1px solid var(--border-card); }
    .help-row:first-of-type { border-top: 0; }
    .help-row kbd { font: 600 13px -apple-system, Helvetica, Arial, sans-serif; min-width: 26px; text-align: center; padding: 3px 8px; border-radius: 6px;
      background: var(--bg-body); border: 1px solid var(--border-card); border-bottom-width: 2px; color: var(--text-primary); }
    .pv-card { background: var(--bg-card); color: var(--text-primary); border-radius: 18px; width: 100%; max-width: 420px;
      max-height: 78%; display: flex; flex-direction: column; padding: 18px 18px 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
    .pv-head { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 700;
      color: var(--text-accent); margin-bottom: 10px; }
    .pv-text { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 8px; } /* typography comes from the shared .passage-stream rule */
    .pv-text sup, .pv-text .pv-n { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700;
      color: var(--text-accent); margin-right: 3px; }
    .pv-btns { display: flex; gap: 10px; margin-top: 10px; }
    .pv-btns button { flex: 1; min-height: 0; padding: 13px; border-radius: 12px; font-size: 16px; font-weight: 700; flex-direction: row; justify-content: center; }
    .pv-close { background: var(--bg-body); color: var(--text-muted); border: 1px solid var(--border-card); }
    .pv-add { background: var(--btn-pass-bg); color: var(--btn-pass-text); }
    /* Hold the reference: tiny undo menu */
    .ref-header { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
    .ref-header { position: relative; isolation: isolate; }
    .ref-header::before { content: ""; position: absolute; z-index: -1; left: var(--hl-l, -12px); right: var(--hl-r, -12px); top: var(--hl-t, -2px); bottom: var(--hl-b, -2px); border-radius: 14px; background: transparent; }
    .ref-header.lp-down::before, .ref-header.um-open::before { background: var(--btn-restart-bg); }
    .card-header-group { position: relative; }
    .undo-menu { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 30; white-space: nowrap;
      background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.22);
      padding: 4px; font-size: 15px; font-weight: 600; }
    .undo-menu::before { content: ""; position: absolute; left: 50%; top: -6px; width: 12px; height: 12px; background: var(--bg-card);
      border-left: 1px solid var(--border-card); border-top: 1px solid var(--border-card); transform: translateX(-50%) rotate(45deg); }
    .undo-menu button { display: block; border: 0; background: none; color: var(--text-primary); font: inherit; padding: 11px 16px; border-radius: 10px; margin: 0; min-height: 0; box-shadow: none; }
    .undo-menu button:active { background: var(--btn-restart-bg); }
    .undo-menu button.off { color: var(--text-muted); font-weight: 500; }
    .sync-warning { position: fixed; top: max(env(safe-area-inset-top, 0px), 8px); left: 50%; transform: translateX(-50%);
      z-index: 60; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    /* Status readout (tap "Verse List" to show it) */
    .diag-test { display: block; margin: 8px 0 0; padding: 7px 12px; min-height: 0; width: auto; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border-card); border-radius: 10px; background: var(--bg-body); color: var(--text-accent); }
    .diag-line { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-h) + 4px); z-index: 60;
      font-size: 10px; line-height: 1.35; color: var(--text-muted); word-break: break-all; user-select: text; flex-shrink: 0;
      background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 8px; padding: 6px 8px; margin: 0; }
    /* Notices (Cleared / Re-queued, errors) float over the bottom of the verse box,
       so they take no room between the verse and the buttons. */
    .verse-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 8px; }
    .verse-wrap .verse-body { flex: 1; margin-bottom: 0; }
    #toastNotice { position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); z-index: 5;
      width: max-content; max-width: 94%; min-height: 0; margin: 0; padding: 6px 14px; border-radius: 14px;
      background: var(--bg-card); border: 1px solid var(--border-card); box-shadow: 0 4px 14px rgba(0,0,0,0.14);
      pointer-events: none; text-align: center; animation: noticeIn 0.18s ease-out both; }
    #toastNotice:empty { display: none; }
    @keyframes noticeIn { from { opacity: 0; transform: translateX(-50%) translateY(6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    button:disabled { opacity: 0.55; cursor: default; }
    button:disabled:active { transform: none; filter: none; }

    /* Simple "pick a verse" sheet */
    .picker {
      position: fixed; inset: 0; z-index: 50;
      background: var(--bg-card);
      display: none; flex-direction: column;
      padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    }
    .picker.open { display: flex; }
    .picker-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .picker-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .picker-close { background: none; border: 0; box-shadow: none; min-height: 0; width: auto;
      padding: 6px 4px; font-size: 14px; color: var(--text-muted); }
    .picker-search { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px;
      border: 1px solid var(--border-card); border-radius: 10px; background: transparent;
      color: var(--text-primary); margin-bottom: 8px; }
    .picker-list { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior-x: none; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
    #verseListView { overflow-x: hidden; touch-action: pan-y; overscroll-behavior: contain; }
    .picker-item { display: block; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0;
      box-shadow: none; min-height: 0; padding: 12px 4px; font-size: 16px; font-weight: 500;
      color: var(--text-primary); border-bottom: 1px solid var(--border-card); }
    .picker-empty { padding: 20px 4px; color: var(--text-muted); font-size: 14px; text-align: center; }

    .notice.is-error { color: var(--badge-fail); }

    .sync-warning {
      flex-direction: row;
      min-height: 0;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      background: var(--badge-repeat-bg);
      color: var(--text-repeat);
    }
  </style>
</head>
<body>

  <div class="diag-line" id="diagLine" style="display: none;"><span id="diagText"></span><button type="button" class="diag-test" id="diagTest" onclick="sendTestPush()">Send test notification</button></div>

  <button type="button" class="sync-warning" id="syncWarning" onclick="onSyncWarningTap()" style="display: none;"></button>

  <div id="deckContainer">
    <div class="notice" id="toastNotice"></div>
    <div class="card" id="activeCard">

      <div class="card-header-group">
        <div class="ref-header-row">
          <span class="ref-header" id="cardRef">---</span>
          <span class="version-badge" id="cardVersion" style="display: none;"></span>
        </div>
        <div class="meta-tag" id="cardMeta">---</div>
        <div class="pips-container" id="cardPips"></div>
      </div>

      <div class="verse-wrap">
        <div class="verse-body" id="cardBody" onclick="handleContainerClick(event)">
        </div>
      </div>

      <div class="action-container">
        <div class="btn-row">
          <button type="button" class="btn-fail" id="btnFail" onclick="scoreCard('Fail')" style="display: none;">
            <span id="btnFailText">Repeat</span>
            <span class="shortcut-hint">[D]</span>
          </button>
          <button type="button" class="btn-pass" id="btnPass" onclick="scoreCard('Pass')">
            <span id="btnPassText">Pass</span>
            <span class="shortcut-hint">[F]</span>
          </button>
        </div>
      </div>
    </div>

    <div class="summary-card" id="summaryView" style="display: none;">
      <div class="summary-header">
        <div class="flawless-badge" id="flawlessBadge" style="display: none;">✦ Flawless day</div>
        <div class="sum-title-row">
          <span class="sum-ico ok" id="summaryIcon">\u2713</span>
          <h2 id="summaryTitle">Review Complete!</h2>
        </div>
        <p id="summarySubtitle">You have finished all verses scheduled for today.</p>
      </div>

      <div class="stats-grid" id="summaryStats">
        <div class="stat-box">
          <div class="stat-val" id="statReviewed">0</div>
          <div class="stat-lbl">Reviewed</div>
        </div>
        <div class="stat-box" id="statGradBox" onclick="toggleStatList('grad')">
          <div class="stat-val val-grad" id="statGraduated">0</div>
          <div class="stat-lbl">Leveled Up</div>
        </div>
        <div class="stat-box" id="statFailBox" onclick="toggleStatList('fail')">
          <div class="stat-val val-fail" id="statFailed">0</div>
          <div class="stat-lbl">Repeats</div>
        </div>
      </div>
      <div class="fail-list" id="failList" style="display: none;"></div>

      <div class="tomorrow-note" id="tomorrowNote" style="display: none;"></div>

      <div class="summary-btn-stack">
        <div class="notice" id="summaryNotice"></div>
        <button type="button" class="btn-add-verse" id="btnAddVerse" onclick="addNewVerse()" style="display: none;">
          Add New Verse
        </button>
        <button type="button" class="btn-restart" id="btnRestart" onclick="restartSession()" style="display: none;">
          Try again
        </button>
      </div>
    </div>
  </div>

  <div class="picker" id="verseListView">

  <script>
    // Mirrors GROUP_CONFIG in Code.gs for names and repsNeeded only.
    // Review intervals live on the server, which computes every due date.
    const GROUP_CONFIG = {
      0: { name: "New",       repsNeeded: 1 },
      1: { name: "Bronze",     repsNeeded: 4 },
      2: { name: "Silver",     repsNeeded: 3 },
      3: { name: "Gold",     repsNeeded: 2 },
      4: { name: "Platinum",    repsNeeded: 2 },
      5: { name: "Sapphire",   repsNeeded: 2 },
      6: { name: "Emerald", repsNeeded: 1 },
      7: { name: "Ruby", repsNeeded: 1 },
      8: { name: "Diamond",   repsNeeded: 1 }
    };

    // Level names, shown as a badge under each verse. Level 0 is simply "New".
    const RANK_NAMES = ["New", "Bronze", "Silver", "Gold", "Platinum", "Sapphire", "Emerald", "Ruby", "Diamond"];
    function rankName(g) { return RANK_NAMES[Math.max(0, Math.min(8, g | 0))]; }
    function setRankBadge(metaTag, g) {
      metaTag.textContent = "";
      const b = document.createElement("span");
      b.className = "rank-badge " + (g > 0 ? "rank-" + Math.min(8, g) : "is-new");
      b.textContent = rankName(g);
      metaTag.appendChild(b);
    }

    function makePill(g, popClass) {
      const b = document.createElement("span");
      b.className = "rank-badge " + (g > 0 ? "rank-" + Math.min(8, g) : "is-new") + (popClass ? " " + popClass : "");
      b.textContent = rankName(g);
      return b;
    }

    // The notice lives outside the card (the card fades away when you score it, and a notice inside it
    // would fade too), so each time it changes it is lined up with the bottom of the verse box.
    function placeNotice() {
      const n = document.getElementById("toastNotice");
      const card = document.getElementById("activeCard");
      const wrap = card && card.querySelector(".verse-wrap");
      const deck = document.getElementById("deckContainer");
      if (!n || !wrap || !deck || !n.firstChild) return;
      const bottomEdge = card.offsetTop + wrap.offsetTop + wrap.offsetHeight;
      n.style.bottom = Math.max(0, deck.clientHeight - bottomEdge + 10) + "px";
      n.style.left = (card.offsetLeft + wrap.offsetLeft + wrap.offsetWidth / 2) + "px";
    }
    try {
      new MutationObserver(placeNotice).observe(document.getElementById("toastNotice"), { childList: true, characterData: true, subtree: true });
    } catch (e) {}

    // Level-up moment: the card itself turns into the new rank (badge, dots, outline and tint cross-fade),
    // settles with a small bounce, then fades away. Higher ranks add a ring and sparkles around the new badge.
    let luOverlay = null;
    function clearLevelUp() {
      if (luOverlay) { luOverlay.remove(); luOverlay = null; }
    }
    function playLevelUp(toG, rep) {
      clearLevelUp();
      const card = document.getElementById("activeCard");
      const deck = document.getElementById("deckContainer");
      if (!card || !deck) return;
      const clone = card.cloneNode(true);
      clone.querySelectorAll("[id]").forEach(function(n) { n.removeAttribute("id"); });
      clone.removeAttribute("id");
      clone.querySelectorAll("button").forEach(function(n) { n.removeAttribute("onclick"); });
      setCardRank(clone, toG);
      const meta = clone.querySelector(".meta-tag");
      if (meta) { meta.className = "meta-tag"; setRankBadge(meta, toG); }
      const pips = clone.querySelector(".pips-container");
      if (pips) {
        pips.innerHTML = "";
        if (toG >= 8) {
          pips.innerHTML = '<span class="dia-mark">\u25C6</span>';
        } else {
          const cfg = GROUP_CONFIG[toG] || { repsNeeded: 1 };
          const filled = rep >= 1 && rep <= cfg.repsNeeded ? rep : 1;
          for (let i = 1; i <= cfg.repsNeeded; i++) {
            const p = document.createElement("div");
            p.className = "pip" + (i <= filled ? " filled" : "");
            pips.appendChild(p);
          }
        }
      }
      const badge = meta && meta.querySelector(".rank-badge");
      if (badge) badge.style.animation = "rankGlow 1s ease-out 0.45s both";
      if (badge && toG >= 4) {
        const fx = document.createElement("span");
        fx.className = "lu-fx rank-" + Math.min(8, toG);
        badge.parentNode.insertBefore(fx, badge);
        const rings = toG >= 8 ? 2 : 1;
        const sparks = toG >= 8 ? 12 : toG >= 6 ? 8 : 5;
        for (let r = 0; r < rings; r++) {
          const ring = document.createElement("span");
          ring.className = "lu-ring";
          ring.style.setProperty("--rd2", (0.4 + r * 0.18) + "s");
          fx.appendChild(ring);
        }
        fx.appendChild(badge);
        for (let i = 0; i < sparks; i++) {
          const sp = document.createElement("span");
          const ang = (i / sparks) * Math.PI * 2 + 0.4;
          const ex = Math.cos(ang) * 46, ey = Math.sin(ang) * 11, more = 10 + ((i * 7) % 9);
          sp.className = "lu-spark" + (i % 3 === 0 ? " dot" : "");
          sp.textContent = i % 3 === 0 ? "\u25CF" : "\u2726";
          sp.style.setProperty("--ex", Math.round(ex) + "px");
          sp.style.setProperty("--ey", Math.round(ey) + "px");
          sp.style.setProperty("--dx", Math.round(ex + Math.cos(ang) * more) + "px");
          sp.style.setProperty("--dy", Math.round(ey + Math.sin(ang) * more * 0.6) + "px");
          sp.style.setProperty("--sd", (0.4 + (i % 3) * 0.06) + "s");
          fx.appendChild(sp);
        }
      }
      const dr = deck.getBoundingClientRect(), cr = card.getBoundingClientRect();
      clone.style.position = "absolute";
      clone.style.left = (cr.left - dr.left) + "px";
      clone.style.top = (cr.top - dr.top) + "px";
      clone.style.width = cr.width + "px";
      clone.style.height = cr.height + "px";
      clone.style.flex = "none";
      clone.style.margin = "0";
      clone.style.pointerEvents = "none";
      clone.style.zIndex = "6";
      clone.style.opacity = "0";
      clone.style.transition = "opacity 0.45s ease";
      deck.appendChild(clone);
      luOverlay = clone;
      void clone.offsetWidth;
      clone.style.opacity = "1";
      card.classList.add("lu-settle");
      clone.classList.add("lu-settle");
    }
    function fadeOutLevelUp() {
      const card = document.getElementById("activeCard");
      if (card) fadeCardContent();
      if (luOverlay) { luOverlay.style.transition = "opacity " + LU_FADE_MS + "ms ease-out"; luOverlay.style.opacity = "0"; }
    }

    // ── Verse List ──
    // Books in Bible order, with the names and abbreviations a reference might start with.
    const BIBLE_BOOKS = [
      ["Genesis", "gen|ge|gn"], ["Exodus", "exod|exo|ex"], ["Leviticus", "lev|le|lv"], ["Numbers", "num|nu|nm|nb"],
      ["Deuteronomy", "deut|dt|de"], ["Joshua", "josh|jos|jsh"], ["Judges", "judg|jdg|jg|jdgs"], ["Ruth", "rth|ru"],
      ["1 Samuel", "1 sam|1 sm|1 sa|1sam|first samuel"], ["2 Samuel", "2 sam|2 sm|2 sa|2sam|second samuel"],
      ["1 Kings", "1 kgs|1 ki|1kgs|first kings"], ["2 Kings", "2 kgs|2 ki|2kgs|second kings"],
      ["1 Chronicles", "1 chron|1 chr|1 ch|1chr|first chronicles"], ["2 Chronicles", "2 chron|2 chr|2 ch|2chr|second chronicles"],
      ["Ezra", "ezr"], ["Nehemiah", "neh|ne"], ["Esther", "esth|est|es"], ["Job", "jb"],
      ["Psalms", "psalm|ps|psa|pss|psm|pslm"], ["Proverbs", "prov|pro|prv|pr"], ["Ecclesiastes", "eccles|eccl|ecc|ec|qoh"],
      ["Song of Solomon", "song of songs|song|sos|ss|canticles|cant"], ["Isaiah", "isa|is"], ["Jeremiah", "jer|je|jr"],
      ["Lamentations", "lam|la"], ["Ezekiel", "ezek|eze|ezk"], ["Daniel", "dan|da|dn"], ["Hosea", "hos|ho"],
      ["Joel", "jl"], ["Amos", "am"], ["Obadiah", "obad|ob"], ["Jonah", "jon|jnh"], ["Micah", "mic|mi"],
      ["Nahum", "nah|na"], ["Habakkuk", "hab|hb"], ["Zephaniah", "zeph|zep|zp"], ["Haggai", "hag|hg"],
      ["Zechariah", "zech|zec|zc"], ["Malachi", "mal|ml"],
      ["Matthew", "matt|mat|mt"], ["Mark", "mrk|mk|mr"], ["Luke", "luk|lk"], ["John", "jhn|jn"], ["Acts", "act|ac"],
      ["Romans", "rom|ro|rm"], ["1 Corinthians", "1 cor|1 co|1cor|first corinthians"], ["2 Corinthians", "2 cor|2 co|2cor|second corinthians"],
      ["Galatians", "gal|ga"], ["Ephesians", "eph|ephes"], ["Philippians", "phil|php|pp"], ["Colossians", "col|co"],
      ["1 Thessalonians", "1 thess|1 thes|1 th|1thess|first thessalonians"], ["2 Thessalonians", "2 thess|2 thes|2 th|2thess|second thessalonians"],
      ["1 Timothy", "1 tim|1 ti|1tim|first timothy"], ["2 Timothy", "2 tim|2 ti|2tim|second timothy"],
      ["Titus", "tit|ti"], ["Philemon", "philem|phlm|phm"], ["Hebrews", "heb"], ["James", "jas|jm"],
      ["1 Peter", "1 pet|1 pe|1pet|1 pt|first peter"], ["2 Peter", "2 pet|2 pe|2pet|2 pt|second peter"],
      ["1 John", "1 jn|1 jhn|1john|first john"], ["2 John", "2 jn|2 jhn|2john|second john"], ["3 John", "3 jn|3 jhn|3john|third john"],
      ["Jude", "jud"], ["Revelation", "rev|re|revelations|apocalypse"]
    ];
    const BOOK_INDEX = (function() {
      const m = {};
      BIBLE_BOOKS.forEach(function(b, i) {
        m[normBook(b[0])] = i;
        b[1].split("|").forEach(function(a) { m[normBook(a)] = i; });
      });
      return m;
    })();

    function normBook(t) {
      return String(t || "").toLowerCase().replace(/\./g, "").replace(/\s+/g, " ").trim()
        .replace(/^(1st|i)\s+/, "1 ").replace(/^(2nd|ii)\s+/, "2 ").replace(/^(3rd|iii)\s+/, "3 ")
        .replace(/^([123])(?=[a-z])/, "$1 ");
    }

    // "John 10:27-30" -> { book: index in the Bible (or 999), chapter, verse }
    function parseRef(ref) {
      // Optional book number ("1", "II", "2nd"), then the book name, then chapter and verse.
      const m = String(ref || "").match(/^\s*((?:(?:[1-3]|1st|2nd|3rd)\.?\s*|(?:iii|ii|i)\.?\s+)?[A-Za-z][A-Za-z.\s]*?)\s*(\d+)(?:\s*[:.]\s*(\d+))?/i);
      let name = ref, chapter = 0, verse = 0;
      if (m) { name = m[1]; chapter = parseInt(m[2], 10) || 0; verse = parseInt(m[3], 10) || 0; }
      let key = normBook(name);
      let idx = BOOK_INDEX[key];
      if (idx === undefined) idx = 999;
      return { book: idx, name: idx === 999 ? (String(name).trim() || "Other") : BIBLE_BOOKS[idx][0], chapter: chapter, verse: verse };
    }

    // How many verses a reference covers: "John 10:27-30" is 4, "Rom 8:28,30" is 2, "Ps 23:1" is 1.
    // A range that crosses chapters, or a whole chapter with no verse numbers, can't be counted
    // without a table of chapter lengths, so each of those counts as 1.
    function verseCount(ref) {
      const m = String(ref || "").match(/\d+\s*[:.]\s*([^]*)$/);
      if (!m) return 1;
      const tail = m[1];
      let total = 0;
      tail.split(/[,;]/).forEach(function(tok) {
        const t = tok.trim();
        if (!t) return;
        if (t.indexOf(":") >= 0) { total += 1; return; }
        const r = t.match(/^(\d+)[a-z]?\s*[-\u2013\u2014]\s*(\d+)[a-z]?$/i);
        if (r) {
          const lo = parseInt(r[1], 10), hi = parseInt(r[2], 10);
          total += hi >= lo ? (hi - lo + 1) : 1;
        } else if (/^\d+[a-z]?$/i.test(t)) {
          total += 1;
        } else {
          total += 1;
        }
      });
      return Math.max(1, total);
    }

    function compareVerses(a, b) {
      return (a.p.book - b.p.book) || (a.p.chapter - b.p.chapter) || (a.p.verse - b.p.verse) ||
        (a.f < b.f ? -1 : a.f > b.f ? 1 : 0);
    }

    let vlVerses = [];
    let vlSort = "book";
    let vlTest = "all"; // Book view filter: all, old (Genesis to Malachi) or new (Matthew to Revelation); always starts at all
    let vlOpen = {};


    // ── Bottom tabs ──
    function goTab(t) {
      const listOpen = document.getElementById("verseListView").classList.contains("open");
      if (t === "verses") {
        if (!listOpen) openVerseList();
        updateTabs();
        return;
      }
      if (listOpen) closeVerseList();
      if (t === "new" && mode !== "learning") toggleLearning();
      else if (t === "review" && mode === "learning") toggleLearning();
      updateTabs();
    }

    function updateProgressBar() {
      const tr = document.querySelector(".progress-track");
      if (!tr) return;
      const cardUp = document.getElementById("activeCard").style.display !== "none";
      tr.classList.toggle("show", mode !== "learning" && cardUp);
    }

    function updateTabs() {
      if (mode === "learning" && learningCards[learningIndex]) {
        { const b = document.getElementById("btnFail"); const sn = isSeen(learningCards[learningIndex].reference); b.classList.toggle("seen", sn); b.classList.toggle("only", sn && learningCards.length === 1); }
      }
      updateProgressBar();
      const listOpen = document.getElementById("verseListView").classList.contains("open");
      const which = listOpen ? "verses" : (mode === "learning" ? "new" : "review");
      document.getElementById("tabReview").classList.toggle("on", which === "review");
      document.getElementById("tabNew").classList.toggle("on", which === "new");
      document.getElementById("tabVerses").classList.toggle("on", which === "verses");
      const left = Math.max(0, activeEnd() - currentIndex);
      const rc = document.getElementById("tabReviewCount");
      rc.textContent = left; rc.style.display = left > 0 ? "" : "none";
      const nc = document.getElementById("tabNewCount");
      const n = unseenCount();
      nc.textContent = n; nc.style.display = n > 0 ? "" : "none";
      scheduleBadgeReturn();
    }

    // "Reviewed" on a New verse marks it as looked at for 2 hours; the New tab's count only shows verses
    // that are still waiting. The marks are saved with the session, so every device agrees.
    const NEW_SNOOZE_MS = 2 * 60 * 60 * 1000;
    let learningSeen = {};
    let badgeTimer = null;
    function isSeen(ref) { return (learningSeen[ref] || 0) > Date.now(); }
    function unseenCount() {
      return learningCards.filter(function(c) { return !isSeen(c.reference); }).length;
    }
    function scheduleBadgeReturn() {
      if (badgeTimer) { clearTimeout(badgeTimer); badgeTimer = null; }
      const now = Date.now();
      let next = Infinity;
      Object.keys(learningSeen).forEach(function(k) { if (learningSeen[k] > now && learningSeen[k] < next) next = learningSeen[k]; });
      if (next < Infinity) badgeTimer = setTimeout(updateTabs, Math.min(next - now + 500, 2147483000));
    }
    document.addEventListener("visibilitychange", function() { if (!document.hidden) updateTabs(); });

    function openVerseList() {
      document.getElementById("verseListView").classList.add("open");
      resetVlSearch();
      updateTabs();
      document.getElementById("vlTotal").textContent = "Loading…";
      document.getElementById("vlList").textContent = "";
      vlSort = "book";
      vlTest = "all";
      vlOpen = {};
      updateVlSeg();
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !Array.isArray(res.verses)) { document.getElementById("vlTotal").textContent = "Couldn't load."; return; }
          vlVerses = res.verses.map(function(v) { return { f: v.f, g: v.g, p: parseRef(v.f), n: verseCount(v.f), v: v.v || "", w: v.w || "", x: v.x || "", t: v.t || "", d: (v.d === null || v.d === undefined) ? null : v.d }; });
          vlVerses.sort(compareVerses);
          renderVerseList();
        })
        .withFailureHandler(function() {
          document.getElementById("vlTotal").textContent = "Couldn't load.";
        })
        .getVerseList();
    }

    document.addEventListener("click", function() { hideVerseTip(); });

    function closeVerseList() {
      hideVerseTip();
      vlTest = "all";
      resetVlSearch();
      document.getElementById("verseListView").classList.remove("open");
      updateTabs();
    }

    function setVlSort(mode) {
      vlSort = mode;
      vlTest = "all";
      vlOpen = {};
      updateVlSeg();
      renderVerseList();
    }

    function setVlTest(t) {
      if (vlTest === t) return;
      vlTest = t;
      vlOpen = {};
      updateVlSeg();
      renderVerseList();
    }

    function updateVlSeg() {
      document.getElementById("vlTestAll").classList.toggle("active", vlTest === "all");
      document.getElementById("vlTestOld").classList.toggle("active", vlTest === "old");
      document.getElementById("vlTestNew").classList.toggle("active", vlTest === "new");
      document.getElementById("vlSortBook").classList.toggle("active", vlSort === "book");
      document.getElementById("vlSortRank").classList.toggle("active", vlSort === "rank");
      document.getElementById("vlSortDate").classList.toggle("active", vlSort === "date");
    }

    function vlGroup(key, label, count, verses, showPills) {
      const box = document.getElementById("vlList");
      const row = document.createElement("button");
      row.type = "button";
      row.className = "vl-row" + (count ? "" : " zero") + (vlOpen[key] ? " open" : "");
      const left = document.createElement("span");
      left.className = "vl-name";
      if (typeof label === "string") left.textContent = label; else left.appendChild(label);
      const right = document.createElement("span");
      right.className = "vl-right";
      const n = document.createElement("span");
      n.className = "vl-count";
      n.textContent = count;

    function closeUndoMenu() {
